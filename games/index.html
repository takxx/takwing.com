<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My pages</title>

  <style>
    :root {
      --pink: #f5c6dc;
      --salmon: #f5b9a9;
      --yellow: #f5df91;
      --cream: #f3e8d2;
      --mint: #b9dec8;
      --turquoise: #a8ded8;
      --blue: #b9cbed;
      --violet: #d2c0ec;

      --text: #f7f3fa;
      --muted: #c7c1d0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background:
        radial-gradient(ellipse at 15% 10%, #493355 0, transparent 42%),
        radial-gradient(ellipse at 85% 85%, #244a5c 0, transparent 45%),
        linear-gradient(145deg, #171522, #211b2b 55%, #121a24);
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.04em;
    }

    .language-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .language-selector select {
      color: var(--text);
      background-color: #ffffff12;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      padding: 7px 10px;
      font: inherit;
      cursor: pointer;
    }

    .language-selector select:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.6);
      outline-offset: 2px;
    }

    .subtitle {
      margin: 8px 0 32px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 6px 0px;
    }

    .tile {
      display: grid;
      justify-items: center;
      gap: 10px;
      color: var(--text);
      text-align: center;
      text-decoration: none;
      border-radius: 18px;
      padding: 10px 6px;
      transition: transform 160ms ease, background 160ms ease;
    }

    .tile:hover,
    .tile:focus-visible {
      background: #ffffff12;
      transform: translateY(-3px);
      outline: none;
    }

    .icon {
      position: relative;
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border-radius: 24px;
      font-size: 36px;
      background-color: color-mix(
        in srgb,
        var(--icon-color, var(--cream)) 38%,
        transparent
      );
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -8px 18px rgba(255, 255, 255, 0.12),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        border-color 180ms ease;
    }

    .icon::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(
          120% 80% at 20% 10%,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0) 55%
        ),
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0) 45%
        );
      mix-blend-mode: screen;
    }
    
    .glyph {
	      position: relative;
	      z-index: 1;
	      color: var(--icon-color, var(--cream));
	      -webkit-text-fill-color: currentColor;
	  }

    .svg-glyph {
      position: relative;
      z-index: 1;
      width: 42px;
      height: 42px;
      object-fit: contain;
      color: var(--icon-color, var(--cream));
    }
    
    @media (max-width: 520px) {
      .svg-glyph {
        width: 34px;
        height: 34px;
      }
    }

    .tile:hover .icon,
    .tile:focus-visible .icon {
      transform: scale(1.04);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        inset 0 -10px 20px rgba(255, 255, 255, 0.16),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .name {
      font-size: 0.95rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .language-selector {
        align-self: flex-end;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile,
      .icon {
        transition: none;
      }

      .tile:hover .icon,
      .tile:focus-visible .icon {
        transform: none;
      }
    }
    
    @media (max-width: 520px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 6px 0px;
  }

  .icon {
    width: 62px;
    height: 62px;
    font-size: 30px;
    border-radius: 20px;
  }

  .name {
    font-size: 0.82rem;
  }
}
  </style>
</head>

    const allowedLanguages = ["en", "es", "zh"];
    const requestedLanguage =
      new URLSearchParams(window.location.search).get("lang");
    const language = allowedLanguages.includes(requestedLanguage)
      ? requestedLanguage
      : "en";
    const text = translations[language];

    document.documentElement.lang = language;
    document.title = text.title;
    document.getElementById("page-title").textContent = text.title;
    document.getElementById("page-subtitle").textContent = text.subtitle;

    const languageSelect = document.getElementById("language");
    languageSelect.value = language;

    languageSelect.addEventListener("change", () => {
      const url = new URL(window.location.href);
      url.searchParams.set("lang", languageSelect.value);
      window.location.href = url.href;
    });

    const container = document.getElementById("pages");
    container.setAttribute("aria-label", text.navLabel);

    const pastelColors = {
      pink: "var(--pink)",
      salmon: "var(--salmon)",
      yellow: "var(--yellow)",
      cream: "var(--cream)",
      mint: "var(--mint)",
      turquoise: "var(--turquoise)",
      blue: "var(--blue)",
      violet: "var(--violet)"
    };

const visiblePages = pages
  .filter(page =>
    typeof page[language] === "string" && page[language].trim() !== ""
  )
  .sort((a, b) => a[language].localeCompare(b[language], language));

    for (const page of visiblePages) {
      const link = document.createElement("a");
      link.className = "tile";
      link.href = `/${encodeURIComponent(page.id)}/${language}`;

      const icon = document.createElement("span");
      icon.className = "icon";
      icon.setAttribute("aria-hidden", "true");
      icon.style.setProperty(
        "--icon-color",
        pastelColors[page.color] || "var(--cream)"
      );
      
const svgMarkup = svgIcons[page.id];

if (svgMarkup) {
  const doc = new DOMParser().parseFromString(
    svgMarkup,
    "image/svg+xml"
  );
  const svg = doc.documentElement;

  if (
    svg.tagName.toLowerCase() === "svg" &&
    !doc.querySelector("parsererror")
  ) {
    svg.classList.add("glyph", "svg-glyph");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    icon.append(document.importNode(svg, true));
    
  } else {
    addFallbackGlyph();
  }
} else {
  addFallbackGlyph();
}

function addFallbackGlyph() {
  const glyph = document.createElement("span");
  glyph.className = "glyph";
  glyph.setAttribute("aria-hidden", "true");
  glyph.textContent = page.emoji || "🔗";
  icon.append(glyph);
}

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = page[language];

      link.append(icon, name);
      container.append(link);
    }

    if (visiblePages.length === 0) {
      const message = document.createElement("p");
      message.className = "empty";
      message.textContent = text.empty;
      container.append(message);
    }
  </script>
