<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roach Patrol</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="game" aria-label="Roach Patrol game">
    <header class="hud">
      <div><span id="stage-label">Stage</span> <span id="stage">1</span></div>
      <div><span id="target-label">Target</span> <span id="target">5</span></div>
      <div><span id="hit-label">Hit</span> <span id="score">0</span></div>
      <div><span id="time-label">Time</span> <span id="timer">20</span>s</div>
    </header>

    <div id="message" class="message" aria-live="polite">
      <span id="instructions">Click or tap to swat the roaches!</span>
    </div>
    
    <canvas id="floor" aria-hidden="true"></canvas>

    <div id="roaches"></div>
    <div id="sandal" aria-hidden="true">🩴</div>
    <label class="language-control">
  <span id="language-label">Language</span>
  <select id="language" aria-label="Language">
    <option value="en">English</option>
    <option value="es">Español</option>
    <option value="zh">中文</option>
  </select>
      <div><span id="high-score">0</span> <span id="high-score-label">dead</span> </div>
</label>
  </main>
</body>
</html>
