<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roach Patrol</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main id="game" aria-label="Roach Patrol game">
      <canvas id="floor" aria-hidden="true"></canvas>
      <div id="roaches" aria-hidden="true"></div>

      <div class="hud" aria-live="polite">
        <span><span id="stage-label">Stage</span>: <span id="stage">1</span></span>
        <span><span id="target-label">Target</span>: <span id="target">5</span></span>
        <span><span id="hit-label">Hit</span>: <span id="score">0</span></span>
        <span><span id="time-label">Time</span>: <span id="timer">30</span></span>
      </div>

      <div class="message" id="message">
        Click or tap to swat the roaches!
      </div>

      <div class="language-control">
        <span id="high-score">0</span>
        <span id="high-score-label">dead</span>
      </div>

      <div id="sandal" aria-hidden="true">🩴</div>
    </main>
  </body>
</html>
