<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lucky 7 Slot Machine</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="machine">
    <div class="top-bar">
      <label for="languageSelect" data-i18n="languageLabel">
        Language
      </label>

      <select id="languageSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh-Hant">繁體中文</option>
      </select>
    </div>

    <h1 data-i18n="title">LUCKY 7</h1>

    <div class="subtitle" data-i18n="subtitle">
      Choose your paylines and spin!
    </div>

    <div class="status">
      <div class="status-box">
        <span data-i18n="credits">Credits</span>
        <strong id="credits">100</strong>
      </div>

      <div class="status-box">
        <span data-i18n="lines">Lines</span>
        <strong id="selectedLines">1</strong>
      </div>

      <div class="status-box">
        <span data-i18n="lastWin">Last Win</span>
        <strong id="lastWin">0</strong>
      </div>
    </div>

    <section class="board" aria-label="Slot machine board">
      <svg
        class="payline-indicators"
        viewBox="0 0 300 300"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <line class="payline line-top" x1="-12" y1="50" x2="312" y2="50" />
        <line class="payline line-centre" x1="-12" y1="150" x2="312" y2="150" />
        <line class="payline line-bottom" x1="-12" y1="250" x2="312" y2="250" />
        <line
          class="payline line-diagonal-down"
          x1="-12"
          y1="-12"
          x2="312"
          y2="312"
        />
        <line
          class="payline line-diagonal-up"
          x1="-12"
          y1="312"
          x2="312"
          y2="-12"
        />
      </svg>

      <div class="cell">🍒</div>
      <div class="cell">🍋</div>
      <div class="cell">🍊</div>

      <div class="cell">🔔</div>
      <div class="cell">7️⃣</div>
      <div class="cell">🍒</div>

      <div class="cell">🍋</div>
      <div class="cell">🍊</div>
      <div class="cell">🔔</div>
    </section>

    <div class="legend">
      <span class="gold-dot">●</span>
      <span data-i18n="selectedLine">Selected line</span>

      &nbsp;

      <span class="green-dot">●</span>
      <span data-i18n="winningLine">Winning line</span>
    </div>

    <div class="line-options">
      <p data-i18n="lineCost">
        Choose paylines — 1 credit per line
      </p>

      <div class="line-buttons">
        <button class="line-button selected" data-lines="1">
          <span data-line-count="1">1 Line</span>
        </button>

        <button class="line-button" data-lines="3">
          <span data-line-count="3">3 Lines</span>
        </button>

        <button class="line-button" data-lines="5">
          <span data-line-count="5">5 Lines</span>
        </button>
      </div>
    </div>

    <div class="sound-controls">
      <button class="sound-button" id="soundButton" type="button">
        🔊 <span data-i18n="soundOn">Sound on</span>
      </button>
    </div>

    <button class="spin-button" id="spinButton" type="button">
      <span data-i18n="spin">SPIN</span>
    </button>

    <button class="reset-button" id="resetButton" type="button">
      <span data-i18n="reset">Reset Credits</span>
    </button>

    <div class="message" id="message" aria-live="polite">
      <span data-i18n="goodLuck">Good luck!</span>
    </div>

    <div class="paytable">
      <span data-i18n="paytableIntro">
        Three matching symbols on a line pays:
      </span>

      <br />

      🍒 ×5 · 🍋 ×10 · 🍊 ×15 · 🔔 ×20 · 7️⃣ ×50
    </div>

<!--   <div class="expected-value">
      <h2 data-i18n="expectedValueTitle">
        Expected win
      </h2>

      <p id="expectedWin"></p>
      <p id="expectedNet"></p>
    </div> -->
  </main>

  <script src="script.js"></script>
</body>
</html>
