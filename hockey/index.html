<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover
  "
/>

<meta name="theme-color" content="#111111" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
/>

<title>Touch Air Hockey</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap");

:root {
  --top-background: #ccefff;
  --bottom-background: #ffcccc;
  --line-color: #5d6875;
  --top-player: #18bde9;
  --bottom-player: #ef4040;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #111;
  touch-action: none;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  font-family: "Orbitron", monospace;
}

body {
  position: fixed;
  inset: 0;

  height: 100vh;
  height: 100dvh;

  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#overlay {
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 10;

  width: 100vh;
  height: 100vw;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 28px;
  gap: 10px;

  color: white;
  text-align: center;
  background: rgba(20, 24, 30, 0.92);

  transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center center;

  font-family: system-ui, sans-serif;
  transition: background-color 0.35s ease;
}

#overlay.blue-win {
  background: rgba(0, 90, 145, 0.94);
}

#overlay.red-win {
  background: rgba(145, 20, 20, 0.94);
}

#overlay.draw {
  background: rgba(40, 45, 52, 0.94);
}

#overlay h1 {
  margin: 0;
  font-size: clamp(34px, 10vh, 64px);
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.05;
  text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
}

#overlay .winner {
  margin: 4px 0 18px;
  font-size: clamp(24px, 7vh, 44px);
  font-weight: 900;
  letter-spacing: 0.03em;
  text-shadow: 0 3px 14px rgba(0, 0, 0, 0.45);
}

#overlay .score {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;

  font-family: "Orbitron", monospace;
  font-weight: 900;
  font-size: clamp(52px, 17vh, 110px);
  line-height: 1;
}

#overlay .score .blue-score {
  color: #4fd8ff;
}

#overlay .score .red-score {
  color: #ff6b6b;
}

#overlay .score .divider {
  color: rgba(255, 255, 255, 0.65);
  font-size: 0.7em;
}

#overlay .score-label {
  margin: 6px 0 22px;
  font-size: clamp(13px, 3.4vh, 18px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.8;
}

#overlay button {
  min-width: 190px;
  margin-top: 10px;
  padding: 16px 30px;
  border: 0;
  border-radius: 12px;
  background: #25bdf2;
  color: #03202d;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
}

#overlay button:active {
  transform: scale(0.97);
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <h1 id="overlayTitle"></h1>
  <p id="overlayInstructionTop"></p>
  <p id="overlayInstructionBottom"></p>
  <p id="overlayInstructionTime"></p>
  <button id="startButton"></button>
</div>

<script>
"use strict";

/*
  ------------------------------------------------------------
  DOM
  ------------------------------------------------------------
*/

const canvas = document.getElementById("game");
const context = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

/*
  ------------------------------------------------------------
  Translations
  ------------------------------------------------------------
*/

const translations = {
  en: {
    title: "Touch Air Hockey",
    topInstruction: "Blue player uses the top half.",
    bottomInstruction: "Red player uses the bottom half.",
    timeInstruction: "Most goals after 99 seconds wins.",
    start: "Start Game",
    timeUp: "Time's Up!",
    topWins: "Blue player wins!",
    bottomWins: "Red player wins!",
    draw: "It's a draw!",
    finalScore: "Final score",
    newGame: "New Game"
  },

  es: {
    title: "Air Hockey Táctil",
    topInstruction: "El jugador azul usa la mitad superior.",
    bottomInstruction: "El jugador rojo usa la mitad inferior.",
    timeInstruction: "Gana quien marque más goles en 99 segundos.",
    start: "Comenzar partida",
    timeUp: "¡Se acabó el tiempo!",
    topWins: "¡Gana el jugador azul!",
    bottomWins: "¡Gana el jugador rojo!",
    draw: "¡Empate!",
    finalScore: "Puntuación final",
    newGame: "Nueva partida"
  },

  zh: {
    title: "觸控空氣曲棍球",
    topInstruction: "藍隊負責上方半場。",
    bottomInstruction: "紅隊負責下方半場。",
    timeInstruction: "99 秒後，入波多嘅一方贏。",
    start: "開始遊戲",
    timeUp: "夠鐘！",
    topWins: "藍隊贏！",
    bottomWins: "紅隊贏！",
    draw: "打和！",
    finalScore: "最終比數",
    newGame: "再嚟一局"
  }
};

function getSelectedLanguage() {
  const requestedLanguage = new URLSearchParams(
    window.location.search
  ).get("lang");

  if (requestedLanguage) {
    const normalizedLanguage = requestedLanguage
      .trim()
      .toLowerCase()
      .split("-")[0];

    if (
      normalizedLanguage === "en" ||
      normalizedLanguage === "es" ||
      normalizedLanguage === "zh"
    ) {
      return normalizedLanguage;
    }
  }

  const browserLanguages =
    navigator.languages?.length > 0
      ? navigator.languages
      : [navigator.language || "en"];

  for (const browserLanguage of browserLanguages) {
    const normalizedLanguage = browserLanguage
      .toLowerCase()
      .split("-")[0];

    if (
      normalizedLanguage === "en" ||
      normalizedLanguage === "es" ||
      normalizedLanguage === "zh"
    ) {
      return normalizedLanguage;
    }
  }

  return "en";
}

const language = getSelectedLanguage();
const text = translations[language];

function applyTranslations() {
  document.documentElement.lang =
    language === "zh" ? "zh-Hant" : language;

  document.getElementById("overlayTitle").textContent =
    text.title;

  document.getElementById("overlayInstructionTop").textContent =
    text.topInstruction;

  document.getElementById(
    "overlayInstructionBottom"
  ).textContent = text.bottomInstruction;

  document.getElementById(
    "overlayInstructionTime"
  ).textContent = text.timeInstruction;

  document.getElementById("startButton").textContent =
    text.start;
}

applyTranslations();

/*
  ------------------------------------------------------------
  Canvas dimensions
  ------------------------------------------------------------
*/

let width = 0;
let height = 0;
let centerX = 0;
let centerY = 0;
let goalLeft = 0;
let goalRight = 0;

/*
  ------------------------------------------------------------
  Game state
  ------------------------------------------------------------
*/

const game = {
  running: false,
  secondsRemaining: 99,
  topScore: 0,
  bottomScore: 0,
  timerId: null
};

const puck = {
  x: 0,
  y: 0,
  velocityX: 0,
  velocityY: 0,
  radius: 0
};

const topPaddle = {
  x: 0,
  y: 0,
  radius: 0,
  active: false,
  pointerId: null,
  velocityX: 0,
  velocityY: 0
};

const bottomPaddle = {
  x: 0,
  y: 0,
  radius: 0,
  active: false,
  pointerId: null,
  velocityX: 0,
  velocityY: 0
};

const physics = {
  friction: 0.998,
  wallBounce: 0.88,
  paddleBounce: 1.15,
  paddleVelocityInfluence: 1.35,
  maxPuckSpeed: 0
};

/*
  ------------------------------------------------------------
  Audio
  ------------------------------------------------------------
*/

let audioContext = null;

function initialiseAudio() {
  if (!audioContext) {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

function playTone({
  frequency = 440,
  duration = 0.08,
  type = "sine",
  volume = 0.08,
  slideTo = null,
  delay = 0
} = {}) {
  if (!audioContext) return;

  const startTime = audioContext.currentTime + delay;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, startTime);

  if (slideTo !== null) {
    oscillator.frequency.exponentialRampToValueAtTime(
      Math.max(1, slideTo),
      startTime + duration
    );
  }

  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(
    volume,
    startTime + 0.008
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    startTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(startTime);
  oscillator.stop(startTime + duration + 0.02);
}

function playNewGameSound() {
  playTone({
    frequency: 440,
    slideTo: 660,
    duration: 0.18,
    type: "triangle",
    volume: 0.12
  });

  playTone({
    frequency: 660,
    slideTo: 880,
    duration: 0.18,
    type: "triangle",
    volume: 0.1,
    delay: 0.16
  });
}

function playPuckHitSound() {
  playTone({
    frequency: 180,
    slideTo: 95,
    duration: 0.045,
    type: "square",
    volume: 0.045
  });
}

function playWallSound() {
  playTone({
    frequency: 125,
    slideTo: 75,
    duration: 0.07,
    type: "triangle",
    volume: 0.055
  });
}

function playGoalSound() {
  playTone({
    frequency: 330,
    slideTo: 660,
    duration: 0.22,
    type: "sawtooth",
    volume: 0.09
  });

  playTone({
    frequency: 660,
    slideTo: 990,
    duration: 0.28,
    type: "triangle",
    volume: 0.09,
    delay: 0.2
  });
}

function playTimeUpSound() {
  playTone({
    frequency: 440,
    slideTo: 220,
    duration: 0.45,
    type: "sawtooth",
    volume: 0.11
  });

  playTone({
    frequency: 220,
    slideTo: 110,
    duration: 0.6,
    type: "sine",
    volume: 0.09,
    delay: 0.42
  });
}

/*
  ------------------------------------------------------------
  Vibration
  ------------------------------------------------------------
*/

function vibrate(pattern) {
  if (typeof navigator.vibrate !== "function") {
    return;
  }

  try {
    navigator.vibrate(pattern);
  } catch {
    // Vibration is optional and may be blocked by the browser.
  }
}

function vibratePuckHit() {
  vibrate(18);
}

function vibrateGoal() {
  vibrate([45, 35, 80]);
}

function vibrateGameOver() {
  vibrate([100, 60, 140, 60, 220]);
}

/*
  ------------------------------------------------------------
  Fullscreen and portrait orientation
  ------------------------------------------------------------
*/

function requestFullscreen(element) {
  if (element.requestFullscreen) {
    return element.requestFullscreen();
  }

  if (element.webkitRequestFullscreen) {
    return element.webkitRequestFullscreen();
  }

  return Promise.reject(
    new Error("Fullscreen is not supported.")
  );
}

function lockPortraitOrientation() {
  const orientation = screen.orientation;

  if (!orientation || typeof orientation.lock !== "function") {
    return Promise.resolve(false);
  }

  return orientation
    .lock("portrait")
    .then(() => true)
    .catch(() => false);
}

async function enterPortraitFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await requestFullscreen(document.documentElement);
    }

    await lockPortraitOrientation();
  } catch {
    // The user may deny fullscreen, or the browser/device
    // may not support fullscreen or orientation locking.
  }
}

/*
  ------------------------------------------------------------
  Canvas setup
  ------------------------------------------------------------
*/

function resizeCanvas() {
  const pixelRatio = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = Math.round(width * pixelRatio);
  canvas.height = Math.round(height * pixelRatio);

  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;

  context.setTransform(
    pixelRatio,
    0,
    0,
    pixelRatio,
    0,
    0
  );

  calculateDimensions();
  resetPositions();
}

function calculateDimensions() {
  centerX = width / 2;
  centerY = height / 2;

  const base = Math.min(width, height);

  puck.radius = base * 0.028;
  topPaddle.radius = base * 0.05;
  bottomPaddle.radius = base * 0.05;

  physics.maxPuckSpeed = base * 0.09;

  const goalWidth = width * 0.38;

  goalLeft = centerX - goalWidth / 2;
  goalRight = centerX + goalWidth / 2;
}

function clamp(value, minimum, maximum) {
  return Math.max(minimum, Math.min(maximum, value));
}

function resetPaddle(paddle, y) {
  paddle.x = centerX;
  paddle.y = y;
  paddle.active = false;
  paddle.pointerId = null;
  paddle.velocityX = 0;
  paddle.velocityY = 0;
}

function resetPositions() {
  const edgeOffset = Math.min(width, height) * 0.18;

  resetPaddle(topPaddle, edgeOffset);
  resetPaddle(bottomPaddle, height - edgeOffset);

  puck.x = centerX;
  puck.y = centerY;
  puck.velocityX = 0;
  puck.velocityY = 0;
}

/*
  ------------------------------------------------------------
  Game lifecycle
  ------------------------------------------------------------
*/

function startGame() {
  initialiseAudio();
  playNewGameSound();

  game.running = true;
  game.secondsRemaining = 99;
  game.topScore = 0;
  game.bottomScore = 0;

  resetPositions();

  clearInterval(game.timerId);

  game.timerId = setInterval(() => {
    if (!game.running) return;

    game.secondsRemaining--;

    if (game.secondsRemaining <= 0) {
      game.secondsRemaining = 0;
      finishGame();
    }
  }, 1000);
}

function finishGame() {
  game.running = false;

  clearInterval(game.timerId);
  game.timerId = null;

  playTimeUpSound();
  vibrateGameOver();

  let resultClass = "draw";
  let winnerText = text.draw;

  if (game.topScore > game.bottomScore) {
    resultClass = "blue-win";
    winnerText = text.topWins;
  } else if (game.bottomScore > game.topScore) {
    resultClass = "red-win";
    winnerText = text.bottomWins;
  }

  overlay.className = resultClass;
  overlay.style.display = "flex";

  overlay.innerHTML = `
    <h1>${text.timeUp}</h1>

    <p class="winner">${winnerText}</p>

    <p class="score">
      <span class="blue-score">${game.topScore}</span>
      <span class="divider">–</span>
      <span class="red-score">${game.bottomScore}</span>
    </p>

    <p class="score-label">${text.finalScore}</p>

    <button id="restartButton">${text.newGame}</button>
  `;

  document
    .getElementById("restartButton")
    .addEventListener("click", async () => {
      await enterPortraitFullscreen();

      overlay.style.display = "none";
      startGame();
    });
}
/*
  ------------------------------------------------------------
  Pointer controls
  ------------------------------------------------------------
*/

function getPointerPosition(event) {
  const rectangle = canvas.getBoundingClientRect();

  return {
    x: event.clientX - rectangle.left,
    y: event.clientY - rectangle.top
  };
}

function startPointer(event) {
  if (!game.running) return;

  event.preventDefault();

  const position = getPointerPosition(event);
  const pointerId = event.pointerId;

  if (
    position.y < centerY &&
    !topPaddle.active
  ) {
    topPaddle.active = true;
    topPaddle.pointerId = pointerId;

    topPaddle.x = clamp(
      position.x,
      topPaddle.radius,
      width - topPaddle.radius
    );

    topPaddle.y = clamp(
      position.y,
      topPaddle.radius,
      centerY - topPaddle.radius
    );

    canvas.setPointerCapture?.(pointerId);
  }

  if (
    position.y > centerY &&
    !bottomPaddle.active
  ) {
    bottomPaddle.active = true;
    bottomPaddle.pointerId = pointerId;

    bottomPaddle.x = clamp(
      position.x,
      bottomPaddle.radius,
      width - bottomPaddle.radius
    );

    bottomPaddle.y = clamp(
      position.y,
      centerY + bottomPaddle.radius,
      height - bottomPaddle.radius
    );

    canvas.setPointerCapture?.(pointerId);
  }
}

function movePointer(event) {
  if (!game.running) return;

  event.preventDefault();

  const position = getPointerPosition(event);
  const pointerId = event.pointerId;

  if (
    topPaddle.active &&
    topPaddle.pointerId === pointerId
  ) {
    const newX = clamp(
      position.x,
      topPaddle.radius,
      width - topPaddle.radius
    );

    const newY = clamp(
      position.y,
      topPaddle.radius,
      centerY - topPaddle.radius
    );

    topPaddle.velocityX = newX - topPaddle.x;
    topPaddle.velocityY = newY - topPaddle.y;

    topPaddle.x = newX;
    topPaddle.y = newY;
  }

  if (
    bottomPaddle.active &&
    bottomPaddle.pointerId === pointerId
  ) {
    const newX = clamp(
      position.x,
      bottomPaddle.radius,
      width - bottomPaddle.radius
    );

    const newY = clamp(
      position.y,
      centerY + bottomPaddle.radius,
      height - bottomPaddle.radius
    );

    bottomPaddle.velocityX = newX - bottomPaddle.x;
    bottomPaddle.velocityY = newY - bottomPaddle.y;

    bottomPaddle.x = newX;
    bottomPaddle.y = newY;
  }
}

function endPointer(event) {
  const pointerId = event.pointerId;

  if (topPaddle.pointerId === pointerId) {
    topPaddle.active = false;
    topPaddle.pointerId = null;
    topPaddle.velocityX = 0;
    topPaddle.velocityY = 0;
  }

  if (bottomPaddle.pointerId === pointerId) {
    bottomPaddle.active = false;
    bottomPaddle.pointerId = null;
    bottomPaddle.velocityX = 0;
    bottomPaddle.velocityY = 0;
  }
}

canvas.addEventListener("pointerdown", startPointer, {
  passive: false
});

canvas.addEventListener("pointermove", movePointer, {
  passive: false
});

canvas.addEventListener("pointerup", endPointer, {
  passive: false
});

canvas.addEventListener("pointercancel", endPointer, {
  passive: false
});

/*
  ------------------------------------------------------------
  Physics
  ------------------------------------------------------------
*/

function isInsideGoalOpening() {
  return puck.x > goalLeft && puck.x < goalRight;
}

function handleWalls() {
  if (puck.x - puck.radius < 0) {
    puck.x = puck.radius;
    puck.velocityX =
      Math.abs(puck.velocityX) * physics.wallBounce;

    playWallSound();
    vibratePuckHit();
  }

  if (puck.x + puck.radius > width) {
    puck.x = width - puck.radius;
    puck.velocityX =
      -Math.abs(puck.velocityX) * physics.wallBounce;

    playWallSound();
    vibratePuckHit();
  }

  if (!isInsideGoalOpening()) {
    if (puck.y - puck.radius < 0) {
      puck.y = puck.radius;
      puck.velocityY =
        Math.abs(puck.velocityY) * physics.wallBounce;

      playWallSound();
      vibrateGoal();
    }

    if (puck.y + puck.radius > height) {
      puck.y = height - puck.radius;
      puck.velocityY =
        -Math.abs(puck.velocityY) * physics.wallBounce;

      playWallSound();
      vibrateGoal();
    }
  }
}

function collidePuckWithPaddle(paddle) {
  const dx = puck.x - paddle.x;
  const dy = puck.y - paddle.y;
  const distance = Math.hypot(dx, dy);
  const minimumDistance = puck.radius + paddle.radius;

  if (
    distance >= minimumDistance ||
    distance === 0
  ) {
    return;
  }

  const normalX = dx / distance;
  const normalY = dy / distance;
  const overlap = minimumDistance - distance;

  puck.x += normalX * overlap;
  puck.y += normalY * overlap;

  const velocityAlongNormal =
    puck.velocityX * normalX +
    puck.velocityY * normalY;

  puck.velocityX -=
    2 * velocityAlongNormal * normalX;

  puck.velocityY -=
    2 * velocityAlongNormal * normalY;

  puck.velocityX +=
    paddle.velocityX * physics.paddleVelocityInfluence;

  puck.velocityY +=
    paddle.velocityY * physics.paddleVelocityInfluence;

  puck.velocityX *= physics.paddleBounce;
  puck.velocityY *= physics.paddleBounce;

  const speed = Math.hypot(
    puck.velocityX,
    puck.velocityY
  );

  if (speed > physics.maxPuckSpeed) {
    const scale = physics.maxPuckSpeed / speed;

    puck.velocityX *= scale;
    puck.velocityY *= scale;
  }

  playPuckHitSound();
  vibratePuckHit();
}

function checkGoals() {
  /*
    Top goal:
    bottom player scores.

    Bottom goal:
    top player scores.
  */

  if (puck.y + puck.radius < 0) {
    game.bottomScore++;

    playGoalSound();
    vibrateGoal();

    resetPositions();
    return true;
  }

  if (puck.y - puck.radius > height) {
    game.topScore++;

    playGoalSound();
    vibrateGoal();

    resetPositions();
    return true;
  }

  return false;
}

function updatePhysics() {
  if (!game.running) return;

  puck.velocityX *= physics.friction;
  puck.velocityY *= physics.friction;

  puck.x += puck.velocityX;
  puck.y += puck.velocityY;

  if (checkGoals()) {
    return;
  }

  handleWalls();

  collidePuckWithPaddle(topPaddle);
  collidePuckWithPaddle(bottomPaddle);

  const speed = Math.hypot(
    puck.velocityX,
    puck.velocityY
  );

  if (speed < 0.35) {
    puck.velocityX += (Math.random() - 0.5) * 0.35;
    puck.velocityY += (Math.random() - 0.5) * 0.35;
  }
}

/*
  ------------------------------------------------------------
  Rendering
  ------------------------------------------------------------
*/

function drawDigitalText(
  value,
  x,
  y,
  size,
  rotation = 0
) {
  context.save();

  context.translate(x, y);
  context.rotate(rotation);

  context.font = `900 ${size}px Orbitron, monospace`;
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#ffffff";

  context.shadowColor = "rgba(0, 0, 0, 0.35)";
  context.shadowBlur = 5;
  context.shadowOffsetX = 2;
  context.shadowOffsetY = 2;

  context.fillText(value, 0, 0);

  context.restore();
}

function drawTable() {
  context.fillStyle = "#ccefff";
  context.fillRect(0, 0, width, centerY);

  context.fillStyle = "#ffcccc";
  context.fillRect(0, centerY, width, height - centerY);

  context.strokeStyle = "#5d6875";
  context.lineWidth = Math.max(
    3,
    Math.min(width, height) * 0.005
  );

  /* Horizontal centre line. */
  context.beginPath();
  context.moveTo(0, centerY);
  context.lineTo(width, centerY);
  context.stroke();

  /* Centre circle. */
  context.beginPath();
  context.arc(
    centerX,
    centerY,
    Math.min(width, height) * 0.12,
    0,
    Math.PI * 2
  );
  context.stroke();

  /*
    Goals are at the top and bottom edges,
    centred horizontally.
  */
  context.fillStyle = "#71808c";

  context.fillRect(
    goalLeft,
    0,
    goalRight - goalLeft,
    12
  );

  context.fillRect(
    goalLeft,
    height - 12,
    goalRight - goalLeft,
    12
  );
}

function drawDisplays() {
  const base = Math.min(width, height);
  const scoreSize = base * 0.16;
  const timerSize = base * 0.09;
  const time = String(game.secondsRemaining).padStart(2, "0");

  /*
    Blue score: positioned in front of the top goal,
    rotated 180 degrees so it faces upward toward the blue player.
  */
  drawDigitalText(
    game.topScore,
    centerX,
    height * 0.14,
    scoreSize,
    Math.PI
  );

  /*
    Red score: remains facing downward toward the red player.
  */
  drawDigitalText(
    game.bottomScore,
    centerX,
    height * 0.86,
    scoreSize,
    0
  );

  /*
    Timer: one on each side, rotated inward.
    The left timer reads toward the right;
    the right timer reads toward the left.
  */
  const timerOffset = base * 0.075;

  drawDigitalText(
    time,
    timerOffset,
    centerY,
    timerSize,
    -Math.PI / 2
  );

  drawDigitalText(
    time,
    width - timerOffset,
    centerY,
    timerSize,
    Math.PI / 2
  );
}

function drawPaddle(
  paddle,
  fillColor,
  outlineColor
) {
  context.fillStyle = fillColor;

  context.beginPath();
  context.arc(
    paddle.x,
    paddle.y,
    paddle.radius,
    0,
    Math.PI * 2
  );
  context.fill();

  context.strokeStyle = outlineColor;
  context.lineWidth = Math.max(
    3,
    paddle.radius * 0.15
  );

  context.beginPath();
  context.arc(
    paddle.x,
    paddle.y,
    paddle.radius * 0.6,
    0,
    Math.PI * 2
  );
  context.stroke();
}

function drawPuck() {
  context.fillStyle = "#000000";

  context.beginPath();
  context.arc(
    puck.x,
    puck.y,
    puck.radius,
    0,
    Math.PI * 2
  );
  context.fill();
}

function render() {
  drawTable();
  drawDisplays();

  drawPaddle(
    topPaddle,
    "#18bde9",
    "#006688"
  );

  drawPaddle(
    bottomPaddle,
    "#ef4040",
    "#880000"
  );

  drawPuck();
}

/*
  ------------------------------------------------------------
  Main loop
  ------------------------------------------------------------
*/

function gameLoop() {
  updatePhysics();
  render();
  requestAnimationFrame(gameLoop);
}

/*
  ------------------------------------------------------------
  Start
  ------------------------------------------------------------
*/

document
  .getElementById("startButton")
  .addEventListener("click", async () => {
    /*
      This must happen synchronously in the click handler,
      before awaiting anything else, so the browser treats it
      as a valid user gesture and can show its fullscreen
      permission prompt.
    */

    const fullscreenRequest = requestFullscreen(
      document.documentElement
    );

    /*
      Start the game immediately. Do not wait for fullscreen
      to resolve first; otherwise some mobile browsers may
      consider the user activation expired.
    */

    overlay.style.display = "none";
    startGame();

    try {
      await fullscreenRequest;
      await lockPortraitOrientation();
    } catch {
      // Fullscreen or orientation lock may be unavailable.
    }
  });

function handleViewportChange() {
  resizeCanvas();
}

window.addEventListener("resize", handleViewportChange);
window.addEventListener(
  "orientationchange",
  handleViewportChange
);

if (window.visualViewport) {
  window.visualViewport.addEventListener(
    "resize",
    handleViewportChange
  );
}

resizeCanvas();
gameLoop();
</script>
</body>
</html>
