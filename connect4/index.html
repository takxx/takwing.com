<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Connect 4</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game">
    <h1 data-i18n="title">Connect 4</h1>

    <div id="status"></div>

    <div
      id="board"
      class="board"
      aria-label="Connect 4 game board"
    ></div>

    <div class="controls">
      <div class="lang-selector">
        <label for="lang-select" data-i18n="language">Language</label>
        <select id="lang-select">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="zh">中文</option>
        </select>
      </div>

      <button id="restart" data-i18n="restart">New Game</button>

      <div class="legend">
        <span class="legend-item">
          <span class="score-dot red" aria-label="Your wins">
            <span class="num" id="player-wins">0</span>
          </span>
          <span data-i18n="you">You</span>
        </span>

        <span class="legend-item">
          <span class="score-dot yellow" aria-label="Computer wins">
            <span class="num" id="computer-wins">0</span>
          </span>
          <span data-i18n="computer">Computer</span>
        </span>
      </div>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
