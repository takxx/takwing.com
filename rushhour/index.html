<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="title">Rush Hour</title>
<style>
:root {
  --bg: #21170f;
  --panel: #382719;
  --board: #493322;
  --cell: #60452e;
  --text: #f7e8c8;
  --muted: #c9ad7d;
  --border: #170f09;
  --gap: 4px;
  --padding: 4px;
  --board-border: 7px;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 24px;
  color: var(--text);
  background:
    radial-gradient(ellipse at top, #654323 0%, transparent 56%),
    var(--bg);
  font-family: Georgia, "Times New Roman", serif;
}

.game {
  width: min(96vw, 900px);
  margin: 0 auto;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 14px;
}

h1 {
  margin: 0;
  color: #f2c879;
  font-size: clamp(2rem, 6vw, 3.2rem);
  letter-spacing: .04em;
  text-shadow: 0 2px 0 #3b2110, 0 4px 12px #0008;
}

select,
button {
  padding: 9px 12px;
  color: var(--text);
  background: #553a24;
  border: 1px solid #f2c87955;
  border-radius: 8px;
  font: inherit;
}

button {
  font-weight: 700;
  cursor: pointer;
}

button:hover,
select:hover {
  background: #704a2c;
}

.wide-toolbar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  padding: 10px;
  background: var(--panel);
  border: 1px solid #f2c87933;
  border-radius: 10px;
}

.subtitle {
  margin: 0;
  color: var(--muted);
  text-align: left;
}

.move-counter {
  justify-self: center;
  padding: 8px 12px;
  color: var(--muted);
  background: #21170f66;
  border: 1px solid #f2c87933;
  border-radius: 8px;
  white-space: nowrap;
}

.move-counter strong {
  margin-left: 4px;
  color: var(--text);
}

.controls {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.board {
  position: relative;
  width: min(96vw, 900px);
  aspect-ratio: 9 / 6;
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));
  gap: var(--gap);
  padding: var(--padding);
  background: var(--board);
  border: var(--board-border) solid var(--border);
  border-radius: 16px;
  box-shadow: 0 20px 40px #0009;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  border-radius: 5px;
  background: var(--cell);
  box-shadow: inset 0 1px 2px #fff2;
}

.exit {
  position: absolute;
  z-index: 3;
  top: calc(
    var(--board-border) + var(--padding) +
    2 * ((100% - 2 * var(--board-border) - 2 * var(--padding) - 5 * var(--gap)) / 6 + var(--gap))
  );
  right: calc(-1 * var(--board-border) - 18px);
  width: 18px;
  height: calc(
    (100% - 2 * var(--board-border) - 2 * var(--padding) - 5 * var(--gap)) / 6
  );
  background: #c74632;
  border-radius: 0 7px 7px 0;
  box-shadow: 0 0 14px #c7463288;
  pointer-events: none;
}

.exit::after {
  content: "➜";
  position: absolute;
  top: 50%;
  right: -29px;
  color: #f08061;
  font: 1.2rem system-ui, sans-serif;
  transform: translateY(-50%);
}

.car {
  position: absolute;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid #170f0f99;
  border-radius: 9px;
  color: #fff8e9;
  font: 800 clamp(.6rem, 2vw, .9rem) system-ui, sans-serif;
  text-shadow: 0 1px 2px #000;
  user-select: none;
  touch-action: none;
  cursor: grab;
  transition: left .12s ease, top .12s ease;
  box-shadow: inset 0 0 0 3px #ffffff26, 0 4px 7px #0008;
}

.car:active {
  z-index: 20;
  cursor: grabbing;
  transition: none;
}

.car::before,
.car::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  border: 1px solid #ffffff33;
  border-radius: 50%;
  background: #21170f;
}

.car.horizontal::before { left: 15%; bottom: -6px; }
.car.horizontal::after { right: 15%; bottom: -6px; }
.car.vertical::before { right: -6px; top: 15%; }
.car.vertical::after { right: -6px; bottom: 15%; }

/* Muted, dusty western paint colors */
.red    { background: #b33c2e; }
.blue   { background: #527a86; }
.green  { background: #6d8050; }
.yellow { background: #c49a46; }
.purple { background: #80627e; }
.orange { background: #b96b37; }
.teal   { background: #4c8278; }
.pink   { background: #a95d67; }

.desktop-instructions {
  margin: 18px 0 0;
  color: var(--muted);
  font-size: .95rem;
  line-height: 1.5;
  text-align: center;
}

.mobile-toolbar {
  display: none;
}

.message {
  min-height: 28px;
  margin-top: 12px;
  color: #a7c879;
  font-weight: 800;
  text-align: center;
}

@media (max-width: 700px) {
  body {
    padding: 16px 12px;
  }

  .page-header {
    margin-bottom: 12px;
  }

  .page-header > select {
    display: none;
  }

  .wide-toolbar,
  .desktop-instructions {
    display: none;
  }

  .board {
    width: min(96vw, 500px);
    height: auto;
    aspect-ratio: 6 / 9;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
  }

  .exit {
    top: auto;
    right: auto;
    bottom: calc(-1 * var(--board-border) - 18px);
    left: calc(
      var(--board-border) + var(--padding) +
      2 * ((100% - 2 * var(--board-border) - 2 * var(--padding) - 5 * var(--gap)) / 6 + var(--gap))
    );
    width: calc(
      (100% - 2 * var(--board-border) - 2 * var(--padding) - 5 * var(--gap)) / 6
    );
    height: 18px;
    border-radius: 0 0 7px 7px;
  }

  .exit::after {
    top: auto;
    right: 50%;
    bottom: -29px;
    transform: translateX(50%) rotate(90deg);
  }

  .mobile-toolbar {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    margin-top: 14px;
  }

  .mobile-toolbar .move-counter {
    align-self: flex-start;
    justify-self: auto;
  }

  .instructions {
    margin: 0;
    color: var(--muted);
    font-size: .95rem;
    line-height: 1.5;
  }

  .mobile-toolbar .controls {
    width: 100%;
  }

  .mobile-toolbar .controls button {
    flex: 1;
  }

  .mobile-language {
    align-self: center;
  }
}
</style>
</head>

<body>
<main class="game">
  <header class="page-header">
    <h1 data-i18n="title">Rush Hour</h1>

    <select id="language" aria-label="Language">
      <option value="en">English</option>

      <option value="zh-Hant">中文</option>
    </select>
  </header>

  <section class="wide-toolbar" aria-label="Game controls">
    <p class="subtitle" data-i18n="subtitle">
      Move the red car to the exit.
    </p>

    <div class="move-counter" aria-live="polite">
      <span data-i18n="moves">Moves</span>:
      <strong id="moveCount">0</strong>
    </div>

    <div class="controls">
      <button id="resetButton" type="button" data-i18n="reset">Reset</button>
      <button id="newButton" type="button" data-i18n="newPuzzle">
        New Puzzle
      </button>
    </div>
  </section>

  <div id="board" class="board" style="aspect-ratio: 9 / 6;">
    <div class="exit" aria-hidden="true"></div>
  </div>

  <div class="mobile-toolbar">
    <div class="move-counter" aria-live="polite">
      <span data-i18n="moves">Moves</span>:
      <strong class="mobile-move-count">0</strong>
    </div>

    <p class="instructions" data-i18n="instructions">
      Drag cars only in the direction they are facing.
    </p>

    <div class="controls">
      <button class="reset-button" type="button" data-i18n="reset">Reset</button>
      <button class="new-button" type="button" data-i18n="newPuzzle">
        New Puzzle
      </button>
    </div>

    <select class="mobile-language" aria-label="Language">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="zh-Hant">中文</option>
    </select>
  </div>

  <p class="instructions desktop-instructions" data-i18n="instructions">
    Drag cars only in the direction they are facing.
  </p>

  <div id="message" class="message" aria-live="polite"></div>
</main>

<script>
const ROWS = 6;
const COLS = 9;

const ROTATE_QUERY = "(max-width: 600px)";

function isRotatedLayout() {
  return window.matchMedia(ROTATE_QUERY).matches;
}

function getGridMetrics(board, rotated = isRotatedLayout()) {
  const style = getComputedStyle(board);

  const paddingLeft = parseFloat(style.paddingLeft) || 0;
  const paddingRight = parseFloat(style.paddingRight) || 0;
  const paddingTop = parseFloat(style.paddingTop) || 0;
  const paddingBottom = parseFloat(style.paddingBottom) || 0;

  const gapX = parseFloat(style.columnGap) || 0;
  const gapY = parseFloat(style.rowGap) || 0;

  const gridWidth = board.clientWidth - paddingLeft - paddingRight;
  const gridHeight = board.clientHeight - paddingTop - paddingBottom;

  const screenCols = rotated ? ROWS : COLS;
  const screenRows = rotated ? COLS : ROWS;

  const cellWidth = (gridWidth - gapX * (screenCols - 1)) / screenCols;
  const cellHeight = (gridHeight - gapY * (screenRows - 1)) / screenRows;

  return {
    rotated,
    paddingLeft,
    paddingTop,
    gapX,
    gapY,
    cellWidth,
    cellHeight,
    stepX: cellWidth + gapX,
    stepY: cellHeight + gapY,
  };
}

function screenPosition(row, col, metrics, car) {
  if (!metrics.rotated) {
    return { screenRow: row, screenCol: col };
  }

  return {
    screenRow: col,
    screenCol:
      car?.dir === "v"
        ? ROWS - 1 - (row + car.length - 1)
        : ROWS - 1 - row,
  };
}

function cellPosition(row, col, metrics, car) {
  const { screenRow, screenCol } = screenPosition(row, col, metrics, car);

  return {
    left: metrics.paddingLeft + screenCol * metrics.stepX,
    top: metrics.paddingTop + screenRow * metrics.stepY,
  };
}

function createCells(board) {
  board.querySelectorAll(".cell").forEach((cell) => cell.remove());

  const exit = board.querySelector(".exit");

  for (let i = 0; i < ROWS * COLS; i += 1) {
    const cell = document.createElement("div");
    cell.className = "cell";
    board.insertBefore(cell, exit);
  }
}

function renderCar(board, car, metrics, onPointerDown) {
  const element = document.createElement("div");

  const visualDirection = metrics.rotated
    ? car.dir === "h"
      ? "v"
      : "h"
    : car.dir;

  element.className = `car ${
    visualDirection === "h" ? "horizontal" : "vertical"
  } ${car.color}`;

  const position = cellPosition(car.row, car.col, metrics, car);

  const visualWidthInCells = car.dir === "h"
    ? metrics.rotated ? 1 : car.length
    : metrics.rotated ? car.length : 1;

  const visualHeightInCells = car.dir === "v"
    ? metrics.rotated ? 1 : car.length
    : metrics.rotated ? car.length : 1;

  element.style.left = `${position.left}px`;
  element.style.top = `${position.top}px`;
  element.style.width = `${
    visualWidthInCells * metrics.cellWidth +
    (visualWidthInCells - 1) * metrics.gapX
  }px`;
  element.style.height = `${
    visualHeightInCells * metrics.cellHeight +
    (visualHeightInCells - 1) * metrics.gapY
  }px`;

  element.textContent = car.label || "";

  element.addEventListener("pointerdown", (event) => {
    onPointerDown(event, car, element, metrics);
  });

  board.appendChild(element);
}

function positionExit(board, target, metrics) {
  const exit = board.querySelector(".exit");

  if (!exit || !target) {
    return;
  }

  if (!metrics.rotated) {
    exit.style.left = "";
    exit.style.top = "";
    exit.style.right = "";
    exit.style.bottom = "";
    exit.style.width = "";
    exit.style.height = "";
    return;
  }

  const screenCol = ROWS - 1 - target.row;
  const gridBottom =
    metrics.paddingTop + COLS * metrics.stepY - metrics.gapY;

  exit.style.left = `${metrics.paddingLeft + screenCol * metrics.stepX}px`;
  exit.style.right = "auto";
  exit.style.top = `${gridBottom}px`;
  exit.style.bottom = "auto";
  exit.style.width = `${metrics.cellWidth}px`;
  exit.style.height = "18px";
}

function render({ board, cars, moves, onPointerDown }) {
  board.querySelectorAll(".car").forEach((element) => element.remove());

  const rotated = isRotatedLayout();
  board.classList.toggle("rotated", rotated);

  if (rotated) {
    const style = getComputedStyle(board);
    const px = (value) => parseFloat(value) || 0;

    const paddingX = px(style.paddingLeft) + px(style.paddingRight);
    const paddingY = px(style.paddingTop) + px(style.paddingBottom);
    const borderY =
      px(style.borderTopWidth) + px(style.borderBottomWidth);

    const gapX = px(style.columnGap);
    const gapY = px(style.rowGap);

    const cellSize =
      (board.clientWidth - paddingX - gapX * (ROWS - 1)) / ROWS;

    board.style.height = `${
      borderY + paddingY + cellSize * COLS + gapY * (COLS - 1)
    }px`;
  } else {
    board.style.height = "";
  }

  const metrics = getGridMetrics(board, rotated);
  const target = cars.find((car) => car.id === "target");

  positionExit(board, target, metrics);

  for (const car of cars) {
    renderCar(board, car, metrics, onPointerDown);
  }

  document.getElementById("moveCount").textContent = moves;
}

function getLanguageFromURL() {
  const langParam = new URLSearchParams(window.location.search).get("lang");

  if (!langParam) {
    return null;
  }

  const normalized = langParam.trim();

  if (SUPPORTED_LANGUAGES.includes(normalized)) {
    return normalized;
  }

  if (normalized === "zh") {
    return "zh-Hant";
  }

  const base = normalized.split("-")[0].toLowerCase();

  if (SUPPORTED_LANGUAGES.includes(base)) {
    return base;
  }

  if (base === "zh") {
    return "zh-Hant";
  }

  return null;
}

function getInitialLanguage() {
  const fromURL = getLanguageFromURL();

  if (fromURL) {
    return fromURL;
  }

  const stored = localStorage.getItem("rush-hour-language");

  if (stored && SUPPORTED_LANGUAGES.includes(stored)) {
    return stored;
  }

  const browserLang =
    navigator.language || navigator.languages?.[0] || "en";

  if (SUPPORTED_LANGUAGES.includes(browserLang)) {
    return browserLang;
  }

  const base = browserLang.split("-")[0].toLowerCase();

  if (SUPPORTED_LANGUAGES.includes(base)) {
    return base;
  }

  if (base === "zh") {
    return "zh-Hant";
  }

  return "en";
}

function translate(language, key) {
  return translations[language]?.[key] ?? translations.en[key] ?? key;
}

function applyLanguage(language, cars, elements) {
  document.documentElement.lang = language;
  document.title = translate(language, "title");

  document.querySelectorAll("[data-i18n]").forEach((element) => {
    element.textContent = translate(language, element.dataset.i18n);
  });

  for (const car of cars) {
    if (car.id === "target") {
      car.label = translate(language, "youLabel");
    }
  }

  elements.message.textContent = "";
}

    { id: "j", row: 5, col: 0, length: 2, dir: "h", color: "teal" },
    { id: "k", row: 5, col: 5, length: 2, dir: "h", color: "pink" },
    { id: "l", row: 0, col: 8, length: 2, dir: "v", color: "yellow" },
    { id: "m", row: 4, col: 8, length: 2, dir: "v", color: "green" },
  ],
  [
    { id: "target", row: 2, col: 7, length: 2, dir: "h", color: "red", label: "YOU" },
    { id: "a", row: 0, col: 2, length: 3, dir: "v", color: "purple" },
    { id: "b", row: 0, col: 3, length: 3, dir: "v", color: "orange" },
    { id: "c", row: 3, col: 7, length: 3, dir: "v", color: "teal" },
    { id: "d", row: 3, col: 8, length: 3, dir: "v", color: "pink" },
    { id: "e", row: 0, col: 0, length: 2, dir: "h", color: "yellow" },
    { id: "f", row: 0, col: 4, length: 2, dir: "h", color: "green" },
    { id: "g", row: 1, col: 4, length: 2, dir: "h", color: "blue" },
    { id: "h", row: 3, col: 0, length: 2, dir: "h", color: "purple" },
    { id: "i", row: 3, col: 3, length: 3, dir: "h", color: "orange" },
    { id: "j", row: 4, col: 0, length: 2, dir: "h", color: "teal" },
    { id: "k", row: 4, col: 3, length: 2, dir: "h", color: "pink" },
    { id: "l", row: 5, col: 0, length: 2, dir: "h", color: "yellow" },
    { id: "m", row: 5, col: 3, length: 2, dir: "h", color: "green" },
  ],
];

const CAR_COLORS = [
  "yellow",
  "green",
  "blue",
  "purple",
  "orange",
  "teal",
  "pink",
];

function randomizeCarColors(cars) {
  for (const car of cars) {
    if (car.id === "target") {
      continue;
    }

    car.color = CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
  }

  return cars;
}

function cloneCars(cars) {
  return cars.map((car) => ({ ...car }));
}

function cellsFor(car, row = car.row, col = car.col) {
  const cells = [];

  for (let i = 0; i < car.length; i += 1) {
    cells.push({
      row: row + (car.dir === "v" ? i : 0),
      col: col + (car.dir === "h" ? i : 0),
    });
  }

  return cells;
}

function canPlaceForGeneration(car, row, col, cars) {
  const occupied = new Set();

  for (const other of cars) {
    if (other.id === car.id) {
      continue;
    }

    for (const cell of cellsFor(other)) {
      occupied.add(`${cell.row},${cell.col}`);
    }
  }

  for (const cell of cellsFor(car, row, col)) {
    if (
      cell.row < 0 ||
      cell.row >= ROWS ||
      cell.col < 0 ||
      cell.col >= COLS ||
      occupied.has(`${cell.row},${cell.col}`)
    ) {
      return false;
    }
  }

  return true;
}

function legalPositions(car, cars) {
  const positions = [];

  const directions =
    car.dir === "h"
      ? [
          { row: 0, col: -1 },
          { row: 0, col: 1 },
        ]
      : [
          { row: -1, col: 0 },
          { row: 1, col: 0 },
        ];

  for (const direction of directions) {
    let row = car.row + direction.row;
    let col = car.col + direction.col;

    while (canPlaceForGeneration(car, row, col, cars)) {
      positions.push({ row, col });

      row += direction.row;
      col += direction.col;
    }
  }

  return positions;
}

function stateKey(cars) {
  return cars.map((car) => `${car.row},${car.col}`).join("|");
}

function validateLayout(cars) {
  const occupied = new Set();

  for (const car of cars) {
    for (const cell of cellsFor(car)) {
      if (
        cell.row < 0 ||
        cell.row >= ROWS ||
        cell.col < 0 ||
        cell.col >= COLS
      ) {
        throw new Error(`Car "${car.id}" is outside the board.`);
      }

      const key = `${cell.row},${cell.col}`;

      if (occupied.has(key)) {
        throw new Error(`Cars overlap at ${key}.`);
      }

      occupied.add(key);
    }
  }
}

function generatePuzzle() {
  for (let attempt = 0; attempt < MAX_GENERATION_ATTEMPTS; attempt += 1) {
    const cars = cloneCars(
      layouts[Math.floor(Math.random() * layouts.length)]
    );

    validateLayout(cars);

    const target = cars.find((car) => car.id === "target");
    target.col = 0;

    const seen = new Set([stateKey(cars)]);
    const scrambleLength =
      MIN_SCRAMBLE_MOVES +
      Math.floor(
        Math.random() * (MAX_SCRAMBLE_MOVES - MIN_SCRAMBLE_MOVES + 1)
      );

    let scrambleMoves = 0;

    for (let step = 0; step < scrambleLength; step += 1) {
      const choices = [];

      for (const car of cars) {
        if (car.id === "target") {
          continue;
        }

        for (const position of legalPositions(car, cars)) {
          const oldRow = car.row;
          const oldCol = car.col;

          car.row = position.row;
          car.col = position.col;

          const key = stateKey(cars);

          if (!seen.has(key)) {
            choices.push({ car, position, key });
          }

          car.row = oldRow;
          car.col = oldCol;
        }
      }

      if (choices.length === 0) {
        break;
      }

      const choice = choices[Math.floor(Math.random() * choices.length)];

      choice.car.row = choice.position.row;
      choice.car.col = choice.position.col;

      seen.add(choice.key);
      scrambleMoves += 1;
    }

    if (scrambleMoves >= MIN_SCRAMBLE_MOVES) {
      return randomizeCarColors(cars);
    }
  }

  const fallback = cloneCars(layouts[0]);
  fallback.find((car) => car.id === "target").col = 0;

  return randomizeCarColors(fallback);
}

const board = document.getElementById("board");
const message = document.getElementById("message");
const languageSelect = document.getElementById("language");

let cars = [];
let startingCars = [];
let moves = 0;
let puzzleNumber = 0;
let solved = false;
let language = getInitialLanguage();

function draw() {
  render({
    board,
    cars,
    moves,
    onPointerDown: dragCar,
  });
}

function resetPuzzle() {
  cars = cloneCars(startingCars);
  moves = 0;
  solved = false;
  message.textContent = "";
  draw();
}

function newPuzzle() {
  puzzleNumber += 1;
  cars = generatePuzzle();

  for (const car of cars) {
    if (car.id === "target") {
      car.label = translate(language, "youLabel");
    }
  }

  startingCars = cloneCars(cars);
  moves = 0;
  solved = false;
  message.textContent = "";
  draw();
}

function checkWin() {
  const target = cars.find((car) => car.id === "target");

  if (!target || target.col + target.length < COLS || solved) {
    return;
  }

  solved = true;

  message.textContent = translate(language, "solved").replace(
    "{moves}",
    moves
  );

  draw();

  setTimeout(() => {
    const result = window.confirm(
      `${translate(language, "solvedTitle")}\n\n` +
        `${translate(language, "solvedMessage").replace("{moves}", moves)}\n\n` +
        translate(language, "newGameOk")
    );

    if (result) {
      newPuzzle();
    }
  }, 50);
}

function canPlace(car, row, col) {
  const occupied = new Set();

  for (const other of cars) {
    if (other.id === car.id) {
      continue;
    }

    for (let i = 0; i < other.length; i += 1) {
      const occupiedRow = other.row + (other.dir === "v" ? i : 0);
      const occupiedCol = other.col + (other.dir === "h" ? i : 0);

      occupied.add(`${occupiedRow},${occupiedCol}`);
    }
  }

  for (let i = 0; i < car.length; i += 1) {
    const candidateRow = row + (car.dir === "v" ? i : 0);
    const candidateCol = col + (car.dir === "h" ? i : 0);

    if (
      candidateRow < 0 ||
      candidateRow >= ROWS ||
      candidateCol < 0 ||
      candidateCol >= COLS ||
      occupied.has(`${candidateRow},${candidateCol}`)
    ) {
      return false;
    }
  }

  return true;
}

function dragCar(event, car, element, metrics) {
  if (solved) {
    event.preventDefault();
    return;
  }

  event.preventDefault();

  const startX = event.clientX;
  const startY = event.clientY;
  const originalRow = car.row;
  const originalCol = car.col;

  element.setPointerCapture(event.pointerId);

  function move(pointerEvent) {
    const dx = pointerEvent.clientX - startX;
    const dy = pointerEvent.clientY - startY;

    let requestedRow = originalRow;
    let requestedCol = originalCol;

    if (!metrics.rotated) {
      if (car.dir === "h") {
        requestedCol += Math.round(dx / metrics.stepX);
      } else {
        requestedRow += Math.round(dy / metrics.stepY);
      }
    } else if (car.dir === "h") {
      requestedCol += Math.round(dy / metrics.stepY);
    } else {
      requestedRow -= Math.round(dx / metrics.stepX);
    }

    let row = originalRow;
    let col = originalCol;

    while (row !== requestedRow || col !== requestedCol) {
      const nextRow = row + Math.sign(requestedRow - row);
      const nextCol = col + Math.sign(requestedCol - col);

      if (!canPlace(car, nextRow, nextCol)) {
        break;
      }

      row = nextRow;
      col = nextCol;
    }

    car.row = row;
    car.col = col;

    const screenRow = metrics.rotated ? col : row;

    const screenCol = metrics.rotated
      ? car.dir === "v"
        ? ROWS - 1 - (row + car.length - 1)
        : ROWS - 1 - row
      : col;

    element.style.left = `${
      metrics.paddingLeft + screenCol * metrics.stepX
    }px`;
    element.style.top = `${
      metrics.paddingTop + screenRow * metrics.stepY
    }px`;
  }

  function end() {
    if (car.row !== originalRow || car.col !== originalCol) {
      moves += 1;
      draw();
      checkWin();
    }

    element.removeEventListener("pointermove", move);
    element.removeEventListener("pointerup", end);
    element.removeEventListener("pointercancel", end);
  }

  element.addEventListener("pointermove", move);
  element.addEventListener("pointerup", end);
  element.addEventListener("pointercancel", end);
}

function updateLanguage() {
  language = languageSelect.value;
  localStorage.setItem("rush-hour-language", language);
  applyLanguage(language, cars, { message });
  draw();
}

document.getElementById("resetButton").addEventListener("click", resetPuzzle);
document.getElementById("newButton").addEventListener("click", newPuzzle);

languageSelect.value = language;
languageSelect.addEventListener("change", updateLanguage);

window.addEventListener("resize", draw);
window.matchMedia("(max-width: 600px)").addEventListener("change", draw);

createCells(board);
applyLanguage(language, cars, { message });
newPuzzle();
  
const desktopMoveCount = document.getElementById("moveCount");
const mobileMoveCount = document.querySelector(".mobile-move-count");
const desktopLanguage = document.getElementById("language");
const mobileLanguage = document.querySelector(".mobile-language");

const syncMoveCount = () => {
  mobileMoveCount.textContent = desktopMoveCount.textContent;
};

new MutationObserver(syncMoveCount).observe(desktopMoveCount, {
  childList: true,
  characterData: true,
  subtree: true
});

mobileLanguage.value = desktopLanguage.value;

mobileLanguage.addEventListener("change", () => {
  desktopLanguage.value = mobileLanguage.value;
  desktopLanguage.dispatchEvent(new Event("change", { bubbles: true }));
});

desktopLanguage.addEventListener("change", () => {
  mobileLanguage.value = desktopLanguage.value;
});

document.querySelector(".reset-button").addEventListener("click", () => {
  document.getElementById("resetButton").click();
});

document.querySelector(".new-button").addEventListener("click", () => {
  document.getElementById("newButton").click();
});
</script>
