<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title data-i18n-title="title">Rush Hour</title>
  <link rel="stylesheet" href="style.css" />

</head>

<body>
  <main class="game">
    <h1 data-i18n="title">Rush Hour</h1>

    <p class="subtitle" data-i18n="subtitle">
      Move the red car to the exit.
    </p>

    <div class="toolbar">
      <div class="stats">
        <span>
          <span data-i18n="moves">Moves</span>:
          <strong id="moveCount">0</strong>
        </span>

        <span>
          <span data-i18n="best">Best</span>:
          <strong id="bestCount">—</strong>
        </span>
      </div>

      <select id="language" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh-Hant">繁體中文</option>
      </select>
    </div>

    <div id="board" class="board">
      <div class="exit"></div>
    </div>

    <div class="controls">
      <button id="resetButton" data-i18n="reset">Reset</button>
      <button id="newButton" data-i18n="newPuzzle">
        New Puzzle
      </button>
    </div>

    <div id="message" class="message"></div>

    <p class="instructions" data-i18n="instructions">
      Drag cars only in the direction they are facing.
    </p>
  </main>

  <script>
    const SIZE = 6;
    const GAP = 4;
    const PADDING = 4;

    const board = document.getElementById("board");
    const moveCount = document.getElementById("moveCount");
    const bestCount = document.getElementById("bestCount");
    const message = document.getElementById("message");
    const languageSelect = document.getElementById("language");

    let cars = [];
    let startingCars = [];
    let moves = 0;
    let puzzleNumber = 0;
    let solved = false;

    // Supported languages (must match <option> values)
    const SUPPORTED_LANGUAGES = ["en", "es", "zh-Hant"];

    // Read language from URL: ?lang=en, ?lang=es, ?lang=zh, ?lang=zh-Hant
    function getLanguageFromURL() {
      const params = new URLSearchParams(window.location.search);
      const langParam = params.get("lang");
      if (!langParam) return null;

      const normalized = langParam.trim();

      // Direct matches
      if (SUPPORTED_LANGUAGES.includes(normalized)) {
        return normalized;
      }

      // Map "zh" to "zh-Hant" to match your existing options
      if (normalized === "zh") {
        return "zh-Hant";
      }

      // Try base code (e.g. "en-US" -> "en")
      const base = normalized.split("-")[0].toLowerCase();
      if (SUPPORTED_LANGUAGES.includes(base)) {
        return base;
      }

      return null;
    }

    // Determine initial language:
    // 1) Use URL ?lang=... if present and supported
    // 2) Use stored preference if available
    // 3) Otherwise, use browser's preferred language (if supported)
    // 4) Otherwise, default to English
    function getInitialLanguage() {
      const fromURL = getLanguageFromURL();
      if (fromURL) {
        return fromURL;
      }

      const stored = localStorage.getItem("rush-hour-language");
      if (stored && SUPPORTED_LANGUAGES.includes(stored)) {
        return stored;
      }

      const browserLang =
        navigator.language ||
        (navigator.languages && navigator.languages[0]) ||
        "en";

      // Normalize: "en-US" -> "en", "zh-HK" -> try exact then base
      const exact = browserLang;
      const base = browserLang.split("-")[0].toLowerCase();

      // Prefer exact match (e.g. "zh-Hant") if you extend support later
      if (SUPPORTED_LANGUAGES.includes(exact)) {
        return exact;
      }

      // Try base code (e.g. "en", "es")
      if (SUPPORTED_LANGUAGES.includes(base)) {
        return base;
      }

      // Special handling for Chinese variants if you want to map to zh-Hant
      if (base === "zh") {
        // Default Chinese browsers to Traditional if you prefer
        return "zh-Hant";
      }

      // Fallback
      return "en";
    }

    let language = getInitialLanguage();

    const translations = {
      en: {
        title: "Rush Hour",
        subtitle: "Move the red car to the exit.",
        moves: "Moves",
        best: "Best",
        reset: "Reset",
        newPuzzle: "New Puzzle",
        instructions:
          "Drag cars only in the direction they are facing.",
        solved: "Solved in {moves} moves!",
        youLabel: "YOU",
        solvedTitle: "🎉 Solved!",
        solvedMessage: "Great job! You solved it in {moves} moves.",
        newGameOk: "Another game?"
      },

      es: {
        title: "Hora punta",
        subtitle: "Mueve el coche rojo hasta la salida.",
        moves: "Movimientos",
        best: "Mejor",
        reset: "Reiniciar",
        newPuzzle: "Nuevo puzzle",
        instructions:
          "Arrastra los coches únicamente en la dirección en la que apuntan.",
        solved: "¡Resuelto en {moves} movimientos!",
        youLabel: "TÚ",
        solvedTitle: "🎉 ¡Resuelto!",
        solvedMessage: "¡Bien hecho! Lo resolviste en {moves} movimientos.",
        newGameOk: "Otro?"
      },

      "zh-Hant": {
        title: "繁忙時間",
        subtitle: "揸架紅車出去。",
        moves: "步數",
        best: "最佳",
        reset: "重設",
        newPuzzle: "新謎題",
        instructions:
          "汽車只可以前後移動。",
        solved: "用咗 {moves} 步出到去！",
        youLabel: "你",
        solvedTitle: "🎉 搞掂！",
        solvedMessage: "你用咗 {moves} 步。",
        newGameOk: "再玩多次？"
      }
    };

    function translate(key) {
      return translations[language][key];
    }

    function updateLanguage() {
      document.documentElement.lang = language;
      document.title = translate("title");

      document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {
          element.textContent = translate(element.dataset.i18n);
        });

      // Update car labels (including "YOU")
      for (const car of cars) {
        if (car.id === "target") {
          car.label = translate("youLabel");
        }
      }

      message.textContent = "";
      render();
    }

    function createCells() {
      for (let i = 0; i < SIZE * SIZE; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";

        board.insertBefore(
          cell,
          board.querySelector(".exit")
        );
      }
    }

    function getCellSize() {
      const usableWidth =
        board.clientWidth -
        PADDING * 2 -
        GAP * (SIZE - 1);

      return usableWidth / SIZE;
    }

    function cellsFor(car, row = car.row, col = car.col) {
      const cells = [];

      for (let i = 0; i < car.length; i++) {
        cells.push({
          row: row + (car.dir === "v" ? i : 0),
          col: col + (car.dir === "h" ? i : 0)
        });
      }

      return cells;
    }

    function validateLayout(layout) {
      const occupied = new Set();

      for (const car of layout) {
        for (const cell of cellsFor(car)) {
          const key = `${cell.row},${cell.col}`;

          if (
            cell.row < 0 ||
            cell.row >= SIZE ||
            cell.col < 0 ||
            cell.col >= SIZE
          ) {
            throw new Error(
              `Car "${car.id}" is outside the board.`
            );
          }

          if (occupied.has(key)) {
            throw new Error(
              `Cars overlap at ${key}.`
            );
          }

          occupied.add(key);
        }
      }
    }

    function occupiedCells(exceptId = null) {
      const occupied = new Set();

      for (const car of cars) {
        if (car.id === exceptId) continue;

        for (const cell of cellsFor(car)) {
          occupied.add(`${cell.row},${cell.col}`);
        }
      }

      return occupied;
    }

    function canPlace(car, row, col) {
      const occupied = occupiedCells(car.id);

      for (const cell of cellsFor(car, row, col)) {
        const key = `${cell.row},${cell.col}`;

        if (
          cell.row < 0 ||
          cell.row >= SIZE ||
          cell.col < 0 ||
          cell.col >= SIZE ||
          occupied.has(key)
        ) {
          return false;
        }
      }

      return true;
    }

    function legalPositions(car) {
      const positions = [];

      const directions =
        car.dir === "h"
          ? [
              { row: 0, col: -1 },
              { row: 0, col: 1 }
            ]
          : [
              { row: -1, col: 0 },
              { row: 1, col: 0 }
            ];

      for (const direction of directions) {
        let row = car.row + direction.row;
        let col = car.col + direction.col;

        while (canPlace(car, row, col)) {
          positions.push({ row, col });

          row += direction.row;
          col += direction.col;
        }
      }

      return positions;
    }

    function shuffleCars() {
      let previousMove = null;

      const shuffleCount =
        180 + Math.floor(Math.random() * 120);

      for (let i = 0; i < shuffleCount; i++) {
        const choices = [];

        for (const car of cars) {
          for (const position of legalPositions(car)) {
            const immediateReverse =
              previousMove &&
              previousMove.id === car.id &&
              previousMove.row === position.row &&
              previousMove.col === position.col;

            if (!immediateReverse) {
              choices.push({ car, position });
            }
          }
        }

        if (!choices.length) break;

        const choice =
          choices[
            Math.floor(Math.random() * choices.length)
          ];

        previousMove = {
          id: choice.car.id,
          row: choice.car.row,
          col: choice.car.col
        };

        choice.car.row = choice.position.row;
        choice.car.col = choice.position.col;
      }
    }

    function difficultyScore() {
      const target = cars.find(car => car.id === "target");

      let score = 0;

      score += (SIZE - target.col) * 12;

      for (const car of cars) {
        if (car.id === "target") continue;

        const cells = cellsFor(car);

        if (
          cells.some(cell => cell.row === target.row)
        ) {
          score += 12;
        }

        if (car.dir === "v") {
          score += 3;
        }

        score += car.length;
      }

      let possibleMoves = 0;

      for (const car of cars) {
        possibleMoves += legalPositions(car).length;
      }

      score += Math.max(0, 35 - possibleMoves);

      return score;
    }

    function cloneCars(list) {
      return list.map(car => ({ ...car }));
    }

    function generatePuzzle() {
      const source =
        layouts[
          Math.floor(Math.random() * layouts.length)
        ];

      let bestPosition = null;
      let bestScore = -Infinity;

      for (let attempt = 0; attempt < 40; attempt++) {
        cars = cloneCars(source);
        shuffleCars();

        const target =
          cars.find(car => car.id === "target");

        if (target.col + target.length >= SIZE) {
          continue;
        }

        const score = difficultyScore();

        if (score > bestScore) {
          bestScore = score;
          bestPosition = cloneCars(cars);
        }
      }

      cars =
        bestPosition ||
        cloneCars(source);

      // Ensure the red car has the correct translated label
      for (const car of cars) {
        if (car.id === "target") {
          car.label = translate("youLabel");
        }
      }

      startingCars = cloneCars(cars);
      moves = 0;
      solved = false;
      message.textContent = "";

      render();
    }

    function resetPuzzle() {
      cars = cloneCars(startingCars);
      moves = 0;
      solved = false;
      message.textContent = "";
      render();
    }

    function render() {
      board
        .querySelectorAll(".car")
        .forEach(car => car.remove());

      const size = getCellSize();

      for (const car of cars) {
        const element = document.createElement("div");

        element.className =
          "car " +
          (car.dir === "h"
            ? "horizontal"
            : "vertical") +
          " " +
          car.color;

        const width =
          car.dir === "h" ? car.length : 1;

        const height =
          car.dir === "v" ? car.length : 1;

        element.style.left =
          `${PADDING + car.col * (size + GAP)}px`;

        element.style.top =
          `${PADDING + car.row * (size + GAP)}px`;

        element.style.width =
          `${width * size + (width - 1) * GAP}px`;

        element.style.height =
          `${height * size + (height - 1) * GAP}px`;

        element.textContent = car.label || "";

        element.addEventListener(
          "pointerdown",
          event => dragCar(event, car)
        );

        board.appendChild(element);
      }

      moveCount.textContent = moves;

      const best =
        localStorage.getItem(bestKey());

      bestCount.textContent = best || "—";
    }

    function dragCar(event, car) {
      if (solved) {
        // Prevent further moves after solving
        event.preventDefault();
        return;
      }

      event.preventDefault();

      const element = event.currentTarget;
      const startX = event.clientX;
      const startY = event.clientY;

      const originalRow = car.row;
      const originalCol = car.col;
      const size = getCellSize();

      element.setPointerCapture(event.pointerId);

      function move(pointerEvent) {
        const dx =
          pointerEvent.clientX - startX;

        const dy =
          pointerEvent.clientY - startY;

        let row = originalRow;
        let col = originalCol;

        if (car.dir === "h") {
          col =
            originalCol +
            Math.round(dx / (size + GAP));
        } else {
          row =
            originalRow +
            Math.round(dy / (size + GAP));
        }

        if (!canPlace(car, row, col)) {
          return;
        }

        car.row = row;
        car.col = col;

        element.style.left =
          `${PADDING + col * (size + GAP)}px`;

        element.style.top =
          `${PADDING + row * (size + GAP)}px`;
      }

      function end() {
        const moved =
          car.row !== originalRow ||
          car.col !== originalCol;

        if (moved) {
          moves++;
          render();
          checkWin();
        }

        element.removeEventListener(
          "pointermove",
          move
        );

        element.removeEventListener(
          "pointerup",
          end
        );

        element.removeEventListener(
          "pointercancel",
          end
        );
      }

      element.addEventListener(
        "pointermove",
        move
      );

      element.addEventListener(
        "pointerup",
        end
      );

      element.addEventListener(
        "pointercancel",
        end
      );
    }

    function bestKey() {
      return `rush-hour-best-${language}-${puzzleNumber}`;
    }

    function checkWin() {
      const target =
        cars.find(car => car.id === "target");

      if (target.col + target.length >= SIZE && !solved) {
        solved = true;

        const oldBest =
          Number(localStorage.getItem(bestKey()));

        if (!oldBest || moves < oldBest) {
          localStorage.setItem(
            bestKey(),
            moves
          );
        }

        message.textContent =
          translate("solved")
            .replace("{moves}", moves);

        render();

        // Show language-aware completion alert
        const title = translate("solvedTitle");
        const text = translate("solvedMessage")
          .replace("{moves}", moves);
        const okText = translate("newGameOk");

        // Small timeout so the board renders first
        setTimeout(() => {
          const result = window.confirm(`${title}\n\n${text}\n\n${okText}`);
          if (result) {
            // OK: start a new game
            document.getElementById("newButton").click();
          }
          // Cancel: stay on current solved board
        }, 50);
      }
    }

    // Predefined solved layouts
    const layouts = [
      [
        {
          id: "target",
          row: 2,
          col: 0,
          length: 2,
          dir: "h",
          color: "red",
          label: "YOU"
        },
        {
          id: "a",
          row: 0,
          col: 0,
          length: 2,
          dir: "v",
          color: "blue"
        },
        {
          id: "b",
          row: 0,
          col: 2,
          length: 2,
          dir: "v",
          color: "green"
        },
        {
          id: "c",
          row: 0,
          col: 5,
          length: 3,
          dir: "v",
          color: "yellow"
        },
        {
          id: "d",
          row: 1,
          col: 3,
          length: 2,
          dir: "h",
          color: "purple"
        },
        {
          id: "e",
          row: 3,
          col: 0,
          length: 2,
          dir: "v",
          color: "orange"
        },
        {
          id: "f",
          row: 4,
          col: 1,
          length: 2,
          dir: "h",
          color: "teal"
        },
        {
          id: "g",
          row: 3,
          col: 3,
          length: 3,
          dir: "v",
          color: "blue"
        },
        {
          id: "h",
          row: 5,
          col: 4,
          length: 2,
          dir: "h",
          color: "green"
        }
      ],

      [
        {
          id: "target",
          row: 2,
          col: 0,
          length: 2,
          dir: "h",
          color: "red",
          label: "YOU"
        },
        {
          id: "a",
          row: 0,
          col: 0,
          length: 2,
          dir: "v",
          color: "blue"
        },
        {
          id: "b",
          row: 0,
          col: 2,
          length: 3,
          dir: "v",
          color: "green"
        },
        {
          id: "c",
          row: 0,
          col: 5,
          length: 2,
          dir: "v",
          color: "yellow"
        },
        {
          id: "d",
          row: 1,
          col: 3,
          length: 2,
          dir: "h",
          color: "purple"
        },
        {
          id: "e",
          row: 3,
          col: 0,
          length: 3,
          dir: "h",
          color: "orange"
        },
        {
          id: "f",
          row: 3,
          col: 4,
          length: 2,
          dir: "v",
          color: "teal"
        },
        {
          id: "g",
          row: 4,
          col: 2,
          length: 2,
          dir: "h",
          color: "blue"
        },
        {
          id: "h",
          row: 5,
          col: 4,
          length: 2,
          dir: "h",
          color: "pink"
        }
      ]
    ];

    document
      .getElementById("resetButton")
      .addEventListener("click", resetPuzzle);

    document
      .getElementById("newButton")
      .addEventListener("click", () => {
        puzzleNumber++;
        generatePuzzle();
      });

    // Initialize language selector to current language
    languageSelect.value = language;

    languageSelect.addEventListener(
      "change",
      event => {
        language = event.target.value;

        localStorage.setItem(
          "rush-hour-language",
          language
        );

        updateLanguage();
      }
    );

    window.addEventListener("resize", render);

    layouts.forEach(validateLayout);

    createCells();
    updateLanguage();
    generatePuzzle();
  </script>
</body>
</html>
