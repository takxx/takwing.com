<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rush Hour</title>
<style>
:root {
  --bg:#21170f; --panel:#382719; --board:#493322; --cell:#60452e;
  --text:#f7e8c8; --muted:#c9ad7d; --border:#170f09;
  --gap:4px; --padding:4px; --board-border:7px;
}
* { box-sizing:border-box; }
body {
  min-height:100vh; margin:0; padding:24px; color:var(--text);
  background:radial-gradient(ellipse at top,#654323 0%,transparent 56%),var(--bg);
  font-family:Georgia,"Times New Roman",serif;
}
#mosaic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
main{ position: relative; z-index: 1;}
button {
  min-height:44px; padding:9px 14px; color:var(--text); background:#553a24;
  border:1px solid #f2c87955; border-radius:8px; font:inherit;
  font-weight:700; cursor:pointer; touch-action:manipulation;
}
button:hover { background:#704a2c; }
button:focus-visible, select:focus-visible { outline:3px solid #f2c879; outline-offset:2px; }
.game { width:min(88vw,560px); margin:0 auto; }
.page-header { width:100%; display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; }
h1 { margin:0; color:#f2c879; font-size:clamp(2rem,6vw,3.2rem); letter-spacing:.04em; text-shadow:0 2px 0 #3b2110,0 4px 12px #0008; }
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; padding:10px; background:var(--panel); border:1px solid #f2c87933; border-radius:10px; }
.counter { padding:8px 12px; color:var(--muted); background:#21170f66; border:1px solid #f2c87933; border-radius:8px; white-space:nowrap; }
.counter strong { margin-left:4px; color:var(--text); }
.controls { display:flex; gap:8px; }
.message { min-height:28px; margin-top:12px; color:#a7c879; font-weight:800; text-align:center; }
.board {
  --side:min(88vw, 620px);
  position:relative; width:var(--side); height:var(--side); margin:0 auto;
  display:grid; grid-template-columns:repeat(6,minmax(0,1fr));
  grid-template-rows:repeat(6,minmax(0,1fr)); gap:var(--gap); padding:var(--padding);
  background:var(--board); border:var(--board-border) solid var(--border);
  border-radius:16px; box-shadow:0 20px 40px #0009;
  touch-action:none; user-select:none; -webkit-user-select:none;
  width:100%; height:auto; aspect-ratio: 1;
}
.cell { min-width:0; min-height:0; border-radius:5px; background:var(--cell); box-shadow:inset 0 1px 2px #fff2; }
.exit {
  position:absolute; z-index:3; top:calc(var(--board-border) + var(--padding) + 2 * ((100% - 2 * var(--board-border) - 2 * var(--padding) - 5 * var(--gap)) / 6 + var(--gap)));
  right:calc(-1 * var(--board-border) - 18px); width:18px;
  height:calc((100% - 2 * var(--board-border) - 2 * var(--padding) - 5 * var(--gap)) / 6);
  background:#c74632; border-radius:0 7px 7px 0; box-shadow:0 0 14px #c7463288; pointer-events:none;
}
.exit::after { content:"➜"; position:absolute; top:50%; right:-29px; color:#f08061; font:1.2rem system-ui,sans-serif; transform:translateY(-50%); }
.car {
  position:absolute; z-index:5; display:flex; align-items:center; justify-content:center;
  border:3px solid #170f0f99; border-radius:9px; color:#fff8e9;
  font:800 clamp(1.6rem,2vw,.9rem) system-ui,sans-serif; text-shadow:0 1px 2px #000;
  cursor:grab; transition:left .12s ease,top .12s ease;
  box-shadow:inset 0 0 0 3px #ffffff26,0 4px 7px #0008;
  touch-action:none;
}
.car:active { z-index:20; cursor:grabbing; transition:none; }
.car.horizontal::before,.car.horizontal::after,.car.vertical::before,.car.vertical::after {
  content:""; position:absolute; width:9px; height:9px; border:1px solid #ffffff33;
  border-radius:50%; background:#21170f;
}
.car.horizontal::before { left:15%; bottom:-6px; }
.car.horizontal::after { right:15%; bottom:-6px; }
.car.vertical::before { right:-6px; top:15%; }
.car.vertical::after { right:-6px; bottom:15%; }
.red { background:#b33c2e; } 
.blue   { background:#647980; }
.green  { background:#737b5a; }
.yellow { background:#a88c55; }
.purple { background:#786879; }
.orange { background:#9c6d4c; }
.teal   { background:#5f7973; }
.pink   { background:#8e6268; }
.instructions { margin:18px auto 0; max-width:680px; color:var(--muted); line-height:1.5; text-align:center; }
.overlay {
  position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:18px;
  background:#120c08dd; overflow:auto;
}
.dialog { width:min(100%,520px); padding:24px; background:var(--panel); border:1px solid #f2c87966; border-radius:16px; box-shadow:0 20px 60px #000b; }
.dialog h2 { margin:0 0 10px; color:#f2c879; font-size:2rem; }
.dialog p { color:var(--muted); line-height:1.5; }
.choice-group { margin:18px 0; }
.choice-group h3 { margin:0 0 9px; font-size:1rem; color:var(--muted); }
.choice-buttons { display:flex; flex-wrap:wrap; gap:8px; }
.choice-buttons button[aria-pressed="true"] { color:#21170f; background:#f2c879; }
.start-button { width:100%; margin-top:8px; background:#704a2c; }
[hidden] { display:none !important; }
@media(max-width:520px) {
  body { padding:16px 12px; }
  .page-header { margin-bottom:12px; }
  .toolbar { align-items:stretch; flex-direction:column; }
  .controls button { flex:1; }
  .counter { align-self:flex-start; }
  .board { --side:min(88vw, 500px); }
}

:root {
  --bg: #211b17;
  --panel: #342821;
  --board: #49372b;
  --cell: #5a4638;
  --text: #e6d8bf;
  --muted: #b9a58a;
  --border: #17120f;
  --gap: 4px;
  --padding: 4px;
  --board-border: 7px;
}

body {
  background:
    radial-gradient(ellipse at top, #654635 0%, transparent 58%),
    var(--bg);
  font-family: Georgia, "Times New Roman", serif;
}

button {
  color: var(--text);
  background: #49372b;
  border-color: #bd885355;
}

button:hover { background: #604633; }

button:focus-visible,
select:focus-visible {
  outline-color: #d49a52;
}

h1,
.dialog h2 { color: #d49a52; }

.toolbar {
  background: #342821;
  border-color: #bd885344;
}

.counter {
  color: var(--muted);
  background: #211b17aa;
  border-color: #bd885344;
}

.message { color: #a7ad7b; }

.exit {
  background: #a94332;
  box-shadow: 0 0 14px #a9433277;
}

.exit::after { color: #d77d5e; }

.car {
  border-color: #201710cc;
  box-shadow: inset 0 0 0 3px #ffffff1c, 0 4px 7px #0009;
}

.red    { background: #a94332; }
.blue   { background: #557674; }
.green  { background: #737655; }
.yellow { background: #a98b4e; }
.purple { background: #75636a; }
.orange { background: #a9663e; }
.teal   { background: #557b70; }
.pink   { background: #916265; }

.instructions { color: var(--muted); }

.dialog {
  background: #342821;
  border-color: #bd885366;
}

.dialog p,
.choice-group h3 { color: var(--muted); }

.choice-buttons button[aria-pressed="true"] {
  color: #211b17;
  background: #d49a52;
}

.start-button { background: #604633; }

</style>
</head>
<body>
<canvas id="mosaic-bg" aria-hidden="true"></canvas>
<main class="game">
  <header class="page-header">
    <h1>Rush Hour</h1>
  </header>

  <section class="toolbar" aria-label="Game controls">
    <div class="counter"><span id="moves-label">Moves</span><strong id="moves">0</strong></div>
    <div class="controls">
      <button id="reset-button" type="button">Reset</button>
      <button id="new-button" type="button">New Game</button>
    </div>
  </section>

  <div id="board" class="board" role="application" aria-label="Rush Hour puzzle board">
    <div class="exit" aria-hidden="true"></div>
  </div>
  <p id="message" class="message" aria-live="polite" style="display:none;"></p>
  <p id="instructions" class="instructions"></p>
</main>

<section id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
  <div class="dialog">
    <h2 id="welcome-title">Rush Hour</h2>
    <p id="welcome-copy"></p>

    <div class="choice-group">
      <h3 id="mode-label"></h3>
      <div class="choice-buttons" id="mode-options">
        <button type="button" data-mode="casual">Easy</button>
        <button type="button" data-mode="normal">Normal</button>
        <button type="button" data-mode="brutal">Fiendish</button>
      </div>
    </div>

    <div class="choice-group">
      <h3 id="language-label"></h3>
      <div class="choice-buttons" id="language-options">
        <button type="button" data-language="en">English</button>
        <button type="button" data-language="es">Español</button>
        <button type="button" data-language="zh">中文</button>
      </div>
    </div>

    <button id="start-button" class="start-button" type="button"></button>
  </div>
</section>

<section id="completion-overlay" class="overlay" role="dialog"
         aria-modal="true" aria-labelledby="completion-title" hidden>
  <div class="dialog">
    <h2 id="completion-title"></h2>
    <p id="completion-message"></p>
    <div class="controls">
      <button id="completion-new-game" type="button"></button>
      <button id="completion-close" type="button"></button>
    </div>
  </div>
</section>

    moves: "步數",
    reset: "重設",
    newGame: "開新局",
    instructions: "沿住車道推開啲車，幫架紅色車開路去右邊出口。",
    welcome: "揀好難度同語言，然後幫紅色車開路。",
    mode: "難度", modes: { casual: "輕鬆", normal: "普通", brutal: "地獄" },
    language: "語言",
    start: "開始遊戲",
    completeTitle: "過關！",
    completionNewGame: "開新局",
    completionClose: "關閉",
    won: "你用咗 {n} 步成功突圍！",
    invalid: "呢個關卡嘅排列無效。",
    noPuzzles: "呢個難度暫時未有關卡。"
  }
};

const colors = ["blue","green","yellow","purple","orange","teal","pink"];
const board = document.querySelector("#board");
const overlay = document.querySelector("#overlay");
const movesEl = document.querySelector("#moves");
const message = document.querySelector("#message");

let language = "en";
let selectedMode = "casual";
let activeMode = "casual";
let puzzleIndex = 0;
let startingCars = [];
let cars = [];
let moves = 0;
let won = false;

function getLanguage() {
  const query = new URLSearchParams(location.search).get("lang");
  if (["en","es","zh"].includes(query)) return query;
  try {
    const saved = localStorage.getItem("rush-hour-language");
    if (["en","es","zh"].includes(saved)) return saved;
  } catch {}
  const preferred = (navigator.languages || [navigator.language || ""]).join(",").toLowerCase();
  if (preferred.includes("zh")) return "zh";
  if (preferred.includes("es")) return "es";
  return "en";
}

function updateLanguage() {
  const t = text[language];
  document.documentElement.lang = language === "zh" ? "zh-Hant" : language;
  document.querySelector("h1").textContent = t.title;
  document.querySelector("#welcome-title").textContent = t.title;
  document.title = t.title;
  document.querySelector("#moves-label").textContent = t.moves;
  document.querySelector("#reset-button").textContent = t.reset;
  document.querySelector("#new-button").textContent = t.newGame;
  document.querySelector("#instructions").textContent = t.instructions;
  document.querySelector("#welcome-copy").textContent = t.welcome;
  document.querySelector("#mode-label").textContent = t.mode;
  document.querySelectorAll("[data-mode]").forEach(button => {
    button.textContent = t.modes[button.dataset.mode];
    button.setAttribute("aria-pressed", String(button.dataset.mode === selectedMode));
  });
  document.querySelector("#language-label").textContent = t.language;
  document.querySelector("#start-button").textContent = t.start;
  document.querySelectorAll("[data-mode]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.mode === selectedMode)));
  document.querySelectorAll("[data-language]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.language === language)));
  document.querySelector("#completion-title").textContent = t.completeTitle;
  document.querySelector("#completion-new-game").textContent = t.completionNewGame;
  document.querySelector("#completion-close").textContent = t.completionClose;

}

function parsePuzzle(description) {
  if (typeof description !== "string" || description.length !== 36) {
    throw new Error("Puzzle must contain exactly 36 characters.");
  }
  const grid = [...description];
  const found = new Map();

  for (let i = 0; i < 36; i++) {
    const ch = grid[i];
    if (ch === "o") continue;
    if (!/^[A-Z]$/.test(ch)) throw new Error("Unexpected puzzle character.");
    if (!found.has(ch)) found.set(ch, []);
    found.get(ch).push(i);
  }

  const result = [];
  for (const [id, cells] of found) {
    const rows = cells.map(i => Math.floor(i / 6));
    const cols = cells.map(i => i % 6);
    const sameRow = rows.every(r => r === rows[0]);
    const sameCol = cols.every(c => c === cols[0]);
    if (!sameRow && !sameCol) throw new Error("A vehicle is not in a straight line.");

    const horizontal = sameRow;
    const sorted = [...(horizontal ? cols : rows)].sort((a,b) => a-b);
    if (sorted.length < 2 || sorted.length > 3 ||
        sorted.some((n, i) => i && n !== sorted[i-1] + 1)) {
      throw new Error("Vehicle cells must be contiguous and length 2 or 3.");
    }
    result.push({
      id, horizontal, length:sorted.length,
      row:horizontal ? rows[0] : sorted[0],
      col:horizontal ? sorted[0] : cols[0]
    });
  }

  const primary = result.find(car => car.id === "A");
  if (!primary || !primary.horizontal || primary.row !== 2) {
    throw new Error("The red car A must be horizontal on the third row.");
  }

  const occupied = new Set();
  for (const car of result) {
    for (let n = 0; n < car.length; n++) {
      const r = car.row + (car.horizontal ? 0 : n);
      const c = car.col + (car.horizontal ? n : 0);
      const key = r * 6 + c;
      if (occupied.has(key)) throw new Error("Vehicles overlap.");
      occupied.add(key);
    }
  }
  return result;
}

function render() {
  board.querySelectorAll(".cell, .car").forEach(el => el.remove());

  for (let i = 0; i < 36; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.setAttribute("aria-hidden", "true");
    board.append(cell);
  }

  // clientWidth excludes the border but includes padding.
  const style = getComputedStyle(board);
  const padding = parseFloat(style.paddingLeft);
  const gap = parseFloat(style.gap);
  const inner = board.clientWidth - 2 * padding;
  const cellSize = (inner - 5 * gap) / 6;

  let otherCarIndex = 0;

  cars.forEach(car => {
    const isRed = car.id === "A";
    const color = isRed ? "red" : colors[otherCarIndex++ % colors.length];

    const el = document.createElement("div");
    el.className = `car ${car.horizontal ? "horizontal" : "vertical"} ${color}`;
    el.textContent = isRed ? "🤯" : "";
    el.setAttribute("role", "img");
    el.setAttribute("aria-label", isRed ? "Red car" : "Vehicle");
    el.dataset.id = car.id;

    el.style.left = `${padding + car.col * (cellSize + gap)}px`;
    el.style.top = `${padding + car.row * (cellSize + gap)}px`;
    el.style.width = `${
      car.horizontal
        ? car.length * cellSize + (car.length - 1) * gap
        : cellSize
    }px`;
    el.style.height = `${
      car.horizontal
        ? cellSize
        : car.length * cellSize + (car.length - 1) * gap
    }px`;

    addDragging(el, car);
    board.append(el);
  });
}

function occupiedByOther(car, row, col) {
  for (const other of cars) {
    if (other.id === car.id) continue;
    for (let n=0; n<other.length; n++) {
      const r = other.row + (other.horizontal ? 0 : n);
      const c = other.col + (other.horizontal ? n : 0);
      if (r === row && c === col) return true;
    }
  }
  return false;
}

function moveCar(car, delta) {
  if (won || !delta) return false;

  const direction = Math.sign(delta);
  let moved = 0;

  for (let step = 0; step < Math.abs(delta); step++) {
    const row = car.row + (car.horizontal ? 0 : direction);
    const col = car.col + (car.horizontal ? direction : 0);

    if (
      row < 0 || col < 0 ||
      row + (car.horizontal ? 0 : car.length - 1) > 5 ||
      col + (car.horizontal ? car.length - 1 : 0) > 5
    ) break;

    let blocked = false;
    for (let n = 0; n < car.length; n++) {
      const r = row + (car.horizontal ? 0 : n);
      const c = col + (car.horizontal ? n : 0);
      if (occupiedByOther(car, r, c)) {
        blocked = true;
        break;
      }
    }
    if (blocked) break;

    car.row = row;
    car.col = col;
    moved++;
  }

  if (!moved) return false;

  moves++;
  movesEl.textContent = moves;
  render();
  checkWin();
  return true;
}

function addDragging(el, car) {
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let cellPitch = 0;
  let previewDelta = 0;

  el.addEventListener("pointerdown", event => {
    if (won || pointerId !== null) return;
    event.preventDefault();

    pointerId = event.pointerId;
    startX = event.clientX;
    startY = event.clientY;

    const style = getComputedStyle(board);
    const border = parseFloat(style.borderLeftWidth);
    const padding = parseFloat(style.paddingLeft);
    const gap = parseFloat(style.gap);
    const inner = board.clientWidth - 2 * border - 2 * padding;
    cellPitch = (inner - 5 * gap) / 6 + gap;

    el.setPointerCapture(pointerId);
  });

  el.addEventListener("pointermove", event => {
    if (event.pointerId !== pointerId) return;

    const distance = car.horizontal
      ? event.clientX - startX
      : event.clientY - startY;

    previewDelta = Math.round(distance / cellPitch);
    el.style.transform = car.horizontal
      ? `translateX(${previewDelta * cellPitch}px)`
      : `translateY(${previewDelta * cellPitch}px)`;
  });

  function clampDragDelta(car, requested) {
    const direction = Math.sign(requested);
    let allowed = 0;
  
    for (let step = 0; step < Math.abs(requested); step++) {
      const row = car.row + (car.horizontal ? 0 : direction * (step + 1));
      const col = car.col + (car.horizontal ? direction * (step + 1) : 0);
  
      if (
        row < 0 || col < 0 ||
        row + (car.horizontal ? 0 : car.length - 1) > 5 ||
        col + (car.horizontal ? car.length - 1 : 0) > 5
      ) break;
  
      let blocked = false;
      for (let n = 0; n < car.length; n++) {
        const r = row + (car.horizontal ? 0 : n);
        const c = col + (car.horizontal ? n : 0);
        if (occupiedByOther(car, r, c)) {
          blocked = true;
          break;
        }
      }
      if (blocked) break;
  
      allowed++;
    }
  
    return direction * allowed;
  }
  
  el.addEventListener("pointermove", event => {
    if (event.pointerId !== pointerId) return;
  
    const distance = car.horizontal
      ? event.clientX - startX
      : event.clientY - startY;
  
    const requested = Math.round(distance / cellPitch);
    previewDelta = clampDragDelta(car, requested);
  
    el.style.transform = car.horizontal
      ? `translateX(${previewDelta * cellPitch}px)`
      : `translateY(${previewDelta * cellPitch}px)`;
  });

  function finishDrag(event) {
    if (event.pointerId !== pointerId) return;

    const delta = previewDelta;
    pointerId = null;
    previewDelta = 0;
    el.style.transform = "";

    if (delta) moveCar(car, delta);
  }

  el.addEventListener("pointerup", finishDrag);
  el.addEventListener("pointercancel", finishDrag);
}

function checkWin() {
  const red = cars.find(car => car.id === "A");
  if (red && red.horizontal && red.col + red.length === 6) {
    won = true;
    document.querySelector("#completion-message").textContent =
      text[language].won.replace("{n}", moves);
    document.querySelector("#completion-overlay").hidden = false;
  }
}

function loadPuzzle(mode, index) {
  const list = puzzles[mode] || [];
  if (!list.length) {
    message.textContent = text[language].noPuzzles;
    return false;
  }
  puzzleIndex = ((index % list.length) + list.length) % list.length;
  try {
    startingCars = parsePuzzle(list[puzzleIndex]);
    activeMode = mode;
    cars = startingCars.map(car => ({...car}));
    moves = 0;
    won = false;
    movesEl.textContent = "0";
    message.textContent = "";
    render();
    return true;
  } catch (error) {
    console.error(error);
    message.textContent = text[language].invalid;
    return false;
  }
}

function showOverlay() {
  overlay.hidden = false;
  updateLanguage();
}

document.querySelector("#reset-button").addEventListener("click", () => {
  if (!startingCars.length) return;
  cars = startingCars.map(car => ({...car}));
  moves = 0; won = false;
  movesEl.textContent = "0";
  message.textContent = "";
  render();
});
document.querySelector("#new-button").addEventListener("click", showOverlay);

document.querySelectorAll("[data-mode]").forEach(button => {
  button.addEventListener("click", () => {
    selectedMode = button.dataset.mode;
    updateLanguage();
  });
});
document.querySelectorAll("[data-language]").forEach(button => {
  button.addEventListener("click", () => {
    language = button.dataset.language;
    try { localStorage.setItem("rush-hour-language", language); } catch {}
    updateLanguage();
  });
});
document.querySelector("#start-button").addEventListener("click", () => {
  if (loadPuzzle(selectedMode, Math.floor(Math.random() * (puzzles[selectedMode] || []).length))) {
    overlay.hidden = true;
  }
});
document.querySelector("#completion-new-game").addEventListener("click", () => {
  document.querySelector("#completion-overlay").hidden = true;
  showOverlay();
});
document.querySelector("#completion-close").addEventListener("click", () => {
  document.querySelector("#completion-overlay").hidden = true;
});
window.addEventListener("resize", render);

language = getLanguage();
updateLanguage();
showOverlay();
const mosaicColors = [
  "#24170f",
  "#302015",
  "#3a2619",
  "#463020",
  "#503824",
];
</script>
<script src="../util/mosaic.js"></script>
</body>
</html>
