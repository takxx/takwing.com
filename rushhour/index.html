<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title data-i18n-title="title">Rush Hour</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game">
    <h1 data-i18n="title">Rush Hour</h1>

    <p class="subtitle" data-i18n="subtitle">
      Move the red car to the exit.
    </p>

    <div class="toolbar">
      <div class="stats">
        <span>
          <span data-i18n="moves">Moves</span>:
          <strong id="moveCount">0</strong>
        </span>

        <span>
          <span data-i18n="best">Best</span>:
          <strong id="bestCount">—</strong>
        </span>
      </div>

      <select id="language" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh-Hant">繁體中文</option>
      </select>
    </div>

    <div id="board" class="board" style="aspect-ratio: 9 / 6;">
      <div class="exit"></div>
    </div>

    <div class="controls">
      <button id="resetButton" data-i18n="reset">Reset</button>
      <button id="newButton" data-i18n="newPuzzle">
        New Puzzle
      </button>
    </div>

    <div id="message" class="message"></div>

    <p class="instructions" data-i18n="instructions">
      Drag cars only in the direction they are facing.
    </p>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
