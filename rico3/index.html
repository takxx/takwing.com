<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>js-dos Loader (compatible)</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <style>
    body{font-family:Arial;background:#111;color:#eee;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
    .wrap{position:relative;width:900px;max-width:95%;height:640px;max-height:90vh}
    #dosbox{width:100%;height:100%;background:#000;border:2px solid #444;box-sizing:border-box}
    #controls{position:absolute;top:8px;left:8px;z-index:9999;display:flex;gap:8px}
    button{padding:6px 10px;background:#222;color:#fff;border:1px solid #444;cursor:pointer}
    #status{position:absolute;top:8px;right:8px;color:#9cf;font-weight:600;z-index:9999}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="controls">
      <button id="startBtn">Start</button>
      <button id="restartBtn">Restart</button>
    </div>
    <div id="status">Idle</div>
    <div id="dosbox"></div>
  </div>

  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <script>
    (function(){
      const dosbox = document.getElementById('dosbox');
      const status = document.getElementById('status');
      const GAME_URL = './bundle.jsdos';
      const options = { wdosboxUrl: 'https://v8.js-dos.com/latest/wdosbox.js' };

      let emu;
      try {
        emu = Dos(dosbox, options); // synchronous factory in v8+
      } catch (e) {
        console.error('Dos init error', e);
        status.textContent = 'Emulator init error';
        return;
      }

      // debug: log available methods
      console.log('emulator methods:', Object.keys(emu || {}));

      function tryRun(url) {
        status.textContent = 'Loading...';

        // 1) preferred: emu.run (if present)
        if (typeof emu.run === 'function') {
          return emu.run(url);
        }

        // 2) some builds expose runCommand / runFromUrl
        if (typeof emu.runCommand === 'function') {
          return Promise.resolve().then(() => emu.runCommand(url));
        }

        if (typeof emu.runFromUrl === 'function') {
          return emu.runFromUrl(url);
        }

        // 3) Dos.run static helper (older API)
        if (typeof Dos.run === 'function') {
          try {
            return Dos.run(dosbox, url, options);
          } catch (e) {
            return Promise.reject(e);
          }
        }

        // 4) fallback: fetch and mount manually if emulator supports mount/run callbacks
        if (typeof emu.mount === 'function' && typeof emu.exec === 'function') {
          return fetch(url)
            .then(r => {
              if (!r.ok) throw new Error('Network error ' + r.status);
              return r.arrayBuffer();
            })
            .then(buf => emu.mount('/', new Uint8Array(buf)).then(() => emu.exec('GAME.EXE')));
        }

        return Promise.reject(new Error('No supported run method on emulator'));
      }

      function start() {
        tryRun(GAME_URL)
          .then(() => {
            status.textContent = 'Game started';
            console.log('started');
          })
          .catch(err => {
            console.error('Start failed', err);
            status.textContent = 'Start failed: ' + (err && err.message || err);
          });
      }

      function restart() {
        try {
          if (typeof emu.exit === 'function') emu.exit();
        } catch(e){}
        try {
          emu = Dos(dosbox, options);
          start();
        } catch (e) {
          console.error('Restart failed', e);
          status.textContent = 'Restart failed';
        }
      }

      document.getElementById('startBtn').addEventListener('click', start);
      document.getElementById('restartBtn').addEventListener('click', restart);

      window.addEventListener('load', () => { status.textContent = 'Ready — click Start'; });
    })();
  </script>
</body>
</html>
