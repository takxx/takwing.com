<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>jsDOS Game</title>
  <script src="https://cdn.jsdelivr.net/npm/jsdos@2.0.0/dist/jsdos.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsdos@2.0.0/dist/jsdos.css">
  <style>body,html{height:100%;margin:0}#dosbox{width:100%;height:100vh}</style>
</head>
<body>
  <div id="dosbox"></div>

  <script>
    const container = document.getElementById('dosbox');
    const gameUrl = 'game.zip';
    const dosbox = new Dosbox({
      id: 'dosbox',
      autostart: true,
      onrun: function() { console.log('DOS started'); }
    });
    dosbox.run({
      file: gameUrl,
      mount: '/',
      cmd: 'RICH3.EXE'          
    }).catch(err => console.error('Failed to run:', err));
  </script>
</body>
</html>
