<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>js-dos Game (default URL)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.3.20/dist/js-dos.css">
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;height:100vh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#0f0f10;border-bottom:1px solid #222;z-index:10000}
    header button{padding:8px 12px;background:#222;color:#fff;border:1px solid #444;cursor:pointer}
    header #status{margin-left:auto;color:#9cf;font-weight:600}
    .container{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
    .wrap{position:relative;width:900px;max-width:95%;height:640px;max-height:90vh;border:2px solid #444;background:#000;box-sizing:border-box}
    #dosbox{width:100%;height:100%}
    a{color:#6cf}
  </style>
</head>
<body>
  <header>
    <button id="restartBtn">Restart</button>
    <div id="status">Loading default URL...</div>
  </header>

  <div class="container">
    <div class="wrap">
      <div id="dosbox" aria-label="DOSBox area"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/js-dos@8.3.20/dist/js-dos.js"></script>

  <script>
    (function(){
      const dosbox = document.getElementById('dosbox');
      const status = document.getElementById('status');
      const restartBtn = document.getElementById('restartBtn');

      // Default game URL (replace with the link that works for you)
      const GAME_URL = 'https://takwing.com/rico3/bundle.jsdos';

      const options = {
        wdosboxUrl: 'https://cdn.jsdelivr.net/npm/js-dos@8.3.20/dist/wdosbox.js'
      };

      function startFromUrl(url) {
        status.textContent = 'Starting: ' + url;
        // Dos.run returns a Promise in this build
        Dos.run(dosbox, url, options)
          .then(() => {
            status.textContent = 'Game started';
            console.log('Game started from', url);
          })
          .catch(err => {
            console.error('Run error', err);
            status.textContent = 'Run error: ' + (err && err.message || err);
          });
      }

      restartBtn.addEventListener('click', () => {
        // reload page to restart cleanly
        location.reload();
      });

      // Auto-start
      window.addEventListener('load', () => {
        startFromUrl(GAME_URL);
      });
    })();
  </script>
</body>
</html>
