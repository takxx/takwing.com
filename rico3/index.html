<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>js-dos Loader (robust)</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <style>
    body{font-family:Arial;background:#111;color:#eee;margin:0;height:100vh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#0f0f10;border-bottom:1px solid #222}
    header button{padding:8px 12px;background:#222;color:#fff;border:1px solid #444;cursor:pointer}
    header #status{margin-left:auto;color:#9cf;font-weight:600}
    .container{flex:1;display:flex;align-items:center;justify-content:center;padding:12px}
    .wrap{position:relative;width:900px;max-width:95%;height:640px;max-height:90vh;border:2px solid #444;background:#000}
    #dosbox{width:100%;height:100%}
  </style>
</head>
<body>
  <header>
    <button id="startBtn">Start</button>
    <button id="reloadBtn">Reload</button>
    <div id="status">Idle</div>
  </header>

  <div class="container">
    <div class="wrap">
      <div id="dosbox"></div>
    </div>
  </div>

  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <script>
    (function(){
      const dosbox = document.getElementById('dosbox');
      const status = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const reloadBtn = document.getElementById('reloadBtn');

      // Put your working bundle URL here
      const GAME_URL = 'https://takwing.com/rico3/bundle.jsdos';

      const options = { wdosboxUrl: 'https://v8.js-dos.com/latest/wdosbox.js' };

      let emu;
      function createEmu() {
        try {
          emu = Dos(dosbox, options); // v8 synchronous factory
        } catch (e) {
          console.error('Dos init error', e);
          status.textContent = 'Emulator init error';
          throw e;
        }
        console.log('emulator methods:', Object.keys(emu || {}));
      }

      // Try to start by detecting methods present
      function startUrl(url) {
        status.textContent = 'Starting...';
        // Prefer emu.run if present
        if (emu && typeof emu.run === 'function') {
          return emu.run(url);
        }
        // other common names
        if (emu && typeof emu.runFromUrl === 'function') return emu.runFromUrl(url);
        if (emu && typeof emu.runCommand === 'function') return emu.runCommand(url);
        if (emu && typeof emu.startFromUrl === 'function') return emu.startFromUrl(url);
        if (emu && typeof emu.exec === 'function') {
          // some builds expect the archive mounted; attempt Dos to fetch via object URL and then exec common file
          return fetch(url)
            .then(r => { if(!r.ok) throw new Error('Fetch failed ' + r.status); return r.arrayBuffer(); })
            .then(buf => {
              const blob = new Blob([buf]);
              const blobUrl = URL.createObjectURL(blob);
              // try Dos.run on blobUrl if available as static
              if (typeof Dos.run === 'function') {
                return Dos.run(dosbox, blobUrl, options).finally(()=> URL.revokeObjectURL(blobUrl));
              }
              // else try mounting if mount exists
              if (typeof emu.mount === 'function') {
                return emu.mount('/', new Uint8Array(buf)).then(()=> emu.exec('AUTORUN.COM'));
              }
              throw new Error('No run/mount API available after fetch');
            });
        }
        // As last resort, try static Dos.run if present (even if Dos.run undefined earlier)
        if (typeof Dos.run === 'function') return Dos.run(dosbox, url, options);

        return Promise.reject(new Error('No supported run method on emulator'));
      }

      function start() {
        status.textContent = 'Initializing...';
        try {
          createEmu();
        } catch (e) { return; }
        startUrl(GAME_URL)
          .then(()=> { status.textContent = 'Game started'; })
          .catch(err => {
            console.error('Start failed', err);
            status.textContent = 'Start failed: ' + (err && err.message || err);
          });
      }

      startBtn.addEventListener('click', start);
      reloadBtn.addEventListener('click', () => location.reload());

      window.addEventListener('load', () => { status.textContent = 'Ready — click Start'; });
    })();
  </script>
</body>
</html>
