<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>js-dos</title>
  <script src="https://cdn.jsdelivr.net/npm/js-dos/dist/js-dos.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/js-dos/dist/js-dos.min.css" rel="stylesheet">
  <style>
    body,html { height:100%; margin:0; display:flex; align-items:center; justify-content:center; background:#000; }
    #dosbox { width:640px; height:400px; }
  </style>
</head>
<body>
  <div id="dosbox"></div>

  <script>
    (async function(){
      // Create the DosBox instance inside the #dosbox element
      const emulator = await Dos(document.getElementById('dosbox'), { wdosboxUrl: "https://cdn.jsdelivr.net/npm/js-dos@7.4.0/dist/wdosbox.js" });

      // Mount and run local game.jsdos (file should be alongside this HTML)
      // .jsdos is a packaged JS file produced by js-dos packaging tools
      await emulator.run("game.jsdos");
    })();
  </script>
</body>
</html>
