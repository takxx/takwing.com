<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>js-dos Game</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
    #dosbox { width:800px; max-width:95%; height:600px; max-height:90vh; background:#000; border:2px solid #444; position:relative; }
    #controls { position:absolute; top:8px; left:8px; z-index:10; }
    button { padding:6px 10px; margin-right:8px; }
  </style>
</head>
<body>
  <div id="dosbox" aria-label="DOSBox area"></div>

  <!-- js-dos CDN -->
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <!-- Your local .jsdos bundle file (placed in same folder). -->
  <script src="/rico3/bundle.jsdos" type="application/octet-stream"></script>

  <script>
    (function () {
      const dosboxEl = document.getElementById('dosbox');

      // Create DOS instance
      const options = { wdosboxUrl: "https://v8.js-dos.com/latest/wdosbox.js" }; // ensures emulator worker is loaded from CDN
      Dos(dosboxEl, options).then(function (emulator) {
        // Load local .jsdos file that was included as a <script type="application/octet-stream"> above.
        // Find the script element and get its text (binary can be base64 in some tooling; here we assume the file is served raw).
        const localScript = Array.from(document.getElementsByTagName('script'))
          .find(s => s.getAttribute('src') === './bundle.jsdos');

        // If the server serves the .jsdos file normally, use emulator.run with the URL instead:
        const gameUrl = 'https://takwing.com/rico3/bundle.jsdos';

        emulator.run(gameUrl).then(function () {
          console.log('Game started.');
        }).catch(function (err) {
          console.error('Failed to run game:', err);
          dosboxEl.innerText = 'Failed to run game: ' + (err && err.message || err);
        });
      }).catch(function (err) {
        console.error('Failed to initialize js-dos:', err);
        document.getElementById('dosbox').innerText = 'Failed to initialize js-dos: ' + (err && err.message || err);
      });
    })();
  </script>
</body>
</html>
