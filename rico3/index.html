<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <style>html,body,#dosbox{height:100%;margin:0}</style>
</head>
<body>
  <div id="dosbox"></div>

  <!-- js-dos from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/js-dos@7.4.0/dist/js-dos.min.js"></script>

  <script>
  (async () => {
    const emulator = await Dos(document.getElementById('dosbox'), { wdosboxUrl: 'https://cdn.jsdelivr.net/npm/js-dos@7.4.0/bin/' });

    const response = await fetch('game.zip'); 
    const arrayBuffer = await response.arrayBuffer();
    await emulator.run(arrayBuffer);
	emulator.sendString("RICH3.EXE\r"); // \r = Enter

  })();
  </script>
</body>
</html>
