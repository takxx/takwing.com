<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>js-dos Simple Launcher</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;height:100vh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#0f0f10;border-bottom:1px solid #222}
    header button{padding:8px 12px;background:#222;color:#fff;border:1px solid #444;cursor:pointer}
    header #status{margin-left:auto;color:#9cf;font-weight:600}
    .container{flex:1;display:flex;align-items:center;justify-content:center;padding:12px}
    .wrap{position:relative;width:900px;max-width:95%;height:640px;max-height:90vh;border:2px solid #444;background:#000}
    #dosbox{width:100%;height:100%}
  </style>
</head>
<body>
  <header>
    <button id="startBtn">Start</button>
    <button id="openBtn">Open Link</button>
    <div id="status">Idle</div>
  </header>

  <div class="container">
    <div class="wrap">
      <div id="dosbox"></div>
    </div>
  </div>

  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <script>
    (function(){
      const dosbox = document.getElementById('dosbox');
      const status = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const openBtn = document.getElementById('openBtn');

      // Replace this with the working external link you mentioned
      const GAME_URL = 'https://takwing.com/rico3/bundle.jsdos';

      const options = {
        wdosboxUrl: 'https://v8.js-dos.com/latest/wdosbox.js'
      };

      function tryStaticRun(url) {
        status.textContent = 'Attempting Dos.run...';
        if (typeof Dos === 'undefined') {
          status.textContent = 'js-dos not loaded; opening link instead';
          window.open(url, '_blank');
          return;
        }
        // If Dos.run exists on this build, use it
        if (typeof Dos.run === 'function') {
          Dos.run(dosbox, url, options)
            .then(()=> status.textContent = 'Game started')
            .catch(e => {
              console.error('Dos.run failed', e);
              status.textContent = 'Dos.run failed; opening link';
              window.open(url, '_blank');
            });
          return;
        }
        // If Dos.run is not present, try synchronous factory + run variants
        try {
          const emu = Dos(dosbox, options);
          if (emu && typeof emu.run === 'function') {
            emu.run(url).then(()=> status.textContent='Game started').catch(e=>{
              console.error('emu.run failed', e);
              status.textContent='emu.run failed; opening link';
              window.open(url,'_blank');
            });
            return;
          }
          if (emu && typeof emu.runFromUrl === 'function') {
            emu.runFromUrl(url).then(()=> status.textContent='Game started').catch(e=>{
              console.error('emu.runFromUrl failed', e);
              status.textContent='runFromUrl failed; opening link';
              window.open(url,'_blank');
            });
            return;
          }
        } catch (e) {
          console.warn('Factory run attempt failed', e);
        }
        // fallback: open the working URL in a new tab
        status.textContent = 'No supported run method; opening link';
        window.open(url, '_blank');
      }

      startBtn.addEventListener('click', () => tryStaticRun(GAME_URL));
      openBtn.addEventListener('click', () => window.open(GAME_URL, '_blank'));

      window.addEventListener('load', () => {
        status.textContent = 'Ready — click Start';
      });
    })();
  </script>
</body>
</html>
