<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <style>html,body,#dosbox{height:100%;margin:0}</style>
</head>
<body>
  <div id="dosbox"></div>

  <!-- js-dos from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/js-dos@7.4.0/dist/js-dos.min.js"></script>

  <script>
	(async () => {
	const emulator = await Dos(document.getElementById('dosbox'), {
	wdosbox: 'https://cdn.jsdelivr.net/npm/js-dos@7.4.0/bin/dosbox.wasm'
	});
	await emulator.run('./game.zip'); // or use Blob URL approach above
	emulator.sendString('RICH3.EXE\r');
	})();
  </script>
</body>
</html>
