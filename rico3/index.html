<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>js-dos Game Loader</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
    .wrap { position:relative; width:900px; max-width:95%; height:640px; max-height:90vh; }
    #dosbox { width:100%; height:100%; background:#000; border:2px solid #444; box-sizing:border-box; }
    #controls { position:absolute; top:8px; left:8px; z-index:9999; display:flex; gap:8px; }
    button { padding:6px 10px; font-size:14px; background:#222; color:#fff; border:1px solid #444; cursor:pointer; }
    #status { position:absolute; top:8px; right:8px; color:#9cf; font-weight:600; z-index:9999; }
    /* ensure controls receive pointer events */
    #controls, #controls * { pointer-events:auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="controls">
      <button id="startBtn">Start Game</button>
      <button id="restartBtn">Restart</button>
    </div>
    <div id="status">Idle</div>
    <div id="dosbox" aria-label="DOSBox area"></div>
  </div>

  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <script>
    (function () {
      const dosboxEl = document.getElementById('dosbox');
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const GAME_URL = './bundle.jsdos';

      const options = { wdosboxUrl: 'https://v8.js-dos.com/latest/wdosbox.js' };

      let emu;
      try {
        emu = Dos(dosboxEl, options);
      } catch (e) {
        console.error('Failed to create emulator:', e);
        statusEl.textContent = 'Emulator init error';
        return;
      }

      if (emu && typeof emu.on === 'function') {
        emu.on('log', msg => console.log('js-dos log:', msg));
        emu.on('error', err => console.error('js-dos error:', err));
      }

      function startGame() {
        statusEl.textContent = 'Loading...';
        emu.run(GAME_URL)
          .then(() => {
            statusEl.textContent = 'Game started';
          })
          .catch(err => {
            console.error('run error', err);
            statusEl.textContent = 'Run error';
          });
      }

      function restartGame() {
        try { if (emu && typeof emu.exit === 'function') emu.exit(); } catch(e){}
        try {
          const newEmu = Dos(dosboxEl, options);
          emu = newEmu;
          startGame();
        } catch (e) {
          console.error('restart failed', e);
          statusEl.textContent = 'Restart failed';
        }
      }

      startBtn.addEventListener('click', startGame);
      restartBtn.addEventListener('click', restartGame);

      window.addEventListener('load', () => {
        statusEl.textContent = 'Ready — click Start';
      });
    })();
  </script>
</body>
</html>
