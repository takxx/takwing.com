<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Sea Matches</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="topbar">
      <h1 data-i18n="title">Sea Matches</h1>

      <div class="topbar-controls">
        <label class="control language-control">
          <span data-i18n="language">Language</span>

          <select id="languageSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="zh-TW">繁體中文</option>
          </select>
        </label>

        <label class="control mode-control">
          <span data-i18n="mode">Mode</span>

          <select id="modeSelect" aria-label="Game mode">
            <option value="relaxed" data-i18n="modeRelaxed">
              Relaxed
            </option>

            <option value="timed" data-i18n="modeTimed">
              Timed
            </option>
          </select>
        </label>
      </div>
    </header>

    <section class="stats" aria-label="Game statistics">
      <div class="stat score-stat">
        <span class="stat-label" data-i18n="score">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>

      <div class="stat moves-stat">
        <span class="stat-label" data-i18n="moves">Moves</span>
        <span class="stat-value" id="moves">0</span>
      </div>

      <div class="stat timer-stat" id="timerWrap" hidden>
        <span class="stat-label" data-i18n="time">Time</span>
        <span class="stat-value" id="timer">80</span>
      </div>

      <div class="stat best-stat">
        <span class="stat-label" data-i18n="bestScore">Best</span>
        <span class="stat-value" id="bestScore">0</span>
      </div>
    </section>

    <div id="board" aria-label="Animal match game board"></div>

    <p id="message" data-i18n="instructions">
      Click or swipe neighboring animals to match them.
    </p>

    <div class="controls">
      <button id="hintButton" data-i18n="hint">Hint</button>
      <button id="newGame" data-i18n="newGame">New Game</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
