<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sea Match</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
  --deepest: #031d35;
  --deep: #063b61;
  --ocean: #087e9e;
  --aqua: #19c7c9;
  --foam: #dffcff;
  --sand: #f8d889;
  --coral: #ff806b;
  --mint: #6af0c4;
  --white: #fff;
  --shadow: rgba(0, 18, 40, .55);
}

html {
  min-height: 100%;
  touch-action: manipulation;
}

body,
h1 {
  margin: 0;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 12px;
  overflow-x: hidden;
  color: var(--white);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 18% 12%, rgba(34, 202, 207, .32), transparent 24rem),
    radial-gradient(circle at 85% 25%, rgba(255, 128, 107, .18), transparent 20rem),
    linear-gradient(180deg, #03192d 0, #064c6e 48%, #021827 100%);
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, rgba(223, 252, 255, 0.7) 0 2px, transparent 3px),
    radial-gradient(circle, rgba(25, 199, 201, 0.4) 0 1px, transparent 2px),
    radial-gradient(circle, rgba(223, 252, 255, 0.5) 0 3px, transparent 4px);
  background-size: 200px 300px, 150px 250px, 300px 400px;
  animation: riseBubbles 25s linear infinite;
  pointer-events: none;
}

body::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, rgba(25, 199, 201, 0.6) 0 1.5px, transparent 2.5px),
    radial-gradient(circle, rgba(223, 252, 255, 0.4) 0 2px, transparent 3px);
  background-size: 120px 180px, 250px 350px;
  animation: riseBubbles 15s linear infinite;
  pointer-events: none;
}

@keyframes riseBubbles {
  from { 
    background-position: 0px 400px, 50px 500px, 100px 600px; 
  }
  to { 
    background-position: 0px -100px, 50px -150px, 100px -200px; 
  }
}
button,
select {
  color: inherit;
  font: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button,
select {
  cursor: pointer;
}

button:focus-visible,
select:focus-visible {
  outline: 3px solid var(--white);
  outline-offset: 3px;
}

.app {
  position: relative;
  isolation: isolate;
  width: min(94vw, 720px);
  padding: 24px;
  overflow: hidden;
  border: 3px solid rgba(223, 252, 255, .8);
  border-radius: 32px;
  background:
    linear-gradient(145deg, rgba(21, 157, 174, .95), rgba(3, 42, 72, .98) 58%),
    var(--deep);
  box-shadow:
    0 0 0 8px rgba(3, 29, 53, .8),
    0 0 0 11px rgba(248, 216, 137, .55),
    0 28px 70px var(--shadow),
    inset 0 1px 0 rgba(255, 255, 255, .35);
}

.app::before {
  position: absolute;
  inset: 0;
  z-index: -1;
  content: "";
  pointer-events: none;
  background:
    radial-gradient(circle at 22% 8%, rgba(223, 252, 255, .1), transparent 38%),
    radial-gradient(circle at 78% 92%, rgba(25, 199, 201, .12), transparent 42%);
}

.app::after {
  position: absolute;
  inset: auto -20% -100px;
  z-index: -1;
  height: 210px;
  content: "";
  opacity: .8;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 15% 40%, rgba(255, 128, 107, .7) 0 9%, transparent 10%),
    radial-gradient(ellipse at 78% 35%, rgba(106, 240, 196, .55) 0 8%, transparent 9%),
    linear-gradient(160deg, transparent 25%, rgba(248, 216, 137, .23) 26% 30%, transparent 31%);
  transform: rotate(-4deg);
}

header,
.toolbar,
.status {
  display: flex;
}

header {
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

h1 {
  color: var(--sand);
  font-size: clamp(2rem, 8vw, 3rem);
  line-height: 1;
  letter-spacing: .04em;
  text-shadow: 0 2px 0 #9b6d2a, 0 0 18px rgba(248, 216, 137, .45);
}

.toolbar {
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 6px;
}

.status {
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
}

.pill {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 9px 12px;
  border: 1px solid rgba(223, 252, 255, .18);
  border-radius: 14px;
  color: var(--foam);
  background: rgba(1, 22, 42, .42);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1);
  font-size: .88rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

#score,
#time {
  color: var(--sand);
  font-weight: 800;
  text-shadow: 0 0 9px rgba(248, 216, 137, .4);
}

#modeText {
  color: var(--mint);
  font-weight: 700;
}

.high-scores {
  display: flex;
  justify-content: flex-start;
  gap: 9px;
  margin: 8px 0 14px;
}

.high-scores .pill span:last-child {
  color: var(--sand);
  font-weight: 800;
}

button,
select {
  border: 1px solid rgba(223, 252, 255, .35);
  border-radius: 12px;
  background: rgba(3, 29, 53, .72);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
  transition: transform .15s, filter .15s, background .15s, box-shadow .15s;
}

button {
  padding: 10px 15px;
  font-weight: 700;
}

button:hover:not(:disabled) {
  filter: brightness(1.12);
  transform: translateY(-1px);
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

button:disabled {
  cursor: not-allowed;
  opacity: .52;
}

#hint,
#restart,
#playAgain {
  color: var(--deepest);
  border-color: var(--sand);
  background: linear-gradient(135deg, #fff1a8, var(--sand));
  box-shadow: 0 4px 0 #9d6b25, 0 0 18px rgba(248, 216, 137, .28);
}

#board {
  position: relative;
  overflow: hidden;
  display: grid;
  width: 100%;
  gap: clamp(3px, 1vw, 7px);
  padding: 12px;
  border: 2px solid rgba(248, 216, 137, .8);
  border-radius: 22px;
  background: linear-gradient(180deg, rgba(12, 116, 143, .9), rgba(2, 38, 66, .98));
  box-shadow:
    0 8px 0 rgba(42, 29, 11, .5),
    0 0 25px rgba(25, 199, 201, .35),
    inset 0 0 22px #011525;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#board::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.25;
  background-image: 
    radial-gradient(circle at 30% 30%, rgba(223, 252, 255, 0.4) 0%, transparent 40%),
    radial-gradient(circle at 70% 70%, rgba(25, 199, 201, 0.3) 0%, transparent 50%);
  background-size: 150px 150px;
  animation: driftCaustics 12s ease-in-out infinite alternate;
}

@keyframes driftCaustics {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.1) translate(-10px, -5px); }
}

.cell {
  display: grid;
  place-items: center;
  min-width: 0;
  aspect-ratio: 1;
  border: 1px solid rgba(223, 252, 255, .15);
  border-radius: 12px;
  color: #03243b;
  background: linear-gradient(135deg, rgba(25, 199, 201, 0.25), rgba(3, 42, 72, 0.65));
  border: 1px solid rgba(223, 252, 255, 0.3);
  box-shadow: 
    inset 0 2px 4px rgba(255, 255, 255, 0.25),
    inset 0 -2px 4px rgba(0, 0, 0, 0.4),
    0 4px 10px rgba(1, 15, 29, 0.4);
  font-size: clamp(17px, 6vw, 42px);
  line-height: 1;
  transition: transform .2s, background .2s, box-shadow .2s;
}

.cell:hover {
  background: linear-gradient(135deg, rgba(25, 199, 201, 0.45), rgba(8, 126, 158, 0.7));
  border-color: var(--aqua);
  box-shadow: 
    inset 0 2px 6px rgba(255, 255, 255, 0.4),
    0 0 12px rgba(25, 199, 201, 0.5);
}

.cell.selected {
  outline: 3px solid var(--mint);
  background: linear-gradient(135deg, #dffcff, var(--mint));
  box-shadow: 
    0 0 20px var(--mint),
    inset 0 0 10px rgba(25, 199, 201, 0.8);
  transform: scale(0.94);
}

.cell.hint {
  z-index: 2;
  outline: 3px solid var(--mint);
  background: linear-gradient(145deg, #dffcff, var(--mint));
  box-shadow: 0 0 20px var(--mint);
  animation: pulse .7s ease-in-out infinite alternate;
}

.help {
  margin: 14px 2px 0;
  color: rgba(223, 252, 255, .8);
  font-size: .9rem;
  line-height: 1.45;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(2, 13, 22, .82);
  backdrop-filter: blur(7px);
}

.dialog {
  width: min(100%, 390px);
  padding: 26px;
  border: 2px solid rgba(223, 252, 255, .8);
  border-radius: 24px;
  background:
    radial-gradient(circle at 18% 12%, rgba(34, 202, 207, .3), transparent 48%),
    linear-gradient(155deg, #087e9e, #063b61 62%, #031d35);
  box-shadow:
    0 0 0 5px rgba(3, 29, 53, .7),
    0 0 0 8px rgba(248, 216, 137, .45),
    0 28px 80px rgba(1, 12, 20, .8);
}

.dialog h2 {
  margin: 0 0 8px;
  color: var(--sand);
  font-size: 1.75rem;
  letter-spacing: .02em;
}

.dialog p,
.dialog ul {
  margin: 0;
  color: var(--foam);
  line-height: 1.55;
}

.dialog ul {
  padding-left: 20px;
}

.dialog li::marker {
  color: var(--mint);
}

.dialog label {
  display: block;
  margin: 18px 0 7px;
  color: var(--foam);
  font-size: .88rem;
  font-weight: 700;
  letter-spacing: .03em;
  text-transform: uppercase;
}

.dialog select {
  width: 100%;
  padding: 11px 12px;
  border-color: rgba(223, 252, 255, .65);
  border-radius: 9px;
  background: rgba(3, 29, 53, .6);
}

.dialog button {
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  color: #12334a;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #fff1a8, var(--sand));
  box-shadow: 0 5px 0 #9d6b25, 0 0 20px rgba(248, 216, 137, .4);
  font-weight: 800;
}

[hidden] {
  display: none !important;
}

@keyframes pulse {
  to { transform: scale(.9); }
}

@media (max-width: 430px) {
  body {
    padding: 15px 8px;
  }

  .app {
    width: 100%;
    padding: 18px 14px;
    border-radius: 25px;
  }

  #board {
    gap: 5px;
    padding: 8px;
  }

  .cell {
    font-size: clamp(17px, 6vw, 32px);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0s !important;
  }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1 id="title">Sea Match</h1>
    <button id="restart" type="button" hidden>New game</button>
  </header>
  <section class="toolbar" aria-label="Game controls">
    <div class="status">
      <span class="pill"><span id="scoreLabel">Score</span>: <span id="score">0</span></span>
      <span class="pill" id="timePill" hidden><span id="timeLabel">Time</span>: <span id="time">80</span></span>
      <span class="pill"><span id="modeText"></span></span>
    </div>
    <div>
      <button id="hint" type="button" disabled>Hint</button>
    </div>
  </section>
  <div id="board" role="grid" aria-label="Match-three game board"></div>
  <p class="help" id="instructions"></p>
</main>

<div class="overlay" id="startOverlay">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle">Sea Match</h2>
    <p id="intro"></p>
    <label id="languageLabel" for="language">Language</label>
    <select id="language">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="zh">中文</option>
    </select>
    <label id="modeLabel" for="mode">Game mode</label>
    <select id="mode">
      <option value="relaxed">Relaxed</option>
      <option value="timed">Timed</option>
    </select>
    <button id="start" type="button">Start game</button>
  </section>
</div>

<div class="overlay" id="endOverlay" hidden>
  <section class="dialog" role="dialog" aria-modal="true">
    <h2 id="endTitle"></h2>
    <p id="finalScore"></p>
    <button id="playAgain" type="button"></button>
  </section>
</div>

<script>
(() => {
  "use strict";

  const animals = ["🐙", "🪼", "🦪", "🦀", "🐢", "🐋", "🐡"];
  const BOMB = "🧨";
  const $ = id => document.getElementById(id);
  const boardEl = $("board");

  const copy = {
    en: {
      title: "Sea Match",
      intro: "Swap adjacent sea creatures to match 3+.",
      steps: [
        "Swap adjacent creatures to match 3+.",
        "Tap dynamite to blast pieces, or swap it to clear matches.",
        "Matches and chain reactions score points.",
        "Relaxed ends with no moves. Timed starts at 80s."
      ],
      language: "Language", mode: "Game mode", relaxed: "Relaxed", timed: "Timed",
      start: "Start game", newGame: "New game", score: "Score", time: "Time",
      hint: "Hint", best: "Best",
      over: "Game over", noMoves: "No moves left", final: "Final score",
      again: "Play again", modeRelaxed: "Relaxed", modeTimed: "Timed"
    },
    es: {
      title: "Conexión Marina",
      intro: "Intercambia criaturas vecinas para alinear 3+.",
      steps: [
        "Intercambia criaturas para alinear 3+.",
        "Toca la dinamita para destruir fichas, o intercámbiala para limpiar iguales.",
        "Combina y haz reacciones en cadena para sumar.",
        "Modo relajado sin movimientos. Contrarreloj desde 80s."
      ],
      language: "Idioma", mode: "Modo de juego", relaxed: "Relajado", timed: "Contrarreloj",
      start: "Empezar partida", newGame: "Nueva partida", score: "Puntuación", time: "Tiempo",
      hint: "Pista", best: "Mejor",
      over: "Fin de la partida", noMoves: "No quedan movimientos", final: "Puntuación final",
      again: "Jugar de nuevo", modeRelaxed: "Relajado", modeTimed: "Contrarreloj"
    },
    zh: {
      title: "消海鮮",
      intro: "移動相鄰海洋生物，連線3個或以上即可消除。",
      steps: [
        "移動相鄰生物，連線3個或以上即可消除。",
        "點擊炸彈炸毀周圍，或交換炸彈清除相同圖示。",
        "消除與觸發連鎖反應來獲得分數。",
        "悠閒模式無步數時結束；限時模式由80秒起倒數。"
      ],
      language: "語言", mode: "遊戲模式", relaxed: "悠閒模式", timed: "限時模式",
      start: "開始遊戲", newGame: "重新開始", score: "分數", time: "時間",
      hint: "提示", best: "最高記錄",
      over: "遊戲結束", noMoves: "沒有可移動步數", final: "最終得分",
      again: "再玩一次", modeRelaxed: "悠閒模式", modeTimed: "限時模式"
    }
  };

  let lang = "en";
  let mode = "relaxed";
  let rows = 10;
  let cols = 7;
  let board = [];
  let score = 0;
  let timeLeft = 80;
  let timer = null;
  let busy = false;
  let selected = null;
  let hintCells = [];
  let queuedBombs = 0;
  let started = false;
  let pointerStart = null;
  let audioCtx = null;
  let fallingCells = new Set();
  let lastCountdownSecond = null;

  const highScores = document.createElement("div");
  highScores.className = "high-scores";
  highScores.innerHTML = `
    <span class="pill" id="relaxedBest">
      <span class="bestLabel"></span>: <span id="relaxedHigh">0</span>
    </span>
    <span class="pill" id="timedBest">
      <span class="bestLabel"></span>: <span id="timedHigh">0</span>
    </span>
  `;
  document.querySelector(".toolbar").after(highScores);

  function preferredLanguage() {
    const query = new URLSearchParams(location.search).get("lang");
    if (["en", "es", "zh"].includes(query)) return query;

    try {
      const saved = localStorage.getItem("seaMatchLanguage");
      if (["en", "es", "zh"].includes(saved)) return saved;
    } catch (_) {}

    const preferences = (navigator.languages || [navigator.language || "en"])
      .map(value => value.toLowerCase());

    if (preferences.some(value => value.startsWith("zh"))) return "zh";
    if (preferences.some(value => value.startsWith("es"))) return "es";
    return "en";
  }

  function setLanguage(value) {
    lang = copy[value] ? value : "en";
    const text = copy[lang];

    document.documentElement.lang =
      lang === "zh" ? "zh-HK" : lang === "es" ? "es-ES" : "en-GB";
    document.title = text.title;

    $("title").textContent = text.title;
    $("dialogTitle").textContent = text.title;
    $("instructions").textContent = text.intro;
    $("intro").innerHTML =
      `<ul>${text.steps.map(step => `<li>${step}</li>`).join("")}</ul>`;

    $("languageLabel").textContent = text.language;
    $("modeLabel").textContent = text.mode;
    $("start").textContent = text.start;
    $("restart").textContent = text.newGame;
    $("scoreLabel").textContent = text.score;
    $("timeLabel").textContent = text.time;
    $("hint").textContent = text.hint;
    $("endTitle").textContent = text.over;
    $("playAgain").textContent = text.again;

    $("mode").options[0].text = text.relaxed;
    $("mode").options[1].text = text.timed;

    document.querySelectorAll(".bestLabel").forEach(el => {
      el.textContent = text.best;
    });

    updateModeLabel();
  }

  function updateModeLabel() {
    const text = copy[lang];
    $("modeText").textContent =
      mode === "timed" ? text.modeTimed : text.modeRelaxed;
    $("timePill").hidden = mode !== "timed";
  }

  function getHighScore(gameMode) {
    try {
      return Number(localStorage.getItem(`seaMatchHigh_${gameMode}`)) || 0;
    } catch (_) {
      return 0;
    }
  }

  function saveHighScore() {
    if (score <= getHighScore(mode)) return;
    try {
      localStorage.setItem(`seaMatchHigh_${mode}`, String(score));
    } catch (_) {}
  }

  function playSound(kind, intensity = 1) {
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const now = audioCtx.currentTime;

      function tone({ start, duration, from, to, wave, peak, end = 0.0001 }) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = wave;
        osc.frequency.setValueAtTime(from, start);
        if (to !== from) {
          osc.frequency.exponentialRampToValueAtTime(to, start + duration);
        }

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(peak, start + 0.008);
        gain.gain.exponentialRampToValueAtTime(end, start + duration);

        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration);
      }

      if (kind === "match") {
        const pitch = 1 + Math.min(Math.max(intensity, 0), 25) * 0.012;

        tone({
          start: now,
          duration: 0.11,
          from: 240 * pitch,
          to: 620 * pitch,
          wave: "sine",
          peak: 0.12
        });
        tone({
          start: now + 0.075,
          duration: 0.14,
          from: 330 * pitch,
          to: 760 * pitch,
          wave: "sine",
          peak: 0.09
        });
        return;
      }

      if (kind === "hint") {
        tone({
          start: now,
          duration: 0.32,
          from: 440,
          to: 440,
          wave: "triangle",
          peak: 0.10
        });
        tone({
          start: now + 0.12,
          duration: 0.42,
          from: 660,
          to: 660,
          wave: "sine",
          peak: 0.08
        });
        return;
      }

      if (kind === "countdown") {
        // Urgent two-tone pulse; the last few seconds get progressively higher and louder.
        const urgency = Math.max(0, Math.min(10, intensity));
        const pitch = 1 + (10 - urgency) * 0.035;
        const peak = 0.09 + (10 - urgency) * 0.008;
        const duration = urgency <= 3 ? 0.18 : 0.12;

        tone({
          start: now,
          duration,
          from: 520 * pitch,
          to: 780 * pitch,
          wave: "square",
          peak
        });
        tone({
          start: now + 0.09,
          duration: duration + 0.02,
          from: 390 * pitch,
          to: 620 * pitch,
          wave: "triangle",
          peak: peak * 0.8
        });

        if (urgency <= 3) {
          tone({
            start: now + 0.2,
            duration: 0.22,
            from: 880 * pitch,
            to: 660 * pitch,
            wave: "sawtooth",
            peak: peak * 0.55
          });
        }
        return;
      }

      const settings = {
        bomb: { frequency: 120, duration: 0.38, wave: "sawtooth" },
        over: { frequency: 330, duration: 0.45, wave: "triangle" }
      }[kind];

      if (!settings) return;

      tone({
        start: now,
        duration: settings.duration,
        from: settings.frequency,
        to: kind === "bomb" ? 45 : settings.frequency * 0.68,
        wave: settings.wave,
        peak: 0.14
      });
    } catch (_) {}
  }

  function playCountdownForSecond(second) {
    if (mode !== "timed" || second > 10 || second < 1) return;
    if (lastCountdownSecond === second) return;

    lastCountdownSecond = second;
    playSound("countdown", second);
  }

  function at(row, col) {
    return row * cols + col;
  }

  function randomAnimal() {
    return animals[Math.floor(Math.random() * animals.length)];
  }

  function matchesIn(cells) {
    const found = new Set();

    for (let row = 0; row < rows; row++) {
      let col = 0;
      while (col < cols) {
        const piece = cells[at(row, col)];
        if (!piece || piece === BOMB) {
          col++;
          continue;
        }

        let end = col + 1;
        while (end < cols && cells[at(row, end)] === piece) end++;
        if (end - col >= 3) {
          for (let x = col; x < end; x++) found.add(at(row, x));
        }
        col = end;
      }
    }

    for (let col = 0; col < cols; col++) {
      let row = 0;
      while (row < rows) {
        const piece = cells[at(row, col)];
        if (!piece || piece === BOMB) {
          row++;
          continue;
        }

        let end = row + 1;
        while (end < rows && cells[at(end, col)] === piece) end++;
        if (end - row >= 3) {
          for (let y = row; y < end; y++) found.add(at(y, col));
        }
        row = end;
      }
    }

    return found;
  }

  function hasMatchAvailable() {
    if (board.includes(BOMB)) return true;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const i = at(row, col);

        for (const [dr, dc] of [[0, 1], [1, 0]]) {
          const nextRow = row + dr;
          const nextCol = col + dc;
          if (nextRow >= rows || nextCol >= cols) continue;

          const j = at(nextRow, nextCol);
          [board[i], board[j]] = [board[j], board[i]];
          const valid = matchesIn(board).size > 0;
          [board[i], board[j]] = [board[j], board[i]];

          if (valid) return true;
        }
      }
    }
    return false;
  }

  function render() {
    boardEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    boardEl.style.width = "100%";
    boardEl.style.maxWidth = "none";
    boardEl.replaceChildren();

    board.forEach((piece, index) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("role", "gridcell");
      cell.setAttribute("aria-label", piece === BOMB ? "Dynamite" : piece || "Empty");
      cell.textContent = piece || "";

      if (selected === index) cell.classList.add("selected");
      if (hintCells.includes(index)) cell.classList.add("hint");

      if (fallingCells.has(index)) {
        cell.animate(
          [
            { transform: "translateY(-45px)", opacity: 0.25 },
            { transform: "translateY(0)", opacity: 1 }
          ],
          { duration: 240, easing: "cubic-bezier(.2,.8,.3,1)" }
        );
      }

      cell.addEventListener("pointerdown", onPointerDown);
      boardEl.append(cell);
    });

    fallingCells.clear();

    $("score").textContent = score;
    $("time").textContent = Math.ceil(timeLeft);
    $("hint").disabled = busy || !started;

    $("relaxedHigh").textContent = getHighScore("relaxed");
    $("timedHigh").textContent = getHighScore("timed");
    $("relaxedBest").hidden = mode !== "relaxed";
    $("timedBest").hidden = mode !== "timed";
  }

  function startGame() {
    mode = $("mode").value;
    updateModeLabel();

    const isWide = window.innerWidth >= 768;
    rows = isWide ? 7 : 10;
    cols = isWide ? 10 : 7;
    
    score = 0;
    timeLeft = 80;
    lastCountdownSecond = null;
    queuedBombs = 0;
    selected = null;
    hintCells = [];
    fallingCells.clear();
    busy = false;
    started = true;
    board = Array(rows * cols).fill(null);

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        let piece;
        do {
          piece = randomAnimal();
        } while (
          (col >= 2 &&
            board[at(row, col - 1)] === piece &&
            board[at(row, col - 2)] === piece) ||
          (row >= 2 &&
            board[at(row - 1, col)] === piece &&
            board[at(row - 2, col)] === piece)
        );
        board[at(row, col)] = piece;
      }
    }

    $("startOverlay").hidden = true;
    $("endOverlay").hidden = true;
    $("restart").hidden = false;

    if (timer) clearInterval(timer);
    timer = null;

    if (mode === "timed") {
      timer = setInterval(() => {
        if (!started) return;

        timeLeft = Math.max(0, timeLeft - 0.1);

        if (timeLeft <= 0) {
          endGame(copy[lang].over);
          return;
        }

        playCountdownForSecond(Math.ceil(timeLeft));
        render();
      }, 100);
    }

    render();
  }

  function addScore(points) {
    if (points <= 0) return;

    score += points;
    if (mode === "timed") {
      // Keep the existing time bonus, capped at 99 seconds.
      timeLeft = Math.min(99, timeLeft + points / 3);
    }

    const threshold = mode === "timed" ? 100 : 500;
    const earned =
      Math.floor(score / threshold) -
      Math.floor((score - points) / threshold);

    queuedBombs += Math.max(0, earned);
  }

  function dropAndRefill() {
    fallingCells = new Set();

    for (let col = 0; col < cols; col++) {
      const kept = [];

      for (let row = rows - 1; row >= 0; row--) {
        const piece = board[at(row, col)];
        if (piece) kept.push(piece);
      }

      const firstSourceRow = rows - kept.length;

      for (let row = rows - 1; row >= 0; row--) {
        const index = at(row, col);

        if (kept.length) {
          board[index] = kept.shift();
          if (row < firstSourceRow) fallingCells.add(index);
        } else {
          board[index] = queuedBombs > 0
            ? (queuedBombs--, BOMB)
            : randomAnimal();
          fallingCells.add(index);
        }
      }
    }
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function resolveMatches(initial, chain = 1) {
    let current = initial;

    while (current.size) {
      const count = current.size;
      playSound("match", count * chain);
      addScore((count - 2) * chain);

      if (chain >= 5) queuedBombs++;

      for (const index of current) board[index] = null;
      render();
      await wait(130);

      dropAndRefill();
      render();
      await wait(250);

      current = matchesIn(board);
      chain++;
    }
  }

  function endGame(message) {
    if (!started) return;

    started = false;
    busy = false;
    if (timer) clearInterval(timer);
    timer = null;

    saveHighScore();
    playSound("over");

    $("endTitle").textContent = message;
    $("finalScore").textContent = `${copy[lang].final}: ${score}`;
    $("endOverlay").hidden = false;
    render();
  }

  async function swap(i, j) {
    if (busy || !started) return;

    busy = true;
    selected = null;
    hintCells = [];

    const a = board[i];
    const b = board[j];

    if (a === BOMB && b === BOMB) {
      playSound("bomb");

      const count = board.filter(Boolean).length;
      board.fill(null);
      addScore(count - 2);

      render();
      await wait(180);

      dropAndRefill();
      render();
      await wait(250);

      await resolveMatches(matchesIn(board), 1);

      busy = false;
      render();
      checkNoMoves();
      return;
    }

    if (a === BOMB || b === BOMB) {
      playSound("bomb");

      const bombIndex = a === BOMB ? i : j;
      const otherPiece = a === BOMB ? b : a;
      const clear = new Set([bombIndex]);

      board.forEach((piece, index) => {
        if (piece === otherPiece) clear.add(index);
      });

      const count = clear.size;
      for (const index of clear) board[index] = null;
      addScore(count - 2);

      dropAndRefill();
      render();
      await wait(250);
      await resolveMatches(matchesIn(board), 1);

      busy = false;
      render();
      checkNoMoves();
      return;
    }

    [board[i], board[j]] = [board[j], board[i]];
    render();

    const matches = matchesIn(board);
    if (!matches.size) {
      await wait(130);
      [board[i], board[j]] = [board[j], board[i]];
      busy = false;
      render();
      return;
    }

    await resolveMatches(matches, 1);
    busy = false;
    render();
    checkNoMoves();
  }

  async function detonate(index) {
    if (busy || !started || board[index] !== BOMB) return;

    busy = true;
    hintCells = [];
    selected = null;
    playSound("bomb");

    const row = Math.floor(index / cols);
    const col = index % cols;
    const clear = new Set();

    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const r = row + dr;
        const c = col + dc;
        if (r >= 0 && r < rows && c >= 0 && c < cols) {
          clear.add(at(r, c));
        }
      }
    }

    const count = clear.size;
    for (const cellIndex of clear) board[cellIndex] = null;
    addScore(count - 2);

    render();
    await wait(160);
    dropAndRefill();
    render();
    await wait(250);
    await resolveMatches(matchesIn(board), 1);

    busy = false;
    render();
    checkNoMoves();
  }

  function shuffleBoard() {
    const pieces = [...board];

    do {
      for (let i = pieces.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      }
      board = [...pieces];
    } while (matchesIn(board).size > 0 || !hasMatchAvailable());

    // Preserve the existing +2-second timed-mode shuffle bonus.
    if (mode === "timed") {
      timeLeft = Math.min(99, timeLeft + 2);
      lastCountdownSecond = null;
    }

    render();
  }

  function checkNoMoves() {
    if (!started || hasMatchAvailable()) return;

    if (mode === "timed") {
      shuffleBoard();
    } else {
      endGame(copy[lang].noMoves);
    }
  }

  function onPointerDown(event) {
    if (busy || !started) return;

    const index = [...boardEl.children].indexOf(event.currentTarget);
    pointerStart = { index, x: event.clientX, y: event.clientY };
    event.currentTarget.setPointerCapture?.(event.pointerId);
  }

  boardEl.addEventListener("pointerup", event => {
    if (!pointerStart || busy || !started) {
      pointerStart = null;
      return;
    }

    const { index, x, y } = pointerStart;
    pointerStart = null;

    const dx = event.clientX - x;
    const dy = event.clientY - y;

    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
      selected = null;
      hintCells = [];

      let next;

      if (Math.abs(dx) > Math.abs(dy)) {
        next = index + (dx > 0 ? 1 : -1);
      } else {
        next = index + (dy > 0 ? cols : -cols);
      }

      const sameRow =
        Math.floor(next / cols) === Math.floor(index / cols);
      const valid =
        next >= 0 &&
        next < board.length &&
        (Math.abs(next - index) === cols || sameRow);

      render();

      if (!valid) return;

      swap(index, next);
      return;
    }

    if (board[index] === BOMB) {
      detonate(index);
      return;
    }

    if (selected === null || selected === index) {
      selected = selected === index ? null : index;
      render();
      return;
    }

    const adjacent =
      Math.abs(Math.floor(selected / cols) - Math.floor(index / cols)) +
      Math.abs((selected % cols) - (index % cols)) === 1;

    if (adjacent) {
      swap(selected, index);
    } else {
      selected = index;
      render();
    }
  });

  $("hint").addEventListener("click", () => {
    if (!started || busy) return;

    playSound("hint");
    const bombIndex = board.indexOf(BOMB);

    if (bombIndex >= 0) {
      const row = Math.floor(bombIndex / cols);
      const col = bombIndex % cols;
      const neighbour = [
        [row, col + 1],
        [row + 1, col],
        [row, col - 1],
        [row - 1, col]
      ].find(([r, c]) => r >= 0 && r < rows && c >= 0 && c < cols);

      hintCells = neighbour ? [bombIndex, at(...neighbour)] : [bombIndex];
      render();
      return;
    }

    hintCells = [];

    for (let row = 0; row < rows && !hintCells.length; row++) {
      for (let col = 0; col < cols && !hintCells.length; col++) {
        const i = at(row, col);

        for (const [dr, dc] of [[0, 1], [1, 0]]) {
          const nextRow = row + dr;
          const nextCol = col + dc;
          if (nextRow >= rows || nextCol >= cols) continue;

          const j = at(nextRow, nextCol);
          [board[i], board[j]] = [board[j], board[i]];
          const valid = matchesIn(board).size > 0;
          [board[i], board[j]] = [board[j], board[i]];

          if (valid) {
            hintCells = [i, j];
            break;
          }
        }
      }
    }

    render();
  });

  $("language").value = preferredLanguage();
  setLanguage($("language").value);

  $("language").addEventListener("change", () => {
    setLanguage($("language").value);
  });

  $("start").addEventListener("click", () => {
    setLanguage($("language").value);
    try {
      localStorage.setItem("seaMatchLanguage", lang);
    } catch (_) {}
    startGame();
  });

  $("restart").addEventListener("click", () => {
    if (timer) clearInterval(timer);
    timer = null;
    started = false;
    busy = false;
    lastCountdownSecond = null;
    $("mode").value = mode;
    $("startOverlay").hidden = false;
  });

  $("playAgain").addEventListener("click", () => {
    if (timer) clearInterval(timer);
    timer = null;

    started = false;
    busy = false;
    selected = null;
    hintCells = [];
    lastCountdownSecond = null;

    $("endOverlay").hidden = true;
    $("mode").value = mode;
    $("startOverlay").hidden = false;
  });

  document.addEventListener("dblclick", event => {
    event.preventDefault();
  }, { passive: false });

  document.addEventListener("gesturestart", event => {
    event.preventDefault();
  }, { passive: false });

  document.addEventListener("gesturechange", event => {
    event.preventDefault();
  }, { passive: false });

  document.addEventListener("gestureend", event => {
    event.preventDefault();
  }, { passive: false });
})();
</script>
</body>
</html>
