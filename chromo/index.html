<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title">Dominos of Colours</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="layout">
    <header class="sidebar-header">
      <h1 data-i18n="title"></h1>
      <p id="record"></p>
      <button id="new-game" type="button" data-i18n="newGame"></button>
      <div id="status" aria-live="polite"></div>
    </header>

    <section id="board-panel" aria-label="Game board">
      <svg id="board" role="img" aria-label="Game board"></svg>
    </section>

    <section class="play-area">
      <div id="pile-count" aria-live="polite"></div>
      <div id="players"></div>
      <h2 id="hand-title"></h2>
      <div id="hand" class="hand"></div>
      <p id="hint" aria-live="polite"></p>
      <div class="controls">
        <button id="draw" type="button" data-i18n="draw"></button>
        <button id="cancel" type="button" data-i18n="cancel"></button>
      </div>
    </section>
  </main>

  <dialog id="start-dialog">
    <form id="start-form">
      <h2 data-i18n="welcome"></h2>
      <p data-i18n="rules"></p>

      <label for="ai-count" data-i18n="opponents"></label>
      <select id="ai-count">
        <option value="1">1</option>
        <option value="2">2</option>
      </select>

      <label for="language" data-i18n="language"></label>
      <select id="language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
      </select>

      <button id="start-button" type="submit" data-i18n="start"></button>
    </form>
  </dialog>

  <script type="module" src="./script.js"></script>
</body>
</html>
