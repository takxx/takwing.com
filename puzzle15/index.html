<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15 Puzzle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="mosaic-bg" aria-hidden="true"></canvas>
<main>
  <header>
    <h1 id="title">15 Puzzle</h1>
    <button id="new-game" type="button">New game</button>
  </header>

  <div id="board" role="group" aria-label="15 puzzle board"></div>

  <section class="controls">
    <p id="instructions">
      Move a tile next to the empty space by tapping it or sliding it.
    </p>
    <div class="language-control">
      <span id="language-label">Language</span>
      <div id="language" role="group" aria-labelledby="language-label">
        <button type="button" class="language-button" data-language="en">English</button>
        <span aria-hidden="true">|</span>
        <button type="button" class="language-button" data-language="es">Español</button>
        <span aria-hidden="true">|</span>
        <button type="button" class="language-button" data-language="zh">中文</button>
      </div>
    </div>
    <p id="status" aria-live="polite"></p>
  </section>
</main>

<script src="script.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>
</body>
</html>
