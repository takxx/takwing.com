<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Slant Puzzle</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  min-height: 100%;

body {

    system-ui,

  line-height: 1.4;
  overflow-x: hidden;
}

}

  margin-bottom: 0.8rem;
}

.controls label {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.95rem;
}

.controls select,
.controls button {
  padding: 0.35rem 0.6rem;
  border: 1px solid #2a3b55;
  border-radius: 6px;
  background: #152238;
  color: #e6eef8;
  font: inherit;
  font-size: 0.95rem;
}

.controls button {
  cursor: pointer;
}

.controls button:hover {
  background: #1b2a44;
}

#board {
  display: block;

  width: 0;
  height: 0;

  margin: 0.4rem auto 0.6rem;
  border-radius: 8px;
  background: #111923;
  box-shadow: 0 6px 24px rgb(0 0 0 / 50%);

}

#status {
  min-height: 1.4em;

  margin: 0.2rem auto 0.6rem;
  font-size: 0.95rem;

}

#status.good {

}

}

#instructions {
  max-width: min(900px, calc(100vw - 2rem));

.rules-block h3 {

}

}

.language-selector select {
  padding: 0.25rem 0.4rem;
  border: 1px solid #2a3b55;
  border-radius: 6px;
  background: #152238;
  color: #e6eef8;
  font: inherit;
  font-size: 0.9rem;
}
</style>
</head>
<body>
<main class="container">
  <h1 data-i18n="puzzleTitle"></h1>

  <div class="controls">
    <label for="size">
      <span data-i18n="sizeLabel">Board size:</span>
      <select id="size">
        <option value="10">10 × 10</option>
        <option value="15">15 × 15</option>
        <option value="20">20 × 20</option>
        <option value="25">25 × 25</option>
      </select>
    </label>

    <button id="undo" title="Undo">↩</button>
    <button id="redo" title="Redo">↪</button>
    <button id="new" data-i18n="newButton">New puzzle</button>

  </div>

  <canvas id="board"></canvas>

  <div id="status"></div>

  <div id="instructions">

      Click on squares to place or clear slants.
    </p>

    <div class="rules-block">
      <h3 data-i18n="rulesTitle">Rules</h3>
      <ul data-i18n="rulesList">
        <!-- Filled by JS -->

      </label>

      <select id="language">

        <option value="es">Español</option>

      </select>
    </div>
  </div>
</main>

<script>
"use strict";

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const sizeControl = document.getElementById("size");
const newButton = document.getElementById("new");
const resetButton = document.getElementById("reset");
const undoButton = document.getElementById("undo");
const redoButton = document.getElementById("redo");
const statusElement = document.getElementById("status");
const languageSelect = document.getElementById("language");

const EMPTY = 0;
const BACKSLASH = 1;
const SLASH = 2;

const COLORS = {
  background: "#111923",
  grid: "#405066",
  diagonal: "#f4f7ff",
  node: "#347fa5",
  complete: "#35a962",
  invalid: "#ff5572",
  text: "#ffffff"
};

const NARROW_BREAKPOINT = 768;
const NARROW_DEFAULT_SIZE = 10;
const WIDE_DEFAULT_SIZE = 15;

function isNarrowScreen() {
  const width =
    window.innerWidth ||
    document.documentElement.clientWidth ||
    document.body.clientWidth ||
    1024;

  return width < NARROW_BREAKPOINT;
}

function getDefaultBoardSize() {
  const controlValue = Number(sizeControl?.value);

  if (!Number.isNaN(controlValue) && controlValue > 0) {
    return controlValue;
  }

  return isNarrowScreen() ? NARROW_DEFAULT_SIZE : WIDE_DEFAULT_SIZE;
}

let boardSize = getDefaultBoardSize();
let board = [];
let solution = [];
let clues = [];
let history = [];
let historyIndex = -1;
const maxHistory = 200;

let canvasSize = 0;
let cellSize = 0;
let deviceScale = 1;
let boardOrigin = 0;

const TRANSLATIONS = {
  en: {
    htmlLang: "en",
    puzzleTitle: "Slant",
    sizeLabel: "Board size:",
    newButton: "New puzzle",
    resetButton: "Reset",
    instruction: "Click on squares to place or clear slants.",
    rulesTitle: "Rules",
    rulesList: [
      "Draw exactly one diagonal in every square.",
      "No diagonal may form a closed loop.",
      "The number at each node shows how many diagonals touch that node."
    ],
    languageLabel: "Language:",
    generating: "Generating puzzle…",
    solved: "Solved!",
    hasViolation: "There is a rule violation.",
    noViolations: "No current rule violations."
  },
  es: {
    htmlLang: "es",
    puzzleTitle: "Diagonales",
    sizeLabel: "Tamaño del tablero:",
    newButton: "Nuevo puzzle",
    resetButton: "Reiniciar",
    instruction: "Haz clic en los cuadros para colocar o borrar las diagonales.",
    rulesTitle: "Reglas",
    rulesList: [
      "Dibuja exactamente una diagonal en cada cuadro.",
      "Ninguna diagonal puede formar un bucle cerrado.",
      "El número en cada nodo indica cuántas diagonales tocan ese nodo."
    ],
    languageLabel: "Idioma:",
    generating: "Generando puzzle…",
    solved: "¡Resuelto!",
    hasViolation: "Hay una violación de las reglas.",
    noViolations: "No hay violaciones de reglas actualmente."
  },
  zh: {
    htmlLang: "zh-Hant",
    puzzleTitle: "多多少少又點斜",
    sizeLabel: "棋盤大小：",
    newButton: "開新局",
    resetButton: "重設",
    instruction: "點吓啲格仔嚟加斜線或者清走佢。",
    rulesTitle: "遊戲玩法",
    rulesList: [
      "每個格仔入面都要畫啱啱好一條斜線。",
      "所有斜線加埋唔可以形成一個閉合嘅圈。",
      "每個交叉點上面嘅數字，代表有幾多條斜線連住呢個點。"
    ],
    languageLabel: "語言選擇：",
    generating: "整緊個謎題出嚟…",
    solved: "搞掂！",
    hasViolation: "有位唔啱例喎。",
    noViolations: "暫時冇犯規。"
  }
};

const SUPPORTED_LANGUAGES = Object.keys(TRANSLATIONS);

function makeGrid(rows, columns, value = EMPTY) {
  return Array.from({ length: rows }, () => Array(columns).fill(value));
}

function copyGrid(grid) {
  return grid.map(row => row.slice());
}

function shuffle(array) {
  for (let index = array.length - 1; index > 0; index -= 1) {
    const other = Math.floor(Math.random() * (index + 1));
    [array[index], array[other]] = [array[other], array[index]];
  }

  return array;
}

function gridsEqual(first, second) {
  if (!first || !second || first.length !== second.length) {
    return false;
  }

  for (let row = 0; row < first.length; row += 1) {
    if (first[row].length !== second[row].length) {
      return false;
    }

    for (let column = 0; column < first[row].length; column += 1) {
      if (first[row][column] !== second[row][column]) {
        return false;
      }
    }
  }

  return true;
}

function cellKey(row, column) {
  return `${row},${column}`;
}

function nodeKey(row, column) {
  return `${row},${column}`;
}

function nodeId(row, column) {
  return row * (boardSize + 1) + column;
}

class RollbackDisjointSet {
  constructor(size) {
    this.parent = Array.from({ length: size }, (_, index) => index);
    this.rank = Array(size).fill(0);
  }

  find(value) {
    while (this.parent[value] !== value) {
      value = this.parent[value];
    }

    return value;
  }

  union(first, second, trail) {
    const rootA = this.find(first);
    const rootB = this.find(second);

    if (rootA === rootB) {
      return false;
    }

    if (this.rank[rootA] < this.rank[rootB]) {
      let rootA = this.find(first);
      let rootB = this.find(second);
      
      if (this.rank[rootA] < this.rank[rootB]) {
        const temp = rootA;
        rootA = rootB;
        rootB = temp;
      }
    }

    trail.push({
      type: "union",
      childRoot: rootB,
      parentRoot: rootA,
      oldParent: this.parent[rootB],
      oldParentRank: this.rank[rootA],
      oldChildRank: this.rank[rootB]
    });

    this.parent[rootB] = rootA;

    if (this.rank[rootA] === this.rank[rootB]) {
      this.rank[rootA] += 1;
    }

    return true;
  }
}

function diagonalEndpoints(row, column, type) {
  if (type === BACKSLASH) {
    return [nodeId(row, column), nodeId(row + 1, column + 1)];
  }

  return [nodeId(row, column + 1), nodeId(row + 1, column)];
}

function adjacentCells(nodeRow, nodeColumn) {
  const cells = [];

  if (nodeRow > 0 && nodeColumn > 0) {
    cells.push({ row: nodeRow - 1, column: nodeColumn - 1 });
  }

  if (nodeRow > 0 && nodeColumn < boardSize) {
    cells.push({ row: nodeRow - 1, column: nodeColumn });
  }

  if (nodeRow < boardSize && nodeColumn > 0) {
    cells.push({ row: nodeRow, column: nodeColumn - 1 });
  }

  if (nodeRow < boardSize && nodeColumn < boardSize) {
    cells.push({ row: nodeRow, column: nodeColumn });
  }

  return cells;
}

function touchingOrientation(cellRow, cellColumn, nodeRow, nodeColumn) {
  if (cellRow === nodeRow - 1 && cellColumn === nodeColumn - 1) {
    return BACKSLASH;
  }

  if (cellRow === nodeRow - 1 && cellColumn === nodeColumn) {
    return SLASH;
  }

  if (cellRow === nodeRow && cellColumn === nodeColumn - 1) {
    return SLASH;
  }

  return BACKSLASH;
}

function touchesNode(cellRow, cellColumn, type, nodeRow, nodeColumn) {
  return type === touchingOrientation(cellRow, cellColumn, nodeRow, nodeColumn);
}

function countNodeConnections(state, nodeRow, nodeColumn) {
  let count = 0;

  for (const cell of adjacentCells(nodeRow, nodeColumn)) {
    const value = state[cell.row][cell.column];

    if (
      value !== EMPTY &&
      touchesNode(cell.row, cell.column, value, nodeRow, nodeColumn)
    ) {
      count += 1;
    }
  }

  return count;
}

function hasLoop(state) {
  const pointCount = (boardSize + 1) * (boardSize + 1);
  const dsu = new RollbackDisjointSet(pointCount);
  const trail = [];

  for (let row = 0; row < boardSize; row += 1) {
    for (let column = 0; column < boardSize; column += 1) {
      const value = state[row][column];

      if (value === EMPTY) {
        continue;
      }

      const endpoints = diagonalEndpoints(row, column, value);

      if (dsu.find(endpoints[0]) === dsu.find(endpoints[1])) {
        return true;
      }

      dsu.union(endpoints[0], endpoints[1], trail);
    }
  }

  return false;
}

function findLoopCells(state) {
  const pointCount = (boardSize + 1) * (boardSize + 1);
  const adjacency = Array.from({ length: pointCount }, () => []);
  const allLoopCells = new Set();

  for (let row = 0; row < boardSize; row += 1) {
    for (let column = 0; column < boardSize; column += 1) {
      const value = state[row][column];

      if (value === EMPTY) {
        continue;
      }

      const endpoints = diagonalEndpoints(row, column, value);
      const edge = {
        from: endpoints[0],
        to: endpoints[1],
        row,
        column
      };

      adjacency[edge.from].push(edge);
      adjacency[edge.to].push({
        from: edge.to,
        to: edge.from,
        row,
        column
      });
    }
  }

  const visited = Array(pointCount).fill(false);
  const parentNode = Array(pointCount).fill(-1);
  const parentEdge = Array(pointCount).fill(null);

  for (let start = 0; start < pointCount; start += 1) {
    if (visited[start]) {
      continue;
    }

    visited[start] = true;
    const stack = [{ node: start, edgeIndex: 0 }];

    while (stack.length > 0) {
      const frame = stack[stack.length - 1];
      const current = frame.node;
      const edges = adjacency[current];

      if (frame.edgeIndex >= edges.length) {
        stack.pop();
        continue;
      }

      const edge = edges[frame.edgeIndex++];
      const next = edge.to;
      const cameFromEdge = parentEdge[current];

      if (
        cameFromEdge &&
        cameFromEdge.row === edge.row &&
        cameFromEdge.column === edge.column
      ) {
        continue;
      }

      if (!visited[next]) {
        visited[next] = true;
        parentNode[next] = current;
        parentEdge[next] = edge;
        stack.push({ node: next, edgeIndex: 0 });
        continue;
      }

      const cycle = collectCycleCells(
        current,
        next,
        edge,
        parentNode,
        parentEdge
      );

      for (const key of cycle) {
        allLoopCells.add(key);
      }
    }
  }

  return allLoopCells;
}

function collectCycleCells(
  firstNode,
  secondNode,
  closingEdge,
  parentNode,
  parentEdge
) {
  const firstPath = [];
  const secondPath = [];

  let cursor = firstNode;

  while (cursor !== -1) {
    firstPath.push({ node: cursor, edge: parentEdge[cursor] });
    cursor = parentNode[cursor];
  }

  cursor = secondNode;

  while (cursor !== -1) {
    secondPath.push({ node: cursor, edge: parentEdge[cursor] });
    cursor = parentNode[cursor];
  }

  firstPath.reverse();
  secondPath.reverse();

  let commonLength = 0;

  while (
    commonLength < firstPath.length &&
    commonLength < secondPath.length &&
    firstPath[commonLength].node === secondPath[commonLength].node
  ) {
    commonLength += 1;
  }

  const cycle = new Set();

  for (let index = commonLength; index < firstPath.length; index += 1) {
    const edge = firstPath[index].edge;

    if (edge) {
      cycle.add(cellKey(edge.row, edge.column));
    }
  }

  for (let index = commonLength; index < secondPath.length; index += 1) {
    const edge = secondPath[index].edge;

    if (edge) {
      cycle.add(cellKey(edge.row, edge.column));
    }
  }

  cycle.add(cellKey(closingEdge.row, closingEdge.column));

  return cycle;
}

class SlantSolver {
  constructor(currentClues) {
    this.clues = currentClues;
    this.nodeCount = (boardSize + 1) * (boardSize + 1);
    this.cellCount = boardSize * boardSize;

    this.values = new Int8Array(this.cellCount);
    this.remaining = this.cellCount;

    this.dsu = new RollbackDisjointSet(this.nodeCount);
    this.trail = [];
    this.queue = [];

    this.solutions = [];
    this.complete = true;
    this.propagations = 0;
    this.branches = 0;
  }

  nodeIndex(row, column) {
    return row * (boardSize + 1) + column;
  }

  enqueueNode(row, column) {
    this.queue.push(this.nodeIndex(row, column));
  }

  enqueueCell(row, column) {
    this.enqueueNode(row, column);
    this.enqueueNode(row + 1, column);
    this.enqueueNode(row, column + 1);
    this.enqueueNode(row + 1, column + 1);
  }

  assignCell(row, column, value) {
    const index = row * boardSize + column;

    if (this.values[index] !== EMPTY) {
      return this.values[index] === value;
    }

    const endpoints = diagonalEndpoints(row, column, value);

    if (this.dsu.find(endpoints[0]) === this.dsu.find(endpoints[1])) {
      return false;
    }

    this.values[index] = value;
    this.remaining -= 1;
    this.trail.push({ type: "value", index });

    if (!this.dsu.union(endpoints[0], endpoints[1], this.trail)) {
      this.values[index] = EMPTY;
      this.remaining += 1;
      this.trail.pop();
      return false;
    }

    this.enqueueCell(row, column);
    return true;
  }

  rollback(mark, queueMark) {
    while (this.trail.length > mark) {
      const entry = this.trail.pop();

      if (entry.type === "value") {
        this.values[entry.index] = EMPTY;
        this.remaining += 1;
      } else {
        this.dsu.parent[entry.childRoot] = entry.oldParent;
        this.dsu.rank[entry.parentRoot] = entry.oldParentRank;
        this.dsu.rank[entry.childRoot] = entry.oldChildRank;
      }
    }

    this.queue.length = queueMark;
  }

  propagate() {
    while (this.queue.length > 0) {
      this.propagations += 1;

      const node = this.queue.pop();
      const row = Math.floor(node / (boardSize + 1));
      const column = node % (boardSize + 1);
      const clue = this.clues[row][column];

      if (clue === null) {
        continue;
      }

      const neighbours = adjacentCells(row, column);
      let connected = 0;
      const unknown = [];

      for (const cell of neighbours) {
        const value = this.values[cell.row * boardSize + cell.column];

        if (value === EMPTY) {
          unknown.push(cell);
        } else if (
          touchesNode(cell.row, cell.column, value, row, column)
        ) {
          connected += 1;
        }
      }

      if (connected > clue || connected + unknown.length < clue) {
        return false;
      }

      if (connected === clue) {
        for (const cell of unknown) {
          const forbidden = touchingOrientation(
            cell.row,
            cell.column,
            row,
            column
          );
          const required = forbidden === BACKSLASH ? SLASH : BACKSLASH;

          if (!this.assignCell(cell.row, cell.column, required)) {
            return false;
          }
        }
      } else if (connected + unknown.length === clue) {
        for (const cell of unknown) {
          const required = touchingOrientation(
            cell.row,
            cell.column,
            row,
            column
          );

          if (!this.assignCell(cell.row, cell.column, required)) {
            return false;
          }
        }
      }
    }

    return true;
  }

  chooseCell() {
    let best = null;
    let bestScore = -1;

    for (let row = 0; row < boardSize; row += 1) {
      for (let column = 0; column < boardSize; column += 1) {
        if (this.values[row * boardSize + column] !== EMPTY) {
          continue;
        }

        let score = 0;
        const nodes = [
          [row, column],
          [row + 1, column],
          [row, column + 1],
          [row + 1, column + 1]
        ];

        for (const [nodeRow, nodeColumn] of nodes) {
          if (this.clues[nodeRow][nodeColumn] !== null) {
            score += 10;
          }
        }

        const neighbours = [
          [row - 1, column],
          [row + 1, column],
          [row, column - 1],
          [row, column + 1]
        ];

        for (const [neighbourRow, neighbourColumn] of neighbours) {
          const inside =
            neighbourRow >= 0 &&
            neighbourRow < boardSize &&
            neighbourColumn >= 0 &&
            neighbourColumn < boardSize;

          if (
            inside &&
            this.values[neighbourRow * boardSize + neighbourColumn] !== EMPTY
          ) {
            score += 1;
          }
        }

        if (score > bestScore) {
          bestScore = score;
          best = { row, column };
        }
      }
    }

    return best;
  }

  valuesToGrid() {
    const result = makeGrid(boardSize, boardSize);

    for (let row = 0; row < boardSize; row += 1) {
      for (let column = 0; column < boardSize; column += 1) {
        result[row][column] = this.values[row * boardSize + column];
      }
    }

    return result;
  }

  isValidCompleteValues() {
    for (let row = 0; row <= boardSize; row += 1) {
      for (let column = 0; column <= boardSize; column += 1) {
        const clue = this.clues[row][column];

        if (clue === null) {
          continue;
        }

        const actual = countNodeConnections(
          this.valuesToGrid(),
          row,
          column
        );

        if (actual !== clue) {
          return false;
        }
      }
    }

    return true;
  }

  search(limit) {
    if (this.solutions.length >= limit) {
      return;
    }

    if (this.remaining === 0) {
      if (this.isValidCompleteValues()) {
        this.solutions.push(this.valuesToGrid());
      }

      return;
    }

    const cell = this.chooseCell();

    if (!cell) {
      return;
    }

    for (const value of [BACKSLASH, SLASH]) {
      this.branches += 1;

      const trailMark = this.trail.length;
      const queueMark = this.queue.length;

      if (this.assignCell(cell.row, cell.column, value)) {
        if (this.propagate()) {
          this.search(limit);
        }
      }

      this.rollback(trailMark, queueMark);

      if (this.solutions.length >= limit) {
        return;
      }
    }
  }

  solve(limit = 2) {
    for (let row = 0; row <= boardSize; row += 1) {
      for (let column = 0; column <= boardSize; column += 1) {
        if (this.clues[row][column] !== null) {
          this.enqueueNode(row, column);
        }
      }
    }

    if (this.propagate()) {
      this.search(limit);
    }

    return {
      solutions: this.solutions,
      complete: this.complete,
      propagations: this.propagations,
      branches: this.branches
    };
  }
}

function isUniquelySolvable(currentClues) {
  const solver = new SlantSolver(currentClues);
  const result = solver.solve(2);

  return (
    result.complete &&
    result.solutions.length === 1 &&
    gridsEqual(result.solutions[0], solution)
  );
}

function measureDifficulty(currentClues) {
  const solver = new SlantSolver(currentClues);
  const result = solver.solve(2);

  if (!result.complete || result.solutions.length !== 1) {
    return -1;
  }

  return result.branches * 10 + Math.min(result.propagations, 1000) / 20;
}

function generateLoopFreeSolution() {
  for (let attempt = 0; attempt < 100; attempt += 1) {
    const candidate = makeGrid(boardSize, boardSize);
    const dsu = new RollbackDisjointSet(
      (boardSize + 1) * (boardSize + 1)
    );
    const trail = [];
    const cells = [];

    for (let row = 0; row < boardSize; row += 1) {
      for (let column = 0; column < boardSize; column += 1) {
        cells.push({ row, column });
      }
    }

    shuffle(cells);

    let failed = false;

    for (const cell of cells) {
      const orientations =
        Math.random() < 0.5
          ? [BACKSLASH, SLASH]
          : [SLASH, BACKSLASH];

      let placed = false;

      for (const orientation of orientations) {
        const endpoints = diagonalEndpoints(
          cell.row,
          cell.column,
          orientation
        );

        if (dsu.find(endpoints[0]) !== dsu.find(endpoints[1])) {
          candidate[cell.row][cell.column] = orientation;
          dsu.union(endpoints[0], endpoints[1], trail);
          placed = true;
          break;
        }
      }

      if (!placed) {
        failed = true;
        break;
      }
    }

    if (!failed && !hasLoop(candidate)) {
      return candidate;
    }
  }

  return generateValidFallbackSolution();
}

function generateValidFallbackSolution() {
  for (let attempt = 0; attempt < 200; attempt += 1) {
    const candidate = makeGrid(boardSize, boardSize);

    for (let row = 0; row < boardSize; row += 1) {
      for (let column = 0; column < boardSize; column += 1) {
        candidate[row][column] =
          (row + column + attempt) % 2 === 0 ? BACKSLASH : SLASH;
      }
    }

    if (!hasLoop(candidate)) {
      return candidate;
    }
  }

  return makeGrid(boardSize, boardSize, BACKSLASH);
}

function calculateAllClues(solutionState) {
  const result = makeGrid(boardSize + 1, boardSize + 1, null);

  for (let row = 0; row <= boardSize; row += 1) {
    for (let column = 0; column <= boardSize; column += 1) {
      result[row][column] = countNodeConnections(
        solutionState,
        row,
        column
      );
    }
  }

  return result;
}

function allNodePositions() {
  const positions = [];

  for (let row = 0; row <= boardSize; row += 1) {
    for (let column = 0; column <= boardSize; column += 1) {
      positions.push({ row, column });
    }
  }

  return positions;
}

function minimizeClues(currentClues, timeBudget) {
  const startTime = performance.now();
  let changed = true;

  while (changed) {
    changed = false;

    const positions = shuffle(allNodePositions());

    for (const position of positions) {
      if (performance.now() - startTime > timeBudget) {
        return currentClues;
      }

      const row = position.row;
      const column = position.column;

      if (currentClues[row][column] === null) {
        continue;
      }

      const savedClue = currentClues[row][column];
      currentClues[row][column] = null;

      if (isUniquelySolvable(currentClues)) {
        changed = true;
      } else {
        currentClues[row][column] = savedClue;
      }
    }
  }

  return currentClues;
}

function createPuzzleCandidate(timeBudget) {
  solution = generateLoopFreeSolution();

  if (hasLoop(solution)) {
    return null;
  }

  const fullClues = calculateAllClues(solution);
  const minimized = minimizeClues(copyGrid(fullClues), timeBudget);

  if (!isUniquelySolvable(minimized)) {
    return null;
  }

  const difficulty = measureDifficulty(minimized);

  if (difficulty < 0) {
    return null;
  }

  return {
    clues: minimized,
    difficulty
  };
}

function createPuzzle() {
  const generationBudget = boardSize <= 15 ? 2500 : boardSize <= 20 ? 5000 : 8000;
  const candidateBudget = boardSize <= 15 ? 700 : boardSize <= 20 ? 1200 : 1800;
  const startTime = performance.now();

  let best = null;

  for (let attempt = 0; attempt < 4; attempt += 1) {
    if (performance.now() - startTime > generationBudget) {
      break;
    }

    const candidate = createPuzzleCandidate(candidateBudget);

    if (candidate && (!best || candidate.difficulty > best.difficulty)) {
      best = candidate;
    }
  }

  if (!best) {
    solution = generateLoopFreeSolution();
    clues = calculateAllClues(solution);
  } else {
    clues = best.clues;
  }

  board = makeGrid(boardSize, boardSize);
}

function getMaxBoardSize() {
  const calculatedSize = 200 + boardSize * 50;
  const horizontalPadding = 32;
  const availableWidth = Math.max(
    1,
    document.documentElement.clientWidth - horizontalPadding
  );

  return Math.min(calculatedSize, availableWidth);
}

function getNodeRadius() {
  return Math.max(9, cellSize * 0.26);
}

function resizeCanvas() {
  canvasSize = Math.floor(getMaxBoardSize());
  canvas.style.width = `${canvasSize}px`;
  canvas.style.height = `${canvasSize}px`;

  deviceScale = window.devicePixelRatio || 1;
  canvas.width = Math.floor(canvasSize * deviceScale);
  canvas.height = Math.floor(canvasSize * deviceScale);

  ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);

  const nominalCellSize = canvasSize / boardSize;
  const radius = Math.max(9, nominalCellSize * 0.26);
  const usableSize = canvasSize - 2 * radius;

  cellSize = usableSize / boardSize;
  boardOrigin = radius;
}

function draw(highlights) {
  ctx.clearRect(0, 0, canvasSize, canvasSize);
  ctx.fillStyle = COLORS.background;
  ctx.fillRect(0, 0, canvasSize, canvasSize);

  drawGrid();
  drawDiagonals(highlights.loopCells);
  drawNodes(highlights);
}

function drawGrid() {
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = Math.max(1, cellSize * 0.018);

  for (let index = 0; index <= boardSize; index += 1) {
    const position = boardOrigin + index * cellSize;

    drawLine(
      position,
      boardOrigin,
      position,
      boardOrigin + boardSize * cellSize
    );

    drawLine(
      boardOrigin,
      position,
      boardOrigin + boardSize * cellSize,
      position
    );
  }
}

function drawDiagonals(loopCells) {
  for (let row = 0; row < boardSize; row += 1) {
    for (let column = 0; column < boardSize; column += 1) {
      const value = board[row][column];

      if (value === EMPTY) {
        continue;
      }

      const x = boardOrigin + column * cellSize;
      const y = boardOrigin + row * cellSize;
      const padding = cellSize * 0.18;
      const inLoop = loopCells.has(cellKey(row, column));

      ctx.strokeStyle = inLoop ? COLORS.invalid : COLORS.diagonal;
      ctx.lineWidth = inLoop
        ? Math.max(3, cellSize * 0.075)
        : Math.max(2, cellSize * 0.055);
      ctx.lineCap = "round";

      if (value === BACKSLASH) {
        drawLine(
          x + padding,
          y + padding,
          x + cellSize - padding,
          y + cellSize - padding
        );
      } else {
        drawLine(
          x + cellSize - padding,
          y + padding,
          x + padding,
          y + cellSize - padding
        );
      }
    }
  }
}

function drawNodes(highlights) {
  const radius = getNodeRadius();

  for (let row = 0; row <= boardSize; row += 1) {
    for (let column = 0; column <= boardSize; column += 1) {
      const x = boardOrigin + column * cellSize;
      const y = boardOrigin + row * cellSize;
      const key = nodeKey(row, column);
      const clue = clues[row][column];

      let color = COLORS.node;

      if (highlights.badNodes.has(key)) {
        color = COLORS.invalid;
      } else if (highlights.completeNodes.has(key)) {
        color = COLORS.complete;
      }

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (clue !== null) {
        ctx.fillStyle = COLORS.text;
        ctx.font = `800 ${Math.max(12, cellSize * 0.28)}px system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(clue, x, y);
      }
    }
  }
}

function drawLine(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function calculateHighlights() {
  const badNodes = new Set();
  const completeNodes = new Set();
  const loopCells = findLoopCells(board);

  for (let row = 0; row <= boardSize; row += 1) {
    for (let column = 0; column <= boardSize; column += 1) {
      const neighbours = adjacentCells(row, column);
      const complete = neighbours.every(
        cell => board[cell.row][cell.column] !== EMPTY
      );

      if (!complete) {
        continue;
      }

      const actual = countNodeConnections(board, row, column);
      const clue = clues[row][column];

      if (clue !== null && actual !== clue) {
        badNodes.add(nodeKey(row, column));
      } else {
        completeNodes.add(nodeKey(row, column));
      }
    }
  }

  return {
    badNodes,
    completeNodes,
    loopCells
  };
}

function isSolved() {
  if (!board.every(row => row.every(value => value !== EMPTY))) {
    return false;
  }

  if (hasLoop(board)) {
    return false;
  }

  for (let row = 0; row <= boardSize; row += 1) {
    for (let column = 0; column <= boardSize; column += 1) {
      const clue = clues[row][column];

      if (
        clue !== null &&
        countNodeConnections(board, row, column) !== clue
      ) {
        return false;
      }
    }
  }

  return true;
}

function getCurrentLanguage() {
  if (languageSelect && TRANSLATIONS[languageSelect.value]) {
    return languageSelect.value;
  }

  return "en";
}

function updateDisplay() {
  if (
    !Array.isArray(board) ||
    board.length !== boardSize ||
    !Array.isArray(clues) ||
    clues.length !== boardSize + 1
  ) {
    return;
  }

  const highlights = calculateHighlights();
  draw(highlights);

  const translation = TRANSLATIONS[getCurrentLanguage()];

  if (isSolved()) {
    statusElement.textContent = translation.solved;
    statusElement.className = "good";
    return;
  }

  if (highlights.badNodes.size > 0 || highlights.loopCells.size > 0) {
    statusElement.textContent = translation.hasViolation;
    statusElement.className = "bad";
    return;
  }

  statusElement.textContent = translation.noViolations;
  statusElement.className = "";
}

function updateUndoRedoButtons() {
  if (undoButton) {
    undoButton.disabled = historyIndex <= 0;
  }

  if (redoButton) {
    redoButton.disabled = historyIndex >= history.length - 1;
  }
}

function resetHistory() {
  history = [copyGrid(board)];
  historyIndex = 0;
  updateUndoRedoButtons();
}

function saveHistory() {
  const snapshot = copyGrid(board);

  if (historyIndex >= 0 && gridsEqual(history[historyIndex], snapshot)) {
    updateUndoRedoButtons();
    return;
  }

  history = history.slice(0, historyIndex + 1);
  history.push(snapshot);

  if (history.length > maxHistory) {
    history.shift();
  }

  historyIndex = history.length - 1;
  updateUndoRedoButtons();
}

function undo() {
  if (historyIndex <= 0) {
    return;
  }

  historyIndex -= 1;
  board = copyGrid(history[historyIndex]);
  updateDisplay();
  updateUndoRedoButtons();
}

function redo() {
  if (historyIndex < 0 || historyIndex >= history.length - 1) {
    return;
  }

  historyIndex += 1;
  board = copyGrid(history[historyIndex]);
  updateDisplay();
  updateUndoRedoButtons();
}

function getCellFromPointer(event) {
  const rectangle = canvas.getBoundingClientRect();
  const x = event.clientX - rectangle.left;
  const y = event.clientY - rectangle.top;

  const column = Math.floor((x - boardOrigin) / cellSize);
  const row = Math.floor((y - boardOrigin) / cellSize);

  if (row < 0 || row >= boardSize || column < 0 || column >= boardSize) {
    return null;
  }

  return { row, column };
}

function changeCell(row, column, mode) {
  const current = board[row][column];
  let next;

  if (mode === "primary") {
    if (current === EMPTY) {
      next = BACKSLASH;
    } else if (current === BACKSLASH) {
      next = SLASH;
    } else {
      next = EMPTY;
    }
  } else {
    if (current === EMPTY) {
      next = SLASH;
    } else if (current === SLASH) {
      next = BACKSLASH;
    } else {
      next = EMPTY;
    }
  }

  if (next === current) {
    return;
  }

  board[row][column] = next;
  saveHistory();
  updateDisplay();
}

canvas.addEventListener("contextmenu", event => {
  event.preventDefault();
});

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();

  const cell = getCellFromPointer(event);

  if (!cell) {
    return;
  }

  changeCell(
    cell.row,
    cell.column,
    event.button === 0 ? "primary" : "secondary"
  );
});

function startNewGame() {
  const translation = TRANSLATIONS[getCurrentLanguage()];

  statusElement.textContent = translation.generating;
  statusElement.className = "";

  if (newButton) {
    newButton.disabled = true;
  }

  setTimeout(() => {
    createPuzzle();
    resizeCanvas();
    resetHistory();
    updateDisplay();

    if (newButton) {
      newButton.disabled = false;
    }
  }, 20);
}

newButton?.addEventListener("click", startNewGame);

resetButton?.addEventListener("click", () => {
  board = makeGrid(boardSize, boardSize);
  resetHistory();
  updateDisplay();
});

undoButton?.addEventListener("click", undo);
redoButton?.addEventListener("click", redo);

sizeControl?.addEventListener("change", () => {
  boardSize = Number(sizeControl.value) || getDefaultBoardSize();
  startNewGame();
});

let lastWasNarrow = isNarrowScreen();

window.addEventListener("resize", () => {
  const nowNarrow = isNarrowScreen();

  if (nowNarrow !== lastWasNarrow) {
    const controlValue = Number(sizeControl?.value);
    const hasExplicitSize =
      !Number.isNaN(controlValue) &&
      controlValue > 0 &&
      controlValue !== NARROW_DEFAULT_SIZE &&
      controlValue !== WIDE_DEFAULT_SIZE;

    if (!hasExplicitSize) {
      boardSize = nowNarrow ? NARROW_DEFAULT_SIZE : WIDE_DEFAULT_SIZE;

      if (sizeControl) {
        sizeControl.value = String(boardSize);
      }

      startNewGame();
    }
  }

  resizeCanvas();
  updateDisplay();
  lastWasNarrow = nowNarrow;
});

function getLanguageFromUrl() {
  const urlLanguage = new URLSearchParams(window.location.search).get("lang");

  if (!urlLanguage) {
    return null;
  }

  const normalized = urlLanguage.trim().toLowerCase();

  if (SUPPORTED_LANGUAGES.includes(normalized)) {
    return normalized;
  }

  return null;
}

function getBrowserLanguage() {
  const browserLanguage = (
    navigator.language ||
    navigator.userLanguage ||
    "en"
  ).toLowerCase();

  if (browserLanguage.startsWith("zh")) {
    return "zh";
  }

  if (browserLanguage.startsWith("es")) {
    return "es";
  }

  return "en";
}

function applyTranslations(language) {
  const translation = TRANSLATIONS[language] || TRANSLATIONS.en;

  document.documentElement.lang = translation.htmlLang;

  const elements = document.querySelectorAll("[data-i18n]");

  for (const element of elements) {
    const key = element.dataset.i18n;

    if (key === "rulesList") {
      element.innerHTML = "";

      for (const rule of translation.rulesList) {
        const listItem = document.createElement("li");
        listItem.textContent = rule;
        element.appendChild(listItem);
      }

      continue;
    }

    if (translation[key]) {
      element.textContent = translation[key];
    }
  }
}

function setLanguage(language, savePreference) {
  const selected = TRANSLATIONS[language] ? language : "en";

  if (languageSelect) {
    languageSelect.value = selected;
  }

  applyTranslations(selected);

  if (savePreference) {
    try {
      localStorage.setItem("puzzle-language", selected);
    } catch {
      // Storage may be unavailable.
    }
  }
}

function initializeLanguage() {
  const urlLanguage = getLanguageFromUrl();
  let language = urlLanguage || getBrowserLanguage();

  if (!urlLanguage) {
    try {
      const savedLanguage = localStorage.getItem("puzzle-language");

      if (savedLanguage && TRANSLATIONS[savedLanguage]) {
        language = savedLanguage;
      }
    } catch {
      // Storage may be unavailable.
    }
  }

  setLanguage(language, false);

  languageSelect?.addEventListener("change", () => {
    setLanguage(languageSelect.value, true);
  });
}

initializeLanguage();
startNewGame();
</script>
