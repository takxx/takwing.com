<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whack-A-Mole</title>
<style>
:root {
  font-family: "Chalkboard SE", "Comic Sans MS", ui-rounded, system-ui, sans-serif;
  color: #fff7cf;
  background: #173c2d;
}
* { box-sizing: border-box; }
body {
  min-height: 100vh;
  margin: 0;
  padding: 16px;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at 50% 0%, #438746, transparent 60%), #173c2d;
}
button { font: inherit; }

.cabinet {
  width: min(100%, 680px);
  overflow: hidden;
  border: 8px solid #633719;
  border-radius: 28px;
  background: #a95725;
  box-shadow: 0 18px 0 #3c2417, 0 24px 38px #071b1380;
}
.marquee {
  padding: 18px 20px;
  text-align: center;
  color: #69254f;
  background: linear-gradient(#fff078, #ffac47);
  border-bottom: 6px solid #713a1b;
}
h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 3rem); letter-spacing: .04em; }
.subtitle { margin: 4px 0 0; font-weight: 800; }

.hud {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  padding: 12px;
  background: #542d1d;
  text-align: center;
}
.stat {
  padding: 8px 4px;
  border-radius: 10px;
  background: #38251d;
  color: #fff19a;
  font-weight: 900;
  min-width: 0;
  overflow: hidden;
  font-size: clamp(0.55rem, 2.5vw, 1rem);
  overflow-wrap: anywhere;
}
.stat span { display: block; margin-top: 3px; color: #fff; font-size: clamp(0.75rem, 3.5vw, 1.2rem);}

.yard {
  padding: clamp(14px, 5vw, 28px);
  background: radial-gradient(ellipse at 50% 15%, #a5de58, transparent 55%), linear-gradient(#54a943, #28733b);
}

.holes {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  column-gap: 0;
  row-gap: clamp(0px, .5vw, 5px);
  max-width: 560px;
  margin: auto;
}
.hole {
  grid-column: span 2;
  min-width: 0;
  aspect-ratio: 1.15;
  position: relative;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: crosshair;
  touch-action: manipulation;
}
.hole:nth-child(1)  { grid-area: 1 / 2 / 2 / 4; }
.hole:nth-child(2)  { grid-area: 1 / 4 / 2 / 6; }
.hole:nth-child(3)  { grid-area: 1 / 6 / 2 / 8; }
.hole:nth-child(4)  { grid-area: 2 / 1 / 3 / 3; }
.hole:nth-child(5)  { grid-area: 2 / 3 / 3 / 5; }
.hole:nth-child(6)  { grid-area: 2 / 5 / 3 / 7; }
.hole:nth-child(7)  { grid-area: 2 / 7 / 3 / 9; }
.hole:nth-child(8)  { grid-area: 3 / 2 / 4 / 4; }
.hole:nth-child(9)  { grid-area: 3 / 4 / 4 / 6; }
.hole:nth-child(10) { grid-area: 3 / 6 / 4 / 8; }

.hole:focus-visible { outline: 4px solid #fff4a8; outline-offset: 3px; border-radius: 50%; }
.hole svg { display: block; width: 100%; height: 100%; overflow: visible; }
.mole {
  opacity: 0;
  transform: translateY(48px) scale(.72);
  transform-origin: center;
  transition: transform .12s ease-out, opacity .1s ease-out;
  pointer-events: none;
}
.hole.up .mole { opacity: 1; transform: translateY(0) scale(1); }
.hole.hit .mole { transform: translateY(12px) scale(.78); }
.hit-mark { opacity: 0; font-size: 34px; text-anchor: middle; pointer-events: none; }
.hole.hit .hit-mark { opacity: 1; }
.hole,.hole:hover,.hole:active,.hole.hit {background: transparent;box-shadow: none;}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #542d1d;
  color: #fff19a;
  font-weight: 800;
}
.small-button, .choice, .primary {
  border: 3px solid #713a1b;
  border-radius: 12px;
  padding: 9px 14px;
  background: #ffe05b;
  color: #51285d;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 3px 0 #9c571d;
}
button:hover { filter: brightness(1.08); }
button:active:not(.hole) { transform: translateY(2px); box-shadow: 0 1px 0 #9c571d; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 18px;
  background: #10251ed9;
}
.overlay[hidden] { display: none; }
.panel {
  width: min(100%, 480px);
  padding: clamp(20px, 5vw, 32px);
  border: 7px solid #633719;
  border-radius: 24px;
  background: linear-gradient(#fff0a1, #ffba57);
  color: #51285d;
  text-align: center;
  box-shadow: 0 12px 0 #301d14;
}
.overlay-game-title {
  margin: 0 0 12px;
  color: #69254f;
  font-size: clamp(1.8rem, 7vw, 2.6rem);
  line-height: 1.1;
  text-shadow: 0 2px #fff19a;
}
.panel h2 { margin: 0 0 8px; font-size: clamp(1.5rem, 5vw, 2.2rem); }
.panel p { line-height: 1.45; }
.group { margin: 18px 0; }
.group-label, .notice { color: #713255; font-weight: 900; }
.group-label { margin-bottom: 8px; }
.choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
.choice[aria-pressed="true"] { background: #a8e06a; border-color: #416d2d; }
.primary { margin-top: 10px; padding: 12px 24px; background: #9be95f; font-size: 1.1rem; }
.notice { min-height: 1.5em; }

@media (max-width: 480px) {
  .hud { grid-template-columns: repeat(5, 1fr); }
  .footer { align-items: flex-start; font-size: .9rem; }
  .yard { padding: 12px 8px; }

  .holes {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(4, auto);
    row-gap: 0;
  }

  .hole {
    grid-column: auto;
  }

  /* Left column: three holes, shifted down half a hole */
  .hole:nth-child(1) { grid-area: 1 / 1; transform: translateY(50%); }
  .hole:nth-child(2) { grid-area: 2 / 1; transform: translateY(50%); }
  .hole:nth-child(3) { grid-area: 3 / 1; transform: translateY(50%); }

  /* Center column: four holes */
  .hole:nth-child(4) { grid-area: 1 / 2; }
  .hole:nth-child(5) { grid-area: 2 / 2; }
  .hole:nth-child(6) { grid-area: 3 / 2; }
  .hole:nth-child(7) { grid-area: 4 / 2; }

  /* Right column: three holes, shifted down half a hole */
  .hole:nth-child(8)  { grid-area: 1 / 3; transform: translateY(50%); }
  .hole:nth-child(9)  { grid-area: 2 / 3; transform: translateY(50%); }
  .hole:nth-child(10) { grid-area: 3 / 3; transform: translateY(50%); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="cabinet">
  <header class="marquee">
    <h1 id="game-title"></h1>
    <p class="subtitle" id="tagline"></p>
  </header>

  <section class="hud" aria-live="polite">
    <div class="stat"><span id="target-label"></span><span id="target-count">0</span></div>
    <div class="stat"><span id="stage-label"></span><span id="stage">1</span></div>
    <div class="stat"><span id="time-label"></span><span id="time">15</span></div>
    <div class="stat"><span id="score-label"></span><span id="score">0</span></div>
    <div class="stat"><span id="best-label"></span><span id="best">0</span></div>
  </section>

  <section class="yard" aria-label="Game field">
    <div class="holes" id="holes"></div>
  </section>

  <footer class="footer">
    <span id="mode-display"></span>
    <button class="small-button" id="menu-button" type="button"></button>
  </footer>
</main>

<div class="overlay" id="overlay">
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <h1 class="overlay-game-title" id="overlay-game-title"></h1>
    <h2 id="panel-title"></h2>
    <p id="panel-text"></p>

    <div class="group" id="mode-group">
      <div class="group-label" id="mode-prompt"></div>
      <div class="choices">
        <button class="choice" type="button" data-mode="relaxed" aria-pressed="false"></button>
        <button class="choice" type="button" data-mode="normal" aria-pressed="true"></button>
        <button class="choice" type="button" data-mode="brutal" aria-pressed="false"></button>
      </div>
    </div>

    <div class="group" id="language-group">
      <div class="group-label" id="language-prompt"></div>
      <div class="choices">
        <button class="choice" type="button" data-lang="en" aria-pressed="false">English</button>
        <button class="choice" type="button" data-lang="es" aria-pressed="false">Español</button>
        <button class="choice" type="button" data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </div>

    <p class="notice" id="notice" aria-live="polite"></p>
    <button class="primary" id="action-button" type="button"></button>
  </section>
</div>

<script>
(() => {
  "use strict";

  const words = {
    en: {
      title: "Whack-A-Mole", tagline: "The classic arcade garden!",
      score: "Score", stage: "Stage", time: "Time", best: "Best", menu: "Menu",
      relaxed: "Relaxed", normal: "Normal", brutal: "Brutal",
      modePrompt: "Choose a mode", languagePrompt: "Choose a language",
      readyTitle: "Ready to play?", readyText: "Choose a mode and language, then start the game.",
      start: "Start game", startStage: "Start stage", continue: "Continue", restart: "Restart",
      nextTitle: "Stage {n}", targetLine: "Target: whack {target} moles in 15 seconds.",
      completeTitle: "Stage {n} complete!", completeText: "Brilliant! Your score is {score}.",
      failedTitle: "Game over!", failedText: "You whacked {hits} of {target} moles in stage {n}. Your score is {score}.",
      finalTitle: "Brilliant!", finalText: "You cleared all 10 stages with {score} points.",
      target: "Moles left: {target}",
      targetLabel: "Left",
      modes: { relaxed: "Relaxed", normal: "Normal", brutal: "Brutal" }
    },
    es: {
      title: "Golpea al topo", tagline: "¡El clásico jardín de los recreativos!",
      score: "Puntos", stage: "Nivel", time: "Tiempo", best: "Récord", menu: "Menú",
      relaxed: "Relajado", normal: "Normal", brutal: "Brutal",
      modePrompt: "Elige un modo", languagePrompt: "Elige un idioma",
      readyTitle: "¿Listo para jugar?", readyText: "Elige un modo y un idioma para empezar.",
      start: "Empezar", startStage: "Empezar nivel", continue: "Continuar", restart: "Reiniciar",
      nextTitle: "Nivel {n}", targetLine: "Objetivo: golpea {target} topos en 15 segundos.",
      completeTitle: "¡Nivel {n} completado!", completeText: "¡Buen trabajo! Tu puntuación es de {score} puntos.",
      failedTitle: "Fin de la partida", failedText: "Has golpeado {hits} de {target} topos en el nivel {n}. Tu puntuación es de {score} puntos.",
      finalTitle: "¡Increíble!", finalText: "Has superado los 10 niveles con {score} puntos.",
      target: "Topos restantes: {target}",
      targetLabel: "Faltan",
      modes: { relaxed: "Relajado", normal: "Normal", brutal: "Brutal" }
    },
    zh: {
      title: "扑傻瓜", tagline: "經典街機大挑戰！",
      score: "分數", stage: "關卡", time: "時間", best: "最高分", menu: "選單",
      relaxed: "輕鬆", normal: "普通", brutal: "地獄",
      modePrompt: "揀個難度", languagePrompt: "揀種語言",
      readyTitle: "準備好未？", readyText: "揀好難度同語言就可以開始。",
      start: "開始遊戲", startStage: "開始呢關", continue: "繼續", restart: "重新開始",
      nextTitle: "第 {n} 關", targetLine: "目標：喺 15 秒內打中 {target} 隻地鼠。",
      completeTitle: "過咗第 {n} 關！", completeText: "好嘢！你拎到 {score} 分。",
      failedTitle: "玩完！", failedText: "第 {n} 關你只係打中 {hits} 隻（目標 {target} 隻），總分係 {score} 分。",
      finalTitle: "爆機！好犀利！", finalText: "你過晒全部 10 關，總共拎到 {score} 分！",
      target: "仲差：{target} 隻",
      targetLabel: "仲差",
      modes: { relaxed: "輕鬆", normal: "普通", brutal: "地獄" }
    }
  };

  const config = {
    relaxed: { delay: 1900, min: 1250, visible: 1500, target: 3, growth: 1 },
    normal: { delay: 1050, min: 420, visible: 820, target: 5, growth: 2 },
    brutal: { delay: 620, min: 190, visible: 430, target: 8, growth: 3 }
  };

  const $ = id => document.getElementById(id);

  function initialLanguage() {
    const query = new URLSearchParams(location.search).get("lang");
    if (["en", "es", "zh"].includes(query)) return query;

    try {
      const saved = localStorage.getItem("wam-language");
      if (["en", "es", "zh"].includes(saved)) return saved;
    } catch (_) {}

    for (const preference of navigator.languages || [navigator.language || ""]) {
      const p = preference.toLowerCase();
      if (p.startsWith("zh")) return "zh";
      if (p.startsWith("es")) return "es";
      if (p.startsWith("en")) return "en";
    }
    return "en";
  }

  let lang = initialLanguage();
  let mode = "normal";
  let score = 0, stage = 1, hits = 0, target = 0;
  let running = false, roundEnd = 0;
  let roundTimer = null, moleTimer = null, audioContext = null;
  let panelState = "start", lastHit = 0;

  const activeHoles = new Set();
  const moleTimers = new Map();

  function t(key, vars = {}) {
    const value = words[lang][key];
    if (typeof value !== "string") return value;
    return value.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
  }

  function bestKey() {
    return "wam-best-" + mode;
  }

  function bestScore() {
    try {
      return Number(localStorage.getItem(bestKey())) || 0;
    } catch (_) {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem(bestKey(), String(value));
    } catch (_) {}
  }

  function sound(kind) {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      audioContext ||= new AudioCtx();
      if (audioContext.state === "suspended") audioContext.resume();

      const notes = {
        start: [[440, .11], [660, .16]],
        hit: [[740, .07], [980, .09]],
        complete: [[523, .12], [659, .12], [784, .12], [1047, .24]],
        failed: [[392, .16], [330, .18], [262, .28]]
      }[kind];

      const now = audioContext.currentTime;

      if (kind === "hit") {
        // Brief noise burst for the sharp contact.
        const buffer = audioContext.createBuffer(
          1,
          Math.floor(audioContext.sampleRate * 0.07),
          audioContext.sampleRate
        );
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      
        const noise = audioContext.createBufferSource();
        noise.buffer = buffer;
      
        const noiseGain = audioContext.createGain();
        noiseGain.gain.setValueAtTime(0.0001, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.16, now + 0.005);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
      
        noise.connect(noiseGain);
        noiseGain.connect(audioContext.destination);
        noise.start(now);
        noise.stop(now + 0.07);
      
        // Low, quick thump underneath the noise.
        const osc = audioContext.createOscillator();
        const oscGain = audioContext.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.09);
      
        oscGain.gain.setValueAtTime(0.0001, now);
        oscGain.gain.exponentialRampToValueAtTime(0.22, now + 0.005);
        oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
      
        osc.connect(oscGain);
        oscGain.connect(audioContext.destination);
        osc.start(now);
        osc.stop(now + 0.11);
        return;
      }

      notes.forEach(([frequency, duration], i) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const at = now + i * (kind === "hit" ? .075 : .14);

        oscillator.type = kind === "failed" ? "triangle" : "sine";
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.0001, at);
        gain.gain.exponentialRampToValueAtTime(.12, at + .015);
        gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(at);
        oscillator.stop(at + duration + .02);
      });
    } catch (_) {}
  }

  function makeHole(index) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "hole";
    button.setAttribute("aria-label", "Mole hole " + (index + 1));
    button.innerHTML = `
    <svg viewBox="0 0 180 150" aria-hidden="true">
      <!-- Mound -->
      <ellipse cx="90" cy="112" rx="75" ry="28" fill="#542918"/>
      <ellipse cx="90" cy="106" rx="62" ry="19" fill="#281711"/>
    
      <!-- Mole -->
      <g class="mole">
        <!-- Filled head shape -->
        <path d="M51 105
          Q48 82 61 68
          Q72 55 90 57
          Q108 55 119 68
          Q132 82 129 105
          Q125 124 110 136
          Q100 143 90 143
          Q80 143 70 136
          Q55 124 51 105Z"
          fill="#9b5c37"/>
    
        <!-- Open head outline: leaves the chin unclosed -->
        <path d="M51 105
          Q48 82 61 68
          Q72 55 90 57
          Q108 55 119 68
          Q132 82 129 105"
          fill="none" stroke="#633719" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    
        <!-- Small ears -->
        <circle cx="62" cy="71" r="10"
          fill="#9b5c37" stroke="#633719" stroke-width="4"/>
        <circle cx="118" cy="71" r="10"
          fill="#9b5c37" stroke="#633719" stroke-width="4"/>
        <circle cx="62" cy="71" r="4.5" fill="#f2a5a1"/>
        <circle cx="118" cy="71" r="4.5" fill="#f2a5a1"/>
    
        <!-- Eyes -->
        <circle cx="75" cy="86" r="3.5" fill="#21150f"/>
        <circle cx="105" cy="86" r="3.5" fill="#21150f"/>
    
        <!-- Tapered muzzle -->
        <path d="M69 96
          Q78 91 90 91
          Q102 91 111 96
          L100 113
          Q95 120 90 124
          Q85 120 80 113Z"
          fill="#e4b27e"/>
    
        <!-- Pointed nose and mouth -->
        <path d="M83 96 Q90 91 97 96 L90 103Z" fill="#56301e"/>
        <path d="M90 103 L90 112 M90 112 L84 115 M90 112 L96 115"
          fill="none" stroke="#56301e" stroke-width="2.5"
          stroke-linecap="round"/>
    
        <!-- Front paws and digging claws -->
        <path d="M55 116 Q63 111 72 116 L68 125 Q61 128 54 123Z"
          fill="#9b5c37" stroke="#633719" stroke-width="2"/>
        <path d="M125 116 Q117 111 108 116 L112 125 Q119 128 126 123Z"
          fill="#9b5c37" stroke="#633719" stroke-width="2"/>
        <path d="M58 124 l-5 5 M64 126 l-2 6 M119 126 l2 6 M125 124 l5 5"
          fill="none" stroke="#e8d0ae" stroke-width="3"
          stroke-linecap="round"/>
      </g>
    
      <!-- Hit mark -->
      <text class="hit-mark" x="90" y="53" text-anchor="middle">✨</text>
    
      <!-- Grass -->
      <path d="M20 118 Q42 105 56 116 M124 116 Q140 104 160 118"
        fill="none" stroke="#83c84f" stroke-width="10"
        stroke-linecap="round"/>
    </svg>
    `;

    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      whack(button);
    });

    return button;
  }

  const holes = Array.from({ length: 10 }, (_, i) => {
    const hole = makeHole(i);
    $("holes").appendChild(hole);
    return hole;
  });

  function updateLabels() {
    document.documentElement.lang =
      lang === "zh" ? "zh-HK" : lang === "es" ? "es-ES" : "en-GB";

    $("game-title").textContent = t("title");
    $("overlay-game-title").textContent = t("title");
    $("tagline").textContent = t("tagline");
    $("score-label").textContent = t("score");
    $("stage-label").textContent = t("stage");
    $("time-label").textContent = t("time");
    $("best-label").textContent = t("best");
    $("menu-button").textContent = t("menu");
    $("mode-prompt").textContent = t("modePrompt");
    $("language-prompt").textContent = t("languagePrompt");
    $("mode-display").textContent = t("modes")[mode];
    $("target-label").textContent = t("targetLabel");
    $("best").textContent = bestScore();
    $("score").textContent = score;
    $("stage").textContent = stage;

    document.querySelectorAll("[data-mode]").forEach(button => {
      button.textContent = t(button.dataset.mode);
      button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
    });

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
    });

    const opening = panelState === "start";
    $("mode-group").hidden = !opening;
    $("language-group").hidden = !opening;

    let action = t("start");
    if (panelState === "stage") action = t("startStage");
    if (panelState === "complete") action = t("continue");
    if (panelState === "failed" || panelState === "final") action = t("restart");
    $("action-button").textContent = action;
  }

  function showPanel(state, title, body) {
    panelState = state;
    $("panel-title").textContent = title;
    $("panel-text").textContent = body;
    $("notice").textContent = "";
    updateLabels();
    $("overlay").hidden = false;
  }

  function showOpening() {
    showPanel("start", t("readyTitle"), t("readyText"));
  }

  function showStageIntro() {
    updateTargetDisplay(target);
    showPanel("stage", t("nextTitle", { n: stage }), t("targetLine", { target }));
  }

  function beginStage() {
    $("overlay").hidden = true;
    running = true;
    hits = 0;
    updateTargetDisplay(target);
    roundEnd = Date.now() + 15000;
    $("time").textContent = "15";
    $("notice").textContent = t("target", { target });
    roundTimer = setInterval(updateClock, 100);
    scheduleMole(350);
  }

  function updateTargetDisplay(remaining) {
    $("target-count").textContent = remaining;
  }
  
  function updateClock() {
    if (!running) return;

    const remaining = Math.max(0, Math.ceil((roundEnd - Date.now()) / 1000));
    $("time").textContent = remaining;
    if (remaining === 0) finishStage(false);
  }

  function scheduleMole(delay) {
    clearTimeout(moleTimer);
    if (running) moleTimer = setTimeout(popMole, Math.max(100, delay));
  }

  function popMole() {
    if (!running || Date.now() >= roundEnd) return;
  
    const c = config[mode];
    const delay = Math.max(
      c.min,
      c.delay - Math.min((stage - 1) * 75, c.delay - c.min)
    );
    const visible = Math.max(500, c.visible - (stage - 1) * 25);
  
    // Start adding two-mole bursts from stage 3, increasingly often.
    const burstChance = stage < 3 ? 0 : Math.min(0.7, 0.15 + (stage - 3) * 0.08);
    const spawnCount = Math.random() < burstChance ? 2 : 1;
  
    for (let i = 0; i < spawnCount; i++) {
      const choices = holes.filter(hole => !activeHoles.has(hole));
      if (!choices.length) break;
  
      const hole = choices[Math.floor(Math.random() * choices.length)];
      activeHoles.add(hole);
      hole.classList.remove("hit");
      hole.classList.add("up");
  
      const hideTimer = setTimeout(() => {
        hole.classList.remove("up");
        activeHoles.delete(hole);
        moleTimers.delete(hole);
      }, visible);
  
      moleTimers.set(hole, hideTimer);
    }
  
    scheduleMole(delay);
  }

  function whack(hole) {
    if (!running || !activeHoles.has(hole)) return;
    if (Date.now() - lastHit < 100) return;
    lastHit = Date.now();

    clearTimeout(moleTimers.get(hole));
    moleTimers.delete(hole);
    activeHoles.delete(hole);
    hole.classList.remove("up");
    hole.classList.add("hit");
    setTimeout(() => hole.classList.remove("hit"), 230);

    score++;
    hits++;
    sound("hit");
    updateTargetDisplay(Math.max(0, target - hits));
    $("score").textContent = score;

    if (score > bestScore()) {
      saveBest(score);
      $("best").textContent = score;
    }

    $("notice").textContent = t("target", {
      target: Math.max(0, target - hits)
    });

    if (hits >= target) finishStage(true);
    else scheduleMole(Math.max(120, config[mode].delay * .48));
  }

  function stopRound() {
    running = false;
    clearInterval(roundTimer);
    clearTimeout(moleTimer);

    moleTimers.forEach(timer => clearTimeout(timer));
    moleTimers.clear();
    activeHoles.clear();
    holes.forEach(hole => hole.classList.remove("up", "hit"));
  }

  function finishStage(success) {
    if (!running) return;
    stopRound();

    if (!success) {
      sound("failed");
      showPanel("failed", t("failedTitle"), t("failedText", {
        n: stage, hits, target, score
      }));
      return;
    }

    sound("complete");

    if (stage >= 10) {
      showPanel("final", t("finalTitle"), t("finalText", { score }));
    } else {
      const finishedStage = stage;
      stage++;
      target = config[mode].target + (stage - 1) * config[mode].growth;
      showPanel("complete", t("completeTitle", { n: finishedStage }),
        t("completeText", { score }));
    }
  }

  document.querySelectorAll("[data-mode]").forEach(button => {
    button.addEventListener("click", () => {
      mode = button.dataset.mode;
      updateLabels();
    });
  });

  document.querySelectorAll("[data-lang]").forEach(button => {
    button.addEventListener("click", () => {
      lang = button.dataset.lang;
      try {
        localStorage.setItem("wam-language", lang);
      } catch (_) {}

      updateLabels();

      if (panelState === "start") {
        $("panel-title").textContent = t("readyTitle");
        $("panel-text").textContent = t("readyText");
      } else {
        showOpening();
      }
    });
  });

  $("action-button").addEventListener("click", () => {
    if (panelState === "start") {
      score = 0;
      stage = 1;
      target = config[mode].target;
      updateLabels();
      showStageIntro();
    } else if (panelState === "stage") {
      sound("start");
      beginStage();
    } else if (panelState === "complete") {
      showStageIntro();
    } else if (panelState === "failed" || panelState === "final") {
      showOpening();
    }
  });

  $("menu-button").addEventListener("click", () => {
    stopRound();
    showOpening();
  });

  updateLabels();
  showOpening();
})();
</script>
</body>
</html>
