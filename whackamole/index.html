<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171027">
<title>Whack-a-Mole!</title>
<link rel="stylesheet" href="style.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Righteous&display=swap");

:root {
  color-scheme: dark;
  --cream: #fff3d2;
  --pink: #ff4e8a;
  --yellow: #ffd34e;
  --blue: #54d8ee;
  font-family: "Fredoka", system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 32px 16px 40px;
  color: var(--cream);
  background:
    radial-gradient(ellipse at 50% 0%, #433269 0, transparent 55%),
    repeating-linear-gradient(90deg, transparent 0 58px, #ffffff05 59px 60px),
    #171027;
}

button,
select {
  font: inherit;
}

.arcade {
  width: min(680px, 100%);
  margin-inline: auto;
  text-align: center;
}

.header {
  margin-bottom: 22px;
}

.eyebrow {
  margin: 0 0 5px;
  color: var(--yellow);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.2em;
}

h1 {
  margin: 0;
  color: var(--yellow);
  font-family: "Righteous", "Fredoka", sans-serif;
  font-size: clamp(2.5rem, 9vw, 4.6rem);
  line-height: 1;
  text-shadow: 0 4px 0 #a94c39, 0 8px 20px #0008;
}

.subtitle {
  margin: 10px 0 0;
  color: #e0d2fb;
}

.machine {
  position: relative;
  padding: 18px clamp(12px, 4vw, 28px) 20px;
  overflow: hidden;
  border: 4px solid #ffb34f;
  border-radius: 28px;
  background: linear-gradient(145deg, #f85b78, #c92770 50%, #862c83);
  box-shadow:
    inset 0 0 0 5px #ffffff25,
    0 12px 0 #531d59,
    0 22px 40px #0007;
}

.marquee {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 9px 8px 13px;
  color: white;
  font-family: "Righteous", sans-serif;
  font-size: clamp(1.3rem, 5vw, 2rem);
  letter-spacing: 0.06em;
  text-shadow: 0 3px 0 #982354;
}

.marquee-highlight,
.marquee-star {
  color: var(--yellow);
}

.marquee-star {
  font-size: 1.2em;
}

.scoreboard {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 8px;
  padding: 9px;
  border: 3px solid #4d3a70;
  border-radius: 15px;
  background: #17122a;
  box-shadow: inset 0 3px 9px #0008;
}

.stat {
  display: grid;
  gap: 1px;
  min-width: 0;
}

.stat-label {
  color: #b9acd2;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.stat-value {
  color: var(--yellow);
  font-family: "Righteous", sans-serif;
  font-size: clamp(1.3rem, 5vw, 1.8rem);
  line-height: 1.1;
}

.stat-high-score .stat-label,
.stat-high-score .stat-value {
  color: var(--pink);
}

.status {
  min-height: 1.5em;
  margin: 9px 0 12px;
  color: var(--cream);
  font-size: 0.95rem;
}

.playfield-frame {
  position: relative;
  width: 100%;
  max-width: 510px;
  margin: 0 auto 17px;
  transform: perspective(700px) rotateX(3deg);
}

.playfield {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(9px, 2.5vw, 18px);
  width: 100%;
  margin: 0;
  padding: clamp(14px, 3vw, 22px);
  border: 0;
  border-radius: 13px;
  background-color: #75432d;
  background-size: 112px 112px;
  box-shadow:
    inset 0 5px 0 #ffffff38,
    inset 0 -10px 0 #29170d80,
    0 7px 0 #54291f;
  clip-path: polygon(9% 0, 91% 0, 100% 100%, 0 100%);
}

.playfield-outline {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.playfield-outline polygon {
  fill: none;
  stroke: #f1bc78;
  stroke-width: 4px;
  vector-effect: non-scaling-stroke;
  stroke-linejoin: round;
}

.hole {
  position: relative;
  width: 70%;
  aspect-ratio: 1.3;
  justify-self: center;
  overflow: hidden;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: radial-gradient(
    ellipse,
    #050408 0 55%,
    #100b12 75%,
    #1b1118 100%
  );
  box-shadow: inset 0 5px 7px #0009, 0 3px 0 #351e18;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.hole:nth-child(-n + 3) {
  width: 64%;
}

.hole:nth-child(n + 4):nth-child(-n + 6) {
  width: 67%;
}

.hole:nth-child(n + 7) {
  width: 70%;
}

.hole:focus-visible,
.action-button:focus-visible,
select:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}

.mole {
  position: absolute;
  z-index: 1;
  bottom: -12%;
  left: 50%;
  display: grid;
  width: 75%;
  aspect-ratio: 1;
  place-items: center;
  border: 3px solid #7b3a28;
  border-radius: 48% 48% 42% 42%;
  background: linear-gradient(145deg, #d99a60, #a85b3e);
  box-shadow: inset -7px -7px 0 #713b37, inset 5px 5px 0 #ffcf84;
  font-size: clamp(2.2rem, 9vw, 3.7rem);
  line-height: 1;
  transform: translate(-50%, 115%);
  transition: transform 150ms ease-out;
  pointer-events: none;
}

.mole::before {
  content: "🐹";
}

.hole.is-up .mole {
  transform: translate(-50%, 4%);
}

.hole.is-hit .mole {
  transform: translate(-50%, 100%) scale(0.8);
  transition-duration: 100ms;
}

.controls {
  display: flex;
  justify-content: center;
}

.action-button {
  min-height: 48px;
  padding: 10px 25px;
  border: 0;
  border-bottom: 5px solid #c17816;
  border-radius: 999px;
  color: #492413;
  background: var(--yellow);
  box-shadow: 0 5px 15px #210d3266;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 100ms, filter 100ms;
  touch-action: manipulation;
}

.action-button:hover {
  filter: brightness(1.08);
}

.action-button:active {
  transform: translateY(3px);
  border-bottom-width: 2px;
}

.cabinet-lights {
  display: flex;
  justify-content: center;
  gap: 13px;
  margin-top: 18px;
}

.cabinet-lights i {
  width: 10px;
  height: 10px;
  border: 2px solid #fff9;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 10px var(--blue);
}

.cabinet-lights i:nth-child(odd) {
  background: var(--yellow);
  box-shadow: 0 0 10px var(--yellow);
}

.help {
  margin: 24px 0 16px;
  color: #cbbde5;
  font-size: 0.9rem;
}

.language-control {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: #e0d2fb;
  font-size: 0.9rem;
}

.language-control select {
  max-width: 100%;
  padding: 8px 30px 8px 11px;
  border: 1px solid #ffffff42;
  border-radius: 9px;
  color: white;
  background: #302344;
  cursor: pointer;
}

.language-control option {
  color: white;
  background: #211832;
}

.round-dialog {
  width: min(420px, calc(100% - 32px));
  padding: 28px 24px 24px;
  border: 3px solid var(--yellow);
  border-radius: 24px;
  color: var(--cream);
  background: linear-gradient(145deg, #34234f, #201832);
  box-shadow: 0 20px 80px #000b;
  text-align: center;
}

.round-dialog::backdrop {
  background: #10091dcc;
  backdrop-filter: blur(5px);
}

.dialog-stars {
  margin-bottom: 10px;
  color: var(--yellow);
  font-size: 1.35rem;
}

.round-dialog h2 {
  margin: 5px 0 8px;
  color: var(--yellow);
  font-family: "Righteous", sans-serif;
  font-size: clamp(1.8rem, 8vw, 2.5rem);
}

.dialog-copy {
  margin: 0 0 18px;
  color: #dfd4f0;
}

.objective {
  display: grid;
  gap: 5px;
  margin-bottom: 16px;
  padding: 14px;
  border: 1px solid #ffffff2b;
  border-radius: 14px;
  background: #100b2070;
}

.objective span {
  color: var(--blue);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.16em;
}

.objective strong {
  color: white;
  font-size: 1.1rem;
}

.relaxed-control {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  padding: 12px 13px;
  border: 1px solid #ffffff2b;
  border-radius: 14px;
  background: #100b2070;
  text-align: left;
  cursor: pointer;
}

/* Important: hide the switch even though .relaxed-control uses display: flex. */
.relaxed-control[hidden] {
  display: none !important;
}

.relaxed-copy {
  display: grid;
  gap: 3px;
}

.relaxed-copy strong {
  color: white;
  font-size: 0.98rem;
}

.relaxed-copy small {
  color: #cbbde5;
  font-size: 0.76rem;
  line-height: 1.3;
}

.relaxed-control input {
  position: absolute;
  right: 13px;
  width: 48px;
  height: 27px;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.switch-track {
  position: relative;
  flex: 0 0 48px;
  height: 27px;
  border: 2px solid #9385a9;
  border-radius: 999px;
  background: #554b65;
  transition: background 150ms, border-color 150ms;
  pointer-events: none;
}

.switch-track::after {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: white;
  content: "";
  transition: transform 150ms;
}

.relaxed-control input:checked + .switch-track {
  border-color: var(--blue);
  background: #20899a;
}

.relaxed-control input:checked + .switch-track::after {
  transform: translateX(21px);
}

.relaxed-control input:focus-visible + .switch-track {
  outline: 3px solid white;
  outline-offset: 3px;
}

.dialog-button {
  width: 100%;
}

@media (max-width: 520px) {
  .scoreboard {
    gap: 4px;
    padding: 8px 5px;
  }

  .stat-label {
    font-size: 0.55rem;
    letter-spacing: 0.06em;
  }

  .stat-value {
    font-size: clamp(1.1rem, 5vw, 1.5rem);
  }
}

@media (max-width: 420px) {
  body {
    padding: 24px 10px 32px;
  }

  .machine {
    padding-inline: 10px;
    border-radius: 22px;
  }

  .playfield {
    gap: 8px;
    padding: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<main class="arcade">
  <header class="header">
    <p class="eyebrow" id="eyebrow">THE MIDWAY ARCADE</p>
    <h1 id="gameTitle">Whack-a-Mole!</h1>
    <p class="subtitle" id="subtitle">Step right up and test your reflexes.</p>
  </header>

  <section class="machine" id="machine" aria-label="Whack-a-mole game">
    <div class="marquee" aria-hidden="true">
      <span class="marquee-star">★</span>
      <span id="marqueeMole">MOLE</span>
      <span class="marquee-highlight" id="marqueeMadness">MADNESS</span>
      <span class="marquee-star">★</span>
    </div>

    <div class="scoreboard" id="scoreboard">
      <div class="stat">
        <span class="stat-label" id="stageLabel">ROUND</span>
        <span class="stat-value" id="stage">1</span>
      </div>
      <div class="stat">
        <span class="stat-label" id="targetLabel">TARGET</span>
        <span class="stat-value" id="target">5</span>
      </div>
      <div class="stat">
        <span class="stat-label" id="scoreLabel">SCORE</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label" id="timeLabel">TIME</span>
        <span class="stat-value" id="time">30</span>
      </div>
      <div class="stat stat-high-score">
        <span class="stat-label" id="highScoreLabel">HIGH SCORE</span>
        <span class="stat-value" id="highScore">0</span>
      </div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="playfield-frame">
      <section class="playfield" id="playfield" aria-label="Mole holes">
        <button class="hole" type="button" aria-label="Hole 1">
          <span class="mole"></span>
        </button>
        <button class="hole" type="button" aria-label="Hole 2">
          <span class="mole"></span>
        </button>
        <button class="hole" type="button" aria-label="Hole 3">
          <span class="mole"></span>
        </button>
        <button class="hole" type="button" aria-label="Hole 4">
          <span class="mole"></span>
        </button>
        <button class="hole" type="button" aria-label="Hole 5">
          <span class="mole"></span>
        </button>
        <button class="hole" type="button" aria-label="Hole 6">
          <span class="mole"></span>
        </button>
        <button class="hole" type="button" aria-label="Hole 7">
          <span class="mole"></span>
        </button>
        <button class="hole" type="button" aria-label="Hole 8">
          <span class="mole"></span>
        </button>
        <button class="hole" type="button" aria-label="Hole 9">
          <span class="mole"></span>
        </button>
      </section>

      <svg
        class="playfield-outline"
        viewBox="0 0 100 100"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <polygon points="9,2 91,2 98,98 2,98"></polygon>
      </svg>
    </div>

    <div class="controls">
      <button class="action-button" id="restartButton" type="button">
        New game
      </button>
    </div>

    <div class="cabinet-lights" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
  </section>

  <p class="help" id="helpText"></p>

  <div class="language-control">
    <label for="languageSelect" id="languageLabel">Language</label>
    <select id="languageSelect">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="zh">中文</option>
    </select>
  </div>
</main>

<dialog class="round-dialog" id="roundDialog" aria-labelledby="dialogTitle">
  <div class="dialog-stars" aria-hidden="true">✦ &nbsp; ★ &nbsp; ✦</div>
  <p class="eyebrow" id="dialogEyebrow">READY, PLAYER?</p>
  <h2 id="dialogTitle">Step right up!</h2>
  <p class="dialog-copy" id="dialogCopy"></p>

  <div class="objective">
    <span id="objectiveLabel">YOUR OBJECTIVE</span>
    <strong id="dialogObjective"></strong>
  </div>

  <label class="relaxed-control" id="relaxedControl">
    <span class="relaxed-copy">
      <strong id="relaxedLabel">Relaxed Mode</strong>
      <small id="relaxedDescription">
        Slower moles and a slower countdown
      </small>
    </span>
    <input id="relaxedToggle" type="checkbox" role="switch">
    <span class="switch-track" aria-hidden="true"></span>
  </label>

  <button class="action-button dialog-button" id="confirmButton" type="button">
    Start game
  </button>
</dialog>
<script>
const translations = {
  en: {
    pageTitle: "Whack-a-Mole! — Funfair Challenge",
    langCode: "en-GB",
    arcade: "THE MIDWAY ARCADE",
    title: "Whack-a-Mole!",
    subtitle: "Step right up and test your reflexes.",
    mole: "MOLE",

    round: "RONDA",

  zh: {

    objectiveText: (target, time) => `${time} 秒內扑中 ${target} 次`,

    statusStart: (stage, target) =>

    remaining: (count, stage) =>
      `仲差 ${count} 次就過第 ${stage} 關。`,

    timesUp: "時間到！",

const LANGUAGE_KEY = "whack-a-mole-language";
const NORMAL_HIGH_SCORE_KEY = "whack-a-mole-high-score-normal";
const RELAXED_HIGH_SCORE_KEY = "whack-a-mole-high-score-relaxed";

const stageDisplay = document.querySelector("#stage");
const targetDisplay = document.querySelector("#target");
const scoreDisplay = document.querySelector("#score");
const timeDisplay = document.querySelector("#time");
const highScoreDisplay = document.querySelector("#highScore");
const statusDisplay = document.querySelector("#status");

const dialog = document.querySelector("#roundDialog");
const dialogEyebrow = document.querySelector("#dialogEyebrow");
const dialogTitle = document.querySelector("#dialogTitle");
const dialogCopy = document.querySelector("#dialogCopy");
const dialogObjective = document.querySelector("#dialogObjective");
const confirmButton = document.querySelector("#confirmButton");
const relaxedControl = document.querySelector("#relaxedControl");
const relaxedToggle = document.querySelector("#relaxedToggle");
const languageSelect = document.querySelector("#languageSelect");

const holes = [...document.querySelectorAll(".hole")];
const restartButton = document.querySelector("#restartButton");

let stage = 1;
let target = 5;
let score = 0;
let stageScore = 0;
let timeLeft = 30;
let running = false;
let relaxedMode = false;
let activeHole = null;
let moleTimer = null;
let countdownTimer = null;
let nextMoleTimer = null;
let language = getInitialLanguage();

// Add a subtle randomized texture to the playfield.
const board = document.querySelector(".playfield");
const canvas = document.createElement("canvas");
const size = 128;
const colors = [
  [117, 67, 45],
  [180, 119, 75],
  [137, 80, 52],
  [96, 53, 31],
];

canvas.width = size;
canvas.height = size;

const context = canvas.getContext("2d");
const image = context.createImageData(size, size);

for (let i = 0; i < image.data.length; i += 4) {
  const color = colors[Math.floor(Math.random() * colors.length)];
  image.data[i] = color[0];
  image.data[i + 1] = color[1];
  image.data[i + 2] = color[2];
  image.data[i + 3] = 255;
}

context.putImageData(image, 0, 0);
board.style.backgroundImage = `url(${canvas.toDataURL()})`;
board.style.backgroundSize = "100% 100%";

function normalizeLanguage(value) {
  if (!value) return null;

  const normalized = value.trim().toLowerCase();
  if (normalized === "en" || normalized.startsWith("en-")) return "en";
  if (normalized === "es" || normalized.startsWith("es-")) return "es";
  if (
    normalized === "zh" ||
    normalized.startsWith("zh-") ||
    normalized.startsWith("zh_")
  ) {
    return "zh";
  }

  return null;
}

function getInitialLanguage() {
  const params = new URLSearchParams(window.location.search);
  const urlLanguage = normalizeLanguage(params.get("lang"));

  if (urlLanguage) {
    localStorage.setItem(LANGUAGE_KEY, urlLanguage);
    return urlLanguage;
  }

  const savedLanguage = normalizeLanguage(localStorage.getItem(LANGUAGE_KEY));
  if (savedLanguage) return savedLanguage;

  const browserLanguages = navigator.languages?.length
    ? navigator.languages
    : [navigator.language || "en"];

  for (const browserLanguage of browserLanguages) {
    const detected = normalizeLanguage(browserLanguage);
    if (detected) return detected;
  }

  return "en";
}

function t(key, ...args) {
  const value = translations[language][key] ?? translations.en[key];
  return typeof value === "function" ? value(...args) : value;
}

function applyTranslations() {
  document.documentElement.lang = t("langCode");
  document.title = t("pageTitle");

  const textById = {
    eyebrow: "arcade",
    gameTitle: "title",
    subtitle: "subtitle",
    marqueeMole: "mole",
    marqueeMadness: "madness",
    stageLabel: "round",
    targetLabel: "target",
    scoreLabel: "score",
    timeLabel: "time",
    highScoreLabel: "highScore",
    languageLabel: "language",
    restartButton: "newGame",
    objectiveLabel: "objective",
    relaxedLabel: "relaxed",
    relaxedDescription: "relaxedDescription",
    helpText: "help",
  };

  for (const [id, key] of Object.entries(textById)) {
    document.getElementById(id).textContent = t(key);
  }

  document.querySelector("#machine").setAttribute("aria-label", t("gameLabel"));
  document.querySelector("#playfield").setAttribute("aria-label", t("holesLabel"));

  holes.forEach((hole, index) => {
    hole.setAttribute("aria-label", `${index + 1}`);
  });

  languageSelect.value = language;
  updateDisplay();

  if (dialog.open) {
    if (stage === 1 && score === 0 && timeLeft === 30) {
      showRoundDialog("first");
    } else if (!running && timeLeft <= 0) {
      showRoundDialog("gameOver");
    } else {
      showRoundDialog("next");
    }
  }
}

function setLanguage(nextLanguage) {
  if (!translations[nextLanguage]) return;
  language = nextLanguage;
  localStorage.setItem(LANGUAGE_KEY, language);
  applyTranslations();
}

function highScoreKey(mode = relaxedMode) {
  return mode ? RELAXED_HIGH_SCORE_KEY : NORMAL_HIGH_SCORE_KEY;
}

function readHighScore(mode = relaxedMode) {
  const saved = Number.parseInt(
    localStorage.getItem(highScoreKey(mode)),
    10
  );
  return Number.isFinite(saved) && saved > 0 ? saved : 0;
}

function updateDisplay() {
  stageDisplay.textContent = stage;
  targetDisplay.textContent = target;
  scoreDisplay.textContent = score;
  timeDisplay.textContent = timeLeft;
  highScoreDisplay.textContent = readHighScore();
}

function clearTimers() {
  clearTimeout(moleTimer);
  clearTimeout(nextMoleTimer);
  clearInterval(countdownTimer);
}

function hideMoles() {
  holes.forEach((hole) => hole.classList.remove("is-up", "is-hit"));
  activeHole = null;
}

function stageDuration() {
  return Math.max(12, 30 - (stage - 1) * 2);
}

function moleTimings() {
  const speed = relaxedMode ? 2 : 1;
  return {
    visible: Math.max(350, 1100 - (stage - 1) * 85) * speed,
    pause: Math.max(120, 650 - (stage - 1) * 45) * speed,
  };
}

function showRoundDialog(kind) {
  const initial = kind === "first";
  const gameOver = kind === "gameOver";

  dialogEyebrow.textContent = initial
    ? t("ready")
    : gameOver
      ? t("timesUp")
      : t("roundEyebrow", stage);

  dialogTitle.textContent = initial
    ? t("firstTitle")
    : gameOver
      ? t("tryAgain")
      : t("nextTitle");

  dialogCopy.textContent = initial
    ? t("firstCopy")
    : gameOver
      ? t("lostCopy", stageScore, target)
      : t("nextCopy");

  dialogObjective.textContent = t("objectiveText", target, timeLeft);
  confirmButton.textContent = gameOver
    ? t("playAgain")
    : initial
      ? t("start")
      : t("next");

  // Mode can only be selected before the first round or after a game ends.
  relaxedControl.hidden = !(initial || gameOver);
  if (initial || gameOver) {
    relaxedToggle.checked = relaxedMode;
  }

  if (!dialog.open) dialog.showModal();
}

function prepareStage() {
  running = false;
  clearTimers();
  hideMoles();

  target = 4 + stage;
  timeLeft = stageDuration();
  stageScore = 0;
  updateDisplay();

  showRoundDialog(stage === 1 ? "first" : "next");
}

function startStage() {
  // Read the mode only at the start of a game, not between stages.
  if (stage === 1) {
    relaxedMode = relaxedToggle.checked;
  }

  dialog.close();
  running = true;
  statusDisplay.textContent = t("statusStart", stage, target);
  updateDisplay();
  startCountdown();
  showRandomMole();
}

function startCountdown() {
  clearInterval(countdownTimer);

  // Relaxed Mode makes each countdown second take twice as long.
  const tickMilliseconds = relaxedMode ? 2000 : 1000;

  countdownTimer = setInterval(() => {
    timeLeft -= 1;
    updateDisplay();

    if (timeLeft <= 0) finishStage();
  }, tickMilliseconds);
}

function showRandomMole() {
  if (!running) return;

  hideMoles();

  const choices = holes.filter((hole) => hole !== activeHole);
  const hole = choices[Math.floor(Math.random() * choices.length)];
  const timings = moleTimings();

  activeHole = hole;
  hole.classList.add("is-up");

  moleTimer = setTimeout(() => {
    if (activeHole === hole) {
      hole.classList.remove("is-up");
      activeHole = null;
    }

    if (running) {
      nextMoleTimer = setTimeout(showRandomMole, timings.pause);
    }
  }, timings.visible);
}

function saveHighScoreIfNeeded() {
  const highScore = readHighScore(relaxedMode);

  if (score > highScore) {
    localStorage.setItem(highScoreKey(relaxedMode), String(score));
    return true;
  }

  return false;
}

function finishStage() {
  if (!running) return;

  running = false;
  clearTimers();
  hideMoles();

  if (stageScore >= target) {
    statusDisplay.textContent = t("cleared", stage);
    saveHighScoreIfNeeded();
    updateDisplay();

    stage += 1;
    nextMoleTimer = setTimeout(prepareStage, 700);
  } else {
    const brokeRecord = saveHighScoreIfNeeded();
    statusDisplay.textContent = brokeRecord ? t("newRecord") : t("timesUp");
    updateDisplay();

    showRoundDialog("gameOver");
  }
}

function whackMole(event) {
  if (!running) return;

  const hole = event.currentTarget;
  if (!hole.classList.contains("is-up")) return;

  hole.classList.remove("is-up");
  hole.classList.add("is-hit");
  activeHole = null;

  score += 1;
  stageScore += 1;
  updateDisplay();

  if ("vibrate" in navigator) navigator.vibrate(20);

  if (stageScore >= target) {
    finishStage();
    return;
  }

  statusDisplay.textContent = t("remaining", target - stageScore, stage);
  clearTimeout(moleTimer);
  clearTimeout(nextMoleTimer);

  nextMoleTimer = setTimeout(() => {
    if (running) showRandomMole();
  }, moleTimings().pause);
}

holes.forEach((hole) => {
  hole.addEventListener("pointerdown", whackMole);
});

confirmButton.addEventListener("click", () => {
  if (!running && timeLeft <= 0) {
    stage = 1;
    target = 5;
    score = 0;
    stageScore = 0;
    timeLeft = 30;
    updateDisplay();
  }

  startStage();
});

restartButton.addEventListener("click", () => {
  clearTimers();
  hideMoles();
  running = false;
  stage = 1;
  target = 5;
  score = 0;
  stageScore = 0;
  timeLeft = 30;
  statusDisplay.textContent = t("readyStatus");
  updateDisplay();
  prepareStage();
});

languageSelect.addEventListener("change", (event) => {
  setLanguage(event.target.value);
});

relaxedToggle.addEventListener("change", () => {
  // Keep the high-score display in sync with the mode selected for the next game.
  if (!running && relaxedControl.hidden === false) {
    highScoreDisplay.textContent = readHighScore(relaxedToggle.checked);
  }
});

applyTranslations();
statusDisplay.textContent = t("readyStatus");
prepareStage();
</script>
</body>
</html>
