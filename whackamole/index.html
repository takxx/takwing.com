<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171027">
  <title>Whack-a-Mole!</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="arcade">
    <header class="header">
      <p class="eyebrow" id="eyebrow">THE MIDWAY ARCADE</p>
      <h1 id="gameTitle">Whack-a-Mole!</h1>
      <p class="subtitle" id="subtitle">Step right up and test your reflexes.</p>
    </header>

    <section class="machine" id="machine" aria-label="Whack-a-mole game">
      <div class="marquee" aria-hidden="true">
        <span class="marquee-star">★</span>
        <span id="marqueeMole">MOLE</span>
        <span class="marquee-highlight" id="marqueeMadness">MADNESS</span>
        <span class="marquee-star">★</span>
      </div>

      <div class="scoreboard" id="scoreboard">
        <div class="stat">
          <span class="stat-label" id="stageLabel">ROUND</span>
          <span class="stat-value" id="stage">1</span>
        </div>
        <div class="stat">
          <span class="stat-label" id="targetLabel">TARGET</span>
          <span class="stat-value" id="target">5</span>
        </div>
        <div class="stat">
          <span class="stat-label" id="scoreLabel">SCORE</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label" id="timeLabel">TIME</span>
          <span class="stat-value" id="time">30</span>
        </div>
        <div class="stat stat-high-score">
          <span class="stat-label" id="highScoreLabel">HIGH SCORE</span>
          <span class="stat-value" id="highScore">0</span>
        </div>
      </div>

      <p class="status" id="status" aria-live="polite"></p>

      <div class="playfield-frame">
        <section class="playfield" id="playfield" aria-label="Mole holes">
          <button class="hole" type="button" aria-label="Hole 1">
            <span class="mole"></span>
          </button>
          <button class="hole" type="button" aria-label="Hole 2">
            <span class="mole"></span>
          </button>
          <button class="hole" type="button" aria-label="Hole 3">
            <span class="mole"></span>
          </button>
          <button class="hole" type="button" aria-label="Hole 4">
            <span class="mole"></span>
          </button>
          <button class="hole" type="button" aria-label="Hole 5">
            <span class="mole"></span>
          </button>
          <button class="hole" type="button" aria-label="Hole 6">
            <span class="mole"></span>
          </button>
          <button class="hole" type="button" aria-label="Hole 7">
            <span class="mole"></span>
          </button>
          <button class="hole" type="button" aria-label="Hole 8">
            <span class="mole"></span>
          </button>
          <button class="hole" type="button" aria-label="Hole 9">
            <span class="mole"></span>
          </button>
        </section>

        <svg
          class="playfield-outline"
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <polygon points="9,2 91,2 98,98 2,98"></polygon>
        </svg>
      </div>

      <div class="controls">
        <button class="action-button" id="restartButton" type="button">
          New game
        </button>
      </div>

      <div class="cabinet-lights" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </section>

    <p class="help" id="helpText"></p>

    <div class="language-control">
      <label for="languageSelect" id="languageLabel">Language</label>
      <select id="languageSelect">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
      </select>
    </div>
  </main>

  <dialog class="round-dialog" id="roundDialog" aria-labelledby="dialogTitle">
    <div class="dialog-stars" aria-hidden="true">✦ &nbsp; ★ &nbsp; ✦</div>
    <p class="eyebrow" id="dialogEyebrow">READY, PLAYER?</p>
    <h2 id="dialogTitle">Step right up!</h2>
    <p class="dialog-copy" id="dialogCopy"></p>

    <div class="objective">
      <span id="objectiveLabel">YOUR OBJECTIVE</span>
      <strong id="dialogObjective"></strong>
    </div>

    <label class="relaxed-control" id="relaxedControl">
      <span class="relaxed-copy">
        <strong id="relaxedLabel">Relaxed Mode</strong>
        <small id="relaxedDescription">
          Slower moles and a slower countdown
        </small>
      </span>
      <input id="relaxedToggle" type="checkbox" role="switch">
      <span class="switch-track" aria-hidden="true"></span>
    </label>

    <button class="action-button dialog-button" id="confirmButton" type="button">
      Start game
    </button>
  </dialog>
</body>
</html>
