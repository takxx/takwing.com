<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Summer Memories</title>
<style>
:root {
  color-scheme: dark;
  --bg-color: #0f172a;
  --card-bg: #1e293b;
  --text-color: #f8fafc;
  --muted-color: #94a3b8;
  --accent-color: #38bdf8;
  --success-color: #22c55e;
  --danger-color: #ef4444;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-color);
  color: var(--text-color);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  touch-action: manipulation;
}

.game-container {
  width: min(100%, 430px);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--card-bg);
  border-radius: 1rem;
  box-shadow: 0 10px 25px rgb(0 0 0 / 30%);
}

header {
  width: 100%;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

h1 {
  margin: 0;
  font-size: 1.25rem;
}

.language-select-wrapper,
.overlay-language {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  font-size: 0.85rem;
}

select {
  padding: 0.35rem 0.5rem;
  border: 1px solid #475569;
  border-radius: 0.35rem;
  background: #334155;
  color: white;
  cursor: pointer;
}

.status-panel {
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: 0.95rem;
  font-weight: 650;
}

.round-panel {
  margin-top: 0.45rem;
  color: var(--muted-color);
  font-size: 0.9rem;
}

#time.low-time {
  color: #f87171;
}

.board-svg {
  width: 100%;
  max-width: 340px;
  height: auto;
  margin: 0.5rem 0;
  overflow: visible;
  touch-action: manipulation;
}

.hex {
  fill: var(--hex-off);
  stroke: #0f172a;
  stroke-width: 3px;
  stroke-linejoin: round;
  transition: fill 100ms ease, filter 100ms ease, opacity 100ms ease;
}

.hex-0 {
  --hex-off: #334155;
}

.hex-1 {
  --hex-off: #244c99;
  --hex-on: #aaccff;
}

.hex-2 {
  --hex-off: #947006;
  --hex-on: #fff3a3;
}

.hex-3 {
  --hex-off: #167a3b;
  --hex-on: #a0ffc0;
}

.hex-4 {
  --hex-off: #693599;
  --hex-on: #e0b3ff;
}

.hex-5 {
  --hex-off: #942d60;
  --hex-on: #ffb3d9;
}

.hex-6 {
  --hex-off: #087587;
  --hex-on: #a0f5ff;
}

.hex.selectable {
  cursor: pointer;
}

.hex.selectable:hover {
  filter: brightness(1.25);
}

.hex.active {
  fill: var(--hex-on);
  filter: drop-shadow(0 0 5px var(--hex-on))
          drop-shadow(0 0 12px var(--hex-on));
}

.hex.wrong {
  fill: var(--danger-color) !important;
  filter: drop-shadow(0 0 8px var(--danger-color));
}

.hex.correct {
  fill: var(--success-color) !important;
  filter: drop-shadow(0 0 8px var(--success-color));
}

.hex.revealed-muted {
  fill: #475569 !important;
  opacity: 0.72;
  filter: none;
}

.hex-number,
#centerText {
  pointer-events: none;
  user-select: none;
  fill: white;
  font-family: inherit;
  font-weight: 750;
}

.hex-number {
  font-size: 19px;
}

#centerText {
  font-size: 27px;
}

#centerText.countdown {
  font-size: 42px;
  animation: countdown-pulse 900ms ease-in-out infinite alternate;
}

#message {
  min-height: 1.5rem;
  margin: 0.25rem 0 0.75rem;
  text-align: center;
  font-weight: 500;
}

button {
  width: 100%;
  padding: 0.75rem 1.25rem;
  border: 0;
  border-radius: 0.5rem;
  background: var(--accent-color);
  color: #0f172a;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  background: #0ea5e9;
}

button:active {
  transform: scale(0.98);
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 1rem;
  background: rgb(2 6 23 / 82%);
}

.overlay[hidden] {
  display: none;
}

.overlay-card {
  width: min(100%, 420px);
  padding: 1.5rem;
  border: 1px solid #334155;
  border-radius: 1rem;
  background: var(--card-bg);
  box-shadow: 0 15px 40px rgb(0 0 0 / 40%);
}

.overlay-card h2 {
  margin-top: 0;
}

.overlay-card p {
  line-height: 1.55;
}

.overlay-language {
  margin-top: 1rem;
}

@keyframes countdown-pulse {
  from { opacity: 0.65; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1.08); }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<main class="game-container">
  <header>
    <h1 id="gameTitle" data-i18n="title">Summer Memories</h1>

    <div class="language-select-wrapper">
      <label for="languageSelect" data-i18n="language">Language</label>
      <select id="languageSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh-Hant">中文</option>
      </select>
    </div>
  </header>

  <section class="status-panel" aria-label="Game statistics">
    <div><span data-i18n="score">Score</span>: <span id="score">0</span></div>
    <div><span data-i18n="time">Time</span>: <span id="time">60</span></div>
    <div><span data-i18n="highScore">Best</span>: <span id="highScore">0</span></div>
  </section>

  <div class="round-panel">
    <span data-i18n="roundLabel">Round</span>: <span id="round">1</span>
  </div>

  <svg id="board" class="board-svg" viewBox="0 0 300 300"
       role="application" aria-label="Number memory game board">
    <polygon class="hex hex-0" data-index="0"
      points="150,100 193.3,125 193.3,175 150,200 106.7,175 106.7,125"></polygon>
    <polygon class="hex hex-1" data-index="1"
      points="193.3,25 236.6,50 236.6,100 193.3,125 150,100 150,50"></polygon>
    <polygon class="hex hex-2" data-index="2"
      points="236.6,100 279.9,125 279.9,175 236.6,200 193.3,175 193.3,125"></polygon>
    <polygon class="hex hex-3" data-index="3"
      points="193.3,175 236.6,200 236.6,250 193.3,275 150,250 150,200"></polygon>
    <polygon class="hex hex-4" data-index="4"
      points="106.7,175 150,200 150,250 106.7,275 63.4,250 63.4,200"></polygon>
    <polygon class="hex hex-5" data-index="5"
      points="63.4,100 106.7,125 106.7,175 63.4,200 20.1,175 20.1,125"></polygon>
    <polygon class="hex hex-6" data-index="6"
      points="106.7,25 150,50 150,100 106.7,125 63.4,100 63.4,50"></polygon>

    <text id="centerText" x="150" y="155" text-anchor="middle"
          dominant-baseline="middle" aria-live="polite"></text>
    <text class="hex-number" data-number-index="1" x="193.3" y="78"
          text-anchor="middle" dominant-baseline="middle"></text>
    <text class="hex-number" data-number-index="2" x="236.6" y="150"
          text-anchor="middle" dominant-baseline="middle"></text>
    <text class="hex-number" data-number-index="3" x="193.3" y="225"
          text-anchor="middle" dominant-baseline="middle"></text>
    <text class="hex-number" data-number-index="4" x="106.7" y="225"
          text-anchor="middle" dominant-baseline="middle"></text>
    <text class="hex-number" data-number-index="5" x="63.4" y="150"
          text-anchor="middle" dominant-baseline="middle"></text>
    <text class="hex-number" data-number-index="6" x="106.7" y="78"
          text-anchor="middle" dominant-baseline="middle"></text>
  </svg>

  <div id="message" role="status" aria-live="polite">Memorise the numbers</div>
  <button id="startButton" data-i18n="newGame">New Game</button>
</main>

<div id="instructionOverlay" class="overlay" role="dialog"
     aria-modal="true" aria-labelledby="overlayTitle">
  <div class="overlay-card">
    <h2 id="overlayTitle" data-i18n="title">Summer Memories</h2>
    <ul id="instructionList">
      <li data-i18n="instruction1">Memorise the six outer numbers in 10 seconds.</li>
      <li data-i18n="instruction2">Select numbers that add up to the centre number.</li>
<!--    <li data-i18n="instruction3"></li>
      <li data-i18n="instruction4"></li>-->
    </ul>
    <button id="overlayStart" data-i18n="start">Start Game</button>

    <div class="overlay-language">
      <label for="overlayLanguageSelect" data-i18n="language">Language</label>
      <select id="overlayLanguageSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh-Hant">中文</option>
      </select>
    </div>
  </div>
</div>

<script>
"use strict";

const translations = {
  en: {
    title: "Summer Memories",
    language: "Language",
    score: "Score",
    time: "Time",
    highScore: "Best",
    roundLabel: "Round",
    newGame: "New Game",
    start: "Start Game",
    instruction1: "Memorise the six outer numbers in 10 seconds.",
    instruction2: "Select numbers that add up to the centre number.",
    instruction3: "",
    instruction4: "",
    memorise: "Memorise the numbers",
    findSum: "Make the centre sum",
    correct: "Correct!",
    incorrect: "Too large! Try again.",
    timeUp: "Time's up!",
    finalScore: "Game over — score: {score}",
    ready: "Ready?"
  },
  es: {
    title: "Suma y sigue",
    language: "Idioma",
    score: "Puntuación",
    time: "Tiempo",
    highScore: "Récord",
    roundLabel: "Ronda",
    newGame: "Nueva partida",
    start: "Empezar",
    instruction1: "Memoriza los seis números exteriores en 10 segundos.",
    instruction2: "Selecciona los números cuya suma dé el número central.",
    instruction3: "",
    instruction4: "",
    memorise: "Memoriza los números",
    findSum: "Haz la suma central",
    correct: "¡Correcto!",
    incorrect: "¡Demasiado alto! Inténtalo de nuevo.",
    timeUp: "¡Se acabó el tiempo!",
    finalScore: "Fin de la partida — puntuación: {score}",
    ready: "¿Preparado?"
  },
  "zh-Hant": {
    title: "心中有數",
    language: "語言",
    score: "分數",
    time: "時間",
    highScore: "最高分",
    roundLabel: "回合",
    newGame: "新遊戲",
    start: "開始遊戲",
    instruction1: "用 10 秒記住外圍嘅六個數字。",
    instruction2: "揀出加埋等於中心數字嘅數字。",
    instruction3: "",
    instruction4: "",
    memorise: "記住啲數字",
    findSum: "砌出中心總和",
    correct: "答啱！",
    incorrect: "太大喇！再試一次。",
    timeUp: "夠鐘！",
    finalScore: "遊戲結束 — 分數：{score}",
    ready: "準備好未？"
  }
};

const languageSelect = document.getElementById("languageSelect");
const overlayLanguageSelect = document.getElementById("overlayLanguageSelect");
const overlay = document.getElementById("instructionOverlay");
const overlayStart = document.getElementById("overlayStart");
const startButton = document.getElementById("startButton");
const board = document.getElementById("board");
const centerText = document.getElementById("centerText");
const message = document.getElementById("message");
const scoreDisplay = document.getElementById("score");
const timeDisplay = document.getElementById("time");
const highScoreDisplay = document.getElementById("highScore");
const roundDisplay = document.getElementById("round");
const title = document.getElementById("gameTitle");

const outerHexes = [...board.querySelectorAll(".hex")].filter(
  hex => Number(hex.dataset.index) !== 0
);
const numberLabels = [...board.querySelectorAll(".hex-number")];

let language = "en";
let numbers = [];
let target = 0;
let selected = new Set();
let score = 0;
let secondsLeft = 60;
let round = 1;
let gameActive = false;
let memorising = false;
let timerInterval = null;
let countdownInterval = null;
let feedbackTimeout = null;
let audioContext = null;

function normaliseLanguage(value) {
  if (!value) return null;
  const code = value.toLowerCase();

  if (code === "en" || code.startsWith("en-")) return "en";
  if (code === "es" || code.startsWith("es-")) return "es";
  if (code === "zh" || code.startsWith("zh-")) return "zh-Hant";

  return null;
}

function chooseInitialLanguage() {
  const queryLanguage = normaliseLanguage(
    new URLSearchParams(window.location.search).get("lang")
  );
  if (queryLanguage) return queryLanguage;

  try {
    const storedLanguage = normaliseLanguage(localStorage.getItem("summer-memories-language"));
    if (storedLanguage) return storedLanguage;
  } catch {
    // Storage may be unavailable; continue with browser preferences.
  }

  for (const preference of navigator.languages || [navigator.language]) {
    const browserLanguage = normaliseLanguage(preference);
    if (browserLanguage) return browserLanguage;
  }

  return "en";
}

function text(key) {
  return translations[language][key];
}

function applyLanguage() {
  document.documentElement.lang = language === "zh-Hant" ? "zh-Hant" : language;
  document.title = text("title");
  title.textContent = text("title");

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;
    if (translations[language][key]) {
      element.textContent = translations[language][key];
    }
  });

  languageSelect.value = language;
  overlayLanguageSelect.value = language;
  updateMessage();
}

function setLanguage(value, updateQuery = true) {
  language = normaliseLanguage(value) || "en";
  try {
    localStorage.setItem("summer-memories-language", language);
  } catch {
    // Language still works for this page if storage is unavailable.
  }

  if (updateQuery) {
    const url = new URL(window.location.href);
    url.searchParams.set("lang", language === "zh-Hant" ? "zh" : language);
    window.history.replaceState({}, "", url);
  }

  applyLanguage();
}

function updateMessage() {
  if (!gameActive && !memorising && secondsLeft === 0) {
    message.textContent = text("finalScore").replace("{score}", score);
  } else if (memorising) {
    message.textContent = text("memorise");
  } else if (gameActive) {
    message.textContent = text("findSum");
  } else {
    message.textContent = text("ready");
  }
}

function updateDisplays() {
  scoreDisplay.textContent = String(score);
  timeDisplay.textContent = String(secondsLeft);
  roundDisplay.textContent = String(round);
  timeDisplay.classList.toggle("low-time", secondsLeft <= 10);
}

function getHighScore() {
  try {
    return Number(localStorage.getItem("summer-memories-high-score")) || 0;
  } catch {
    return 0;
  }
}

function setHighScore(value) {
  try {
    localStorage.setItem("summer-memories-high-score", String(value));
  } catch {
    // The current game remains playable without persistent storage.
  }
}

function updateHighScore() {
  highScoreDisplay.textContent = String(getHighScore());
}

function playTone(type) {
  try {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === "suspended") audioContext.resume();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.type = "sine";
    oscillator.frequency.value = type === "correct" ? 660 : 180;
    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, audioContext.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.22);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.23);
  } catch {
    // Audio is optional; the visual feedback still works.
  }
}

function setHexNumber(index, value) {
  const label = numberLabels.find(
    item => Number(item.dataset.numberIndex) === index
  );
  if (label) label.textContent = value == null ? "" : String(value);
}

function displayNumbers(show) {
  numbers.forEach((number, position) => {
    setHexNumber(position + 1, show ? number : "");
  });
}

function makePuzzle() {
  const pool = [3, 4, 5, 6, 7, 8, 9];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  numbers = pool.slice(0, 6);
  selected.clear();
  clearHexStates();
  chooseTarget();
}

function chooseTarget() {
  const possibleTargets = new Set();
  const requiredCount = round <= 3 ? 2 : null;

  for (let mask = 0; mask < (1 << numbers.length); mask++) {
    const count = mask.toString(2).replace(/0/g, "").length;

    if (requiredCount !== null && count !== requiredCount) continue;
    if (requiredCount === null && (count < 2 || count > 4)) continue;

    let sum = 0;
    for (let i = 0; i < numbers.length; i++) {
      if (mask & (1 << i)) sum += numbers[i];
    }

    if (sum >= 10) possibleTargets.add(sum);
  }

  const alternatives = [...possibleTargets].filter(value => value !== target);
  const choices = alternatives.length ? alternatives : [...possibleTargets];

  target = choices[Math.floor(Math.random() * choices.length)];
  centerText.textContent = String(target);
}

function clearHexStates() {
  board.querySelectorAll(".hex").forEach(hex => {
    hex.classList.remove("active", "wrong", "correct", "revealed-muted", "selectable");
  });
}

function startGame() {
  clearInterval(timerInterval);
  clearInterval(countdownInterval);
  clearTimeout(feedbackTimeout);

  score = 0;
  secondsLeft = 60;
  round = 1;
  gameActive = false;
  memorising = true;
  selected.clear();
  updateDisplays();
  makePuzzle();
  displayNumbers(true);

  overlay.hidden = true;
  startButton.disabled = true;
  centerText.classList.add("countdown");

  let countdown = 10;
  centerText.textContent = String(countdown);
  message.textContent = text("memorise");

  countdownInterval = setInterval(() => {
    countdown -= 1;

    if (countdown <= 0) {
      clearInterval(countdownInterval);
      memorising = false;
      gameActive = true;
      displayNumbers(false);
      centerText.classList.remove("countdown");
      centerText.textContent = String(target);
      outerHexes.forEach(hex => hex.classList.add("selectable"));
      startButton.disabled = false;
      updateMessage();
      timerInterval = setInterval(tick, 1000);
    } else {
      centerText.textContent = String(countdown);
    }
  }, 1000);
}

function tick() {
  if (!gameActive) return;
  secondsLeft -= 1;
  if (secondsLeft <= 0) {
    secondsLeft = 0;
    endGame();
  }
  updateDisplays();
}

function handleSelection(hex) {
  if (!gameActive) return;

  const index = Number(hex.dataset.index) - 1;
  if (index < 0 || index >= numbers.length || selected.has(index)) return;

  selected.add(index);
  setHexNumber(index + 1, numbers[index]);
  hex.classList.add("active");

  const sum = [...selected].reduce((total, item) => total + numbers[item], 0);

  if (sum === target) {
    gameActive = false;
    score += target;
    secondsLeft = Math.min(99, secondsLeft + 3);
    round += 1;
    if (score > getHighScore()) setHighScore(score);
    updateHighScore();
    updateDisplays();

    const centerHex = board.querySelector('[data-index="0"]');
    centerHex.classList.add("correct");
    centerText.textContent = String(target);
    message.textContent = text("correct");
    playTone("correct");

    feedbackTimeout = setTimeout(() => {
      if (secondsLeft <= 0) {
        endGame();
        return;
      }
    
      // Keep the ring numbers; generate a new target from those same numbers.
      selected.clear();
      clearHexStates();
      displayNumbers(false);
      chooseTarget();
      outerHexes.forEach(hex => hex.classList.add("selectable"));
    
      gameActive = true;
      updateDisplays();
      updateMessage();
    }, 500);
  } else if (sum > target) {
    secondsLeft = Math.max(0, secondsLeft - 1);
    updateDisplays();

    const centerHex = board.querySelector('[data-index="0"]');
    centerHex.classList.add("wrong");
    message.textContent = text("incorrect");
    playTone("wrong");

    feedbackTimeout = setTimeout(() => {
      centerHex.classList.remove("wrong");
      selected.clear();
      outerHexes.forEach((outerHex, position) => {
        outerHex.classList.remove("active");
        setHexNumber(position + 1, "");
      });

      if (secondsLeft <= 0) {
        endGame();
      } else {
        updateMessage();
      }
    }, 550);
  }
}

function endGame() {
  clearInterval(timerInterval);
  clearInterval(countdownInterval);
  clearTimeout(feedbackTimeout);

  gameActive = false;
  memorising = false;
  startButton.disabled = false;
  displayNumbers(true);

  outerHexes.forEach(hex => {
    hex.classList.remove("selectable", "active");
    hex.classList.add("revealed-muted");
  });

  centerText.classList.remove("countdown");
  centerText.textContent = String(target);
  updateMessage();
  updateDisplays();

  if (score > getHighScore()) {
    setHighScore(score);
    updateHighScore();
  }
}

language = chooseInitialLanguage();
applyLanguage();
updateHighScore();
updateDisplays();
overlay.hidden = false;

languageSelect.addEventListener("change", event => {
  setLanguage(event.target.value);
});

overlayLanguageSelect.addEventListener("change", event => {
  setLanguage(event.target.value);
});

overlayStart.addEventListener("click", startGame);
startButton.addEventListener("click", startGame);

board.addEventListener("click", event => {
  const hex = event.target.closest(".hex");
  if (hex && Number(hex.dataset.index) !== 0) {
    handleSelection(hex);
  }
});
</script>
</body>
</html>
