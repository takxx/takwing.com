<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Tangram Workshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="info">
    <h1>🧩 Tangram Workshop</h1>
    <p>
      Drag pieces to build anything.<br>
      Right-click or tap to rotate.<br>
      Double-click or double-tap to flip.
    </p>
  </header>

  <svg
    id="workspace"
    viewBox="0 0 1000 1000"
    preserveAspectRatio="xMidYMid meet"
  ></svg>

  <script src="script.js"></script>
</body>
</html>
