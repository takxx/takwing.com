<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>js-dos file player</title>

  <!-- js-dos 7.5 stylesheet -->
  <link
    rel="stylesheet"
    href="../util/js-dos/v7.5.0/js-dos.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      color: #222;
      background: #f3f3f3;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
    }

    .controls {
      display: grid;
      gap: 12px;
      padding: 16px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    label {
      display: grid;
      gap: 5px;
      font-weight: 600;
    }

    input[type="file"] {
      font-weight: normal;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      padding: 9px 14px;
      cursor: pointer;
      border: 1px solid #888;
      border-radius: 5px;
      background: #eee;
      font: inherit;
    }

    button:hover:not(:disabled) {
      background: #ddd;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #status {
      min-height: 1.5em;
      margin: 14px 0;
      color: #444;
    }

    #jsdos {
      width: 100%;
      height: 650px;
      min-height: 400px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .help {
      margin-top: 14px;
      color: #555;
      font-size: 0.92rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>js-dos file player</h1>

    <section class="controls">
      <label>
        Base game or program (.jsdos)
        <input
          id="bundleFile"
          type="file"
          accept=".jsdos,application/zip"
        >
      </label>

      <label>
        Optional changes file
        <input
          id="changesFile"
          type="file"
          accept=".changes,.jsdos,application/zip"
        >
      </label>

      <div class="buttons">
        <button id="playButton" type="button">
          Play
        </button>

        <button id="saveButton" type="button" disabled>
          Save current changes
        </button>

        <button id="downloadButton" type="button" disabled>
          Download changes
        </button>

        <button id="stopButton" type="button" disabled>
          Stop
        </button>
      </div>
    </section>

    <p id="status" role="status">
      Select a .jsdos file to begin.
    </p>

    <div id="jsdos"></div>

    <p class="help">
      Save files inside the DOS program before downloading the changes file.
      The downloaded changes file can be uploaded again later with the same
      base .jsdos file.
    </p>
  </main>

  <!-- Your js-dos 7.5 JavaScript file -->
  <script src="../util/js-dos/v7.5.0/js-dos.js"></script>

  <script>
    "use strict";

    const bundleInput = document.getElementById("bundleFile");
    const changesInput = document.getElementById("changesFile");

    const playButton = document.getElementById("playButton");
    const saveButton = document.getElementById("saveButton");
    const downloadButton = document.getElementById("downloadButton");
    const stopButton = document.getElementById("stopButton");

    const statusElement = document.getElementById("status");
    const playerElement = document.getElementById("jsdos");

    let player = null;
    let bundleObjectUrl = null;

    let uploadedChanges = null;
    let changesKey = null;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function setRunningState(isRunning) {
      saveButton.disabled = !isRunning;
      stopButton.disabled = !isRunning;
      downloadButton.disabled = !isRunning && !uploadedChanges;
    }

    function revokeBundleUrl() {
      if (bundleObjectUrl !== null) {
        URL.revokeObjectURL(bundleObjectUrl);
        bundleObjectUrl = null;
      }
    }

    async function stopPlayer() {
      if (player !== null) {
        try {
          await player.stop();
        } catch (error) {
          console.warn("Error while stopping js-dos:", error);
        }

        player = null;
      }

      playerElement.innerHTML = "";
      setRunningState(false);
    }

    changesInput.addEventListener("change", async () => {
      const file = changesInput.files[0];

      if (!file) {
        uploadedChanges = null;
        setStatus("No changes file selected.");
        return;
      }

      try {
        uploadedChanges = new Uint8Array(
          await file.arrayBuffer()
        );

        setStatus(
          `Loaded changes file: ${file.name} ` +
          `(${uploadedChanges.byteLength} bytes).`
        );

        downloadButton.disabled = false;
      } catch (error) {
        uploadedChanges = null;
        console.error(error);
        setStatus("Could not read the changes file.");
      }
    });

    playButton.addEventListener("click", async () => {
      const bundleFile = bundleInput.files[0];

      if (!bundleFile) {
        alert("Please select a .jsdos file first.");
        return;
      }

      if (!bundleFile.name.toLowerCase().endsWith(".jsdos")) {
        alert("The base file should have a .jsdos extension.");
        return;
      }

      await stopPlayer();
      revokeBundleUrl();

      /*
       * This key identifies the changes belonging to this uploaded bundle.
       * It is deliberately unique for this browser session.
       */
      changesKey =
        "uploaded-changes-" +
        Date.now() +
        "-" +
        Math.random().toString(36).slice(2) +
        ".changes";

      bundleObjectUrl = URL.createObjectURL(bundleFile);

      setStatus("Starting js-dos...");

      try {
        /*
         * This is the current js-dos player API.
         *
         * If your exact 7.5.0 build exposes only:
         *
         *     Dos(element).run(url)
         *
         * and rejects the options object, see the compatibility note below.
         */
        player = Dos(playerElement, {
          url: bundleObjectUrl,

          /*
           * Disable automatic local persistence. We explicitly load and
           * download the changes file ourselves.
           */
          fsChanges: {
            local: false,

            /*
             * Called when js-dos wants to load previous changes.
             */
            pull: async (key) => {
              if (key === changesKey && uploadedChanges) {
                return uploadedChanges;
              }

              return null;
            },

            /*
             * Called when js-dos writes updated filesystem changes.
             */
            push: async (key, data) => {
              if (key === changesKey) {
                uploadedChanges = new Uint8Array(data);
                downloadButton.disabled = false;

                setStatus(
                  "Changes updated. You can download them now."
                );
              }
            },

            /*
             * Called if js-dos deletes its changes data.
             */
            delete: async (key) => {
              if (key === changesKey) {
                uploadedChanges = null;
                downloadButton.disabled = true;
              }
            },

            /*
             * Converts the bundle URL to the changes-storage key.
             */
            urlToKey: async () => changesKey
          },

          autoStart: true,

          /*
           * Set this if your emulators files are not found automatically.
           * Adjust it to the directory containing the js-dos emulator assets.
           *
           * pathPrefix: "../util/js-dos/v7.5.0/"
           */
        });

        setRunningState(true);
        setStatus("js-dos is running.");
      } catch (error) {
        console.error(error);
        player = null;
        setRunningState(false);
        setStatus("Could not start js-dos: " + error.message);
        alert(
          "Could not start js-dos. Open the browser console for details."
        );
      }
    });

    saveButton.addEventListener("click", async () => {
      if (!player) {
        return;
      }

      try {
        setStatus("Saving changes...");

        const saved = await player.save();

        /*
         * getLocalChanges() returns the latest changes bundle.
         */
        const latestChanges =
          await player.getLocalChanges(changesKey);

        if (latestChanges) {
          uploadedChanges = new Uint8Array(latestChanges);
          downloadButton.disabled = false;

          setStatus(
            saved === false
              ? "No changes were saved."
              : "Changes saved."
          );
        } else {
          setStatus("There are no changes to save yet.");
        }
      } catch (error) {
        console.error(error);
        setStatus("Could not save changes: " + error.message);
      }
    });

    downloadButton.addEventListener("click", async () => {
      if (!player && !uploadedChanges) {
        alert("There are no changes to download.");
        return;
      }

      try {
        /*
         * Ask js-dos to flush the current filesystem state first.
         */
        if (player) {
          await player.save();

          const latestChanges =
            await player.getLocalChanges(changesKey);

          if (latestChanges) {
            uploadedChanges = new Uint8Array(latestChanges);
          }
        }

        if (!uploadedChanges || uploadedChanges.byteLength === 0) {
          alert(
            "No changes are available yet. Save something inside the DOS program first."
          );
          return;
        }

        const blob = new Blob(
          [uploadedChanges],
          { type: "application/octet-stream" }
        );

        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = downloadUrl;
        link.download = "updated.changes";

        /*
         * The click must occur from the user's button action so that
         * browsers allow the download.
         */
        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(downloadUrl);

        setStatus("Changes downloaded.");
      } catch (error) {
        console.error(error);
        setStatus("Could not download changes: " + error.message);
      }
    });

    stopButton.addEventListener("click", async () => {
      await stopPlayer();
      setStatus("Player stopped.");
    });

    window.addEventListener("beforeunload", () => {
      revokeBundleUrl();
    });
  </script>
</body>
</html>
