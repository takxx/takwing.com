<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Palabeja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="hive-game">
    <header class="game-header">
      <h1 class="game-title">Palabeja</h1>

      <div class="top-controls" aria-label="Controles del juego">
        <button
          id="muteButton"
          type="button"
          aria-pressed="false"
          aria-label="Activar o desactivar sonido"
          title="Activar o desactivar sonido"
        >🔊</button>

        <a
          id="langButton"
          class="language-link"
          href="/buzzword"
          lang="en"
          hreflang="en"
          aria-label="Switch to the English version"
          title="English version"
        >🇬🇧</a>
      </div>

      <div class="status-bar">
        <div class="status-item">
          <span class="status-label">TIEMPO</span>
          <strong id="timerDisplay" class="status-value">80</strong>
        </div>

        <div class="status-item">
          <span class="status-label">PUNTOS</span>
          <strong id="scoreDisplay" class="status-value">0</strong>
        </div>

        <div class="status-item">
          <span class="status-label">RÉCORD</span>
          <strong id="highScoreDisplay" class="status-value">0</strong>
        </div>
      </div>

      <p id="message" class="game-message" aria-live="polite"></p>
    </header>

    <section class="board-section">
      <div id="board" class="hex-board" aria-label="Tablero de Palabeja"></div>

      <div id="currentWord" class="current-word" aria-live="polite"></div>

      <div id="feedback" class="feedback" aria-hidden="true"></div>

      <div
        id="roundOverlay"
        class="round-overlay"
        role="dialog"
        aria-modal="true"
        hidden
      >
        <div class="round-overlay-content">
          <h2 id="roundOverlayTitle" class="round-overlay-title"></h2>
          <p id="roundOverlayMessage" class="round-overlay-message"></p>
          <button
            id="roundOverlayButton"
            class="round-overlay-button"
            type="button"
          ></button>
        </div>
      </div>

      <div
        id="startOverlay"
        class="round-overlay"
        role="dialog"
        aria-modal="true"
      >
        <div class="round-overlay-content">
          <h2 class="round-overlay-title">Cómo jugar</h2>
          <ol class="start-instructions">
            <li>Forma una palabra deslizando el dedo por las letras.</li>
            <li>Cada letra solo puede usarse una vez por palabra.</li>
            <li>Encuentra una palabra de 7 letras para avanzar.</li>
          </ol>
          <button
            id="startButton"
            class="round-overlay-button"
            type="button"
          >Empezar</button>
        </div>
      </div>
    </section>

    <section class="word-bank">
      <h2 class="section-title">Palabras encontradas</h2>
      <div id="hintList" class="hint-list"></div>
    </section>
  </main>

  <script src="script.js" type="module"></script>
</body>
</html>
