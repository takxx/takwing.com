<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SFCave — Palm Grayscale</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #111;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game"></canvas>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const GAME_W = 160;
  const GAME_H = 240;

  const COLORS = {
    black: "#000000",
    darkGray: "#404040",
    gray: "#808080",
    lightGray: "#c0c0c0",
    white: "#ffffff"
  };

  const TRANSLATIONS = {
    en: {
      htmlLang: "en",
      title: "SFCave — Palm Grayscale",
      score: "SCORE",
      best: "BEST",
      gameTitle: "S F C A V E",
      holdToRise: "HOLD TO RISE",
      releaseToFall: "RELEASE TO FALL",
      controls: "SPACE / CLICK / TOUCH",
      gameOver: "GAME OVER",
      holdToRetry: "HOLD TO RETRY"
    },
    es: {
      htmlLang: "es-ES",
      title: "SFCave — Escala de grises Palm",
      score: "PUNTOS",
      best: "RÉCORD",
      gameTitle: "S F C A V E",
      holdToRise: "MANTÉN PULSADO PARA SUBIR",
      releaseToFall: "SUELTA PARA CAER",
      controls: "ESPACIO / CLIC / TOQUE",
      gameOver: "FIN DE LA PARTIDA",
      holdToRetry: "MANTÉN PULSADO PARA REINTENTAR"
    },
    zh: {
      htmlLang: "zh-Hant",
      title: "SFCave — Palm 灰階版",
      score: "分數",
      best: "最佳",
      gameTitle: "S F C A V E",
      holdToRise: "撳住上升",
      releaseToFall: "放開下降",
      controls: "空白鍵 / 撳一下 / 輕觸",
      gameOver: "遊戲結束",
      holdToRetry: "撳住再嚟一次"
    }
  };

  function detectLanguage() {
    const requested = new URLSearchParams(window.location.search).get("lang");

    if (requested && Object.hasOwn(TRANSLATIONS, requested.toLowerCase())) {
      return requested.toLowerCase();
    }

    const preferences = [
      ...(navigator.languages || []),
      navigator.language
    ].filter(Boolean);

    for (const preference of preferences) {
      const code = preference.toLowerCase();

      if (code.startsWith("es")) return "es";
      if (code.startsWith("zh")) return "zh";
      if (code.startsWith("en")) return "en";
    }

    return "en";
  }

  const languageCode = detectLanguage();
  const t = TRANSLATIONS[languageCode];

  document.documentElement.lang = t.htmlLang;
  document.title = t.title;

  let running = false;
  let gameOver = false;
  let score = 0;
  let best = Number(localStorage.getItem("sfcave_gray_best") || 0);

  // Faster starting pace and a more noticeable difficulty ramp.
  const scrollSpeedStart = 0.72;
  const scrollSpeedMax = 1.55;
  let scrollSpeed = scrollSpeedStart;

  const ribbon = {
    x: 34,
    y: GAME_H / 2,
    vy: 0,
    radius: 1,
    trail: []
  };

  const step = 2;
  const ceiling = [];
  const floor = [];

  let caveOffset = 0;

  let caveCenter = GAME_H / 2;
  let caveGap = 74;
  let targetCenter = GAME_H / 2;
  let targetGap = 74;

  let frame = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const viewportW = window.innerWidth;
    const viewportH = window.innerHeight;

    const scale = Math.min(viewportW / GAME_W, viewportH / GAME_H);
    const cssWidth = Math.floor(GAME_W * scale);
    const cssHeight = Math.floor(GAME_H * scale);

    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";

    canvas.width = Math.max(1, Math.floor(cssWidth * dpr));
    canvas.height = Math.max(1, Math.floor(cssHeight * dpr));

    ctx.imageSmoothingEnabled = false;
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  function resetGame() {
    running = false;
    gameOver = false;
    score = 0;
    scrollSpeed = scrollSpeedStart;
    frame = 0;
    caveOffset = 0;

    ribbon.x = 34;
    ribbon.y = GAME_H / 2;
    ribbon.vy = 0;
    ribbon.trail = [];

    ceiling.length = 0;
    floor.length = 0;

    caveCenter = GAME_H / 2;
    caveGap = 74;
    targetCenter = GAME_H / 2;
    targetGap = 74;

    const columns = Math.ceil(GAME_W / step) + 3;

    for (let i = 0; i < columns; i++) {
      ceiling.push(caveCenter - caveGap / 2);
      floor.push(caveCenter + caveGap / 2);
    }
  }

  const input = {
    space: false,
    mouse: false,
    touch: false
  };

  function holding() {
    return input.space || input.mouse || input.touch;
  }

  function startOrRestart() {
    if (gameOver) resetGame();
    running = true;
  }

  window.addEventListener("keydown", e => {
    if (e.code === "Space") {
      e.preventDefault();
      input.space = true;
      startOrRestart();
    }
  });

  window.addEventListener("keyup", e => {
    if (e.code === "Space") input.space = false;
  });

  canvas.addEventListener("mousedown", e => {
    e.preventDefault();
    input.mouse = true;
    startOrRestart();
  });

  window.addEventListener("mouseup", () => {
    input.mouse = false;
  });

  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    input.touch = true;
    startOrRestart();
  }, { passive: false });

  canvas.addEventListener("touchend", e => {
    e.preventDefault();
    input.touch = false;
  }, { passive: false });

  canvas.addEventListener("touchcancel", () => {
    input.touch = false;
  });

  function updateCave() {
    frame++;

    // A shorter calm opening; difficulty begins much sooner.
    if (frame < 130) {
      targetCenter = GAME_H / 2;
      targetGap = 76;
    } else {
      // The cave changes direction roughly twice as often.
      if (frame % 55 === 0) {
        const difficulty = Math.min(1, score / 450);
        const maxShift = 22 + 12 * difficulty;

        const minCenter = 46;
        const maxCenter = GAME_H - 46;

        targetCenter = Math.max(
          minCenter,
          Math.min(
            maxCenter,
            caveCenter + (Math.random() * 2 - 1) * maxShift
          )
        );
      }

      // Narrow steadily and reach a genuinely tight cave earlier.
      if (frame % 45 === 0 && caveGap > 42) {
        targetGap = Math.max(42, caveGap - 3);
      }
    }

    // More responsive bends, closer to the original's sharper navigation.
    caveCenter += (targetCenter - caveCenter) * 0.022;
    caveGap += (targetGap - caveGap) * 0.018;

    caveOffset += scrollSpeed;

    while (caveOffset >= step) {
      caveOffset -= step;

      const top = caveCenter - caveGap / 2;
      const bottom = caveCenter + caveGap / 2;

      ceiling.push(top);
      floor.push(bottom);

      ceiling.shift();
      floor.shift();
    }
  }

  function caveBoundaryAt(array, x) {
    const position = (x + caveOffset) / step;
    const index = Math.floor(position);
    const fraction = position - index;

    const a = array[index] ?? array[array.length - 1] ?? GAME_H / 2;
    const b = array[index + 1] ?? a;

    return a + (b - a) * fraction;
  }

  function updateTrail() {
    for (const point of ribbon.trail) {
      point.x -= scrollSpeed;
    }

    ribbon.trail.push({
      x: ribbon.x,
      y: ribbon.y
    });

    while (ribbon.trail.length && ribbon.trail[0].x < -2) {
      ribbon.trail.shift();
    }
  }

  function update() {
    if (!running || gameOver) return;

    score += scrollSpeed * 0.12;

    // Reaches higher speeds substantially sooner, but remains capped.
    const speedLevel = Math.floor(score / 45);
    scrollSpeed = Math.min(
      scrollSpeedMax,
      scrollSpeedStart + speedLevel * 0.05
    );

    if (holding()) {
      ribbon.vy -= 0.09;
    } else {
      ribbon.vy += 0.07;
    }

    ribbon.vy *= 0.94;
    ribbon.vy = Math.max(-1.15, Math.min(1.35, ribbon.vy));

    ribbon.y += ribbon.vy;

    updateTrail();
    updateCave();

    const ceilY = caveBoundaryAt(ceiling, ribbon.x);
    const floorY = caveBoundaryAt(floor, ribbon.x);

    if (
      ribbon.y - ribbon.radius < ceilY ||
      ribbon.y + ribbon.radius > floorY ||
      ribbon.y < 0 ||
      ribbon.y > GAME_H
    ) {
      gameOver = true;
      best = Math.max(best, Math.floor(score));
      localStorage.setItem("sfcave_gray_best", best);
    }
  }

  function drawPixelText(text, x, y, align = "left", color = COLORS.white) {
    ctx.fillStyle = color;
    ctx.font = "8px monospace";
    ctx.textAlign = align;
    ctx.textBaseline = "top";
    ctx.fillText(text, x, y);
  }

  function drawCave() {
    ctx.fillStyle = COLORS.black;
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    for (let i = 0; i < ceiling.length; i++) {
      const x = i * step - caveOffset;
      const top = Math.round(ceiling[i]);
      const bottom = Math.round(floor[i]);

      if (x + step < 0 || x > GAME_W) continue;

      ctx.fillStyle = COLORS.lightGray;
      ctx.fillRect(x, 0, step, top);
      ctx.fillRect(x, bottom, step, GAME_H - bottom);

      ctx.fillStyle = COLORS.darkGray;
      ctx.fillRect(x, top - 1, step, 1);
      ctx.fillRect(x, bottom, step, 1);
    }
  }

  function drawRibbon() {
    ctx.strokeStyle = COLORS.white;
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (let i = 0; i < ribbon.trail.length; i++) {
      const point = ribbon.trail[i];
      const x = Math.round(point.x);
      const y = Math.round(point.y);

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }

    ctx.stroke();

    ctx.fillStyle = COLORS.white;
    ctx.fillRect(
      Math.round(ribbon.x) - 1,
      Math.round(ribbon.y) - 1,
      3,
      3
    );
  }

  function drawUI() {
    drawPixelText(
      t.score + " " + String(Math.floor(score)).padStart(4, "0"),
      4,
      4
    );

    drawPixelText(
      t.best + " " + String(best).padStart(4, "0"),
      GAME_W - 4,
      4,
      "right",
      COLORS.gray
    );

    if (!running && !gameOver) {
      drawPixelText(t.gameTitle, GAME_W / 2, 84, "center", COLORS.white);
      drawPixelText(t.holdToRise, GAME_W / 2, 112, "center", COLORS.lightGray);
      drawPixelText(t.releaseToFall, GAME_W / 2, 126, "center", COLORS.lightGray);
      drawPixelText(t.controls, GAME_W / 2, 150, "center", COLORS.gray);
    }

    if (gameOver) {
      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      drawPixelText(t.gameOver, GAME_W / 2, 92, "center", COLORS.white);
      drawPixelText(t.score + " " + Math.floor(score), GAME_W / 2, 116, "center", COLORS.lightGray);
      drawPixelText(t.best + " " + best, GAME_W / 2, 130, "center", COLORS.lightGray);
      drawPixelText(t.holdToRetry, GAME_W / 2, 158, "center", COLORS.gray);
    }
  }

  function loop() {
    update();

    const scale = canvas.width / GAME_W;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    drawCave();
    drawRibbon();
    drawUI();

    requestAnimationFrame(loop);
  }

  resetGame();
  loop();
})();
</script>

</body>
</html>
