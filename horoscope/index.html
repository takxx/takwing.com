<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everyday Horoscopes</title>

  <style>
    :root {
      --bg-deep: #05060a;
      --card: rgba(20, 24, 36, 0.72);
      --text: #e9ecf1;
      --muted: #9aa3b3;
      --accent: #9fb8ff;
      --accent-soft: rgba(159, 184, 255, 0.25);
      --border: rgba(180, 190, 220, 0.16);
      --error: #ff9f9f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(900px 600px at 50% -20%, #182039, transparent 70%),
        radial-gradient(700px 500px at 100% 20%, #171329, transparent 65%),
        var(--bg-deep);
      font-family:
        "Palatino Linotype",
        "URW Palladio L",
        Palatino,
        "Times New Roman",
        Times,
        serif;
      font-style: normal;
      letter-spacing: 0.02em;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
    }

    .stars {
      z-index: 0;
      opacity: 0.55;
      background-image:
        radial-gradient(1px 1px at 10% 15%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 20% 75%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 35% 30%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 48% 85%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 63% 22%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 77% 62%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 90% 12%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 92% 88%, white 1px, transparent 1px);
      background-size:
        210px 210px,
        260px 260px,
        180px 180px,
        240px 240px,
        300px 300px,
        220px 220px,
        270px 270px,
        190px 190px;
      animation: drift 18s linear infinite;
    }

    .stars::before {
      opacity: 0.5;
      background-image:
        radial-gradient(1px 1px at 15% 45%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 32% 90%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 57% 50%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 72% 15%, white 1px, transparent 1px),
        radial-gradient(1px 1px at 87% 73%, white 1px, transparent 1px);
      background-size:
        280px 280px,
        230px 230px,
        310px 310px,
        250px 250px,
        200px 200px;
      animation: drift 25s linear infinite reverse;
    }

    @keyframes drift {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-30px);
      }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 860px);
      margin: 40px auto 60px;
    }

    .container {
      padding: 26px 20px 28px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.045),
        rgba(255, 255, 255, 0.012)
      );
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: clamp(1.45rem, 4vw, 1.8rem);
      letter-spacing: 0.3px;
      line-height: 1.2;
      text-align: center;
      text-shadow: 0 0 18px var(--accent-soft);
    }

    .subtitle {
      max-width: 650px;
      margin: 0 auto 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 18px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    .date-line {
      color: #ffd39a;
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .language-line {
      align-self: center;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    select {
      display: block;
      width: min(100%, 270px);
      margin: 0 auto;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: rgba(15, 18, 28, 0.8);
      font: inherit;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(159, 184, 255, 0.15);
    }

    .signs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    @media (min-width: 480px) {
      .signs-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 640px) {
      .signs-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (min-width: 900px) {
      .signs-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    .sign-button {
      display: flex;
      min-width: 0;
      min-height: 68px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 9px 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: rgba(18, 22, 34, 0.74);
      font: inherit;
      cursor: pointer;
      transition:
        transform 0.12s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .sign-button:hover {
      transform: translateY(-1px);
      border-color: rgba(180, 190, 220, 0.4);
      background: rgba(30, 36, 54, 0.9);
    }

    .sign-button:focus-visible {
      outline: 3px solid rgba(159, 184, 255, 0.35);
      outline-offset: 2px;
    }

    .sign-button.active {
      border-color: var(--accent);
      background:
        linear-gradient(
          180deg,
          rgba(60, 80, 140, 0.38),
          rgba(40, 50, 90, 0.48)
        );
      box-shadow: 0 0 22px rgba(159, 184, 255, 0.24);
    }

    .sign-emoji {
      font-size: 1.35rem;
      line-height: 1;
    }

    .sign-name {
      max-width: 100%;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .horoscope-card {
      min-height: 100px;
      margin-top: 20px;
      padding: 17px 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: #eef2ff;
      background: rgba(255, 255, 255, 0.025);
      font-size: 0.96rem;
      line-height: 1.7;
      text-shadow: 0 0 18px rgba(159, 184, 255, 0.15);
      white-space: pre-wrap;
    }

    .loading,
    .error {
      color: var(--muted);
      text-align: center;
    }

    .error {
      color: var(--error);
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.5;
      opacity: 0.85;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="page">
    <section class="container">
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>

      <div class="meta-row">
        <span id="date-line" class="date-line"></span>
        <span id="language-line" class="language-line"></span>
      </div>

      <label for="language-select" id="language-label"></label>

      <select id="language-select">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
      </select>

      <label id="sign-label"></label>

      <div
        id="signs-grid"
        class="signs-grid"
        role="group"
        aria-labelledby="sign-label"
      ></div>

      <section
        id="horoscope-output"
        class="horoscope-card"
        aria-live="polite"
      >
        <div id="loading" class="loading"></div>
      </section>

      <p id="footer-note" class="footer-note"></p>
    </section>
  </main>

  <script>
    "use strict";

    const SUPPORTED_LANGUAGES = ["en", "es", "zh"];

    const LANGUAGE_NAMES = {
      en: "English",
      es: "Español",
      zh: "中文"
    };

    const LANGUAGE_STORAGE_KEY = "horoscope-language";
    const SIGN_STORAGE_KEY = "horoscope-sign";

    let currentLanguage = "en";
    let currentData = null;
    let selectedSign = null;
    let today = new Date();

    function mulberry32(seed) {
      return function random() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function fnv1a(value) {
      let hash = 2166136261;

      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }

      return hash >>> 0;
    }

    function getDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function getSeed(date, signKey) {
      return fnv1a(`${getDateKey(date)}|${signKey}`);
    }

    function pick(random, values) {
      if (!Array.isArray(values) || values.length === 0) {
        return "";
      }

      return values[Math.floor(random() * values.length)];
    }

    function fillTemplate(template, values) {
      if (typeof template !== "string") {
        return "";
      }

      return template.replace(
        /\{([a-zA-Z0-9_]+)\}/g,
        (match, key) => Object.prototype.hasOwnProperty.call(values, key)
          ? values[key]
          : match
      );
    }

    function chooseTemplate(random, data, category) {
      const templates = data.templates?.[category];

      if (Array.isArray(templates)) {
        return pick(random, templates);
      }

      if (typeof templates === "string") {
        return templates;
      }

      return "";
    }

    function buildSentence(random, data, category) {
      const segments = data.segments?.[category] || {};
      const values = {};

      for (const [key, choices] of Object.entries(segments)) {
        values[key] = pick(random, choices);
      }

      const template = chooseTemplate(random, data, category);

      return fillTemplate(template, values).trim();
    }

    function generateHoroscope(data, signKey, date) {
      const random = mulberry32(getSeed(date, signKey));

      const categories = [
        "opener",
        "social",
        "opportunities",
        "inner",
        "advice",
        "mystical",
        "warnings",
        "affirmation",
        "retrograde",
        "closer"
      ];

      return categories
        .map(category => buildSentence(random, data, category))
        .filter(Boolean)
        .join(" ");
    }

    function getBrowserLanguage() {
      const browserLanguage = (
        navigator.language ||
        navigator.userLanguage ||
        "en"
      ).toLowerCase();

      if (browserLanguage.startsWith("es")) {
        return "es";
      }

      if (browserLanguage.startsWith("zh")) {
        return "zh";
      }

      return "en";
    }

    function getInitialLanguage() {
      const storedLanguage = localStorage.getItem(LANGUAGE_STORAGE_KEY);

      if (SUPPORTED_LANGUAGES.includes(storedLanguage)) {
        return storedLanguage;
      }

      return getBrowserLanguage();
    }

    function getInitialSign() {
      return localStorage.getItem(SIGN_STORAGE_KEY);
    }

    function setText(id, value) {
      const element = document.getElementById(id);

      if (element) {
        element.textContent = value || "";
      }
    }

    function formatDate(date, language) {
      if (language === "zh") {
        const formatter = new Intl.DateTimeFormat("zh-Hant", {
          calendar: "gregory",
          year: "numeric",
          month: "numeric",
          day: "numeric",
          weekday: "long"
        });

        return formatter.format(date);
      }

      if (language === "es") {
        const formatter = new Intl.DateTimeFormat("es", {
          calendar: "gregory",
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });

        return formatter
          .format(date)
          .replace(/^./, character => character.toLowerCase());
      }

      const formatter = new Intl.DateTimeFormat("en-GB", {
        calendar: "gregory",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

      return formatter.format(date);
    }

    function applyInterfaceText() {
      const ui = currentData?.ui || {};

      setText("title", ui.title);
      setText("subtitle", ui.subtitle);
      setText("language-label", ui.languageLabel);
      setText("sign-label", ui.signLabel);
      setText("loading", ui.loading);
      setText("footer-note", ui.footerNote);

      setText("date-line", formatDate(today, currentLanguage));

      setText(
        "language-line",
        `${ui.languagePrefix || "Language:"} ${
          LANGUAGE_NAMES[currentLanguage] || currentLanguage
        }`
      );

      document.documentElement.lang =
        currentLanguage === "zh" ? "zh-Hant" : currentLanguage;

      document.title = ui.title || "Everyday Horoscopes";
    }

    function getValidSelectedSign() {
      const signs = currentData?.signs || [];
      const storedSign = selectedSign || getInitialSign();

      if (signs.some(sign => sign.key === storedSign)) {
        return storedSign;
      }

      return signs[0]?.key || null;
    }

    function renderSigns() {
      const grid = document.getElementById("signs-grid");
      const signs = currentData?.signs || [];

      grid.replaceChildren();
      selectedSign = getValidSelectedSign();

      for (const sign of signs) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "sign-button";
        button.dataset.signKey = sign.key;
        button.setAttribute(
          "aria-label",
          sign.name || sign.key
        );

        if (sign.key === selectedSign) {
          button.classList.add("active");
          button.setAttribute("aria-pressed", "true");
        } else {
          button.setAttribute("aria-pressed", "false");
        }

        const emoji = document.createElement("span");
        emoji.className = "sign-emoji";
        emoji.textContent = sign.emoji || "";

        const name = document.createElement("span");
        name.className = "sign-name";
        name.textContent = sign.name || sign.key;

        button.append(emoji, name);

        button.addEventListener("click", () => {
          selectedSign = sign.key;
          localStorage.setItem(SIGN_STORAGE_KEY, selectedSign);

          renderSigns();
          renderHoroscope();
        });

        grid.appendChild(button);
      }
    }

    function renderHoroscope() {
      const output = document.getElementById("horoscope-output");

      if (!currentData || !selectedSign) {
        output.textContent = "";
        return;
      }

      output.textContent = generateHoroscope(
        currentData,
        selectedSign,
        today
      );
    }

    async function loadLanguage(language) {
      const output = document.getElementById("horoscope-output");

      if (!SUPPORTED_LANGUAGES.includes(language)) {
        language = "en";
      }

      output.innerHTML = "";

      const loading = document.createElement("div");
      loading.className = "loading";
      loading.textContent = currentData?.ui?.loading || "Loading…";
      output.appendChild(loading);

      try {
        const response = await fetch(`${language}.json`, {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(`Could not load ${language}.json`);
        }

        const data = await response.json();

        if (
          !data ||
          !data.ui ||
          !Array.isArray(data.signs) ||
          !data.templates ||
          !data.segments
        ) {
          throw new Error(`${language}.json has an invalid structure`);
        }

        currentLanguage = language;
        currentData = data;

        localStorage.setItem(LANGUAGE_STORAGE_KEY, currentLanguage);

        applyInterfaceText();
        renderSigns();
        renderHoroscope();
      } catch (error) {
        console.error(error);

        output.innerHTML = "";

        const errorMessage = document.createElement("div");
        errorMessage.className = "error";
        errorMessage.textContent =
          currentData?.ui?.loadError ||
          "The horoscope data could not be loaded.";

        output.appendChild(errorMessage);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const languageSelect = document.getElementById("language-select");

      currentLanguage = getInitialLanguage();
      languageSelect.value = currentLanguage;

      languageSelect.addEventListener("change", event => {
        selectedSign = null;
        loadLanguage(event.target.value);
      });

      await loadLanguage(currentLanguage);
    });
  </script>
</body>
</html>
