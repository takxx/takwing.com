<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wooden Labyrinth</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game" id="game">
    <div class="board" id="board">
      <div class="board-inner">
        <div class="holes-layer" id="holesLayer"></div>
        <div class="walls-layer" id="wallsLayer"></div>
        <div class="markers-layer" id="markersLayer"></div>
        <div class="ball" id="ball"></div>
      </div>
    </div>

    <section
      class="game-screen"
      id="gameScreen"
      aria-live="polite"
      aria-modal="true"
      role="dialog"
    >
      <div class="message-panel">
        <h1 class="message-title" id="messageTitle"></h1>
        <p class="message-text" id="messageText"></p>

        <div class="message-actions">
          <button id="primaryAction" type="button"></button>
          <button id="secondaryAction" type="button" hidden></button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
