<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1,
                 maximum-scale=1, user-scalable=no"
    >
    <title>Classic Labyrinth</title>

    <style>
        :root {
            --wood-dark: #211109;
            --board: #c79458;
            --cream: #faf7f0;
            --text: #1c2730;
            --muted: #69747d;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100dvh;
            padding: 14px;
            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(
                    ellipse at 50% 8%,
                    rgba(120, 88, 58, .28),
                    transparent 42%
                ),
                linear-gradient(145deg, #17100c, #060403 82%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .2;
            background-image:
                linear-gradient(
                    rgba(255, 255, 255, .035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, .035) 1px,
                    transparent 1px
                );
            background-size: 38px 38px;
            mask-image: radial-gradient(circle, black, transparent 75%);
        }

        #game-container {
            position: relative;
            width: min(94vw, 760px, calc(100dvh - 28px));
            height: min(94vw, 760px, calc(100dvh - 28px));
            padding: clamp(14px, 2.5vw, 26px);
            border: 2px solid #32170a;
            border-radius: 18px;
            background:
                repeating-linear-gradient(
                    8deg,
                    rgba(52, 22, 8, .24) 0 2px,
                    transparent 2px 9px
                ),
                repeating-linear-gradient(
                    92deg,
                    #9b5d2e 0,
                    #77401d 70px,
                    #a96835 145px,
                    #512712 230px,
                    #8a4e25 330px
                );
            box-shadow:
                0 38px 85px rgba(0, 0, 0, .78),
                0 12px 24px rgba(0, 0, 0, .6),
                inset 0 2px 2px rgba(255, 230, 190, .42),
                inset 0 -16px 24px rgba(20, 7, 2, .72);
            transform-style: preserve-3d;
            transition: transform .16s ease-out;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 8px;
            pointer-events: none;
            border: 2px solid rgba(255, 215, 160, .24);
            border-radius: 13px;
            box-shadow: inset 0 0 0 2px rgba(38, 15, 5, .5);
        }

        #maze-board {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 5px solid #301508;
            border-radius: 8px;
            background:
                radial-gradient(
                    ellipse at 25% 10%,
                    rgba(255, 238, 195, .28),
                    transparent 42%
                ),
                linear-gradient(145deg, #d6a66a, #b77b42 58%, #8f582d);
            box-shadow:
                inset 0 9px 18px rgba(36, 14, 4, .5),
                inset 0 0 0 2px rgba(67, 30, 10, .5);
        }

        #maze-board::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            box-shadow: inset 0 0 25px rgba(47, 20, 7, .28);
        }

        .wall {
            position: absolute;
            border: 1px solid #3a1b0b;
            border-radius: 5px;
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 235, 190, .3),
                    transparent 22%,
                    rgba(0, 0, 0, .22) 86%
                ),
                linear-gradient(90deg, #a96834, #82471f 45%, #5a2b12);
            box-shadow:
                3px 5px 0 rgba(48, 21, 8, .28),
                0 7px 10px rgba(38, 15, 4, .38),
                inset 1px 1px 0 rgba(255, 226, 174, .48),
                inset -2px -3px 4px rgba(0, 0, 0, .4);
        }

        .hole {
            position: absolute;
            border: 2px solid rgba(57, 31, 15, .55);
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 34% 28%,
                    #433229 0 8%,
                    #171310 28%,
                    #050505 68%,
                    #26180f 100%
                );
            box-shadow:
                inset 5px 7px 10px rgba(0, 0, 0, .95),
                0 2px 3px rgba(255, 255, 255, .14);
        }

        .endpoint {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: clamp(9px, 1.4vw, 12px);
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-align: center;
            box-shadow:
                inset 0 2px 7px rgba(0, 0, 0, .25),
                0 1px 1px rgba(255, 255, 255, .35);
        }

        .start-zone {
            color: #12613a;
            border: 2px solid rgba(27, 153, 88, .72);
            background: rgba(99, 235, 155, .22);
        }

        .checkpoint-zone {
            color: #765016;
            border: 2px solid rgba(211, 151, 47, .9);
            background: rgba(255, 214, 92, .3);
            transition:
                color .2s ease,
                background .2s ease,
                border-color .2s ease,
                transform .2s ease;
        }

        .checkpoint-zone.checkpoint-reached {
            color: #075d35;
            border-color: rgba(27, 153, 88, .95);
            background: rgba(99, 235, 155, .5);
            transform: scale(1.08);
        }

        .goal-zone {
            color: #a92838;
            border: 2px solid rgba(219, 61, 75, .78);
            background: rgba(255, 118, 126, .3);
        }

        #ball {
            position: absolute;
            z-index: 10;
            border-radius: 50%;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 27% 20%,
                    #fff 0 4%,
                    #f5fbff 8%,
                    #cbd6da 22%,
                    #7c898e 44%,
                    #3d474b 70%,
                    #111517 100%
                );
            border: 1px solid rgba(255, 255, 255, .7);
            box-shadow:
                7px 10px 12px rgba(0, 0, 0, .48),
                inset -4px -5px 8px rgba(0, 0, 0, .7),
                inset 3px 3px 5px rgba(255, 255, 255, .9);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(12, 6, 3, .76);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: min(440px, 100%);
            padding: clamp(26px, 6vw, 42px);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, .78);
            border-radius: 20px;
            background: linear-gradient(145deg, #fff, #f5efe2);
            box-shadow: 0 25px 70px rgba(0, 0, 0, .58);
        }

        .modal h2 {
            margin-bottom: 14px;
            color: #211109;
            font-size: clamp(26px, 6vw, 35px);
            line-height: 1.05;
        }

        .modal p {
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
        }

        .modal p strong {
            color: var(--text);
        }

        .btn {
            margin-top: 14px;
            padding: 14px 28px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(180deg, #c77c43, #78401f);
            box-shadow: 0 5px 0 #482311, 0 8px 18px rgba(74, 39, 18, .28);
            font: inherit;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #482311;
        }

        @media (max-width: 520px) {
            body {
                padding: 10px;
            }

            #game-container {
                width: min(96vw, calc(100dvh - 20px));
                height: min(96vw, calc(100dvh - 20px));
                padding: 13px;
                border-radius: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <main id="game-container">
        <section id="maze-board" aria-label="Labyrinth game board">
            <div id="ball"></div>
        </section>
    </main>

    <div id="instruction-modal" class="modal active">
        <div class="modal-content">
            <h2>Classic Labyrinth</h2>

            <p>
                Guide the steel ball through the wooden maze and reach the
                red goal without falling into a pit.
            </p>

            <p>
                <strong>Desktop:</strong>
                Move your mouse around the board.
            </p>

            <p>
                <strong>Mobile:</strong>
                Tilt your device to steer the ball.
            </p>

            <p>
                <strong>Tip:</strong>
                Reach the numbered waypoints in order.
            </p>

            <button type="button" class="btn" id="start-btn">
                Begin Game
            </button>
        </div>
    </div>

    <div id="end-modal" class="modal">
        <div class="modal-content">
            <h2 id="end-title">Game Complete</h2>
            <p id="end-message"></p>

            <button type="button" class="btn" id="reload-btn">
                Mill New Board
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
