<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Handcrafted Wooden Labyrinth</title>
    <style>
        :root {
            /* Hand-picked premium timber color palette */
            --wood-frame: #4a2c11;
            --wood-wall: #704214;
            --wood-wall-highlight: #965d22;
            --wood-floor: #c29b6a;
            --wood-grain-dark: rgba(92, 58, 33, 0.08);
            --wood-grain-light: rgba(255, 230, 200, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            /* Room ambiance ambient occlusion shadow */
            background-image: radial-gradient(circle, #252525 0%, #0a0a0a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1400px;
        }

        /* Outer Hand-Carved Wooden Cabinet Frame */
        #game-container {
            width: 95vw;
            height: 95vh;
            max-width: 92vh;
            max-height: 92vw;
            aspect-ratio: 1 / 1;
            background: var(--wood-frame);
            /* Complex linear gradients simulating layered premium furniture trim planks */
            background-image: 
                linear-gradient(0deg, rgba(0,0,0,0.4) 0%, transparent 10px),
                linear-gradient(90deg, rgba(0,0,0,0.3) 0%, transparent 10px),
                repeating-linear-gradient(45deg, var(--wood-grain-dark) 0px, var(--wood-grain-dark) 4px, transparent 4px, transparent 12px);
            padding: 24px;
            border-radius: 16px;
            /* Extreme depth projection dropshadow styling */
            box-shadow: 
                0 40px 80px rgba(0,0,0,0.85), 
                0 10px 25px rgba(0,0,0,0.5),
                inset 0 4px 6px rgba(255,255,255,0.15),
                inset 0 -10px 20px rgba(0,0,0,0.7);
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        /* Inner Board / Sanded Veneer Maze Floor Floorboards */
        #maze-board {
            width: 100%;
            height: 100%;
            background-color: var(--wood-floor);
            /* Overlaying interlocking procedural timber grain lines and plank cuts */
            background-image: 
                repeating-linear-gradient(90deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 80px),
                repeating-linear-gradient(0deg, var(--wood-grain-dark) 0px, var(--wood-grain-dark) 2px, transparent 2px, transparent 18px),
                repeating-linear-gradient(115deg, var(--wood-grain-light) 0px, var(--wood-grain-light) 8px, transparent 8px, transparent 24px);
            position: relative;
            border-radius: 6px;
            /* Sinks the inner track below the external frame structure */
            box-shadow: 
                inset 0 12px 24px rgba(0,0,0,0.75),
                inset 0 -4px 10px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* 3D Sanded Solid Timber Walls */
        .wall {
            position: absolute;
            background: var(--wood-wall);
            background-image: repeating-linear-gradient(0deg, var(--wood-grain-dark) 0px, var(--wood-grain-dark) 2px, transparent 2px, transparent 10px);
            border-radius: 2px;
            /* Beveled timber frame overlay edges + casting realistic baseline block shadows */
            box-shadow: 
                4px 5px 8px rgba(0,0,0,0.4), 
                inset 1px 1px 0px var(--wood-wall-highlight),
                inset -1px -1px 2px rgba(0,0,0,0.5);
        }

        /* Deep-Bored Drilled Pit Holes (Hazards) */
        .hole {
            position: absolute;
            border-radius: 50%;
            background: #0d0d0d;
            /* Double-nested shadow parameters create an illusion of hollow vertical depth */
            box-shadow: 
                inset 4px 5px 12px rgba(0,0,0,0.95),
                inset -2px -2px 6px rgba(255,255,255,0.05),
                1px 2px 2px rgba(255,255,255,0.15);
        }

        /* Goal & Start Zones (Branded Stamp Look) */
        .endpoint {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            /* Inset blending mimics a burned wood-burning iron brand mark */
            box-shadow: inset 1px 2px 5px rgba(0,0,0,0.3);
        }
        .start-zone { background: rgba(46, 125, 50, 0.15); border: 2px dashed rgba(46, 125, 50, 0.4); color: #1b5e20; }
        .goal-zone { background: rgba(198, 40, 40, 0.15); border: 2px dashed rgba(198, 40, 40, 0.5); color: #b71c1c; }

        /* Highly-Polished Chrome Ball Bearing */
        #ball {
            position: absolute;
            border-radius: 50%;
            /* High-contrast multi-stop specular reflection points mimicking brushed steel */
            background: radial-gradient(circle at 30% 25%, #ffffff 0%, #eaeaea 8%, #b5b5b5 25%, #555555 65%, #222222 100%);
            /* Heavy offset contact drop shadow updates dynamically with movement */
            box-shadow: 
                6px 10px 14px rgba(0,0,0,0.45), 
                inset -3px -3px 7px rgba(0,0,0,0.6),
                inset 2px 2px 4px rgba(255,255,255,0.4);
            z-index: 10;
            pointer-events: none;
        }

        /* Vintage Overlay Modal Dialog Canvas */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #fdfaf2;
            padding: 35px;
            border-radius: 14px;
            max-width: 440px;
            width: 88%;
            text-align: center;
            border: 5px solid var(--wood-frame);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .modal h2 { color: var(--wood-frame); margin-bottom: 18px; font-size: 28px; letter-spacing: -0.5px; }
        .modal p { color: #444; margin-bottom: 16px; line-height: 1.6; font-size: 15px; }
        
        .btn {
            background: var(--wood-wall);
            background-image: linear-gradient(180deg, var(--wood-wall-highlight) 0%, var(--wood-wall) 100%);
            color: #fdfaf2;
            border: 1px solid var(--wood-frame);
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 5px 0 #3a200a, 0 8px 10px rgba(0,0,0,0.3);
            transition: all 0.05s ease;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #3a200a, 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="maze-board">
            <div id="ball"></div>
        </div>
    </div>

    <!-- Instruction Popup -->
    <div id="instruction-modal" class="modal active">
        <div class="modal-content">
            <h2>Classic Labyrinth</h2>
            <p>Tilt the fine timber board to roll the polished steel bearing to the Red Goal.</p>
            <p><strong>Desktop:</strong> Move your mouse cursor across the screen window.</p>
            <p><strong>Mobile:</strong> Physically tilt your smartphone device using internal sensors.</p>
            <p style="color: #901a1a; font-weight: bold;">⚠️ Steer clear of the milled pit traps!</p>
            <button class="btn" id="start-btn">Begin Game</button>
        </div>
    </div>

    <!-- Win / Loss Popup -->
    <div id="end-modal" class="modal">
        <div class="modal-content">
            <h2 id="end-title">Game Complete</h2>
            <p id="end-message"></p>
            <button class="btn" id="reload-btn">Mill New Board</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
