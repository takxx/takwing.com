<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Another Wordle</title>

<style>
:root {
  --background: #121212;
  --surface: #1e1e1e;
  --surface-2: #2a2a2a;
  --border: #3a3a3a;
  --text: #e8e8e8;
  --muted-text: #b8b8b8;

  --green: #538d4e;
  --yellow: #b59f3b;
  --gray: #3a3a3a;
  --focus: #7aa9ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--background);
}

header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

h1 {
  margin: 0;
  letter-spacing: 0.2rem;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

label {
  color: var(--muted-text);
}

select,
button {
  font: inherit;
  padding: 0.45rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  background: var(--surface-2);
  cursor: pointer;
}

select:hover,
button:hover {
  border-color: #5a5a5a;
}

select:focus-visible,
button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

main {
  max-width: 500px;
  margin: 0 auto;
  padding: 1rem;
  text-align: center;
}

#instructions {
  min-height: 3rem;
  margin: 0 0 1rem;
  color: var(--muted-text);
}

#board {
  display: grid;
  gap: 6px;
  justify-content: center;
  margin-bottom: 1rem;
  cursor: text;
  touch-action: manipulation;
}

.row {
  display: grid;
  grid-template-columns: repeat(5, 58px);
  gap: 6px;
}

.tile {
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  border: 2px solid var(--border);
  color: var(--text);
  font-size: 1.75rem;
  font-weight: 700;
  text-transform: uppercase;
  user-select: none;
  will-change: contents, background-color;
}

.tile.filled {
  border-color: #565758;
}

.tile.correct {
  color: #ffffff;
  background: var(--green);
  border-color: var(--green);
}

.tile.present {
  color: #121212;
  background: var(--yellow);
  border-color: var(--yellow);
}

.tile.absent {
  color: #d7dadc;
  background: var(--gray);
  border-color: var(--gray);
}

#message {
  min-height: 1.5rem;
  margin-bottom: 1rem;
  color: var(--text);
  font-weight: 600;
}

/*
  This remains focusable so that mobile browsers open the touchscreen keyboard.
  It is visually hidden without using display:none or pointer-events:none.
*/
#guess-input {
  position: fixed;
  left: -9999px;
  width: 1px;
  height: 1px;
  padding: 0;
  border: 0;
  opacity: 0;
}

@media (max-width: 480px) {
  .row {
    grid-template-columns: repeat(5, minmax(48px, 1fr));
  }

  .tile {
    width: 100%;
    height: 52px;
    font-size: 1.4rem;
  }
}
</style>
</head>

<body>
<header>
  <h1 id="title">WORDLE</h1>

  <div class="controls">
    <label for="language-select" id="language-label">Language</label>

    <select id="language-select">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>

    <button id="new-game" type="button">New game</button>
  </div>
</header>

<main>
  <p id="instructions"></p>

  <div
    id="board"
    aria-label="Wordle board"
    role="application"
    tabindex="0"
  ></div>

  <div id="message" role="status" aria-live="polite"></div>

  <input
    id="guess-input"
    type="text"
    inputmode="text"
    autocomplete="off"
    autocapitalize="characters"
    autocorrect="off"
    spellcheck="false"
    aria-label="Enter your guess"
  />
</main>

<script>
"use strict";

const WORD_LENGTH = 5;
const MAX_GUESSES = 6;
const LETTER_PATTERN = /^[a-zA-ZñÑáéíóúüÁÉÍÓÚÜ]$/;

const TRANSLATIONS = {
  en: {
    title: "WORDLE",
    language: "Language",
    newGame: "New game",
    instructions:
      "Guess the five-letter word in six tries. Green means the letter is correct and in the right place, yellow means it is in the word but elsewhere, and gray means it is not in the word.",
    invalidLength: "Your guess must have 5 letters.",
    invalidWord: "Not a valid five-letter word.",
    win: "You guessed it!",
    lose: "The word was:"
  },
  es: {
    title: "WORDLE",
    language: "Idioma",
    newGame: "Nueva partida",
    instructions:
      "Adivina la palabra de cinco letras en seis intentos. Verde significa que la letra es correcta y está en su lugar, amarillo que está en la palabra pero en otra posición, y gris que no está en la palabra.",
    invalidLength: "Tu palabra debe tener 5 letras.",
    invalidWord: "No es una palabra válida de cinco letras.",
    win: "¡Lo adivinaste!",
    lose: "La palabra era:"
  }
};

const state = {
  lang: "en",
  words: [],
  wordSet: new Set(),
  answer: "",
  guesses: [],
  currentGuess: "",
  gameOver: false,
  loading: false
};

const board = document.getElementById("board");
const message = document.getElementById("message");
const guessInput = document.getElementById("guess-input");
const languageSelect = document.getElementById("language-select");
const languageLabel = document.getElementById("language-label");
const instructions = document.getElementById("instructions");
const newGameButton = document.getElementById("new-game");
const title = document.getElementById("title");

/*
  Cached tile references:
  tiles[row][column]
  This avoids repeated DOM traversal via board.children during every keystroke.
*/
const tiles = [];

function detectInitialLanguage() {
  const urlLanguage = new URLSearchParams(window.location.search).get("lang");

  if (urlLanguage === "en" || urlLanguage === "es") {
    return urlLanguage;
  }

  const browserLanguages = navigator.languages || [navigator.language || "en"];

  for (const browserLanguage of browserLanguages) {
    const code = browserLanguage.toLowerCase().slice(0, 2);

    if (code === "es") return "es";
    if (code === "en") return "en";
  }

  return "en";
}

async function loadWords(language) {
  const response = await fetch(`/util/wordlist/${language}.json`);

  if (!response.ok) {
    throw new Error(`Could not load word list for "${language}".`);
  }

  const allWords = await response.json();

  const fiveLetterWords = allWords
    .filter(
      word =>
        typeof word === "string" &&
        [...word].length === WORD_LENGTH &&
        /^[A-ZÑÁÉÍÓÚÜ]+$/i.test(word)
    )
    .map(word => word.toUpperCase());

  if (fiveLetterWords.length === 0) {
    throw new Error(`No five-letter words found in "${language}.json".`);
  }

  return fiveLetterWords;
}

function normalizeLetter(letter) {
  return letter
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase();
}

function normalizeWord(word) {
  return normalizeLetter(word);
}

function createBoard() {
  board.replaceChildren();
  tiles.length = 0;

  const fragment = document.createDocumentFragment();

  for (let row = 0; row < MAX_GUESSES; row++) {
    const rowElement = document.createElement("div");
    rowElement.className = "row";

    const rowTiles = [];

    for (let column = 0; column < WORD_LENGTH; column++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.setAttribute("aria-hidden", "true");

      rowElement.appendChild(tile);
      rowTiles.push(tile);
    }

    fragment.appendChild(rowElement);
    tiles.push(rowTiles);
  }

  board.appendChild(fragment);
}

function resetTile(tile) {
  tile.textContent = "";
  tile.className = "tile";
}

function updateCurrentRow() {
  const rowIndex = state.guesses.length;

  if (rowIndex >= MAX_GUESSES) return;

  for (let column = 0; column < WORD_LENGTH; column++) {
    const tile = tiles[rowIndex][column];
    const letter = state.currentGuess[column] || "";

    tile.textContent = letter;
    tile.classList.toggle("filled", Boolean(letter));
  }
}

function renderSubmittedRow(rowIndex, guess, feedback) {
  for (let column = 0; column < WORD_LENGTH; column++) {
    const tile = tiles[rowIndex][column];

    tile.textContent = guess[column];
    tile.className = `tile ${feedback[column]}`;
  }
}

function clearBoard() {
  for (const rowTiles of tiles) {
    for (const tile of rowTiles) {
      resetTile(tile);
    }
  }
}

function showMessage(text = "") {
  message.textContent = text;
}

function buildAnswerMap(word) {
  const counts = new Map();

  for (const letter of word) {
    counts.set(letter, (counts.get(letter) || 0) + 1);
  }

  return counts;
}

function evaluateGuess(guess, answer) {
  const result = Array(WORD_LENGTH).fill("absent");
  const remaining = buildAnswerMap(answer);

  for (let index = 0; index < WORD_LENGTH; index++) {
    if (guess[index] === answer[index]) {
      result[index] = "correct";
      remaining.set(guess[index], remaining.get(guess[index]) - 1);
    }
  }

  for (let index = 0; index < WORD_LENGTH; index++) {
    if (result[index] === "correct") continue;

    const count = remaining.get(guess[index]) || 0;

    if (count > 0) {
      result[index] = "present";
      remaining.set(guess[index], count - 1);
    }
  }

  return result;
}

function addLetter(rawLetter) {
  if (state.loading || state.gameOver) return;
  if (state.currentGuess.length >= WORD_LENGTH) return;

  const letter = normalizeLetter(rawLetter);

  if (!LETTER_PATTERN.test(rawLetter) || letter.length !== 1) return;

  state.currentGuess += letter;
  showMessage();
  updateCurrentRow();
}

function removeLetter() {
  if (state.loading || state.gameOver) return;
  if (!state.currentGuess) return;

  state.currentGuess = state.currentGuess.slice(0, -1);
  showMessage();
  updateCurrentRow();
}

function submitGuess() {
  if (state.loading || state.gameOver) return;

  const guess = state.currentGuess;

  if (guess.length !== WORD_LENGTH) {
    showMessage(TRANSLATIONS[state.lang].invalidLength);
    return;
  }

  /*
    Set.has() is faster than scanning all words with Array.some()
    every time a guess is submitted.
  */
  if (!state.wordSet.has(normalizeWord(guess))) {
    showMessage(TRANSLATIONS[state.lang].invalidWord);
    return;
  }

  const feedback = evaluateGuess(guess, state.answer);
  const rowIndex = state.guesses.length;

  state.guesses.push({ guess, feedback });
  state.currentGuess = "";

  renderSubmittedRow(rowIndex, guess, feedback);

  if (guess === state.answer) {
    state.gameOver = true;
    showMessage(TRANSLATIONS[state.lang].win);
    guessInput.blur();
    return;
  }

  if (state.guesses.length === MAX_GUESSES) {
    state.gameOver = true;
    showMessage(`${TRANSLATIONS[state.lang].lose} ${state.answer}`);
    guessInput.blur();
    return;
  }

  updateCurrentRow();
}

function applyTranslations() {
  const text = TRANSLATIONS[state.lang];

  document.documentElement.lang = state.lang;
  title.textContent = text.title;
  languageLabel.textContent = text.language;
  newGameButton.textContent = text.newGame;
  instructions.textContent = text.instructions;
  languageSelect.value = state.lang;
}

function focusGameInput() {
  if (!state.gameOver && !state.loading) {
    guessInput.focus({ preventScroll: true });
  }
}

function handleKey(key) {
  if (key === "Enter") {
    submitGuess();
    return;
  }

  if (key === "Backspace" || key === "Delete") {
    removeLetter();
    return;
  }

  if (LETTER_PATTERN.test(key)) {
    addLetter(key);
  }
}

async function startGame(language, { preserveUrl = false } = {}) {
  state.loading = true;
  showMessage("");

  try {
    state.lang = language;
    applyTranslations();

    const words = await loadWords(language);

    state.words = words;
    state.wordSet = new Set(words.map(normalizeWord));
    state.answer = words[Math.floor(Math.random() * words.length)];
    state.guesses = [];
    state.currentGuess = "";
    state.gameOver = false;

    clearBoard();

    if (preserveUrl) {
      const url = new URL(window.location.href);
      url.searchParams.set("lang", language);
      window.history.replaceState({}, "", url);
    }

    focusGameInput();
  } catch (error) {
    console.error(error);
    showMessage(error.message || "Unable to start the game.");
  } finally {
    state.loading = false;
  }
}

/*
  Hardware keyboards:
  Do not intercept normal text entry while the hidden input owns focus.
  The input event handles those letters. This handler remains useful if
  the board itself is focused.
*/
document.addEventListener("keydown", event => {
  if (event.target === guessInput) return;

  if (
    event.key === "Enter" ||
    event.key === "Backspace" ||
    event.key === "Delete" ||
    LETTER_PATTERN.test(event.key)
  ) {
    event.preventDefault();
    handleKey(event.key);
  }
});

/*
  Mobile virtual keyboards:
  beforeinput exposes deleteContentBackward even where keydown does not
  reliably report Backspace.
*/
guessInput.addEventListener("beforeinput", event => {
  if (event.inputType === "deleteContentBackward") {
    event.preventDefault();
    removeLetter();
  }
});

/*
  Fallback for keyboards that do emit a normal Backspace key event.
  Preventing default avoids duplicate deletion when both events occur.
*/
guessInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    submitGuess();
    return;
  }

  if (event.key === "Backspace" || event.key === "Delete") {
    event.preventDefault();
    removeLetter();
  }
});

/*
  Handles touchscreen typing, physical keyboard typing, paste, speech
  input, and IME text insertion. The value is immediately cleared because
  game state is stored in state.currentGuess rather than in this field.
*/
guessInput.addEventListener("input", () => {
  const value = guessInput.value;
  guessInput.value = "";

  for (const character of value) {
    if (LETTER_PATTERN.test(character)) {
      addLetter(character);
    }
  }
});

board.addEventListener("click", focusGameInput);

board.addEventListener("touchstart", focusGameInput, {
  passive: true
});

languageSelect.addEventListener("change", event => {
  startGame(event.target.value, { preserveUrl: true });
});

newGameButton.addEventListener("click", () => {
  startGame(state.lang);
});

createBoard();
startGame(detectInitialLanguage());
</script>
</body>
</html>
