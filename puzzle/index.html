<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="title">Hex Puzzle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <select id="languageSelect">
    <option value="en">English</option>
    <option value="es">Español</option>
    <option value="zh-Hant">繁體中文</option>
  </select>

  <div>
    <span data-i18n="score">Score:</span>
    <span id="round">0</span>
  </div>
  <div>
    <span data-i18n="time">Time:</span>
    <span id="time">60</span>
  </div>
  <div>
    <span data-i18n="highScore">High Score:</span>
    <span id="highScore">0</span>
  </div>

  <p id="message" data-i18n="watchSequence">Watch the sequence</p>

  <div id="board" class="is-disabled" aria-disabled="true">
    <button class="hex hex-0" data-index="0">0</button>
    <button class="hex hex-1" data-index="1">1</button>
    <button class="hex hex-2" data-index="2">2</button>
    <button class="hex hex-3" data-index="3">3</button>
    <button class="hex hex-4" data-index="4">4</button>
    <button class="hex hex-5" data-index="5">5</button>
    <button class="hex hex-6" data-index="6">6</button>
  </div>

  <button id="startButton" data-i18n="start">Start Game</button>

  <script src="task.js"></script>
  <script src="script.js"></script>
</body>
</html>
