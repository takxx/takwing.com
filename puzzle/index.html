<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <title>Hex Puzzle</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main id="game" class="game">
    <header class="game-header">
      <div class="top-bar">
        <h1 class="game-title" data-i18n="title">
          Hex Puzzle
        </h1>

        <label class="language-control">
          <span class="visually-hidden">
            Language
          </span>

          <select
            id="languageSelect"
            aria-label="Language"
          >
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="zh-Hant">繁體中文</option>
          </select>
        </label>
      </div>

      <section
        id="statusBar"
        class="status-bar"
        aria-label="Game status"
      >
        <div class="status-item">
          <span data-i18n="score">
            Score
          </span>
          <strong id="round">0</strong>
        </div>

        <div class="status-item">
          <span data-i18n="time">
            Time
          </span>
          <strong id="time">60</strong>
        </div>

        <div class="status-item">
          <span data-i18n="highScore">
            High Score
          </span>
          <strong id="highScore">0</strong>
        </div>
      </section>

      <p
        id="message"
        class="instruction"
        data-i18n="watchSequence"
        aria-live="polite"
      >
        Watch the sequence
      </p>
    </header>

    <section
      id="board"
      class="board is-disabled"
      aria-disabled="true"
      aria-label="Swipe game board"
    >
      <button
        type="button"
        class="hex hex-0"
        data-index="0"
        aria-label="Hexagon 1"
      >
        0
      </button>

      <button
        type="button"
        class="hex hex-1"
        data-index="1"
        aria-label="Hexagon 2"
      >
        1
      </button>

      <button
        type="button"
        class="hex hex-2"
        data-index="2"
        aria-label="Hexagon 3"
      >
        2
      </button>

      <button
        type="button"
        class="hex hex-3"
        data-index="3"
        aria-label="Hexagon 4"
      >
        3
      </button>

      <button
        type="button"
        class="hex hex-4"
        data-index="4"
        aria-label="Hexagon 5"
      >
        4
      </button>

      <button
        type="button"
        class="hex hex-5"
        data-index="5"
        aria-label="Hexagon 6"
      >
        5
      </button>

      <button
        type="button"
        class="hex hex-6"
        data-index="6"
        aria-label="Hexagon 7"
      >
        6
      </button>

      <span
        id="feedbackThumb"
        class="feedback-thumb"
        aria-hidden="true"
      ></span>
    </section>

    <div class="controls">
      <button
        id="startButton"
        class="start-button"
        type="button"
        data-i18n="start"
      >
        Start Game
      </button>
    </div>
  </main>

	<script type="module" src="task.js"></script>
	<script type="module" src="script.js"></script>
</body>
</html>
