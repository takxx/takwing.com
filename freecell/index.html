<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="title">FreeCell</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="board">

  <header>
    <h1 data-i18n="title">FreeCell</h1>

    <div class="controls">
      <button id="newBtn" data-i18n="newGame">New</button>
      <button id="restartBtn" data-i18n="restart">Restart</button>
      <button id="undoBtn" data-i18n="undo">Undo</button>
      <button id="autoBtn" data-i18n="autoMove">Auto-move</button>
      <button id="hintBtn" data-i18n="hint">Hint</button>
      
      <select id="langSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh-TW">繁體中文</option>
      </select>
    </div>

    <div id="status"></div>
  </header>

  <div class="row" id="topRow">
    <div class="slot small" data-type="free" data-index="0">
      <div class="label" data-i18n="freeCell">Free</div> 1
    </div>

    <div class="slot small" data-type="free" data-index="1">
      <div class="label" data-i18n="freeCell">Free</div> 2
    </div>

    <div class="slot small" data-type="free" data-index="2">
      <div class="label" data-i18n="freeCell">Free</div> 3
    </div>

    <div class="slot small" data-type="free" data-index="3">
      <div class="label" data-i18n="freeCell">Free</div> 4
    </div>

    <div style="width:24px"></div>

    <div class="slot small" data-type="home" data-index="0">
      <div class="label">♥</div>
    </div>

    <div class="slot small" data-type="home" data-index="1">
      <div class="label">♦</div>
    </div>

    <div class="slot small" data-type="home" data-index="2">
      <div class="label">♣</div>
    </div>

    <div class="slot small" data-type="home" data-index="3">
      <div class="label">♠</div>
    </div>
  </div>

  <div class="row" id="tableauRow">
    <div class="stack" data-type="tableau" data-index="0"></div>
    <div class="stack" data-type="tableau" data-index="1"></div>
    <div class="stack" data-type="tableau" data-index="2"></div>
    <div class="stack" data-type="tableau" data-index="3"></div>
    <div class="stack" data-type="tableau" data-index="4"></div>
    <div class="stack" data-type="tableau" data-index="5"></div>
    <div class="stack" data-type="tableau" data-index="6"></div>
    <div class="stack" data-type="tableau" data-index="7"></div>
  </div>

  <footer>
    <div class="hint" data-i18n="hintText">
      Drag or click cards to move them. Double-click a card to move it to a foundation.
    </div>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
