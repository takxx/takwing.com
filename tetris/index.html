<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tetris (HTML5)</title>
<style>
  :root{
    --cell-size: 28px;
    --cols: 10;
    --rows: 20;
    --board-width: calc(var(--cols) * var(--cell-size));
    --board-height: calc(var(--rows) * var(--cell-size));
  }
  body{ background-color:rgba(32,32,32,1); display:flex; gap:20px; font-family:system-ui,Segoe UI,Roboto,Arial; padding:24px; }
  #container{ display:flex; gap:20px; align-items:flex-start;}
  canvas{ background:#0b1020; image-rendering:pixelated; border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.6); }
  #ui{ width:220px; color:#fff; }
  h1{ font-size:18px; margin:0 0 8px; }
  .panel{ background:#071022; padding:12px; border-radius:8px; margin-bottom:12px; }
  .stat{ display:flex; justify-content:space-between; margin:6px 0; font-size:14px; }
  button{ background:#1e90ff; color:#fff; border:0; padding:8px 10px; border-radius:6px; cursor:pointer; }
  small{ color:#9fb0d6; }
</style>
</head>
<body>
<div id="container">
  <canvas id="board" width="calc(var(--cols) * var(--cell-size))" height="calc(var(--rows) * var(--cell-size))"></canvas>
  <div id="ui">
    <h1>Tetris</h1>
    <div class="panel">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Level</span><strong id="level">1</strong></div>
      <div class="stat"><span>Lines</span><strong id="lines">0</strong></div>
    </div>
    <div class="panel">
      <canvas id="next" width="120" height="120" style="background:#071022;border-radius:6px;"></canvas>
      <div style="margin-top:8px;">
        <button id="start">Start / Restart</button>
        <button id="pause" style="margin-left:8px">Pause</button>
      </div>
      <p style="margin-top:8px"><small>Keys: ← → ↓ rotate: X/Z or ↑ • Space hard drop • P pause</small></p>
    </div>
    <div class="panel" style="font-size:13px;line-height:1.3">
      <strong>Controls</strong>
      <ul>
        <li>Left/Right — move</li>
        <li>Down — soft drop</li>
        <li>Up / X / Z — rotate</li>
        <li>Space — hard drop</li>
      </ul>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS = 10, ROWS = 20, CELL = 28;
  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  board.width = COLS * CELL; board.height = ROWS * CELL;
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const startBtn = document.getElementById('start');
  const pauseBtn = document.getElementById('pause');

  const COLORS = {
    I: '#00f0f0', J: '#0000f0', L: '#f0a000',
    O: '#f0f000', S: '#00f000', T: '#a000f0', Z: '#f00000'
  };

  const SHAPES = {
    I: [[[0,1],[1,1],[2,1],[3,1]],
        [[2,0],[2,1],[2,2],[2,3]]],
    J: [[[0,0],[0,1],[1,1],[2,1]],
        [[1,0],[2,0],[1,1],[1,2]],
        [[0,1],[1,1],[2,1],[2,2]],
        [[1,0],[1,1],[1,2],[0,2]]],
    L: [[[2,0],[0,1],[1,1],[2,1]],
        [[1,0],[1,1],[1,2],[2,2]],
        [[0,1],[1,1],[2,1],[0,2]],
        [[0,0],[1,0],[1,1],[1,2]]],
    O: [[[1,0],[2,0],[1,1],[2,1]]],
    S: [[[1,0],[2,0],[0,1],[1,1]],
        [[1,0],[1,1],[2,1],[2,2]]],
    T: [[[1,0],[0,1],[1,1],[2,1]],
        [[1,0],[1,1],[2,1],[1,2]],
        [[0,1],[1,1],[2,1],[1,2]],
        [[1,0],[0,1],[1,1],[1,2]]],
    Z: [[[0,0],[1,0],[1,1],[2,1]],
        [[2,0],[1,1],[2,1],[1,2]]]
  };

  function makeEmptyBoard(){
    return Array.from({length: ROWS}, ()=>Array(COLS).fill(null));
  }

  let grid = makeEmptyBoard();
  let cur = null, next = null;
  let score = 0, level = 1, lines = 0;
  let dropInterval = 800, dropTimer = 0;
  let lastTime = 0;
  let gameOver = false;
  let paused = false;

  function randPiece(){
    const keys = Object.keys(SHAPES);
    const k = keys[Math.floor(Math.random()*keys.length)];
    return { type: k, rot: 0, x: 3, y: -1, shape: SHAPES[k] };
  }

  function clonePiece(p){
    return { type: p.type, rot: p.rot, x: p.x, y: p.y, shape: p.shape };
  }

  function getBlocks(piece, rot = piece.rot){
    return piece.shape[rot % piece.shape.length];
  }

  function collision(piece, dx=0, dy=0, drot=0){
    const blocks = getBlocks(piece, (piece.rot + drot) % piece.shape.length);
    for(const [bx,by] of blocks){
      const x = piece.x + bx + dx;
      const y = piece.y + by + dy;
      if(x < 0 || x >= COLS) return true;
      if(y >= ROWS) return true;
      if(y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function place(piece){
    for(const [bx,by] of getBlocks(piece)){
      const x = piece.x + bx;
      const y = piece.y + by;
      if(y>=0) grid[y][x] = piece.type;
    }
    clearLines();
    spawn();
  }

  function clearLines(){
    let removed = 0;
    outer: for(let y=ROWS-1; y>=0; y--){
      for(let x=0;x<COLS;x++) if(!grid[y][x]) continue outer;
      grid.splice(y,1);
      grid.unshift(Array(COLS).fill(null));
      removed++;
      y++; // re-check same row after shift
    }
    if(removed){
      lines += removed;
      score += [0,40,100,300,1200][removed] * level;
      level = Math.floor(lines/10) + 1;
      dropInterval = Math.max(80, 800 - (level-1)*60);
      scoreEl.textContent = score;
      levelEl.textContent = level;
      linesEl.textContent = lines;
    }
  }

  function spawn(){
    cur = next || randPiece();
    next = randPiece();
    cur.x = 3; cur.y = -1; cur.rot = 0;
    if(collision(cur,0,0,0)){ gameOver = true; paused=true; alert('Game Over — press Start to restart'); }
  }

  function rotate(dir=1){
    if(!cur) return;
    const len = cur.shape.length;
    const newRot = (cur.rot + dir + len) % len;
    // wall kick simple: try no offset, left, right, up
    const kicks = [[0,0],[-1,0],[1,0],[-2,0],[2,0]];
    for(const [dx,dy] of kicks){
      if(!collision(cur,dx,0, (dir+len)%len )){
        cur.x += dx;
        cur.rot = newRot;
        return;
      }
    }
    // if none worked, don't rotate
  }

  function hardDrop(){
    if(!cur) return;
    while(!collision(cur,0,1,0)) cur.y++;
    place(cur);
  }

  function move(dx){
    if(!cur) return;
    if(!collision(cur,dx,0,0)) cur.x += dx;
  }

  function softDrop(){
    if(!cur) return;
    if(!collision(cur,0,1,0)) cur.y++;
    else place(cur);
  }

  function tick(ts){
    if(!lastTime) lastTime = ts;
    const delta = ts - lastTime;
    lastTime = ts;
    if(!paused && !gameOver){
      dropTimer += delta;
      if(dropTimer > dropInterval){
        dropTimer = 0;
        if(!collision(cur,0,1,0)) cur.y++;
        else place(cur);
      }
    }
    draw();
    requestAnimationFrame(tick);
  }

  function drawCell(x,y,color){
    ctx.fillStyle = color;
    ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.strokeRect(x*CELL+0.5, y*CELL+0.5, CELL-1, CELL-1);
  }

  function drawGrid(){
    ctx.clearRect(0,0,board.width,board.height);
    // draw placed
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const t = grid[y][x];
        if(t) drawCell(x,y,COLORS[t]);
        else {
          // faint grid lines
          ctx.strokeStyle = 'rgba(255,255,255,0.02)';
          ctx.strokeRect(x*CELL+0.5, y*CELL+0.5, CELL-1, CELL-1);
        }
      }
    }
    // ghost piece (show landing position)
    if(cur){
      const ghost = clonePiece(cur);
      while(!collision(ghost,0,1,0)) ghost.y++;
      for(const [bx,by] of getBlocks(ghost)){
        const x = ghost.x + bx, y = ghost.y + by;
        if(y>=0){
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);
        }
      }
    }
    // draw current
    if(cur){
      for(const [bx,by] of getBlocks(cur)){
        const x = cur.x + bx, y = cur.y + by;
        if(y>=0) drawCell(x,y,COLORS[cur.type]);
      }
    }
  }

  function drawNext(){
    nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
    if(!next) return;
    const s = 20;
    const offsetX = 10, offsetY = 10;
    for(const [bx,by] of getBlocks(next,0)){
      nctx.fillStyle = COLORS[next.type];
      nctx.fillRect(offsetX + bx*s, offsetY + by*s, s-2, s-2);
      nctx.strokeStyle = 'rgba(0,0,0,0.2)';
      nctx.strokeRect(offsetX + bx*s + 0.5, offsetY + by*s + 0.5, s-1, s-1);
    }
  }

  function draw(){ drawGrid(); drawNext(); }

  // input
  const keys = {};
  window.addEventListener('keydown', e=>{
    if(e.repeat) return;
    const k = e.key;
    if(k === 'ArrowLeft') { move(-1); }
    else if(k === 'ArrowRight') { move(1); }
    else if(k === 'ArrowDown') { softDrop(); }
    else if(k === ' '){ e.preventDefault(); hardDrop(); }
    else if(k === 'x' || k === 'X' || k === 'ArrowUp'){ rotate(1); }
    else if(k === 'z' || k === 'Z'){ rotate(-1); }
    else if(k === 'p' || k === 'P'){ togglePause(); }
  });

  startBtn.addEventListener('click', ()=>{
    grid = makeEmptyBoard();
    score = 0; level = 1; lines = 0;
    scoreEl.textContent = '0'; levelEl.textContent = '1'; linesEl.textContent = '0';
    dropInterval = 800; dropTimer = 0; gameOver = false; paused = false;
    next = randPiece();
    spawn();
  });

  pauseBtn.addEventListener('click', togglePause);
  function togglePause(){ paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; }

  // Start loop
  next = randPiece();
  spawn();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
