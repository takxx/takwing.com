<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Tetris</title>
<style>
:root {
  --cols: 10;
  --rows: 20;

  --cell-size: 30px;

  --board-width: calc(var(--cols) * var(--cell-size));
  --board-height: calc(var(--rows) * var(--cell-size));

  --page-bg: #10141f;
  --panel-bg: #1a2233;
  --board-bg: #0b1020;
  --border: rgba(255, 255, 255, 0.1);
  --text: #f4f7fb;
  --muted: #a9b6cc;
  --accent: #6c8cff;
  --accent-hover: #829cff;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--page-bg);

  /*
   * The game owns all touch input on the page.
   */
  touch-action: pan-y;
  overscroll-behavior-x: none;

  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;

  margin: 0;
  padding: 16px;

  display: flex;
  justify-content: center;
  align-items: flex-start;

  overflow-x: hidden;

  background:
    radial-gradient(circle at top, #1b263b 0%, var(--page-bg) 52%);

  color: var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  touch-action: pan-y;
  overscroll-behavior-x: none;

  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

button,
select {
  font: inherit;
  touch-action: manipulation;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px 11px;

  color: #fff;
  background: var(--accent);
  cursor: pointer;

  transition:
    background 0.15s ease,
    transform 0.15s ease,
    filter 0.15s ease;

  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

button:hover {
  background: var(--accent-hover);
}

button:active {
  transform: translateY(1px);
  filter: brightness(0.92);
}

button:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(130, 156, 255, 0.55);
  outline-offset: 2px;
}

#container {
  width: 100%;
  max-width: 980px;

  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 24px;

  position: relative;

  touch-action: none;
}

canvas {
  display: block;
  max-width: 100%;

  background: var(--board-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);

  image-rendering: pixelated;
}

#board {
  width: var(--board-width);
  height: var(--board-height);

  flex: 0 0 auto;

  touch-action: none;
  overscroll-behavior: none;

  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#ui {
  width: 240px;

  display: flex;
  flex-direction: column;
  gap: 12px;

  touch-action: manipulation;

  /* FIX: Enable vertical scrolling */
  overflow-y: auto;
  max-height: calc(100dvh - 32px);
  padding-right: 4px;
}

h1 {
  margin: 0 0 4px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.panel {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;

  background: rgba(26, 34, 51, 0.92);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

.stats-panel {
  width: 100%;
}

.next-panel {
  width: 100%;

  display: flex;
  flex-direction: column;

  position: relative;
  padding-top: 76px;
}

#next {
  width: 96px;
  height: 72px;

  position: absolute;
  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  background: #0d1528;
  z-index: 5;

  pointer-events: none;
  touch-action: none;

  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.stat {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin: 7px 0;
  font-size: 14px;
}

.stat strong {
  color: #dce5ff;
  font-variant-numeric: tabular-nums;
}

.button-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.button-row button {
  flex: 1;
}

small {
  color: var(--muted);
}

.keys-hint,
.touch-hint {
  margin: 10px 0 0;
  font-size: 12px;
  line-height: 1.35;
}

label {
  display: block;
  margin-bottom: 7px;

  color: var(--muted);
  font-size: 14px;
}

select {
  width: 100%;
  padding: 8px 10px;

  border: 1px solid rgba(130, 156, 255, 0.55);
  border-radius: 8px;

  color: var(--text);
  background: #0d1528;
}

.audio-controls {
  margin-top: 12px;
}

.audio-controls button {
  width: 100%;
}

.audio-controls button.muted {
  background: #465066;
}

/* Custom, non-blocking game-over dialog */
.game-over-dialog {
  position: fixed;
  inset: 0;
  z-index: 1000;

  display: grid;
  place-items: center;

  padding: 20px;
  background: rgba(4, 7, 14, 0.72);

  backdrop-filter: blur(4px);

  touch-action: manipulation;
}

.game-over-dialog[hidden] {
  display: none;
}

.game-over-panel {
  width: min(360px, 100%);
  padding: 26px;

  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 16px;

  text-align: center;
  background: #202a3e;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);

  animation: dialog-in 0.18s ease-out;
}

.game-over-panel p {
  margin: 0 0 20px;

  color: var(--text);
  font-size: 19px;
  font-weight: 700;
}

.game-over-panel button {
  min-width: 150px;
}

@keyframes dialog-in {
  from {
    opacity: 0;
    transform: scale(0.96) translateY(6px);
  }

  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@media (max-width: 700px) {
  body {
    padding: 12px;
  }

  #container {
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #ui {
    width: min(var(--board-width), 100%);
    max-width: 100%;
  }

  .next-panel {
    padding-top: 80px;
  }
}

@media (max-width: 430px) {
  body {
    padding: 8px;
  }

  #container {
    gap: 12px;
  }

  #ui {
    width: min(var(--board-width), 100%);
    max-width: 100%;
  }

  .next-panel {
    padding-top: 78px;
  }
}
</style>
</head>
<body>
<main id="container">
  <!-- Game board -->
  <canvas id="board" aria-label="Tetris game board"></canvas>

  <!-- UI panel -->
  <section id="ui" aria-label="Game controls">
    <h1 data-i18n="title">Tetris</h1>

    <!-- Next piece + stats + buttons -->
    <section class="panel next-panel" aria-label="Next piece and game stats">
      <!-- Next piece preview -->
      <canvas
        id="next"
        width="96"
        height="72"
        aria-label="Next piece"
      ></canvas>

      <!-- Stats -->
      <section class="panel stats-panel" aria-label="Game statistics">
        <div class="stat">
          <span data-i18n="score">Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span data-i18n="level">Level</span>
          <strong id="level">1</strong>
        </div>
        <div class="stat">
          <span data-i18n="lines">Lines</span>
          <strong id="lines">0</strong>
        </div>
      </section>

      <!-- Start / Pause buttons -->
      <div class="button-row">
        <button id="start" type="button" data-i18n="startRestart">
          Start / Restart
        </button>
        <button id="pause" type="button" data-i18n="pause">
          Pause
        </button>
      </div>

      <!-- Hints -->
      <p class="keys-hint">
        <small data-i18n="keysHint">
          Keys: ← → ↓ rotate: X/Z or ↑ • Space hard drop • P pause
        </small>
      </p>

      <p class="touch-hint">
        <small data-i18n="ctrlTouch">
          Touch: swipe left/right/up/down to move/rotate/soft drop; double-tap for hard drop
        </small>
      </p>
    </section>

    <!-- Language + sound -->
    <section class="panel lang-panel" aria-label="Language and sound settings">
      <label for="lang" data-i18n="language">Language</label>

      <select id="lang">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh-TW">中文</option>
      </select>

      <div class="audio-controls">
        <button id="mute" type="button" aria-pressed="true">
          🔇 <span data-i18n="soundOff">Sound Off</span>
        </button>
      </div>
    </section>
  </section>
</main>

<!-- Game over dialog -->
<div id="game-over-dialog" class="game-over-dialog" hidden>
  <div
    class="game-over-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="game-over-message"
  >
    <p id="game-over-message"></p>
    <button id="game-over-restart" type="button"></button>
  </div>
</div>

<!-- Background music -->
<audio id="bgm" loop preload="auto">
  <source src="tetris-theme.mp3" type="audio/mpeg" />
</audio>

<script>
(() => {
  "use strict";

  const langSelect = document.getElementById("lang");
  const muteBtn = document.getElementById("mute");
  const bgm = document.getElementById("bgm");

  const board = document.getElementById("board");
  const ctx = board.getContext("2d");

  const nextCanvas = document.getElementById("next");
  const nctx = nextCanvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const linesEl = document.getElementById("lines");
  const startBtn = document.getElementById("start");
  const pauseBtn = document.getElementById("pause");

  const gameOverDialog = document.getElementById("game-over-dialog");
  const gameOverMessage = document.getElementById("game-over-message");
  const gameOverRestart = document.getElementById("game-over-restart");

  // =========================
  // Audio settings
  // =========================

  const MUSIC_VOLUME = 0.22;
  const SFX_VOLUME = 0.42;

  if (bgm) {
    bgm.volume = MUSIC_VOLUME;
    bgm.loop = true;
    bgm.preload = "auto";
  }

  let audioCtx = null;
  let isMuted = true;
  let bgmStarted = false;

  function initAudio() {
    if (audioCtx) {
      return;
    }

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      return;
    }

    audioCtx = new AudioContextClass();
  }

  async function ensureAudioReady() {
    if (!audioCtx) {
      initAudio();
    }

    if (!audioCtx) {
      return false;
    }

    if (audioCtx.state === "suspended") {
      try {
        await audioCtx.resume();
      } catch {
        return false;
      }
    }

    return audioCtx.state === "running";
  }

  function resumeAudio() {
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
  }

  function updateMuteButtonText() {
    const t = translations[currentLang] || translations.en;

    if (!muteBtn) {
      return;
    }

    muteBtn.innerHTML = isMuted
      ? `🔇 <span>${t.soundOff}</span>`
      : `🔊 <span>${t.soundOn}</span>`;

    muteBtn.classList.toggle("muted", isMuted);
    muteBtn.setAttribute("aria-pressed", String(!isMuted));
  }

  function ensureBGMPlaying() {
    if (!bgm || isMuted || bgmStarted || gameOver || paused) {
      return;
    }

    bgm.volume = MUSIC_VOLUME;
    bgm.muted = false;

    bgm.play()
      .then(() => {
        bgmStarted = true;
      })
      .catch(() => {
        bgmStarted = false;
      });
  }

  function stopBGM() {
    if (!bgm) {
      return;
    }

    bgm.pause();
    bgmStarted = false;
  }

  function setMuted(muted) {
    isMuted = muted;

    if (bgm) {
      bgm.volume = MUSIC_VOLUME;
      bgm.muted = muted;

      if (muted) {
        bgm.pause();
        bgmStarted = false;
      } else if (!gameOver && !paused) {
        ensureBGMPlaying();
      }
    }
    updateMuteButtonText();
  }

  function playTone(
    frequency,
    duration,
    type = "sine",
    volume = SFX_VOLUME,
    delay = 0
  ) {
    if (!audioCtx || isMuted) {
      return;
    }

    const startTime = audioCtx.currentTime + delay;
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, startTime);

    gain.gain.setValueAtTime(0.0001, startTime);

    gain.gain.exponentialRampToValueAtTime(
      Math.max(volume, 0.001),
      startTime + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      startTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start(startTime);
    oscillator.stop(startTime + duration + 0.03);
  }

  async function playClearSound() {
    if (isMuted) {
      return;
    }

    const ready = await ensureAudioReady();

    if (!ready) {
      return;
    }

    const notes = [523.25, 659.25, 783.99, 1046.5];

    notes.forEach((frequency, index) => {
      playTone(
        frequency,
        0.18,
        "square",
        SFX_VOLUME,
        index * 0.05
      );
    });
  }

  async function playGameOverSound() {
    if (isMuted) {
      return;
    }

    const ready = await ensureAudioReady();

    if (!ready) {
      return;
    }

    const notes = [392.0, 349.23, 329.63, 261.63];
    const noteDuration = 0.35;
    const noteGap = 0.18;

    notes.forEach((frequency, index) => {
      playTone(
        frequency,
        noteDuration,
        "triangle",
        SFX_VOLUME,
        index * noteGap
      );
    });
  }

  if (muteBtn) {
    muteBtn.addEventListener("click", async () => {
      initAudio();
      await ensureAudioReady();
      setMuted(!isMuted);
    });
  }

  // =========================
  // Translations
  // =========================

  const translations = {
    en: {
      title: "Tetris",
      score: "Score",
      level: "Level",
      lines: "Lines",
      startRestart: "(Re)start",
      pause: "Pause",
      resume: "Resume",
      keysHint: "Keys: ← → ↓ rotate: X/Z or ↑ • Space hard drop • P pause",
      ctrlTouch:
        "Touch: swipe left/right to move • tap to rotate • tap+hold to soft drop",
      language: "Language",
      soundOn: "Sound On",
      soundOff: "Sound Off",
      gameOver: "Game Over"
    },

    es: {
      title: "Tetris",
      score: "Puntuación",
      level: "Nivel",
      lines: "Líneas",
      startRestart: "(Re)iniciar",
      pause: "Pausa",
      resume: "Continuar",
      keysHint:
        "Teclas: ← → ↓ rotar: X/Z o ↑ • Espacio caída rápida • P pausa",
      ctrlTouch:
        "Táctil: desliza izquierda/derecha para mover • toca para rotar • mantén pulsado para caída suave",
      language: "Idioma",
      soundOn: "Sonido activado",
      soundOff: "Sonido desactivado",
      gameOver: "Fin de la partida"
    },

    "zh-TW": {
      title: "俄羅斯方塊",
      score: "分數",
      level: "等級",
      lines: "行數",
      startRestart: "(重新)開始",
      pause: "暫停",
      resume: "繼續",
      keysHint: "按鍵：← → ↓ 旋轉：X/Z 或 ↑ • 空格快速落下 • P 暫停",
      ctrlTouch:
        "觸控：向左／右滑動來移動 • 輕點旋轉 • 長按緩慢落下",
      language: "語言",
      soundOn: "聲音開啟",
      soundOff: "聲音關閉",
      gameOver: "遊戲結束"
    }
  };

function detectLanguage() {
  const urlLang = new URLSearchParams(window.location.search)
    .get("lang")
    ?.toLowerCase();

  if (urlLang === "en") return "en";
  if (urlLang === "es") return "es";
  if (urlLang && urlLang.startsWith("zh")) return "zh-TW";

  const navLang = (navigator.language || "").toLowerCase();

  if (navLang.startsWith("zh")) return "zh-TW";
  if (navLang.startsWith("es")) return "es";

  return "en";
}

  let currentLang = detectLanguage();

  function getTranslation(key) {
    const language = translations[currentLang] || translations.en;
    return language[key] || translations.en[key] || key;
  }

  function applyLanguage(lang) {
    currentLang = translations[lang] ? lang : "en";

    document.documentElement.lang =
      currentLang === "zh-TW" ? "zh-Hant" : currentLang;

    const t = translations[currentLang];

    document.querySelectorAll("[data-i18n]").forEach((element) => {
      const key = element.getAttribute("data-i18n");

      if (t[key]) {
        element.textContent = t[key];
      }
    });

    updateMuteButtonText();
    updatePauseButtonText();

    if (gameOverDialog && !gameOverDialog.hidden) {
      gameOverMessage.textContent = getTranslation("gameOver");
      gameOverRestart.textContent = getTranslation("startRestart");
    }
  }

  // =========================
  // Game state
  // =========================

  const COLS = 10;
  const ROWS = 20;
  const BASE_CELL = 30;

  let CELL = BASE_CELL;

  const COLORS = {
    I: "#48C6D9",
    J: "#6878D9",
    L: "#E9A15B",
    O: "#E7C75D",
    S: "#70B98A",
    T: "#B47CC7",
    Z: "#D97979"
  };

  const SHAPES = {
    I: [
      [[0, 1], [1, 1], [2, 1], [3, 1]],
      [[2, 0], [2, 1], [2, 2], [2, 3]]
    ],

    J: [
      [[0, 0], [0, 1], [1, 1], [2, 1]],
      [[1, 0], [2, 0], [1, 1], [1, 2]],
      [[0, 1], [1, 1], [2, 1], [2, 2]],
      [[1, 0], [1, 1], [1, 2], [0, 2]]
    ],

    L: [
      [[2, 0], [0, 1], [1, 1], [2, 1]],
      [[1, 0], [1, 1], [1, 2], [2, 2]],
      [[0, 1], [1, 1], [2, 1], [0, 2]],
      [[0, 0], [1, 0], [1, 1], [1, 2]]
    ],

    O: [
      [[1, 0], [2, 0], [1, 1], [2, 1]]
    ],

    S: [
      [[1, 0], [2, 0], [0, 1], [1, 1]],
      [[1, 0], [1, 1], [2, 1], [2, 2]]
    ],

    T: [
      [[1, 0], [0, 1], [1, 1], [2, 1]],
      [[1, 0], [1, 1], [2, 1], [1, 2]],
      [[0, 1], [1, 1], [2, 1], [1, 2]],
      [[1, 0], [0, 1], [1, 1], [1, 2]]
    ],

    Z: [
      [[0, 0], [1, 0], [1, 1], [2, 1]],
      [[2, 0], [1, 1], [2, 1], [1, 2]]
    ]
  };

  let grid = makeEmptyBoard();
  let cur = null;
  let next = null;

  let score = 0;
  let level = 1;
  let lines = 0;

  let dropInterval = 800;
  let dropTimer = 0;
  let lastTime = 0;

  let gameOver = false;
  let paused = false;
  let gameOverDialogPending = false;

  function makeEmptyBoard() {
    return Array.from(
      { length: ROWS },
      () => Array(COLS).fill(null)
    );
  }

  function randomPiece() {
    const types = Object.keys(SHAPES);
    const type = types[Math.floor(Math.random() * types.length)];

    return {
      type,
      rot: 0,
      x: 3,
      y: -1,
      shape: SHAPES[type]
    };
  }

  function clonePiece(piece) {
    return {
      type: piece.type,
      rot: piece.rot,
      x: piece.x,
      y: piece.y,
      shape: piece.shape
    };
  }

  function getBlocks(piece, rotation = piece.rot) {
    return piece.shape[rotation % piece.shape.length];
  }

  function collision(piece, dx = 0, dy = 0, drot = 0) {
    const rotation =
      (piece.rot + drot + piece.shape.length) %
      piece.shape.length;

    const blocks = getBlocks(piece, rotation);

    for (const [blockX, blockY] of blocks) {
      const x = piece.x + blockX + dx;
      const y = piece.y + blockY + dy;

      if (x < 0 || x >= COLS || y >= ROWS) {
        return true;
      }

      if (y >= 0 && grid[y][x]) {
        return true;
      }
    }

    return false;
  }

  async function place(piece) {
    for (const [blockX, blockY] of getBlocks(piece)) {
      const x = piece.x + blockX;
      const y = piece.y + blockY;

      if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
        grid[y][x] = piece.type;
      }
    }

    await clearLines();
    await spawn();
  }

  async function clearLines() {
    let removed = 0;

    outer:
    for (let y = ROWS - 1; y >= 0; y--) {
      for (let x = 0; x < COLS; x++) {
        if (!grid[y][x]) {
          continue outer;
        }
      }

      grid.splice(y, 1);
      grid.unshift(Array(COLS).fill(null));
      removed++;
      y++;
    }

    if (!removed) {
      return;
    }

    lines += removed;
    score += [0, 40, 100, 300, 1200][removed] * level;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(80, 800 - (level - 1) * 60);

    scoreEl.textContent = String(score);
    levelEl.textContent = String(level);
    linesEl.textContent = String(lines);

    await playClearSound();
  }

  async function spawn() {
    cur = next || randomPiece();
    next = randomPiece();

    cur.x = 3;
    cur.y = -1;
    cur.rot = 0;

    if (!collision(cur)) {
      return;
    }

    gameOver = true;
    paused = true;
    stopBGM();

    if (gameOverDialogPending) {
      return;
    }

    gameOverDialogPending = true;

    initAudio();
    await ensureAudioReady();
    await playGameOverSound();

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        gameOverDialogPending = false;
        showGameOverDialog();
      });
    });
  }

  function rotate(direction = 1) {
    if (!cur || gameOver || paused) {
      return;
    }

    const length = cur.shape.length;
    const kicks = [
      [0, 0],
      [-1, 0],
      [1, 0],
      [-2, 0],
      [2, 0]
    ];

    for (const [dx] of kicks) {
      if (!collision(cur, dx, 0, direction)) {
        cur.x += dx;
        cur.rot = (cur.rot + direction + length) % length;
        return;
      }
    }
  }

  async function hardDrop() {
    if (!cur || gameOver || paused) {
      return;
    }

    while (!collision(cur, 0, 1)) {
      cur.y++;
    }

    await place(cur);
  }

  function move(dx) {
    if (!cur || gameOver || paused) {
      return;
    }

    if (!collision(cur, dx, 0)) {
      cur.x += dx;
    }
  }

  async function softDropStep() {
    if (!cur || gameOver || paused) {
      return;
    }

    if (!collision(cur, 0, 1)) {
      cur.y++;
    } else {
      await place(cur);
    }
  }

  async function startGame() {
    initAudio();
    await ensureAudioReady();

    hideGameOverDialog();

    grid = makeEmptyBoard();
    score = 0;
    level = 1;
    lines = 0;

    dropInterval = 800;
    dropTimer = 0;
    lastTime = 0;

    gameOver = false;
    paused = false;
    gameOverDialogPending = false;

    scoreEl.textContent = "0";
    levelEl.textContent = "1";
    linesEl.textContent = "0";

    next = randomPiece();
    await spawn();

    if (!isMuted) {
      ensureBGMPlaying();
    }

    updatePauseButtonText();
  }

  // =========================
  // Dialog and pause controls
  // =========================

  function showGameOverDialog() {
    gameOverMessage.textContent = getTranslation("gameOver");
    gameOverRestart.textContent = getTranslation("startRestart");
    gameOverDialog.hidden = false;
    gameOverRestart.focus();
  }

  function hideGameOverDialog() {
    gameOverDialog.hidden = true;
  }

  function updatePauseButtonText() {
    if (!pauseBtn) {
      return;
    }

    pauseBtn.textContent = paused
      ? getTranslation("resume")
      : getTranslation("pause");
  }

  function togglePause() {
    if (gameOver) {
      return;
    }

    paused = !paused;
    updatePauseButtonText();

    if (paused) {
      stopBGM();
    } else if (!isMuted) {
      ensureBGMPlaying();
    }
  }

  if (gameOverRestart) {
    gameOverRestart.addEventListener("click", () => {
      hideGameOverDialog();
      startGame().catch(() => {});
    });
  }

  if (startBtn) {
    startBtn.addEventListener("click", () => {
      startGame().catch(() => {});
    });
  }

  if (pauseBtn) {
    pauseBtn.addEventListener("click", togglePause);
  }

  // =========================
  // Drawing
  // =========================

  function getAvailableBoardSize() {
    const viewportWidth = window.visualViewport?.width ?? window.innerWidth;
    const viewportHeight = window.visualViewport?.height ?? window.innerHeight;
    const isMobile = viewportWidth <= 700;
  
    // Include the page's horizontal padding; keep the board within the viewport.
    const horizontalPadding = isMobile
      ? (viewportWidth <= 430 ? 16 : 24)
      : 0;
  
    const availableWidth = Math.max(160, viewportWidth - horizontalPadding);
    const availableHeight = Math.max(1, viewportHeight - 24);
  
    const cellSize = Math.min(
      BASE_CELL,
      availableWidth / COLS,
      availableHeight / ROWS
    );
  
    return {
      width: Math.floor(COLS * cellSize),
      height: Math.floor(ROWS * cellSize)
    };
  }

  function resizeBoardForViewport() {
    const { width, height } = getAvailableBoardSize();

    CELL = width / COLS;

    board.width = width;
    board.height = height;

    board.style.width = `${width}px`;
    board.style.height = `${height}px`;

    board.style.setProperty("--cell-size", `${CELL}px`);
    document.documentElement.style.setProperty("--cell-size", `${CELL}px`);

    draw();
  }

  function drawCell(x, y, color, targetCtx = ctx, cellSize = CELL) {
    targetCtx.fillStyle = color;
    targetCtx.fillRect(
      x * cellSize + 1,
      y * cellSize + 1,
      cellSize - 2,
      cellSize - 2
    );

    targetCtx.strokeStyle = "rgba(255, 255, 255, 0.16)";
    targetCtx.lineWidth = 1;

    targetCtx.strokeRect(
      x * cellSize + 0.5,
      y * cellSize + 0.5,
      cellSize - 1,
      cellSize - 1
    );
  }

  function withAlpha(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);

    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function drawNextSilhouetteOnBoard() {
    if (!next || !cur) {
      return;
    }

    const blocks = getBlocks(next, 0);
    const minX = Math.min(...blocks.map(([x]) => x));
    const maxX = Math.max(...blocks.map(([x]) => x));
    const pieceWidth = maxX - minX + 1;
    const silhouetteX = Math.floor((COLS - pieceWidth) / 2) - minX;

    for (const [blockX, blockY] of blocks) {
      const x = silhouetteX + blockX;
      const y = 1 + blockY;

      if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
        ctx.fillStyle = withAlpha(COLORS[next.type], 0.1);
        ctx.fillRect(
          x * CELL + 2,
          y * CELL + 2,
          CELL - 4,
          CELL - 4
        );

        ctx.strokeStyle = withAlpha(COLORS[next.type], 0.08);
        ctx.strokeRect(
          x * CELL + 1.5,
          y * CELL + 1.5,
          CELL - 3,
          CELL - 3
        );
      }
    }
  }

  function drawGrid() {
    ctx.clearRect(0, 0, board.width, board.height);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const type = grid[y][x];

        if (type) {
          drawCell(x, y, COLORS[type]);
        } else {
          ctx.strokeStyle = "rgba(255, 255, 255, 0.035)";
          ctx.strokeRect(
            x * CELL + 0.5,
            y * CELL + 0.5,
            CELL - 1,
            CELL - 1
          );
        }
      }
    }

    if (!cur) {
      return;
    }

    const ghost = clonePiece(cur);

    while (!collision(ghost, 0, 1)) {
      ghost.y++;
    }

    for (const [blockX, blockY] of getBlocks(ghost)) {
      const x = ghost.x + blockX;
      const y = ghost.y + blockY;

      if (y >= 0) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.075)";
        ctx.fillRect(
          x * CELL + 1,
          y * CELL + 1,
          CELL - 2,
          CELL - 2
        );
      }
    }

    for (const [blockX, blockY] of getBlocks(cur)) {
      const x = cur.x + blockX;
      const y = cur.y + blockY;

      if (y >= 0) {
        drawCell(x, y, COLORS[cur.type]);
      }
    }

    drawNextSilhouetteOnBoard();
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);

    if (!next) {
      return;
    }

    const cellSize = 14;
    const blocks = getBlocks(next, 0);

    const minX = Math.min(...blocks.map(([x]) => x));
    const maxX = Math.max(...blocks.map(([x]) => x));
    const minY = Math.min(...blocks.map(([, y]) => y));
    const maxY = Math.max(...blocks.map(([, y]) => y));

    const pieceWidth = (maxX - minX + 1) * cellSize;
    const pieceHeight = (maxY - minY + 1) * cellSize;

    const offsetX =
      (nextCanvas.width - pieceWidth) / 2 - minX * cellSize;

    const offsetY =
      (nextCanvas.height - pieceHeight) / 2 - minY * cellSize;

    for (const [blockX, blockY] of blocks) {
      nctx.fillStyle = COLORS[next.type];

      nctx.fillRect(
        offsetX + blockX * cellSize + 1,
        offsetY + blockY * cellSize + 1,
        cellSize - 2,
        cellSize - 2
      );

      nctx.strokeStyle = "rgba(255, 255, 255, 0.16)";

      nctx.strokeRect(
        offsetX + blockX * cellSize + 0.5,
        offsetY + blockY * cellSize + 0.5,
        cellSize - 1,
        cellSize - 1
      );
    }
  }

  function draw() {
    drawGrid();
    drawNext();
  }

  // =========================
  // Keyboard controls
  // =========================

  window.addEventListener("keydown", (event) => {
    if (event.repeat) {
      return;
    }

    initAudio();
    resumeAudio();

    switch (event.key) {
      case "ArrowLeft":
        move(-1);
        break;

      case "ArrowRight":
        move(1);
        break;

      case "ArrowDown":
        softDropStep();
        break;

      case " ":
        event.preventDefault();
        hardDrop();
        break;

      case "ArrowUp":
      case "x":
      case "X":
        rotate(1);
        break;

      case "z":
      case "Z":
        rotate(-1);
        break;

      case "p":
      case "P":
        togglePause();
        break;
    }
  });

  // =========================
  // Language controls
  // =========================

  if (langSelect) {
    langSelect.addEventListener("change", () => {
      applyLanguage(langSelect.value);
    });
  }

  // =========================
  // Touch controls (tap / tap+hold / left-right swipe)
  // =========================

  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  let longPressTimer = null;
  let longPressInterval = null;
  let longPressActive = false;
  let didSwipe = false;

  const SWIPE_THRESHOLD = 24;       // min distance to count as swipe
  const TAP_MAX_MOVE = 12;          // max movement to still be a tap
  const TAP_MAX_TIME = 260;         // max duration to be a tap
  const LONGPRESS_DELAY = 320;      // time before long-press starts
  const LONGPRESS_REPEAT = 90;      // soft-drop repeat interval while holding

  function clearLongPress() {
    if (longPressTimer !== null) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
    if (longPressInterval !== null) {
      clearInterval(longPressInterval);
      longPressInterval = null;
    }
    longPressActive = false;
  }

  function startLongPressDrop() {
    if (!cur || gameOver || paused) {
      clearLongPress();
      return;
    }

    // First step immediately
    softDropStep().catch(() => {});

    // Then repeat at interval
    longPressInterval = setInterval(() => {
      if (!cur || gameOver || paused) {
        clearLongPress();
        return;
      }
      softDropStep().catch(() => {});
    }, LONGPRESS_REPEAT);
  }

  function preventBoardGesture(event) {
    // Only prevent default for horizontal gestures we handle.
    // Vertical moves are allowed so page/UI can scroll.
    if (event.touches.length !== 1) {
      return;
    }

    const touch = event.touches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    // If primarily horizontal, prevent default to avoid scroll interfering.
    if (Math.abs(dx) > Math.abs(dy)) {
      event.preventDefault();
    }
    // If primarily vertical, do nothing: let the browser scroll.
  }

  function handleBoardTouchStart(event) {
    if (event.touches.length !== 1) {
      clearLongPress();
      didSwipe = false;
      return;
    }

    const touch = event.touches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = performance.now();

    clearLongPress();
    didSwipe = false;

    initAudio();
    resumeAudio();

    // Start long-press timer for soft drop
    longPressTimer = setTimeout(() => {
      if (gameOver || paused) {
        clearLongPress();
        return;
      }

      // Check we haven't already turned this into a swipe
      const currentTouch = event.touches[0];
      if (!currentTouch) {
        clearLongPress();
        return;
      }

      const dx = currentTouch.clientX - touchStartX;
      const dy = currentTouch.clientY - touchStartY;

      if (Math.abs(dx) > TAP_MAX_MOVE || Math.abs(dy) > TAP_MAX_MOVE) {
        // Moved too much: treat as swipe, not tap/hold
        clearLongPress();
        return;
      }

      longPressActive = true;
      startLongPressDrop();
    }, LONGPRESS_DELAY);
  }

  function handleBoardTouchMove(event) {
    if (event.touches.length !== 1) {
      clearLongPress();
      didSwipe = false;
      return;
    }

    const touch = event.touches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    // If movement exceeds tap threshold, cancel tap/long-press and treat as swipe
    if (
      Math.abs(dx) > TAP_MAX_MOVE ||
      Math.abs(dy) > TAP_MAX_MOVE
    ) {
      clearLongPress();
      didSwipe = true;
    }

    preventBoardGesture(event);
  }

  function handleBoardTouchEnd(event) {
    if (event.changedTouches.length !== 1) {
      clearLongPress();
      didSwipe = false;
      return;
    }

    const touch = event.changedTouches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    const duration = performance.now() - touchStartTime;

    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    const wasLongPress = longPressActive;

    clearLongPress();

    // If we already decided this is a swipe, handle swipe only
    if (didSwipe) {
      // Only horizontal swipes control the game.
      // Vertical movement is ignored so it can scroll the page.
      if (absX > SWIPE_THRESHOLD && absX > Math.abs(dy)) {
        move(dx > 0 ? 1 : -1);
      }
      didSwipe = false;
      return;
    }

    // Not a swipe: decide between tap and long-press
    if (wasLongPress) {
      // Long-press already handled via interval; just stop on lift.
      didSwipe = false;
      return;
    }

    // Treat as tap if within time/move limits
    if (
      duration < TAP_MAX_TIME &&
      absX < TAP_MAX_MOVE &&
      absY < TAP_MAX_MOVE
    ) {
      rotate(1);
    }

    didSwipe = false;
  }

  function handleBoardTouchCancel() {
    clearLongPress();
    didSwipe = false;
  }

  board.addEventListener(
    "touchstart",
    handleBoardTouchStart,
    { passive: false }
  );

  board.addEventListener(
    "touchmove",
    handleBoardTouchMove,
    { passive: false }
  );

  board.addEventListener(
    "touchend",
    handleBoardTouchEnd,
    { passive: false }
  );

  board.addEventListener(
    "touchcancel",
    handleBoardTouchCancel,
    { passive: false }
  );

  ["gesturestart", "gesturechange", "gestureend"].forEach((type) => {
    document.addEventListener(
      type,
      (event) => {
        event.preventDefault();
      },
      { passive: false }
    );
  });

  // =========================
  // Game loop and initialization
  // =========================

  function tick(timestamp) {
    if (!lastTime) {
      lastTime = timestamp;
    }

    const delta = timestamp - lastTime;
    lastTime = timestamp;

    if (!paused && !gameOver && cur) {
      dropTimer += delta;

      if (dropTimer >= dropInterval) {
        dropTimer = 0;

        if (!collision(cur, 0, 1)) {
          cur.y++;
        } else {
          place(cur).catch(() => {});
        }
      }
    }

    draw();
    requestAnimationFrame(tick);
  }

  langSelect.value = currentLang;
  applyLanguage(currentLang);

  next = randomPiece();
  spawn().catch(() => {});

  resizeBoardForViewport();

  window.addEventListener("resize", resizeBoardForViewport);
  window.addEventListener("orientationchange", resizeBoardForViewport);
  document.addEventListener("dblclick", (event) => {
    event.preventDefault();
  }, { passive: false });

  if (window.visualViewport) {
    window.visualViewport.addEventListener(
      "resize",
      resizeBoardForViewport
    );
  }

  requestAnimationFrame(tick);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
