<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="container">
    <!-- Game board -->
    <canvas id="board" aria-label="Tetris game board"></canvas>

    <!-- UI panel -->
    <section id="ui" aria-label="Game controls">
      <h1 data-i18n="title">Tetris</h1>

      <!-- Next piece + stats + buttons -->
      <section class="panel next-panel" aria-label="Next piece and game stats">
        <!-- Next piece preview -->
        <canvas
          id="next"
          width="96"
          height="72"
          aria-label="Next piece"
        ></canvas>

        <!-- Stats -->
        <section class="panel stats-panel" aria-label="Game statistics">
          <div class="stat">
            <span data-i18n="score">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span data-i18n="level">Level</span>
            <strong id="level">1</strong>
          </div>
          <div class="stat">
            <span data-i18n="lines">Lines</span>
            <strong id="lines">0</strong>
          </div>
        </section>

        <!-- Start / Pause buttons -->
        <div class="button-row">
          <button id="start" type="button" data-i18n="startRestart">
            Start / Restart
          </button>
          <button id="pause" type="button" data-i18n="pause">
            Pause
          </button>
        </div>

        <!-- Hints -->
        <p class="keys-hint">
          <small data-i18n="keysHint">
            Keys: ← → ↓ rotate: X/Z or ↑ • Space hard drop • P pause
          </small>
        </p>

        <p class="touch-hint">
          <small data-i18n="ctrlTouch">
            Touch: swipe left/right/up/down to move/rotate/soft drop; double-tap for hard drop
          </small>
        </p>
      </section>

      <!-- Language + sound -->
      <section class="panel lang-panel" aria-label="Language and sound settings">
        <label for="lang" data-i18n="language">Language</label>

        <select id="lang">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="zh-TW">繁體中文</option>
        </select>

        <div class="audio-controls">
          <button id="mute" type="button" aria-pressed="true">
            🔇 <span data-i18n="soundOff">Sound Off</span>
          </button>
        </div>
      </section>
    </section>
  </main>

  <!-- Game over dialog -->
  <div id="game-over-dialog" class="game-over-dialog" hidden>
    <div
      class="game-over-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="game-over-message"
    >
      <p id="game-over-message"></p>
      <button id="game-over-restart" type="button"></button>
    </div>
  </div>

  <!-- Background music -->
  <audio id="bgm" loop preload="auto">
    <source src="tetris-theme.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
