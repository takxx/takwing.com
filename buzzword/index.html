<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Buzzword</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="hive-game">
    <header class="game-header">
      <h1 class="game-title">Buzzword</h1>

      <div class="status-bar">
        <div class="status-item">
          <span class="status-label">TIME</span>
          <strong id="timerDisplay" class="status-value">80</strong>
        </div>

        <div class="status-item">
          <span class="status-label">SCORE</span>
          <strong id="scoreDisplay" class="status-value">0</strong>
        </div>

        <div class="status-item">
          <span class="status-label">BEST</span>
          <strong id="highScoreDisplay" class="status-value">0</strong>
        </div>
      </div>

      <p id="message" class="game-message" aria-live="polite"></p>
    </header>

    <section class="board-section">
      <div id="board" class="hex-board" aria-label="Buzzword board">
        <!-- Hexes injected by JS -->
      </div>

      <div id="currentWord" class="current-word" aria-live="polite"></div>

      <!-- Feedback icons: bee (good) / thumb down (bad) -->
      <div id="feedback" class="feedback" aria-hidden="true"></div>

      <!-- End-of-round overlay -->
      <div id="roundOverlay" class="round-overlay" role="dialog" aria-modal="true" hidden>
        <div class="round-overlay-content">
          <h2 id="roundOverlayTitle" class="round-overlay-title"></h2>
          <p id="roundOverlayMessage" class="round-overlay-message"></p>
          <button id="roundOverlayButton" class="round-overlay-button" type="button"></button>
        </div>
      </div>

      <!-- Start screen overlay -->
      <div id="startOverlay" class="round-overlay" role="dialog" aria-modal="true">
        <div class="round-overlay-content">
          <h2 class="round-overlay-title">How to play</h2>
          <ol class="start-instructions">
            <li>Spell a word by a swipe.</li>
            <li>Each letter can only be used once.</li>
            <li>Find a 7‑letter word to advance to next round.</li>
          </ol>
          <button id="startButton" class="round-overlay-button" type="button">Start game</button>
        </div>
      </div>
    </section>

    <section class="word-bank">
      <h2 class="section-title">Words found</h2>
      <div id="hintList" class="hint-list"></div>
    </section>
  </main>

  <script src="script.js" type="module"></script>
</body>
</html>
