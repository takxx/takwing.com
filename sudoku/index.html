<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>

<style>
:root {
  color-scheme: dark;

  --bg: #0d1117;
  --panel: #161b22;
  --cell: #20272f;
  --cell-border: rgba(148, 163, 184, 0.35);
  --box-border: rgba(203, 213, 225, 0.65);

  --text: #e5e7eb;
  --muted: #9ca3af;

  --input-highlight: #72b7e8;
  --notes-highlight: #d6b84c;

  --wrong: #ef7777;
  --good: #70c7a1;

  --number-1: #4a2e2b;
  --number-2: #4a3a26;
  --number-3: #444224;
  --number-4: #35482a;
  --number-5: #294738;
  --number-6: #284646;
  --number-7: #294052;
  --number-8: #373a52;
  --number-9: #4c2f49;
  
  --control-bg: #252d36;
  --control-bg-hover: #303a46;
  --control-border: #46515e;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size: 15px;
}

body {
  user-select: none;
  -webkit-user-select: none;
}

main {
  width: min(94vw, 640px);
  margin: 0 auto;
  padding: 22px 0 35px;
}

h1 {
  margin: 0 0 12px;
  text-align: center;
  font-size: 24px;
  letter-spacing: 0.02em;
}

.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
  padding: 10px;
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 12px;
  background: var(--panel);
}

button,
select {
  border: 1px solid var(--control-border);
  border-radius: 7px;
  padding: 8px 10px;
  background: var(--control-bg);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  transition:
    background-color 0.15s ease,
    border-color 0.15s ease,
    transform 0.1s ease;
}

button:hover,
select:hover {
  border-color: #64748b;
  background: var(--control-bg-hover);
}

button:active {
  transform: translateY(1px);
}

button:focus-visible,
select:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}

.board-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
}

#board {
  position: relative;
  display: grid;
  width: 100%;
  height: 100%;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  grid-template-rows: repeat(9, minmax(0, 1fr));
  border: 3px solid var(--box-border);
  background: var(--cell-border);
  touch-action: none;
  cursor: crosshair;
}

.board-wrap.notes-mode #board {
  cursor: cell;
}

.cell {
  position: relative;
  display: grid;
  min-width: 0;
  min-height: 0;
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--cell-border);
  background: var(--cell);
  cursor: pointer;
}

.cell:focus,
.cell:focus-visible {
  outline: none;
}

.cell.selected {
  background-color: rgba(114, 183, 232, 0.28);
  box-shadow:
    inset 0 0 0 2px var(--input-highlight);
  z-index: 2;
}

.board-wrap.notes-mode .cell.selected {
  background-color: rgba(214, 184, 76, 0.24);
  box-shadow:
    inset 0 0 0 2px var(--notes-highlight);
}

.cell:nth-child(3n) {
  border-right: 3px solid var(--box-border);
}

.cell:nth-child(n + 19):nth-child(-n + 27),
.cell:nth-child(n + 46):nth-child(-n + 54) {
  border-bottom: 3px solid var(--box-border);
}

.cell[data-value="1"] { background-color: var(--number-1); }
.cell[data-value="2"] { background-color: var(--number-2); }
.cell[data-value="3"] { background-color: var(--number-3); }
.cell[data-value="4"] { background-color: var(--number-4); }
.cell[data-value="5"] { background-color: var(--number-5); }
.cell[data-value="6"] { background-color: var(--number-6); }
.cell[data-value="7"] { background-color: var(--number-7); }
.cell[data-value="8"] { background-color: var(--number-8); }
.cell[data-value="9"] { background-color: var(--number-9); }

.cell.selected[data-value="1"],
.cell.selected[data-value="2"],
.cell.selected[data-value="3"],
.cell.selected[data-value="4"],
.cell.selected[data-value="5"],
.cell.selected[data-value="6"],
.cell.selected[data-value="7"],
.cell.selected[data-value="8"],
.cell.selected[data-value="9"] {
  background-image:
    linear-gradient(
      rgba(114, 183, 232, 0.30),
      rgba(114, 183, 232, 0.30)
    );
}

.board-wrap.notes-mode .cell.selected[data-value="1"],
.board-wrap.notes-mode .cell.selected[data-value="2"],
.board-wrap.notes-mode .cell.selected[data-value="3"],
.board-wrap.notes-mode .cell.selected[data-value="4"],
.board-wrap.notes-mode .cell.selected[data-value="5"],
.board-wrap.notes-mode .cell.selected[data-value="6"],
.board-wrap.notes-mode .cell.selected[data-value="7"],
.board-wrap.notes-mode .cell.selected[data-value="8"],
.board-wrap.notes-mode .cell.selected[data-value="9"] {
  background-image:
    linear-gradient(
      rgba(214, 184, 76, 0.26),
      rgba(214, 184, 76, 0.26)
    );
}

.cell.same {
  box-shadow:
    inset 0 0 0 999px rgba(255, 255, 255, 0.09);
}

.cell.selected.same {
  box-shadow:
    inset 0 0 0 2px var(--input-highlight),
    inset 0 0 0 999px rgba(255, 255, 255, 0.09);
}

.board-wrap.notes-mode .cell.selected.same {
  box-shadow:
    inset 0 0 0 2px var(--notes-highlight),
    inset 0 0 0 999px rgba(255, 255, 255, 0.09);
}

.value {
  position: relative;
  z-index: 2;
  font-size: clamp(18px, 5.5vw, 30px);
  font-weight: 700;
  line-height: 1;
  font-family:
    "Chalkboard SE",
    "Chalkboard",
    "Comic Sans MS",
    "Segoe Print",
    "Bradley Hand",
    "Marker Felt",
    "Comic Sans",
    cursive;
}

.cell.fixed .value {
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Ubuntu,
    Cantarell,
    sans-serif;
  color: #d3d9e0;
  font-weight: 800;
}

.cell.user .value {
  color: #7dd3fc;
}

.cell.error .value {
  color: var(--wrong);
}

.notes {
  position: absolute;
  inset: 2px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  color: rgba(226, 232, 240, 0.72);
  font-size: clamp(7px, 1.7vw, 10px);
  line-height: 1;
}

.notes span {
  display: grid;
  place-items: center;
}

#status {
  min-height: 20px;
  margin: 10px 0 12px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

#status.good {
  color: var(--good);
}

#status.error {
  color: var(--wrong);
}

.controls {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
  width: 100%;
  margin-top: 12px;
  align-items: stretch;
}

.numbers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 8px;
  min-width: 0;
}

.numbers button {
  aspect-ratio: 1.75;
  padding: 0;
  font-size: clamp(20px, 6vw, 28px);
  font-weight: 800;
}

.actions {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 8px;
  min-width: 0;
}

.actions button {
  min-width: 0;
  padding: 14px 10px;
  font-weight: 700;
}

#notes.active {
  border-color: var(--notes-highlight);
  background: #4a4126;
  color: #ead57d;
}

.help {
  margin-top: 14px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}

.language-control {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
  color: var(--muted);
  font-size: 13px;
}

.language-control select {
  min-width: 145px;
  padding: 7px 9px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>
<main>
  <h1>Color Sudoku</h1>

  <div class="bar">
    <select id="difficulty" aria-label="Difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button id="new" type="button">New game</button>
    <button id="undo" type="button">Undo</button>
    <button id="hint" type="button">Hint</button>
    <button id="check" type="button">Check</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div
      id="board"
      role="grid"
      aria-label="Sudoku board"
      tabindex="0"
    ></div>
  </div>

  <div id="status" aria-live="polite">
    Select one or more cells, then choose a number.
  </div>

  <div class="controls">
    <div class="numbers" aria-label="Number pad">
      <button type="button" data-value="1">1</button>
      <button type="button" data-value="2">2</button>
      <button type="button" data-value="3">3</button>
      <button type="button" data-value="4">4</button>
      <button type="button" data-value="5">5</button>
      <button type="button" data-value="6">6</button>
      <button type="button" data-value="7">7</button>
      <button type="button" data-value="8">8</button>
      <button type="button" data-value="9">9</button>
    </div>

    <div class="actions">
      <button id="notes" type="button" aria-pressed="false">
        Notes
      </button>

      <button id="erasePad" type="button">
        Erase
      </button>
    </div>
  </div>

  <p class="help">
    Tap a cell to select it.<br>
    In <b>Notes mode</b>, drag across cells or hold <b>Shift</b> with arrow keys to select multiple cells, including irregular shapes.<br>
    A number is added to every selected editable cell in Notes mode.
  </p>

  <div class="language-control">
    <label for="language">Language</label>

    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="zh">繁體中文</option>
    </select>
  </div>
</main>

<script>
"use strict";

const SIZE = 9;
const BOX_SIZE = 3;
const MAX_HISTORY = 200;
const NUMBERS = [1, 2, 3, 4, 5, 6, 7, 8, 9];

const boardWrap = document.getElementById("boardWrap");
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const difficultyEl = document.getElementById("difficulty");
const notesButton = document.getElementById("notes");
const languageEl = document.getElementById("language");
const languageLabelEl = document.querySelector(".language-control label");
const helpEl = document.querySelector(".help");
const numbersEl = document.querySelector(".numbers");

const targetClues = {
  easy: 30,
  medium: 23,
  hard: 18
};

const LANGUAGE_STORAGE_KEY = "color-sudoku-language";
const SUPPORTED_LANGUAGES = ["en", "es", "zh"];

const translations = {

    notesModeOff: "Modo de notas desactivado. Solo se puede seleccionar una celda.",
    nothingToUndo: "No hay nada que deshacer.",
    moveUndone: "Movimiento deshecho.",
    noHints: "No hacen falta pistas.",
    hintPlaced: "Pista colocada.",
    solved: "¡Resuelto! Muy bien.",
    incorrectEntry: "entrada incorrecta",
    incorrectEntries: "entradas incorrectas",
    noIncorrectEntries: "No hay entradas incorrectas por ahora.",
    newPuzzle: "Nuevo rompecabezas generado.",
    empty: "vacía",
    value: "valor",
    row: "Fila",
    column: "columna",
    selectedCount: "celdas seleccionadas"
  },

  zh: {
    documentTitle: "數獨",
    heading: "數獨",
    difficultyLabel: "難度",
    easy: "簡單",
    medium: "中等",
    hard: "困難",
    newGame: "新遊戲",
    undo: "還原",
    hint: "提示",
    check: "檢查",
    initialStatus: "請選擇一格，然後選擇數字。",
    numberPadLabel: "數字鍵盤",
    notes: "筆記",
    notesOn: "筆記：開啟",
    erase: "清除",
    language: "語言",
    helpFirst: "點擊一格以選取。",
    selectCell: "請先選擇至少一格。",
    fixedCell: "部分已選取的格子是固定提示。",
    notesModeOn: "筆記模式已開啟。可以選取多格。",
    notesModeOff: "筆記模式已關閉。只能選取一格。",
    nothingToUndo: "沒有可復原的操作。",
    moveUndone: "已復原操作。",
    noHints: "不需要提示。",
    hintPlaced: "已放置提示。",
    solved: "完成！做得好！",
    incorrectEntry: "個錯誤答案",
    incorrectEntries: "個錯誤答案",
    noIncorrectEntries: "目前沒有錯誤答案。",
    newPuzzle: "已產生新題目。",
    empty: "空白",
    value: "數字",
    row: "第",
    column: "列",
    selectedCount: "格已選取"
  }
};

let currentLanguage = getInitialLanguage();

let solution = createEmptyGrid();
let puzzle = createEmptyGrid();
let current = createEmptyGrid();
let fixed = createEmptyGrid();
let notes = createNotesGrid();

let history = [];

let selectedCells = new Set();
let selectionAnchor = null;
let selectionHead = null;

let noteMode = false;
let pointerSelecting = false;
let lastPointerCell = null;

function normalizeLanguage(language) {
  if (!language) return null;

  const normalized = language.toLowerCase().split("-")[0];

  return SUPPORTED_LANGUAGES.includes(normalized)
    ? normalized
    : null;
}

function getInitialLanguage() {
  const urlLanguage = normalizeLanguage(
    new URLSearchParams(window.location.search).get("lang")
  );

  if (urlLanguage) return urlLanguage;

  let savedLanguage = null;

  try {
    savedLanguage = normalizeLanguage(
      localStorage.getItem(LANGUAGE_STORAGE_KEY)
    );
  } catch {
    savedLanguage = null;
  }

  if (savedLanguage) return savedLanguage;

  const browserLanguages = Array.isArray(navigator.languages)
    ? navigator.languages
    : [navigator.language];

  for (const browserLanguage of browserLanguages) {
    const preferredLanguage = normalizeLanguage(browserLanguage);

    if (preferredLanguage) return preferredLanguage;
  }

  return "en";
}

function t(key) {
  return translations[currentLanguage][key]
    ?? translations.en[key]
    ?? key;
}

function applyTranslations() {
  document.documentElement.lang = currentLanguage;
  document.title = t("documentTitle");

  document.querySelector("h1").textContent = t("heading");

  difficultyEl.setAttribute("aria-label", t("difficultyLabel"));

  difficultyEl.options[0].textContent = t("easy");
  difficultyEl.options[1].textContent = t("medium");
  difficultyEl.options[2].textContent = t("hard");

  document.getElementById("new").textContent = t("newGame");
  document.getElementById("undo").textContent = t("undo");
  document.getElementById("hint").textContent = t("hint");
  document.getElementById("check").textContent = t("check");

  numbersEl.setAttribute("aria-label", t("numberPadLabel"));

  notesButton.textContent = noteMode ? t("notesOn") : t("notes");
  document.getElementById("erasePad").textContent = t("erase");

  languageLabelEl.textContent = t("language");
  languageEl.setAttribute("aria-label", t("language"));

  helpEl.innerHTML = `
    ${t("helpFirst")}
  `;

  updateMode();
  render();
}

function createEmptyGrid() {
  return Array.from(
    { length: SIZE },
    () => Array(SIZE).fill(0)
  );
}

function createNotesGrid() {
  return Array.from(
    { length: SIZE },
    () => Array.from(
      { length: SIZE },
      () => new Set()
    )
  );
}

function copyGrid(grid) {
  return grid.map(row => [...row]);
}

function copyNotes(grid) {
  return grid.map(row =>
    row.map(cellNotes => new Set(cellNotes))
  );
}

function shuffled(values) {
  const result = [...values];

  for (let index = result.length - 1; index > 0; index--) {
    const randomIndex = Math.floor(Math.random() * (index + 1));

    [result[index], result[randomIndex]] = [
      result[randomIndex],
      result[index]
    ];
  }

  return result;
}

function cellKey(row, col) {
  return `${row},${col}`;
}

function parseCellKey(key) {
  const [row, col] = key.split(",").map(Number);
  return [row, col];
}

function isValidCell(row, col) {
  return (
    row >= 0 &&
    row < SIZE &&
    col >= 0 &&
    col < SIZE
  );
}

function isValid(grid, row, col, value) {
  for (let index = 0; index < SIZE; index++) {
    if (grid[row][index] === value) return false;
    if (grid[index][col] === value) return false;
  }

  const boxRow = Math.floor(row / BOX_SIZE) * BOX_SIZE;
  const boxCol = Math.floor(col / BOX_SIZE) * BOX_SIZE;

  for (
    let currentRow = boxRow;
    currentRow < boxRow + BOX_SIZE;
    currentRow++
  ) {
    for (
      let currentCol = boxCol;
      currentCol < boxCol + BOX_SIZE;
      currentCol++
    ) {
      if (grid[currentRow][currentCol] === value) {
        return false;
      }
    }
  }

  return true;
}

function findEmptyCell(grid) {
  for (let row = 0; row < SIZE; row++) {
    for (let col = 0; col < SIZE; col++) {
      if (grid[row][col] === 0) return [row, col];
    }
  }

  return null;
}

function fillGrid(grid) {
  const emptyCell = findEmptyCell(grid);

  if (!emptyCell) return true;

  const [row, col] = emptyCell;

  for (const value of shuffled(NUMBERS)) {
    if (!isValid(grid, row, col, value)) continue;

    grid[row][col] = value;

    if (fillGrid(grid)) return true;

    grid[row][col] = 0;
  }

  return false;
}

function countSolutions(grid, limit = 2) {
  const emptyCell = findEmptyCell(grid);

  if (!emptyCell) return 1;

  const [row, col] = emptyCell;
  let solutionCount = 0;

  for (const value of NUMBERS) {
    if (!isValid(grid, row, col, value)) continue;

    grid[row][col] = value;

    solutionCount += countSolutions(
      grid,
      limit - solutionCount
    );

    grid[row][col] = 0;

    if (solutionCount >= limit) {
      return solutionCount;
    }
  }

  return solutionCount;
}

function hasContradiction(grid, row, col) {
  const value = grid[row][col];

  if (value === 0) return false;

  for (let currentCol = 0; currentCol < SIZE; currentCol++) {
    if (
      currentCol !== col &&
      grid[row][currentCol] === value
    ) {
      return true;
    }
  }

  for (let currentRow = 0; currentRow < SIZE; currentRow++) {
    if (
      currentRow !== row &&
      grid[currentRow][col] === value
    ) {
      return true;
    }
  }

  const boxRow = Math.floor(row / BOX_SIZE) * BOX_SIZE;
  const boxCol = Math.floor(col / BOX_SIZE) * BOX_SIZE;

  for (
    let currentRow = boxRow;
    currentRow < boxRow + BOX_SIZE;
    currentRow++
  ) {
    for (
      let currentCol = boxCol;
      currentCol < boxCol + BOX_SIZE;
      currentCol++
    ) {
      if (
        (currentRow !== row || currentCol !== col) &&
        grid[currentRow][currentCol] === value
      ) {
        return true;
      }
    }
  }

  return false;
}

function generatePuzzle(difficulty) {
  solution = createEmptyGrid();
  fillGrid(solution);

  puzzle = copyGrid(solution);

  const cells = shuffled(
    Array.from(
      { length: SIZE * SIZE },
      (_, index) => [
        Math.floor(index / SIZE),
        index % SIZE
      ]
    )
  );

  const target =
    targetClues[difficulty] ?? targetClues.medium;

  let clueCount = SIZE * SIZE;

  for (const [row, col] of cells) {
    if (clueCount <= target) break;

    const originalValue = puzzle[row][col];
    puzzle[row][col] = 0;

    if (countSolutions(copyGrid(puzzle)) === 1) {
      clueCount--;
    } else {
      puzzle[row][col] = originalValue;
    }
  }

  current = copyGrid(puzzle);

  fixed = puzzle.map(row =>
    row.map(value => value !== 0)
  );

  notes = createNotesGrid();
  history = [];

  selectedCells = new Set();
  selectionAnchor = null;
  selectionHead = null;
}

function buildBoard() {
  boardEl.replaceChildren();

  for (let row = 0; row < SIZE; row++) {
    for (let col = 0; col < SIZE; col++) {
      const cell = document.createElement("div");

      cell.className = "cell";
      cell.dataset.row = String(row);
      cell.dataset.col = String(col);
      cell.setAttribute("role", "gridcell");
      cell.setAttribute("tabindex", "-1");

      boardEl.appendChild(cell);
    }
  }
}

function getCellElement(row, col) {
  return boardEl.children[row * SIZE + col];
}

function getCellFromPoint(clientX, clientY) {
  const boardRect = boardEl.getBoundingClientRect();

  const col = Math.floor(
    ((clientX - boardRect.left) / boardRect.width) * SIZE
  );

  const row = Math.floor(
    ((clientY - boardRect.top) / boardRect.height) * SIZE
  );

  return isValidCell(row, col) ? [row, col] : null;
}

function setSingleSelection(row, col) {
  selectedCells = new Set([cellKey(row, col)]);
  selectionAnchor = [row, col];
  selectionHead = [row, col];
}

function setRectangularSelection(anchor, head) {
  const [anchorRow, anchorCol] = anchor;
  const [headRow, headCol] = head;

  const minRow = Math.min(anchorRow, headRow);
  const maxRow = Math.max(anchorRow, headRow);
  const minCol = Math.min(anchorCol, headCol);
  const maxCol = Math.max(anchorCol, headCol);

  selectedCells = new Set();

  for (let row = minRow; row <= maxRow; row++) {
    for (let col = minCol; col <= maxCol; col++) {
      selectedCells.add(cellKey(row, col));
    }
  }
}

function extendSelectionTo(row, col) {
  if (!isValidCell(row, col)) return;

  if (!selectionHead) {
    setSingleSelection(row, col);
    return;
  }

  selectedCells.add(cellKey(row, col));
  selectionHead = [row, col];
}

function selectCell(row, col, extend = false) {
  if (!isValidCell(row, col)) return;

  if (extend && noteMode) {
    extendSelectionTo(row, col);
  } else {
    setSingleSelection(row, col);
  }

  render();
  boardEl.focus({ preventScroll: true });
}

function beginPointerSelection(row, col) {
  pointerSelecting = noteMode;
  lastPointerCell = noteMode ? [row, col] : null;

  setSingleSelection(row, col);
  render();
}

function extendPointerSelection(row, col) {
  if (!pointerSelecting || !noteMode) return;
  if (!isValidCell(row, col)) return;

  const key = cellKey(row, col);

  if (selectedCells.has(key)) return;

  selectedCells.add(key);
  selectionHead = [row, col];
  lastPointerCell = [row, col];

  render();
}

function endPointerSelection() {
  pointerSelecting = false;
  lastPointerCell = null;
}

function moveSelection(rowChange, colChange, extend = false) {
  if (selectedCells.size === 0) {
    selectCell(0, 0);
    return;
  }

  let base;

  if (selectionHead) {
    base = selectionHead;
  } else if (selectionAnchor) {
    base = selectionAnchor;
  } else {
    base = parseCellKey([...selectedCells][0]);
  }

  const [row, col] = Array.isArray(base)
    ? base
    : parseCellKey(base);

  const nextRow = (row + rowChange + SIZE) % SIZE;
  const nextCol = (col + colChange + SIZE) % SIZE;

  selectCell(nextRow, nextCol, extend);
}

function saveHistory() {
  history.push({
    current: copyGrid(current),
    notes: copyNotes(notes)
  });

  if (history.length > MAX_HISTORY) {
    history.shift();
  }
}

function setStatus(message, type = "") {
  statusEl.textContent = message;
  statusEl.className = type;
}

function updateMode() {
  boardWrap.classList.toggle("notes-mode", noteMode);
  notesButton.classList.toggle("active", noteMode);
  notesButton.setAttribute("aria-pressed", String(noteMode));
  notesButton.textContent = noteMode ? t("notesOn") : t("notes");
}

function toggleNoteMode() {
  noteMode = !noteMode;

  if (!noteMode && selectedCells.size > 1) {
    const lastCell = selectionHead ?? selectionAnchor;

    if (lastCell) {
      setSingleSelection(lastCell[0], lastCell[1]);
    }
  }

  updateMode();
  render();

  setStatus(
    noteMode ? t("notesModeOn") : t("notesModeOff")
  );
}

function getEditableSelectedCells() {
  return [...selectedCells]
    .map(parseCellKey)
    .filter(([row, col]) => !fixed[row][col]);
}

function setValue(value) {
  const editableCells = getEditableSelectedCells();

  if (selectedCells.size === 0) {
    setStatus(t("selectCell"), "error");
    return;
  }

  if (editableCells.length === 0) {
    setStatus(t("fixedCell"), "error");
    return;
  }

  saveHistory();

  if (noteMode) {
    const allHaveNote = editableCells.every(
      ([row, col]) => notes[row][col].has(value)
    );

    for (const [row, col] of editableCells) {
      if (current[row][col] !== 0) {
        current[row][col] = 0;
      }

      if (allHaveNote) {
        notes[row][col].delete(value);
      } else {
        notes[row][col].add(value);
      }
    }
  } else {
    for (const [row, col] of editableCells) {
      current[row][col] = value;
      notes[row][col].clear();
    }
  }

  render();
		if (!noteMode && isSolved()) {
		setStatus(t("solved"), "good");
	}
}

function erase() {
  const editableCells = getEditableSelectedCells();

  if (selectedCells.size === 0) {
    setStatus(t("selectCell"), "error");
    return;
  }

  if (editableCells.length === 0) {
    setStatus(t("fixedCell"), "error");
    return;
  }

  const hasContent = editableCells.some(
    ([row, col]) =>
      current[row][col] !== 0 ||
      notes[row][col].size > 0
  );

  if (!hasContent) return;

  saveHistory();

  for (const [row, col] of editableCells) {
    current[row][col] = 0;
    notes[row][col].clear();
  }

  render();
}

function undo() {
  const previousState = history.pop();

  if (!previousState) {
    setStatus(t("nothingToUndo"), "error");
    return;
  }

  current = previousState.current;
  notes = previousState.notes;

  render();
  setStatus(t("moveUndone"));
}

function giveHint() {
  const availableCells = [];

  for (let row = 0; row < SIZE; row++) {
    for (let col = 0; col < SIZE; col++) {
      if (
        !fixed[row][col] &&
        current[row][col] !== solution[row][col]
      ) {
        availableCells.push([row, col]);
      }
    }
  }

  if (availableCells.length === 0) {
    setStatus(t("noHints"), "good");
    return;
  }

  const randomIndex = Math.floor(
    Math.random() * availableCells.length
  );

  const [row, col] = availableCells[randomIndex];

  saveHistory();

  current[row][col] = solution[row][col];
  notes[row][col].clear();

  setSingleSelection(row, col);
  render();

  setStatus(t("hintPlaced"), "good");
}

function checkPuzzle() {
  let mistakes = 0;

  for (let row = 0; row < SIZE; row++) {
    for (let col = 0; col < SIZE; col++) {
      const value = current[row][col];

      if (
        !fixed[row][col] &&
        value !== 0 &&
        value !== solution[row][col]
      ) {
        mistakes++;
      }
    }
  }

  if (mistakes > 0) {
    if (currentLanguage === "zh") {
      setStatus(
        `${mistakes}${t("incorrectEntries")}.`,
        "error"
      );
    } else {
      const label = mistakes === 1
        ? t("incorrectEntry")
        : t("incorrectEntries");

      setStatus(`${mistakes} ${label}.`, "error");
    }

    return;
  }

  if (isSolved()) {
    setStatus(t("solved"), "good");
    return;
  }

  setStatus(t("noIncorrectEntries"), "good");
}

function isSolved() {
  for (let row = 0; row < SIZE; row++) {
    for (let col = 0; col < SIZE; col++) {
      if (current[row][col] !== solution[row][col]) {
        return false;
      }
    }
  }

  return true;
}

function getCellMarkup(row, col, value) {
  if (value !== 0) {
    return `<div class="value">${value}</div>`;
  }

  const cellNotes = notes[row][col];

  if (cellNotes.size === 0) return "";

  return `
    <div class="notes">
      ${NUMBERS.map(number => `
        <span>${
          cellNotes.has(number) ? number : ""
        }</span>
      `).join("")}
    </div>
  `;
}

function getCellAriaLabel(row, col, value) {
  if (currentLanguage === "zh") {
    return `第 ${row + 1} 行，第 ${col + 1} 列，${
      value === 0 ? t("empty") : `${t("value")} ${value}`
    }`;
  }

  return `${t("row")} ${row + 1}, ${t("column")} ${
    col + 1
  }, ${
    value === 0 ? t("empty") : `${t("value")} ${value}`
  }`;
}

function render() {
  updateMode();

  const primaryKey = selectionAnchor
    ? cellKey(selectionAnchor[0], selectionAnchor[1])
    : [...selectedCells][0];

  const primaryCell = primaryKey
    ? parseCellKey(primaryKey)
    : null;

  const primaryValue = primaryCell
    ? current[primaryCell[0]][primaryCell[1]]
    : 0;

  [...boardEl.children].forEach((cell, index) => {
    const row = Math.floor(index / SIZE);
    const col = index % SIZE;
    const value = current[row][col];

    cell.className = "cell";

    if (selectedCells.has(cellKey(row, col))) {
      cell.classList.add("selected");
    }

    const hasSameValue =
      primaryValue !== 0 &&
      value === primaryValue &&
      !selectedCells.has(cellKey(row, col));

    const isIncorrect =
      !fixed[row][col] &&
      hasContradiction(current, row, col);

    if (hasSameValue) cell.classList.add("same");
    if (isIncorrect) cell.classList.add("error");

    cell.innerHTML = getCellMarkup(row, col, value);

    if (value !== 0) {
      cell.dataset.value = String(value);
      cell.classList.add(
        fixed[row][col] ? "fixed" : "user"
      );
    } else {
      delete cell.dataset.value;
    }

    cell.setAttribute(
      "aria-label",
      getCellAriaLabel(row, col, value)
    );
  });

  if (selectedCells.size > 1) {
    setStatus(
      `${selectedCells.size} ${t("selectedCount")}.`
    );
  }
}

function handleKeyboard(event) {
  const target = event.target;

  if (
    target instanceof HTMLInputElement ||
    target instanceof HTMLSelectElement ||
    target instanceof HTMLTextAreaElement
  ) {
    return;
  }

  const extend = event.shiftKey && noteMode;

  switch (event.key) {
    case "ArrowUp":
      event.preventDefault();
      moveSelection(-1, 0, extend);
      break;

    case "ArrowDown":
      event.preventDefault();
      moveSelection(1, 0, extend);
      break;

    case "ArrowLeft":
      event.preventDefault();
      moveSelection(0, -1, extend);
      break;

    case "ArrowRight":
      event.preventDefault();
      moveSelection(0, 1, extend);
      break;

    case "Backspace":
    case "Delete":
    case "0":
      event.preventDefault();
      erase();
      break;

    case "n":
    case "N":
      event.preventDefault();
      toggleNoteMode();
      break;

    default:
      if (event.key >= "1" && event.key <= "9") {
        event.preventDefault();
        setValue(Number(event.key));
      }
  }
}

function handlePointerDown(event) {
  const cell = getCellFromPoint(
    event.clientX,
    event.clientY
  );

  if (!cell) return;

  event.preventDefault();
  boardEl.setPointerCapture(event.pointerId);

  const [row, col] = cell;

  if (noteMode && event.shiftKey && selectionAnchor) {
    selectionHead = [row, col];
    setRectangularSelection(selectionAnchor, selectionHead);
    pointerSelecting = true;
    lastPointerCell = [row, col];
  } else {
    beginPointerSelection(row, col);
  }

  render();
  boardEl.focus({ preventScroll: true });
}

function handlePointerMove(event) {
  if (!pointerSelecting || !noteMode) return;

  const cell = getCellFromPoint(
    event.clientX,
    event.clientY
  );

  if (!cell) return;

  const [row, col] = cell;

  if (
    lastPointerCell &&
    lastPointerCell[0] === row &&
    lastPointerCell[1] === col
  ) {
    return;
  }

  extendPointerSelection(row, col);
}

function handlePointerUp(event) {
  if (!pointerSelecting) return;

  endPointerSelection();

  if (boardEl.hasPointerCapture(event.pointerId)) {
    boardEl.releasePointerCapture(event.pointerId);
  }

  render();
}

function handlePointerCancel(event) {
  endPointerSelection();

  if (boardEl.hasPointerCapture(event.pointerId)) {
    boardEl.releasePointerCapture(event.pointerId);
  }

  render();
}

document
  .querySelectorAll(".numbers button")
  .forEach(button => {
    button.addEventListener("click", () => {
      setValue(Number(button.dataset.value));
    });
  });

boardEl.addEventListener(
  "pointerdown",
  handlePointerDown
);

boardEl.addEventListener(
  "pointermove",
  handlePointerMove
);

boardEl.addEventListener(
  "pointerup",
  handlePointerUp
);

boardEl.addEventListener(
  "pointercancel",
  handlePointerCancel
);

document.getElementById("new").addEventListener("click", () => {
  generatePuzzle(difficultyEl.value);
  render();
  setStatus(t("newPuzzle"));
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("hint").addEventListener("click", giveHint);
document.getElementById("check").addEventListener("click", checkPuzzle);
document.getElementById("erasePad").addEventListener("click", erase);
document.getElementById("notes").addEventListener("click", toggleNoteMode);

languageEl.addEventListener("change", () => {
  currentLanguage = languageEl.value;

  try {
    localStorage.setItem(LANGUAGE_STORAGE_KEY, currentLanguage);
  } catch {
    /* Storage may be unavailable. */
  }

  applyTranslations();
  setStatus(t("initialStatus"));
});

document.addEventListener("keydown", handleKeyboard);

buildBoard();
languageEl.value = currentLanguage;
applyTranslations();
generatePuzzle(difficultyEl.value);
render();
setStatus(t("initialStatus"));
</script>
</body>
</html>
