<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rummiqub</title>
<style>
:root {
  color-scheme: dark;
  font: 15px/1.4 serif;
  color: #f5efe2;

  --royal: #1e2f66;
  --royal-deep: #13214a;
  --royal-soft: #2b448c;
  --velvet: #243a7a;
  --gold: #d7b15a;
  --gold-light: #f0cf82;
  --gold-dim: #a88634;
  --tile-brown: #4a2f1f;
  --tile-brown-dark: #352014;
  --tile-border: #8a5a31;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 18px;
  color: #f5efe2;
  background:#0f1731;
}

#mosaic-bg {position: fixed;inset: 0;z-index: 0;width: 100%;height: 100%;opacity: 0.18;pointer-events: none;}

.game {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  position: relative;z-index: 1;
}

.game-layout {
  display: grid;
  grid-template-areas:
    "header"
    "board"
    "side";
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  direction: ltr;
}

.game-header {
  grid-area: header;
}

.game-header h1 {
  color: var(--gold-light);
  margin: 0 0 6px;
}

.game-header p {
  margin: 0;
}

.board-column {
  grid-area: board;
  min-width: 0;
}

.side-panel {
  grid-area: side;
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 12px;
}

.hand-section,
.board-section {
  min-width: 0;
}

h2 {
  margin: 0 0 8px;
  font-size: 1.08rem;
}

.title-row,
.hand-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.title-row h1,
.hand-title-row h2 {
  margin: 0;
}

.board-layout {
  display: grid;
  width: min(100%, 720px);
  aspect-ratio: 1 / 1;
  min-width: 0;
  min-height: 0;
  grid-template:
    ". top ." 28px
    "left center right" minmax(0, 5fr)
    ". bottom ." 28px
    / 28px minmax(0, 5fr) 28px;
  gap: 4px;
  padding: 5px;
  border: 1px solid var(--gold-dim);
  border-radius: 12px;
  background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
  box-shadow: 0 6px 24px rgb(0 0 0 / 35%);
}

.board-center {
  grid-area: center;
  min-width: 0;
  min-height: 0;
  overflow: auto;
  padding: 8px;
  border: 1px solid var(--gold-dim);
  border-radius: 8px;
  background: linear-gradient(180deg, var(--royal) 0%, var(--royal-deep) 100%);
}

.table {
  display: flex;
  min-width: 0;
  min-height: 100%;
  flex-wrap: wrap;
  align-content: flex-start;
  align-items: flex-start;
  gap: 8px;
}

.opponent {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: #1a2f66;
  text-align: center;
  font-size: 11px;
  white-space: nowrap;
}

.opponent-top,
.opponent-bottom {
  flex-direction: row;
}

.opponent-top {
  grid-area: top;
}

.opponent-bottom {
  grid-area: bottom;
}

.opponent-left {
  grid-area: left;
  flex-direction: column;
}

.opponent-right {
  grid-area: right;
  flex-direction: column;
}

.opponent-name,
.opponent-count {
  flex: 0 0 auto;
  font-weight: 400;
  color: #1a2f66;
}

.mini-rack {
  display: flex;
  flex: 0 0 auto;
  flex-flow: row nowrap;
  justify-content: center;
  gap: 2px;
}

.opponent-left .mini-rack,
.opponent-right .mini-rack {
  flex-direction: column;
}

.mini-tile {
  display: block;
  flex: 0 0 auto;
  width: 9px;
  height: 13px;
  border: 1px solid #7a5a37;
  border-radius: 2px;
  background: linear-gradient(180deg, #4b3020 0%, #2f1d12 100%);
  box-shadow: 1px 1px 2px rgb(0 0 0 / 45%);
}

.opponent-left .mini-tile,
.opponent-right .mini-tile {
  width: 13px;
  height: 9px;
}

.hand {
  display: flex;
  min-height: 68px;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  padding: 10px;
  border: 1px solid var(--gold-dim);
  border-radius: 10px;
  background: linear-gradient(180deg, #243a7a 0%, #1b2d63 100%);
}

.loose-area {
  position: relative;
  min-height: 92px;
  margin-top: 8px;
  border-style: dashed;
  transition:
    border-color 140ms ease,
    background 140ms ease,
    box-shadow 140ms ease;
}

.loose-area::before {
  position: absolute;
  top: 6px;
  left: 10px;
  color: #dfd0a6;
  font-size: 0.82rem;
  content: var(--draft-hint, "Draft — drag rack or board tiles here");
  pointer-events: none;
}

.loose-area.is-drop-ready {
  border-color: #ecd38a;
}

.loose-area.drag-over {
  border-color: var(--gold-light);
  background: #17365c;
  box-shadow: 0 0 0 2px rgb(240 207 130 / 22%);
}

.set {
  display: flex;
  width: max-content;
  max-width: 100%;
  min-height: 58px;
  flex-wrap: nowrap;
  gap: 3px;
  padding: 7px;
  border: 1px solid var(--gold-dim);
  border-radius: 8px;
  background: linear-gradient(180deg, #304a93 0%, #21356f 100%);
  transition:
    border-color 140ms ease,
    background 140ms ease,
    box-shadow 140ms ease;
}

.set.drag-over {
  border-color: var(--gold-light);
  background: #1c3a76;
}

.set.set-invalid {
  border: 2px solid #ff8d6a;
  background: #4a2430;
  box-shadow: 0 0 10px rgb(255 120 90 / 35%);
}

.tile {
  display: inline-grid;
  flex: 0 0 auto;
  width: 40px;
  height: 52px;
  place-items: center;
  padding: 0;
  border: 2px solid var(--tile-border);
  border-radius: 7px;
  background: linear-gradient(180deg, var(--tile-brown) 0%, var(--tile-brown-dark) 100%);
  color: var(--tile-color, #fff);
  text-shadow: 0 0 8px color-mix(in srgb, var(--tile-color) 45%, transparent);
  font-size: 1.2rem;
  font-weight: 900;
  cursor: pointer;
  user-select: none;
}

.tile[draggable="true"] {
  cursor: grab;
  touch-action: manipulation;
}

.tile.is-dragging {
  opacity: 0.4;
  cursor: grabbing;
}

.tile:disabled {
  cursor: default;
  opacity: 1;
}

.log-tile {
  display: inline-grid;
  min-width: 1.65em;
  height: 1.8em;
  margin: 0 2px;
  padding: 0 3px;
  place-items: center;
  border: 1px solid #7a5a37;
  border-radius: 4px;
  background: linear-gradient(180deg, #4b3020 0%, #2f1d12 100%);
  color: var(--tile-color, #fff);
  font-weight: 900;
  vertical-align: middle;
}

.draft-valid-tick {
  right: 8px;
  top: 8px;
  z-index: 1;
  display: grid;
  width: 2rem;
  height: 2rem;
  place-items: center;
  padding: 0;
  border: 1px solid #c7a34b;
  border-radius: 50%;
  background: linear-gradient(180deg, #d9b45f 0%, #b88a2f 100%);
  color: #2a1d07;
  font: inherit;
  font-size: 1.5rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 12px rgb(215 177 90 / 34%);
}

.draft-valid-tick:hover {
  background: linear-gradient(180deg, #f0cf82 0%, #c99a3d 100%);
}

.draft-valid-tick[hidden] {
  display: none;
}

.draft-cancel-x {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 2rem;
  height: 2rem;
  padding: 0;
  border: 0;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font: inherit;
  font-size: 1.4rem;
  line-height: 1;
  cursor: pointer;
  color: #fff;
  background: #c62828;
}

.draft-cancel-x:hover {
  background: #a51f1f;
}

.draft-cancel-x:focus-visible {
  outline: 3px solid currentColor;
  outline-offset: 2px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.controls button,
.header-button,
.draw-button,
#instructions-dialog button {
  min-height: 40px;
  padding: 9px 12px;
  border: 1px solid var(--gold-dim);
  border-radius: 7px;
  background: linear-gradient(180deg, #d9b45f 0%, #b88a2f 100%);
  color: #2a1d07;
  font: inherit;
  cursor: pointer;
}

.controls button:hover:not(:disabled),
.header-button:hover:not(:disabled),
.draw-button:hover:not(:disabled),
#instructions-dialog button:hover:not(:disabled) {
  background: linear-gradient(180deg, var(--gold-light) 0%, #c99a3d 100%);
}

.controls button:disabled,
.header-button:disabled,
.draw-button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px 16px;
  margin: 0;
  padding: 12px;
  border: 1px solid var(--gold-dim);
  border-radius: 10px;
  background: linear-gradient(180deg, #243a7a 0%, #1a2a5d 100%);
}

.status > p {
  margin: 0;
}

#message {
  flex-basis: 100%;
  min-width: 0;
  max-height: 180px;
  margin: 0;
  overflow-y: auto;
}

.message-entry {
  margin: 0;
  padding: 4px 0;
  border-bottom: 1px solid #ffffff30;
}

.message-entry:last-child {
  border-bottom: 0;
}

#turn {
  display: none;
}

.instructions-link {
  border: 0;
  padding: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  text-decoration: underline;
  cursor: pointer;
}

#instructions-dialog {
  width: min(90vw, 38rem);
  max-height: 85vh;
  overflow-y: auto;
  border: 1px solid var(--gold-dim);
  border-radius: 12px;
  padding: 1.5rem;
  background: linear-gradient(180deg, #1c2c62 0%, #121c3f 100%);
  color: #f5efe2;
}

#instructions-dialog::backdrop {
  background: rgb(0 0 0 / 72%);
}

#instructions-dialog h2 {
  margin-bottom: 1rem;
}

#instructions-dialog h3 {
  margin: 1rem 0 0.25rem;
  font-size: 1rem;
}

#instructions-dialog p {
  margin: 0;
}

@media (min-width: 801px) {
  .game-layout {
    grid-template-areas:
      "board header"
      "board side";
    grid-template-columns: minmax(0, 720px) minmax(280px, 380px);
    gap: 16px 22px;
    align-items: start;
    justify-content: center;
  }

  .board-column {
    grid-area: board;
  }

  .game-header {
    grid-area: header;
    margin: 0;
  }

  .side-panel {
    grid-area: side;
  }
}

@media (max-width: 800px) {
  body {
    padding: 12px;
  }

  .board-layout {
    width: min(100%, 600px);
    grid-template:
      ". top ." 24px
      "left center right" minmax(0, 5fr)
      ". bottom ." 24px
      / 24px minmax(0, 5fr) 24px;
    gap: 3px;
  }

  .opponent {
    gap: 3px;
    font-size: 9px;
  }

  .mini-tile {
    width: 7px;
    height: 10px;
  }

  .opponent-left .mini-tile,
  .opponent-right .mini-tile {
    width: 10px;
    height: 7px;
  }

  .tile {
    width: 34px;
    height: 45px;
  }
}

@media (max-width: 420px) {
  body {
    padding: 8px;
  }

  .board-layout {
    width: 100%;
    padding: 3px;
    grid-template:
      ". top ." 20px
      "left center right" minmax(0, 5fr)
      ". bottom ." 20px
      / 20px minmax(0, 5fr) 20px;
    gap: 2px;
  }

  .opponent {
    gap: 2px;
    font-size: 8px;
  }

  .opponent-left .mini-tile,
  .opponent-right .mini-tile {
    width: 8px;
    height: 6px;
  }

  .tile {
    width: 30px;
    height: 41px;
  }

  .hand {
    gap: 5px;
    padding: 7px;
  }

  .loose-area {
    min-height: 84px;
  }
}
</style>
</head>
<body>
<canvas id="mosaic-bg" aria-hidden="true"></canvas>
<main class="game">
  <div id="game-layout" class="game-layout">
    <header class="game-header">
      <div class="title-row">
        <h1 data-i18n="title">Rummiqub</h1>
        <button id="new-game" class="header-button" type="button" data-i18n="newGame">
          New game
        </button>
      </div>
      <button
        id="instructions-button"
        class="instructions-link"
        type="button"
        data-i18n="instructionsLink"
        aria-haspopup="dialog"
        aria-controls="instructions-dialog"
      ></button>
    </header>

    <section class="board-column" aria-label="Game board">
      <div id="board-layout" class="board-layout">
        <div id="opponent-top" class="opponent opponent-top"></div>
        <div id="opponent-left" class="opponent opponent-left"></div>

        <div class="board-center">
          <div id="table" class="table" aria-label="Played sets"></div>
        </div>

        <div id="opponent-right" class="opponent opponent-right"></div>
        <div id="opponent-bottom" class="opponent opponent-bottom"></div>
      </div>
    </section>

    <aside class="side-panel">
      <section class="hand-section">
        <div class="hand-title-row">
          <h2 data-i18n="yourTiles">Your tiles</h2>
          <button id="draw" class="draw-button" type="button" data-i18n="draw">
            Draw a tile
          </button>
        </div>
        <div id="hand" class="hand" aria-label="Your tiles"></div>

        <h2 class="draft-heading" data-i18n="draftArea">Draft</h2>
        <div
          id="loose"
          class="hand loose-area"
          aria-label="Draft area"
          aria-dropeffect="move"
        ></div>

        <div class="controls">
          <button id="play" type="button" data-i18n="play">
            Play selected tiles
          </button>
        </div>
      </section>

      <section class="status" aria-label="Game status">
        <p id="turn"></p>
        <p id="stock"></p>
        <div id="message" class="message-log" aria-live="polite"></div>
      </section>
    </aside>
  </div>
</main>

<script>
var COLORS = ["pink", "orange", "green", "azure"];
var SEARCH_BUDGET_MS = 2500;
var MAX_REARRANGED_SETS = 3;
var MAX_HAND_TILES_TO_CONSIDER = 8;
var MAX_POOL_TILES = 24;
function expired(deadline) {
  return Date.now() >= deadline;
}
function isConcreteSet(tiles) {
  if (tiles.length < 3 || tiles.length > 13) return false;
  if (tiles.some((tile) => tile.joker)) return false;
  const sameValue = tiles.every((tile) => tile.value === tiles[0].value);
  if (sameValue) {
    return tiles.length <= COLORS.length && new Set(tiles.map((tile) => tile.color)).size === tiles.length;
  }
  if (!tiles.every((tile) => tile.color === tiles[0].color)) return false;
  const values = tiles.map((tile) => tile.value).sort((a, b) => a - b);
  return new Set(values).size === values.length && values.every(
    (value, index) => index === 0 || value === values[index - 1] + 1
  );
}
function forEachJokerAssignment(tiles, visit) {
  const jokers = tiles.filter((tile) => tile.joker);
  const natural = tiles.filter((tile) => !tile.joker);
  if (jokers.length > 2 || natural.length === 0) return false;
  function assign(index, completed, assignments) {
    if (index === jokers.length) {
      if (!isConcreteSet(completed)) return false;
      return visit(completed, assignments) === true;
    }
    const joker = jokers[index];
    for (const color of COLORS) {
      for (let value = 1; value <= 13; value++) {
        const replacement = { ...joker, color, value, joker: false };
        if (assign(
          index + 1,
          [...completed, replacement],
          [...assignments, { joker, color, value }]
        )) {
          return true;
        }
      }
    }
    return false;
  }
  return assign(0, natural, []);
}
function isValidSet(tiles) {
  if (tiles.length < 3 || tiles.length > 13) return false;
  if (!tiles.some((tile) => tile.joker)) {
    return isConcreteSet(tiles);
  }
  return forEachJokerAssignment(tiles, () => true);
}
function handPointsInMeld(meld, handIds) {
  const natural = meld.filter((tile) => !tile.joker);
  if (!meld.some((tile) => tile.joker)) {
    if (!isConcreteSet(meld)) return -1;
    return natural.filter((tile) => handIds.has(tile.id)).reduce((sum, tile) => sum + tile.value, 0);
  }
  let best = -1;
  forEachJokerAssignment(meld, (_completed, assignments) => {
    let points = natural.filter((tile) => handIds.has(tile.id)).reduce((sum, tile) => sum + tile.value, 0);
    for (const assignment of assignments) {
      if (handIds.has(assignment.joker.id)) {
        points += assignment.value;
      }
    }
    best = Math.max(best, points);
  });
  return best;
}
function choose(items, count, visit, deadline) {
  const chosen = [];
  function walk(start) {
    if (expired(deadline)) return;
    if (chosen.length === count) {
      visit([...chosen]);
      return;
    }
    const needed = count - chosen.length;
    for (let i = start; i <= items.length - needed; i++) {
      if (expired(deadline)) return;
      chosen.push(items[i]);
      walk(i + 1);
      chosen.pop();
    }
  }
  walk(0);
}
function tileSearchScore(tile) {
  return (tile.joker ? 1e3 : 0) + (tile.value || 0);
}
function playIsBetter(candidate, current) {
  if (!current) return true;
  if (candidate.playedIds.size !== current.playedIds.size) {
    return candidate.playedIds.size > current.playedIds.size;
  }
  if (candidate.playedPoints !== current.playedPoints) {
    return candidate.playedPoints > current.playedPoints;
  }
  return candidate.reclaimedJokers > current.reclaimedJokers;
}
function findComputerPlay(hand, table, hasOpened) {
  const deadline = Date.now() + SEARCH_BUDGET_MS;
  const handIds = new Set(hand.map((tile) => tile.id));
  const searchHand = [...hand].sort(
    (a, b) => tileSearchScore(b) - tileSearchScore(a)
  );
  let best = null;
  function openingIsValid(melds) {
    if (hasOpened) return true;
    let points = 0;
    for (const meld of melds) {
      const meldPoints = handPointsInMeld(meld, handIds);
      if (meldPoints < 0) return false;
      points += meldPoints;
    }
    return points >= 30;
  }
  function considerPool(pool, replacedIndexes) {
    if (expired(deadline) || pool.length > MAX_POOL_TILES) return;
    const indexById = new Map(pool.map((tile, index) => [tile.id, index]));
    const meldsByTile = Array.from({ length: pool.length }, () => []);
    for (let size = 3; size <= Math.min(13, pool.length); size++) {
      if (expired(deadline)) return;
      choose(
        pool,
        size,
        (meld) => {
          if (expired(deadline) || !isValidSet(meld)) return;
          const indexes = meld.map((tile) => indexById.get(tile.id));
          const candidate = { tiles: meld, indexes };
          for (const index of indexes) {
            meldsByTile[index].push(candidate);
          }
        },
        deadline
      );
    }
    for (const candidates of meldsByTile) {
      candidates.sort((a, b) => {
        function priority(candidate) {
          let score = 0;
          for (const tile of candidate.tiles) {
            if (!handIds.has(tile.id)) continue;
            score += tile.joker ? 100 : 1;
          }
          return score;
        }
        return priority(b) - priority(a);
      });
    }
    const used = new Array(pool.length).fill(false);
    const partition = [];
    function searchPartition(usedCount) {
      if (expired(deadline)) return;
      if (usedCount === pool.length) {
        if (!openingIsValid(partition)) return;
        const playedIds = new Set(
          pool.filter((tile) => handIds.has(tile.id)).map((tile) => tile.id)
        );
        if (playedIds.size === 0) return;
        let playedPoints = 0;
        for (const meld of partition) {
          const points = handPointsInMeld(meld, handIds);
          if (points >= 0) playedPoints += points;
        }
        const replaced = new Set(replacedIndexes);
        const newTable = [
          ...table.filter((_, index) => !replaced.has(index)).map((set) => [...set]),
          ...partition.map((meld) => [...meld])
        ];
        const reclaimedJokers = replacedIndexes.reduce(
          (total, index) => total + table[index].filter((tile) => tile.joker).length,
          0
        );
        const candidate = {
          table: newTable,
          playedIds,
          playedPoints,
          reclaimedJokers
        };
        if (playIsBetter(candidate, best)) best = candidate;
        return;
      }
      let pivot = 0;
      while (used[pivot]) pivot++;
      for (const candidate of meldsByTile[pivot]) {
        if (expired(deadline)) return;
        if (candidate.indexes.some((index) => used[index])) continue;
        for (const index of candidate.indexes) used[index] = true;
        partition.push(candidate.tiles);
        searchPartition(usedCount + candidate.indexes.length);
        partition.pop();
        for (const index of candidate.indexes) used[index] = false;
      }
    }
    searchPartition(0);
  }
  for (let count = 1; count <= Math.min(MAX_HAND_TILES_TO_CONSIDER, searchHand.length); count++) {
    if (expired(deadline)) break;
    choose(
      searchHand,
      count,
      (selected) => considerPool(selected, []),
      deadline
    );
  }
  const tableIndexes = table.map((set, index) => ({
    index,
    containsJoker: set.some((tile) => tile.joker)
  })).sort((a, b) => Number(b.containsJoker) - Number(a.containsJoker)).map((item) => item.index);
  for (let setCount = 1; setCount <= Math.min(MAX_REARRANGED_SETS, table.length); setCount++) {
    if (expired(deadline)) break;
    choose(
      tableIndexes,
      setCount,
      (indexes) => {
