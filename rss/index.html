<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aggregated RSS Feed Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      margin-bottom: 8px;
    }
    a {
      text-decoration: none;
      color: #1a0dab;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Aggregated RSS Feed</h1>
  <div id="feed-container"></div>

  <script>
    // Array of RSS feed URLs to aggregate
    const RSS_URLS = [
      'https://hongkongfp.com/feed'
    ];

    // Fetch and parse one RSS feed URL, return array of items
    async function fetchRSS(url) {
      const response = await fetch(url);
      // Note: Some feeds may require CORS proxy to avoid cross-origin issues
      if (!response.ok) throw new Error('Network response not ok');
      const text = await response.text();
      const xml = new DOMParser().parseFromString(text, 'application/xml');

      const items = xml.querySelectorAll('item');
      return Array.from(items).map(item => ({
        title: item.querySelector('title')?.textContent || 'No title',
        link: item.querySelector('link')?.textContent || '#'
      }));
    }

    // Fetch all feeds in parallel, aggregate items, and display
    async function fetchAndDisplayMultipleRSS(urls) {
      try {
        const allItemsArrays = await Promise.all(urls.map(fetchRSS));
        const allItems = allItemsArrays.flat();

        const container = document.createElement('ul');
        allItems.forEach(({ title, link }) => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = link;
          a.textContent = title;
          a.target = '_blank'; // open links in new tab
          li.appendChild(a);
          container.appendChild(li);
        });

        document.getElementById('feed-container').appendChild(container);
      } catch (error) {
        document.getElementById('feed-container').textContent = 'Failed to load RSS feeds: ' + error.message;
        console.error(error);
      }
    }

    // Run on page load
    fetchAndDisplayMultipleRSS(RSS_URLS);
  </script>
</body>
</html>
